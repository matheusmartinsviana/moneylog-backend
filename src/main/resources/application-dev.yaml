# Perfil de desenvolvimento local (Postgres do docker-compose.yml).
# As variáveis vêm do ambiente: carregue o .env antes de subir a aplicação (veja README.md).
spring:
  flyway:
    # Só no perfil dev (revisão R-02): as etapas em paralelo reservam números V3.*..V9.* e o banco de dev persistente pode
    # ver uma migração de número menor depois de uma maior. Nunca no padrão nem em produção.
    out-of-order: true
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

moneylog:
  mail:
    provider: ${MAIL_PROVIDER:log}

logging:
  level:
    org.flywaydb: info

# Swagger UI e /v3/api-docs só em dev (T21 CA5).
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
