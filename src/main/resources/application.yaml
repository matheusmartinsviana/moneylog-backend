# Configuração base. Nenhum segredo aqui: tudo vem de variáveis de ambiente (veja .env.example).
spring:
  application:
    name: moneylog
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      auto-commit: false
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    open-in-view: false
    hibernate:
      # O schema só muda por migração Flyway (BE 05).
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      # Importação do vault (T112, S-162): o caso de uso confere os 20 MB e responde 422 VAULT_IMPORT_TOO_LARGE; o teto do container fica logo acima.
      max-file-size: 21MB
      max-request-size: 22MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      owner-email: ${MONEYLOG_OWNER_EMAIL:}
  jackson:
    time-zone: UTC
    deserialization:
      # o contrato declara additionalProperties: false nos corpos de entrada: campo desconhecido é 400 (BUG-E2E-02)
      fail-on-unknown-properties: true
      # S-207: em dinheiro, `installments: 2.5` não pode virar 2 em silêncio; número com parte fracionária em campo
      # inteiro é 400 VALIDATION_FAILED (INVALID_FORMAT)
      accept-float-as-int: false

# Documentação viva (springdoc): desligada por padrão, ligada só no perfil dev (application-dev.yaml).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  paths-to-match: /v1/**

server:
  tomcat:
    # Upload acima do teto do vault (T112): o Tomcat engole até 30 MB do corpo restante para o cliente receber o 422 em vez de um reset da conexão.
    max-swallow-size: 30MB
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    # Busca global (S-287): o termo `q` é dado do usuário e não vai para log. Estes dois loggers do Spring imprimem em DEBUG a URL com a query
    # string ("Securing GET /v1/search?q=...", "GET \"/v1/search?q=...\""), então ficam em INFO mesmo que alguém suba o nível da raiz.
    org.springframework.security.web.FilterChainProxy: INFO
    org.springframework.web.servlet.DispatcherServlet: INFO
    # O Tomcat em DEBUG registra "Invalid character found in the request target [/v1/search?q=...]" com o termo (BUG-QA-06).
    org.apache.coyote.http11: INFO
    org.apache.tomcat.util.http.parser: INFO

management:
  endpoints:
    web:
      exposure:
        # Só o health fica exposto (BE 06).
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      # Sem grupos liveness/readiness por enquanto: a resposta fica só {"status":"UP"}.
      # Ligar na etapa de deploy, se a topologia (ADR-005) precisar de probes separados.
      probes:
        enabled: false

moneylog:
  # Fuso usado para "hoje" e para a competência (S-1).
  zone: America/Sao_Paulo
  security:
    # No mínimo 32 bytes: com menos o app não sobe (ADR-003).
    jwt-secret: ${JWT_SECRET}
    # Origens do front (CSRF do refresh e do logout), separadas por vírgula. Sem CORS: mesmo domínio em produção.
    allowed-origins: ${MONEYLOG_ALLOWED_ORIGINS}
    # CIDRs dos proxies de confiança (CloudFront/ALB). Vazio = ignora X-Forwarded-For (S-86).
    trusted-proxies: ${MONEYLOG_TRUSTED_PROXIES:}
  auth:
    access-token-ttl: PT15M
    refresh-ttl: P30D
    # Tolerância na detecção de reuso do refresh (S-83).
    reuse-grace: PT30S
    # Sempre true. false só com o perfil dev e origens localhost (S-85, plano B).
    cookie-secure: true
    max-login-failures: 5
    login-window: PT15M
    # Teto absoluto da sessão: nenhuma família de refresh vive além de login + 90 dias, por mais que rotacione (B7).
    max-session-age: P90D
    # Refresh expirado fica na tabela por este tempo e depois é apagado (B7).
    refresh-retention: P7D
  invitations:
    # Convites por e-mail (ADR-032). Desligado: criar, reenviar, pré-visualizar e aceitar respondem 404; a gestão de usuários segue.
    enabled: ${MONEYLOG_INVITATIONS_ENABLED:true}
    validity-days: 7
    retention-days: 90
  quick-entry:
    default-validity-days: ${MONEYLOG_QUICK_ENTRY_DEFAULT_VALIDITY_DAYS:30}
    max-validity-days: ${MONEYLOG_QUICK_ENTRY_MAX_VALIDITY_DAYS:90}
    max-active-tokens: ${MONEYLOG_QUICK_ENTRY_MAX_ACTIVE_TOKENS:3}
    # No máximo uma gravação de last_used_at/IP mascarado/user agent por token neste intervalo.
    last-used-write-interval: PT1M
    rate-limit:
      # Falhas de token por IP na janela; acima, 429 TOO_MANY_ATTEMPTS com Retry-After (só falhas contam).
      max-failures-per-ip: ${MONEYLOG_QUICK_ENTRY_MAX_FAILURES_PER_IP:10}
      failure-window: PT5M
      # Chamadas com token válido na janela; acima, 429 e o token continua válido.
      max-calls-per-token: ${MONEYLOG_QUICK_ENTRY_MAX_CALLS_PER_TOKEN:20}
      call-window: PT1M
    # Tetos de uso do lançamento rápido (ADR-034, Q7): desligados por padrão (vazio ou 0 = sem limite). Valores em reais, por exemplo 1000.00.
    max-amount: ${MONEYLOG_QUICK_ENTRY_MAX_AMOUNT:}
    max-entries-per-day: ${MONEYLOG_QUICK_ENTRY_MAX_ENTRIES_PER_DAY:}
    max-expense-per-day: ${MONEYLOG_QUICK_ENTRY_MAX_EXPENSE_PER_DAY:}
    max-income-per-day: ${MONEYLOG_QUICK_ENTRY_MAX_INCOME_PER_DAY:}
  users:
    # Teto de usuários (ativos e desativados) somados aos convites pendentes não expirados.
    max: ${MONEYLOG_USERS_MAX:10}
  export:
    # Teto de movimentações do backup e do CSV (S-260): acima dele, 422 EXPORT_TOO_LARGE. Medido: 50.000 = backup de 57 MB e heap +121 MB.
    max-transactions: 200000
    rate-limit:
      # Pedidos de exportação por usuário na janela (em memória, como o login); acima, 429 TOO_MANY_ATTEMPTS com Retry-After.
      max-requests: 6
      window: PT1M
  goals:
    photos:
      # Fotos das metas de sonho (ADR-018). Os bytes ficam no Postgres (goal_photo_blobs) atrás da porta PhotoStorage.
      max-per-goal: 8
      max-per-user: 40
      # Exibição + miniatura de todas as fotos do usuário (40 MB).
      max-bytes-per-user: 41943040
      # Arquivo enviado (8 MB); acima disso 422 GOAL_PHOTO_TOO_LARGE.
      max-upload-bytes: 8388608
      # Teto de dimensões lido do cabeçalho ANTES de decodificar (anti decompression bomb): 24 megapixels e 8000 px no maior lado.
      max-pixels: 24000000
      max-side: 8000
      rate-limit:
        # Envios por usuário na janela (decodificar imagem é caro na instância pequena).
        max-requests: 30
        window: PT1M
  search:
    # Busca global (S-287): pedidos por usuário por minuto (a busca roda a cada pausa de digitação) e teto de tempo de cada grupo de consulta.
    rate-limit:
      max-requests: 120
      window: PT1M
    timeout: PT3S
  owner:
    email: ${MONEYLOG_OWNER_EMAIL}
    # Hash BCrypt direto (entre aspas simples no .env) ou arquivo com o hash (evita o problema do "$").
    password-hash: ${MONEYLOG_OWNER_PASSWORD_HASH:}
    password-hash-file: ${MONEYLOG_OWNER_PASSWORD_HASH_FILE:}
    # Primeiro acesso (ADR-015). reset-password é de uso único: apaga a senha do banco; remova a variável depois.
    reset-password: ${MONEYLOG_OWNER_RESET_PASSWORD:false}
    # Código de uso único do primeiro acesso, informado pelo operador (secret em produção). Vazio: gerado e impresso no log do dev.
    setup-code: ${MONEYLOG_OWNER_SETUP_CODE:}
    setup-code-file: ${MONEYLOG_OWNER_SETUP_CODE_FILE:}
    setup-code-ttl: PT24H
  ai:
    provider: ${AI_PROVIDER:none}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    # Opcionais (S-185/S-186). A chave só existe no ambiente do servidor, nunca no front.
    base-url: ${AI_BASE_URL:}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
    daily-call-limit: ${AI_DAILY_CALL_LIMIT:50}
    monthly-token-budget: ${AI_MONTHLY_TOKEN_BUDGET:500000}
    payload-retention-days: ${AI_PAYLOAD_RETENTION_DAYS:90}
  notifications:
    job:
      # Gera as notificações do dia a cada 15 min em America/Sao_Paulo; idempotente (índice único), uma instância (ADR-001).
      enabled: true
      cron: "0 */15 * * * *"
  push:
    # Push PREPARADO e DESLIGADO (S-173): a central dentro do app é o canal garantido. Ligar exige HTTPS real, chaves VAPID e PWA instalada.
    # Com enabled=true e sem as três variáveis abaixo o app não sobe (como o JWT_SECRET).
    enabled: false
    vapid-public: ${MONEYLOG_PUSH_VAPID_PUBLIC:}
    vapid-private: ${MONEYLOG_PUSH_VAPID_PRIVATE:}
    vapid-subject: ${MONEYLOG_PUSH_VAPID_SUBJECT:}
    # Valores financeiros no payload do push: desligado por padrão (a notificação sai sem valores).
    include-amounts: false
    ttl-seconds: 86400
  backup:
    # Backup do banco (T176): DESLIGADO por padrão. Armazenamento local (BACKUP_DIR) ou s3. Cifra opcional com BACKUP_ENCRYPTION_KEY.
    # S3 sem BACKUP_S3_ACCESS_KEY usa a role da instância (IMDSv2); nunca grave chave no código.
    enabled: ${MONEYLOG_BACKUP_ENABLED:false}
    storage: ${BACKUP_STORAGE:local}
    dir: ${BACKUP_DIR:/var/backups/moneylog}
    prefix: ${BACKUP_PREFIX:moneylog/}
    retention-days: ${BACKUP_RETENTION_DAYS:7}
    cron: ${BACKUP_CRON:0 0 3 * * *}
    encryption-key: ${BACKUP_ENCRYPTION_KEY:}
    s3:
      endpoint: ${BACKUP_S3_ENDPOINT:}
      region: ${BACKUP_S3_REGION:}
      bucket: ${BACKUP_S3_BUCKET:}
      access-key: ${BACKUP_S3_ACCESS_KEY:}
      secret-key: ${BACKUP_S3_SECRET_KEY:}
      session-token: ${BACKUP_S3_SESSION_TOKEN:}
  mail:
    # E-mail transacional (convites, ADR-032). none (padrão) desliga; log só escreve no log (dev); ses envia pelo Amazon SES.
    # No SES as credenciais vêm do papel da EC2 (cadeia padrão do SDK); nunca grave chave de acesso aqui.
    provider: ${MAIL_PROVIDER:none}
    from: ${MAIL_FROM:}
    reply-to: ${MAIL_REPLY_TO:}
    app-base-url: ${MAIL_APP_BASE_URL:https://moneylog.mviana.tech}
    ses:
      region: ${MAIL_SES_REGION:}
      configuration-set: ${MAIL_SES_CONFIGURATION_SET:}
