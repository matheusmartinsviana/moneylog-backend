        consumptionMineAfter:
          $ref: '#/components/schemas/Money'
        receivablePending:
          $ref: '#/components/schemas/Money'
        reimbursed:
          $ref: '#/components/schemas/Money'
    ShareMigrationPurchase:
      type: object
      required: [transactionId, personId, status, reason, splitMode, charged, third, refunded, legacyReceived, months]
      additionalProperties: false
      properties:
        transactionId:
          type: string
          format: uuid
