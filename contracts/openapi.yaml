  /v1/profile/photo:
    put:
      tags: [Notifications]
      operationId: replaceProfilePhoto
      summary: Substitui a foto de perfil do usuário autenticado
      description: |
        Foto única por usuário: um novo envio troca a anterior. Mesma validação das fotos de meta (magic bytes JPEG ou PNG, dimensões lidas do cabeçalho, recodificação
        que derruba EXIF/GPS, exibição até 1280 px e miniatura até 320 px). Tipo inválido → `422 GOAL_PHOTO_UNSUPPORTED_TYPE`; imagem ilegível → `422 GOAL_PHOTO_INVALID_IMAGE`;
        acima de 8 MB → `422 GOAL_PHOTO_TOO_LARGE`; dimensões acima do limite → `422 GOAL_PHOTO_DIMENSIONS_EXCEEDED`. Limite de envios por minuto → `429`.
        A operação é naturalmente idempotente (substituir), então não há `Idempotency-Key`. Devolve `hasPhoto` e o `photoVersion` novo.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: A imagem (JPEG ou PNG, até 8 MB).
      responses:
        '200':
          description: Foto substituída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilePhoto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Notifications]
      operationId: deleteProfilePhoto
      summary: Remove a foto de perfil (idempotente)
      description: Sem foto, também responde `204`.
      responses:
        '204':
          description: Foto removida.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/profile/photo/content:
    get:
      tags: [Notifications]
      operationId: getProfilePhotoContent
      summary: Bytes da foto de perfil (JPEG), autenticado
      description: |
        Rota protegida por Bearer: o front busca com o `HttpClient` como `Blob` e usa `URL.createObjectURL`; use `photoVersion` de `NotificationSettings` para saber quando buscar de novo.
        Resposta com `Cache-Control: no-store`, `X-Content-Type-Options: nosniff` e `Content-Type: image/jpeg`. Sem foto → `404 PROFILE_PHOTO_NOT_FOUND`. Só devolve a foto do próprio usuário.
      parameters:
        - name: variant
          in: query
          description: '`display` (até 1280 px, padrão) ou `thumb` (até 320 px). Outro valor → `400`.'
          schema:
            type: string
            enum: [thumb, display]
            default: display
      responses:
        '200':
          description: A imagem.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/push/config:
    get:
      tags: [Notifications]
      operationId: getPushConfig
      summary: Push ativo neste servidor? Chave VAPID pública para assinar
      description: |
