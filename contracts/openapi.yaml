  /v1/debts/{id}/void:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Debts]
      operationId: voidDebt
      summary: Estorna o registro de uma dívida sem movimentação
      description: |
        Só dívida `WITHOUT_MOVEMENT` sem quitações ativas: vira `VOIDED` e os lançamentos dela ficam inativos. Com quitações
        → `422 DEBT_HAS_SETTLEMENTS` (estorne antes as quitações). Dívida que nasceu de uma movimentação →
        `422 DEBT_HAS_ORIGIN_TRANSACTION` (o caminho é estornar a movimentação de origem em `POST /v1/transactions/{id}/void`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebtReasonInput'
      responses:
        '200':
          description: Dívida `VOIDED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Debt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------- Recurrences (Etapa 4)
  /v1/recurrences:
    get:
      tags: [Recurrences]
      operationId: listRecurrences
      summary: Lista as recorrências (ordem `description asc`)
      parameters:
        - name: active
          in: query
          description: Sem o parâmetro, devolve todas (ativas e desativadas).
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de recorrências.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurrenceSlice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Recurrences]
      operationId: createRecurrence
      summary: Cria uma recorrência
      description: |
        Modelo de uma `EXPENSE`, `INCOME` (conta + meio de pagamento) ou `CARD_PURCHASE` à vista (cartão, sem parcelas,
        S-144). Nada acontece sozinho: as ocorrências previstas são compromissos e só viram movimentação quando o usuário
        confirma (S-20). Conta e cartão ao mesmo tempo → `422 RECURRENCE_INVALID`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurrenceInput'
      responses:
        '201':
          description: Recorrência criada.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recurrence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/recurrences/summary:
    get:
      tags: [Recurrences]
      operationId: getRecurrenceSummary
      summary: Custo fixo mensal e receita recorrente mensal (estimativa)
      description: |
        Σ das recorrências ativas **e não encerradas** normalizadas para o mês (semanal × 52/12, diária × 365/12, anual ÷ 12). Uma
        recorrência encerrada (`Recurrence.ended`: sem ocorrência hoje nem depois) e a desativada não entram (S-235). Sempre estimativa (S-146).
        **2.24.0 (A1b, ADR-022):** `view=MINE` (padrão) soma só a minha parte das recorrências rateadas; `GROSS` soma o valor cheio. A resposta
        devolve `view`. Sem recorrência rateada, os números não mudam.
      parameters:
        - $ref: '#/components/parameters/View'
      responses:
        '200':
          description: Resumo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurrenceSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/recurrences/occurrences:
    get:
      tags: [Recurrences]
      operationId: listOccurrences
      summary: Ocorrências previstas, realizadas e puladas
      description: |
        Ordem `date asc, recurrenceId asc`, no intervalo `[from, to]`. **Sem `from`**, a janela começa no início da agenda: é
        o jeito de listar as **vencidas e não realizadas**, que continuam pendentes até serem realizadas ou puladas (S-20;
        `overdue = true`). `to` padrão = (`from`, ou hoje se também falta) + 30 dias. Recorrência desativada não gera
        ocorrência pendente. **Limites (S-239, S-240):** `from` e `to` ficam entre 2000-01-01 e 2100-12-31 e a janela entre
        eles pode ter no máximo 3 anos (sem `from`, conta de hoje até `to`); fora disso, `400 VALIDATION_FAILED`. As pendentes
        **vencidas** vêm limitadas às 500 mais recentes por chamada (somando as recorrências); havendo mais,
        `overdueTruncated = true` (realizadas, puladas e pendentes futuras não são limitadas).
      parameters:
        - name: from
          in: query
          description: 'De 2000-01-01 a 2100-12-31.'
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: 'De 2000-01-01 a 2100-12-31; no máximo 3 anos depois de `from`.'
          schema:
            type: string
            format: date
        - name: status
          in: query
          description: Sem o parâmetro, devolve os três.
          schema:
            $ref: '#/components/schemas/OccurrenceStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de ocorrências.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccurrenceSlice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/recurrences/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Recurrences]
      operationId: getRecurrence
      summary: Consulta uma recorrência
      responses:
        '200':
          description: A recorrência.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recurrence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Recurrences]
      operationId: updateRecurrence
      summary: Edita os dados do modelo (valem para as ocorrências ainda não realizadas)
      description: |
        Só valor, descrição, categoria, conta/meio de pagamento (ou cartão) e fim (S-139). **Frequência e início não
        mudam** (campo desconhecido → `400`): para mudar, encerre e crie outra. As ocorrências já realizadas continuam
        como estão (são movimentações). `endDate` anterior à última ocorrência realizada ou pulada → `422 RECURRENCE_INVALID`. Recorrência já encerrada sem `endDate`
        → `422 RECURRENCE_ENDED` (não reabre em silêncio, S-236); remover o fim de uma recorrência em curso segue válido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurrenceUpdate'
      responses:
        '200':
          description: Recorrência atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recurrence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/recurrences/{id}/end:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Recurrences]
      operationId: endRecurrence
      summary: Encerra a recorrência numa data
      description: 'Define `endDate` (ou `activeUntil`, 2.27.0; padrão: hoje); nada é apagado. Data anterior ao início ou à última ocorrência realizada/pulada → `422 RECURRENCE_INVALID`. Devolve a recorrência atualizada.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurrenceEndInput'
      responses:
        '200':
          description: Recorrência encerrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recurrence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/recurrences/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Recurrences]
      operationId: deactivateRecurrence
      summary: Desativa a recorrência
      description: |
        Deixa de gerar ocorrências pendentes (e de entrar nos compromissos). Idempotente; nada é apagado. **Definitivo**: não há
        reativação, e realizar ou pular ocorrência de uma recorrência desativada é `422 RECURRENCE_INACTIVE` (S-234), inclusive as
        atrasadas.
      responses:
        '200':
          description: Recorrência desativada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recurrence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/recurrences/{id}/occurrences/{date}/realize:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: date
        in: path
        required: true
        description: Data da ocorrência.
        schema:
          type: string
          format: date
    post:
      tags: [Recurrences]
      operationId: realizeOccurrence
      summary: Confirma uma ocorrência (cria a movimentação)
      description: |
        Sempre por confirmação do usuário (S-20, S-140). A movimentação nasce na **data da ocorrência**, com `source:
        RECURRENCE`, `recurrenceId` e `occurrenceDate`; o valor padrão é o do modelo e pode ser trocado em `amount` (conta
        de luz). Conta: `EXPENSE`/`INCOME`. Cartão: `CARD_PURCHASE` em 1 parcela pela alocação normal (lançamento tardio em
        fatura fechada e não paga; fatura paga manda para a corrente). Depois de realizada, a ocorrência sai dos
        compromissos e o valor passa a vir só da movimentação/fatura (sem dupla contagem). Estornar a movimentação
        reabre a ocorrência (S-49). `Idempotency-Key` obrigatório (mesma chave + mesmo corpo devolve a mesma movimentação).
        Já realizada → `422 RECURRENCE_OCCURRENCE_ALREADY_REALIZED`; pulada → `422 RECURRENCE_OCCURRENCE_SKIPPED`; data que
        não é ocorrência → `422 RECURRENCE_NOT_AN_OCCURRENCE`; recorrência desativada → `422 RECURRENCE_INACTIVE` (S-234).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealizeOccurrenceInput'
      responses:
        '201':
          description: Movimentação criada (ou replay da mesma chave).
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/recurrences/{id}/occurrences/{date}/skip:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: date
        in: path
        required: true
        description: Data da ocorrência.
        schema:
          type: string
          format: date
    post:
      tags: [Recurrences]
      operationId: skipOccurrence
      summary: Pula uma ocorrência
      description: Não cria movimentação; a ocorrência sai dos compromissos. Já realizada → `422 RECURRENCE_OCCURRENCE_ALREADY_REALIZED`; já pulada → `422 RECURRENCE_OCCURRENCE_SKIPPED`; recorrência desativada → `422 RECURRENCE_INACTIVE` (S-234).
      responses:
        '200':
          description: A ocorrência pulada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Occurrence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------- Goals (Etapa 5)
  /v1/goals:
    get:
      tags: [Goals]
      operationId: listGoals
      summary: Lista as metas
      description: |
        Meta é **reserva lógica** sobre o saldo de uma conta (S-147): nenhuma movimentação, nenhum lançamento. `status` filtra pelo
        status **derivado** (`ACHIEVED` = `current` ≥ `target`, S-150; só `ARCHIVED` é gravado). Sem `status`, devolve todas, na ordem
        `ACTIVE`, `ACHIEVED`, `ARCHIVED` e, dentro de cada uma, prioridade, prazo (sem prazo por último) e nome. Tudo calculado pelo
        backend: o front não soma reservas nem divide valores.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/GoalStatus'
        - name: featured
          in: query
          description: '`true` devolve só a meta em destaque da Home (no máximo uma; ADR-018); `false`, as demais. Ausente = todas.'
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de metas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalSlice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Goals]
      operationId: createGoal
      summary: Cria uma meta
      description: |
        Nasce sem reservas (`current` 0,00, `progress` `0.0000`). `kind = METRIC` (ADR-016) exige `metric` e `target` (pode ser 0.00), aceita `name` ausente e captura o `baseline` agora; alvo igual ao valor atual → `422 GOAL_METRIC_TARGET_EQUALS_BASELINE`; mesma medida e mesmo alvo ativos → `409 GOAL_METRIC_DUPLICATE`. `Idempotency-Key` opcional (escopo `POST /v1/goals`, 24 h): repetir o
        mesmo corpo devolve a mesma meta; outro corpo com a mesma chave é `409 IDEMPOTENCY_KEY_REUSED`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalInput'
      responses:
        '201':
          description: Meta criada.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/goals/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Goals]
      operationId: getGoal
      summary: Consulta uma meta
      responses:
        '200':
          description: A meta, com as reservas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Goals]
      operationId: updateGoal
      summary: Edita os dados da meta
      description: Nome, alvo, prazo, prioridade, descrição e `planNote`; as reservas não mudam. `name` e `target` só são exigidos em `SAVINGS` (ausentes → `422`); em `METRIC` o nome é opcional (ausente apaga) e o alvo ausente mantém o atual (mudar o alvo re-deriva `direction`; igual ao `baseline` → `422 GOAL_METRIC_TARGET_EQUALS_BASELINE`; duplicata ativa → `409 GOAL_METRIC_DUPLICATE`); em `DEBT_PAYOFF` ausentes mantêm os atuais. `planNote` ausente apaga o texto do plano. Remover o `deadline` rebaixa o `stage` para `FANTASY`. Meta arquivada → `422 GOAL_ARCHIVED`. `version` desatualizada → `409 VERSION_CONFLICT`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalUpdate'
      responses:
        '200':
          description: Meta atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/goals/{id}/reservations:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Goals]
      operationId: reserveOnGoal
      summary: Reserva ou libera dinheiro na meta
      description: |
        `amount` positivo reserva; **negativo libera** (`-?\d{1,13}(\.\d{1,2})?`, zero → `422 GOAL_RESERVATION_AMOUNT_ZERO`). É
        reserva **lógica** (S-147): **não** cria movimentação nem lançamento e **não** muda o saldo da conta, o consumo, a receita nem o
        patrimônio; `balances.reserved` do dashboard sobe e `balances.available` cai pelo mesmo valor (só contas `CASH`; reserva em
        conta `INVESTMENT` conta no `current` da meta e não mexe no disponível). Reserva acima do saldo da conta **é aceita** e
        sinalizada (`uncovered`, `Account.uncovered`, S-148). A conta arquivada não recebe reserva nova (`422 ACCOUNT_ARCHIVED`), mas
        aceita liberação; uma conta com reserva ativa positiva **não arquiva** (`422 ACCOUNT_HAS_RESERVATIONS`, S-259), e só uma meta
        arquivada e desarquivada depois pode voltar a ter reserva numa conta já arquivada (a UI avisa e a liberação é permitida). Liberar mais do que a meta tem reservado naquela conta, em qualquer data → `422 GOAL_RELEASE_EXCEEDS_RESERVED`.
        `Idempotency-Key` obrigatório: a mesma chave com o mesmo corpo não reserva de novo (devolve a meta no estado atual); duas
        reservas simultâneas na mesma meta se serializam e ambas valem. Devolve a meta atualizada (`200`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalReservationInput'
      responses:
        '200':
          description: A meta com a reserva incluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/goals/{id}/baseline:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Goals]
      operationId: anchorGoalBaseline
      summary: '"Cadastrei tudo": fixa a baseline da meta de quitar dívidas (ou re-ancora a meta de medida)'
      description: |
        Em `kind = METRIC` (ADR-016): re-ancora `baseline` com o valor atual da medida (qualquer valor vale) e re-deriva `direction`; alvo igual ao valor atual → `422 GOAL_METRIC_TARGET_EQUALS_BASELINE` e a meta não muda.

        Em `kind = DEBT_PAYOFF`: Grava `baseline` = total de dívidas de hoje (o mesmo de `GET /v1/debts/overview`) e `baselineAt`;
        `target` passa a ser a baseline. Pode ser repetido (re-ancorar) e é sempre ação explícita: nada muda sozinho quando aparece dívida
        nova (`grewSinceBaseline`). Total 0 → `422 DEBT_PAYOFF_NOTHING_TO_BASELINE`. Meta de guardar dinheiro (`SAVINGS`) → `422 GOAL_KIND_MISMATCH`.
      responses:
        '200':
          description: Meta atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/goals/{id}/actions:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Goals]
      operationId: addGoalAction
      summary: Acrescenta uma ação ao plano declarado da meta
      description: |
        Plano declarado (ADR-016): até 10 ações por meta (`422 GOAL_ACTION_LIMIT`), sem efeito em contas, razão ou saldos. Meta arquivada
        → `422 GOAL_ARCHIVED`. Devolve a meta atualizada (`201`, `Location` da meta); a ação nova é a última de `actions`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalActionInput'
      responses:
        '201':
          description: Meta com a ação incluída.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/goals/{id}/actions/{actionId}:
    parameters:
