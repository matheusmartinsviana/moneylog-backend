  # ---------------------------------------------------------------- Etapa 7: notificações, lembretes, push, mensagem diária
  /v1/notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: Central de notificações (as não arquivadas)
      description: Os textos são **chave de i18n + `params`**; o front traduz e formata (S-34). `status=UNREAD` é o padrão.
      parameters:
        - name: status
          in: query
          schema:
            type: string
