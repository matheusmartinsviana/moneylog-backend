openapi: 3.1.0
info:
  title: moneylog API
  version: 2.38.1
  summary: Contrato das Etapas 2 a 6 (contas, categorias, movimentações, cartões, faturas, parcelas, pessoas, dívidas, recorrências, metas, resumo mensal, projeções, exportação e vault de notas) dos acréscimos do redesign (relatórios, busca global e variações do Início) e da Etapa 7 (importação de extrato CSV/OFX, notificações, lembretes, push preparado e mensagem diária).
  description: |
    Fonte da verdade do contrato entre o backend e o frontend (S-66). O backend prova a conformidade nos testes de
    integração (toda requisição e toda resposta é validada contra este arquivo) e o frontend gera os tipos dele.
    Referência: `docs/planos/2026-10-04-etapa-2-contas-movimentacoes.md` §4, `docs/planos/2026-10-05-etapa-3-cartoes-faturas-parcelas.md` §4, `docs/planos/2026-10-05-etapa-4-dividas-pessoas-recorrencias.md` §4, `docs/planos/2026-10-05-etapa-5-metas-resumo-projecoes.md` §4, `docs/planos/2026-10-05-etapa-6-vault-notas.md` §4 (ADR-009), `docs/planos/2026-10-10-redesign-workspace.md` §5 (versão 2.6.0, só acréscimos compatíveis), `docs/planos/2026-10-05-etapa-7-importacao-notificacoes.md` §4 (versão 2.7.0, só acréscimos compatíveis), `docs/planos/2026-10-05-etapa-8-ia.md` §4 (versão 2.8.0, só acréscimos compatíveis) e `docs/arquitetura/arquitetura.md` §4.

    ## Correção 2.38.1 (só acréscimo compatível)
    `GET /v1/ai/analyses` passa a declarar o `403` (`ForbiddenRole`) que já devolvia para `MEMBER`.

    ## Multiusuário por convite (2.38.0, só acréscimos compatíveis, ADR-032)
    O dono (`OWNER`, exatamente um) convida pessoas por e-mail; cada convidado (`MEMBER`) tem conta própria, com dados totalmente isolados dos demais, inclusive do dono. Não há cadastro público.
    - **Convite**: `POST /v1/invitations` (só `OWNER`), token aleatório de 256 bits guardado só como hash, validade de 7 dias, uso único, reenvio (`resend`, novo token) e revogação (`DELETE`).
      O token em claro nunca aparece em resposta de gestão nem em log; viaja só no **fragmento** da URL do e-mail (`https://moneylog.mviana.tech/convite#<token>`) e **nenhum endpoint o recebe em caminho ou query**:
      o front o lê do fragmento e o envia no corpo de `POST /v1/invitations/preview` e `POST /v1/invitations/accept` (públicos, sem JWT, `Cache-Control: no-store`, sob limite de tentativas).
    - **Ciclo de vida** (`Invitation.status`): `PENDING`, `ACCEPTED`, `EXPIRED`, `REVOKED`. Um `PENDING` vencido é tratado como `EXPIRED`. Reenviar vale em `PENDING` e `EXPIRED` (em `EXPIRED` reavalia as regras de criação:
      `409 EMAIL_ALREADY_REGISTERED`, `409 INVITATION_PENDING`, `409 USER_LIMIT_REACHED`); em `ACCEPTED` e `REVOKED` é `409 INVITATION_NOT_RESENDABLE`. Revogar `ACCEPTED` é `409 INVITATION_NOT_REVOCABLE`; revogar `REVOKED` é idempotente.
      Token expirado, usado, revogado ou inexistente: `404 INVALID_INVITATION`, idêntico nos quatro casos. Senha fraca no aceite: `422 WEAK_PASSWORD` e o token continua válido.
    - **Falha de envio**: `502 EMAIL_DELIVERY_FAILED` significa que o convite **foi criado** com `deliveryStatus = FAILED`; o `problem+json` traz `invitationId` (o convite criado) para o cliente oferecer `resend` sem duplicar.
      O mesmo `invitationId` acompanha `409 INVITATION_PENDING` (o convite pendente existente).
    - **Usuários**: `GET /v1/users`, `POST /v1/users/{id}/disable` e `POST /v1/users/{id}/enable` (só `OWNER`). `ManagedUser` não traz nenhum dado financeiro. Desativar bloqueia login e refresh, revoga as sessões e não apaga dados;
      o dono não se desativa (`409 CANNOT_DISABLE_OWNER`). O papel e o status valem do **banco** a cada requisição; a claim `role` do JWT é só dica para a interface e nunca autoriza nada.
    - **Papéis**: `MEMBER` em rota de gestão (`/v1/users/**`, `/v1/invitations/**` exceto `preview` e `accept`) ou nos endpoints de IA recebe `403 FORBIDDEN` (`application/problem+json`).
    - **Sessão**: `AuthToken` ganha `user = { id, email, role }`, aditivo (cliente antigo ignora).
    - **Chave de desligamento** `moneylog.invitations.enabled`: desligada, `POST /v1/invitations`, `resend`, `preview` e `accept` respondem `404`; a gestão de usuários continua.
    - Teto de usuários (`moneylog.users.max`): conta usuários (`ACTIVE` e `DISABLED`) e convites `PENDING` não expirados; acima, `409 USER_LIMIT_REACHED`.

    ## Valor do documento da fatura e alerta de divergência (2.37.0, só acréscimos compatíveis, ADR-028)
    O dono informa o valor que consta no **documento da fatura** do cartão (`PUT /v1/invoices/{id}/document-amount`, `documentAmount = null` limpa). Serve só de comparação: o `total`
    calculado pelo backend continua sendo a fonte da verdade. `Invoice` ganha `documentAmount` (`null` sem valor informado), `documentDivergence` (`total` − `documentAmount`, com sinal; `null`
    sem valor ou quando fecham) e `documentVersion` (versão para o `version` opcional do `PUT`). Quando `|total − documentAmount|` passa de `documentDivergenceTolerance`, o job de alertas
    gera `DOCUMENT_DIVERGENCE` (`refType` `INVOICE`, novo valor de `NotificationRef.type`, `refId` = id da fatura, `titleKey` `notification.document.divergence`, `params` `label`, `informed` (o total calculado), `documented`
    e `difference` (absoluta)); dentro da tolerância, ou com o valor removido, o alerta deixa de ser gerado. Valor negativo ou fora de BRL → `422 INVOICE_DOCUMENT_AMOUNT_INVALID`;
    `version` desatualizada → `409 VERSION_CONFLICT`; fatura de outro usuário → `404 INVOICE_NOT_FOUND`.

    ## Mês previsto do recebimento, editável por recebível (2.36.0, só acréscimos compatíveis, ADR-023)
    O "a receber" de um mês (`OwnerStatementMonth.receivablesPending`) passa a usar o **mês em que o recebimento está previsto**, não o mês do consumo. Cada recebível é a parte de uma
    pessoa em **uma parcela** de compra de cartão rateada. Por padrão o mês previsto é o mês do **vencimento da fatura** daquela parcela; o dono pode trocá-lo
    (`PUT /v1/third-party-receivables/{transactionId}/installments/{installmentId}/people/{personId}/expected-month`, `expectedMonth = null` volta ao padrão). Vale o último valor definido e o
    valor só conta no mês escolhido. O consumo (`grossConsumption`, `ThirdPartyPersonMonth`) continua na competência do consumo. `ThirdPartyItem.installments` lista as parcelas
    de um item `CARD_SHARE` (vazio nos demais). Recebível já recebido por inteiro → `422 RECEIVABLE_ALREADY_RECEIVED`; mês fora de 2000-01..2100-12 →
    `422 RECEIVABLE_EXPECTED_MONTH_INVALID`; recebível que não existe ou é de outro usuário → `404 RECEIVABLE_NOT_FOUND`. `NetWorthOverview.receivablesPending` é o total e não muda.

    ## Faixas de entrada e status de erro (2.35.0, só texto, sem mudança de comportamento)
    - `POST /v1/simulations/purchase`: `installments` fora de 1..36, `interestRatePerMonthBps` fora de 0..10000 e `firstInstallmentMonth` fora de 2000-01..2100-12 respondem
      `422 SIMULATION_INVALID` (regra de negócio validada no caso de uso), não `400`. Os `minimum`/`maximum` do schema descrevem a faixa aceita.
    - `lastDigits` da compra com formato diferente de 4 dígitos responde `422`; o `pattern` de `CardLastDigits` descreve o formato aceito.
    - `PUT /v1/profile/photo`: a foto não conta na cota das fotos de meta e tem limite próprio de 2 MB já processada (exibição + miniatura); acima disso `422 GOAL_PHOTO_QUOTA_EXCEEDED`.

    ## Foto de perfil (2.34.0, só acréscimos compatíveis)
    Foto única por usuário, no molde das fotos de meta (ADR-018): `PUT /v1/profile/photo` (multipart `file`) substitui a foto, `GET /v1/profile/photo/content?variant=thumb|display`
    devolve os bytes (JPEG, `no-store`; sem foto → `404 PROFILE_PHOTO_NOT_FOUND`) e `DELETE /v1/profile/photo` remove (`204`, idempotente). Os tipos, limites e códigos de erro
    de imagem são os de `POST /v1/goals/{id}/photos` (`GOAL_PHOTO_*`). `NotificationSettings` ganha `hasPhoto` e `photoVersion` (somente leitura) para o front saber se há foto e invalidar o cache.

    ## Correções de texto (2.33.2, sem rota nova)
    - `PUT /v1/transactions/{id}/shares`: o patrimônio muda exatamente pela variação da minha parte (antes dizia que não mudava); o valor da compra não é editável.
    - `ThirdPartyPersonMonth.pending` e `ThirdPartyMonth.thirdPartyPending` seguem a mesma regra do rateio de cartão (`owed - received` do mês) e podem ser negativos no mês de um estorno parcial, para a soma dos meses fechar com o total da pessoa.

    ## Correções de conformidade (2.33.1, sem rota nova)
    - `/v1/insights/monthly|daily|history` aceitam `view` (`MINE` padrão) e devolvem `view`; `/v1/insights` aceita `view` e mantém a forma original.
    - `Recurrence.incomeCompetenceOffsetMonths` aceita `-1` (ADR-017 emendada). `IncomeProfileInput` e `IncomeProfileUpdate` passam a compor `IncomeProfileFields` com `unevaluatedProperties: false`, para o `PUT` poder carregar `version`.
    - `PreviewDeduction.debtId` é sempre enviado (`null` fora da rubrica `LOAN`); `PurchasePreview.splitMode` é omitido quando a compra não é rateada.
    - Tabela de erros: `COMMITMENT_CLAUSES_INVALID` removido (cláusulas inválidas respondem `COMMITMENT_INVALID`) e `CARD_BRAND_TOO_LONG` incluído.
    - Exemplos de `MonthlySummary`, `IncomeExpenseSeries` e `SpendingByCategory` com `view`.

    ## Backup completo v2 e restauração (2.33.0, só acréscimos)
    - `GET /v1/exports/backup` passa a `schemaVersion` 2 e traz tudo que o app guarda do usuário: além do que já vinha, o rateio das compras e das recorrências
      (`shares`), a natureza (`nature`), a moeda estrangeira (`originalAmount`/`fxRate`/`iofBps` na movimentação e `originalAmount`/`referenceFxRate`/`iofBps` na recorrência),
      a assinatura (`isSubscription`, `scope`, `channel`, `overlapGroup`, `lastUsedOn`), a procedência (`provenance`), os finais do cartão e o débito automático
      (`lastDigits`, `autoDebit`, `brand`, `bestPurchaseDay`, `closingDayConfirmed`), `kind`/`channel` das dívidas, a chave da categoria de sistema (`systemKey`), os campos
      novos das metas e as listas `purchaseGroups`, `assets` (com histórico), `incomeProfiles` (com rubricas), `incomeOccurrences`, `payrollLoanPlans`,
      `payrollLoanApplications`, `commitments` (cronograma, cotas e cláusulas), `thirdPartyExpenses` (marcas de terceiro) e `thirdPartyReceipts`. Fica de fora: fotos das metas.
    - `POST /v1/backups/restore` restaura um backup (versão 1 ou 2) **só em conta sem dados financeiros**; tudo ou nada, na ordem das chaves estrangeiras, com os
      lançamentos do razão e os saldos idênticos ao arquivo. Os `id` do arquivo são mantidos (por isso o backup original precisa ter sido apagado). Origem `IMPORT` volta como `MANUAL`.
    - Códigos novos: `RESTORE_TARGET_NOT_EMPTY` e `RESTORE_CONFLICT` (409), `BACKUP_INVALID` e `BACKUP_SCHEMA_UNSUPPORTED` (422).

    ## Migração do rateio legado e códigos de erro (2.32.2, só acréscimos)
    - `POST /v1/third-party-expenses/share-migration/dry-run` devolve o relatório (hash, por compra e por mês, totais, `receivableRecognized`, exceções com motivo) sem gravar;
      `POST /v1/third-party-expenses/share-migration/apply` aplica o relatório aprovado pelo hash, com backup confirmado, e é idempotente (`alreadyApplied`).
    - Códigos novos na tabela de erros: `SHARE_MIGRATION_REPORT_MISMATCH` (409), `SHARE_MIGRATION_BACKUP_REQUIRED` e `SHARE_MIGRATION_NOTHING_TO_APPLY` (422),
      `PAYROLL_LOAN_INVALID` (422), `PURCHASE_GROUP_UNTIL_INVALID` e `NET_WORTH_MONTH_INVALID` (400).

    ## Ajustes do parecer de contratos do Lote 1 (2.32.1, só acréscimos compatíveis; decisões provisórias delegadas pelo dono)
    - **Recebimento sem conta (ADR-022):** `settlement = ALREADY_IN_BALANCE` com `ledgerEffect = EQUITY_OFFSET` grava `RECEIVABLE −X / EQUITY +X` com fonte de posting
      própria `THIRD_PARTY_RECEIPT_IN_BALANCE` (id = id do recebimento) e data = `receivedOn`; sem `accountId` o `Idempotency-Key` é **obrigatório**. O legado
      (sem `accountId`) devolve `ledgerEffect = NONE`.
    - **Assinatura por marca explícita (ADR-025):** `Recurrence.isSubscription` (padrão `false`); `GET /v1/subscriptions` lista só as marcadas. Migração conceitual:
      toda recorrência `CARD_PURCHASE` existente passa a `true`; o dono revisa.
    - **Consignado (ADR-026):** a renda no razão é `N + p`; a tela expõe `receivedInAccount = N` (o que cai na conta) e `appliedToDebt = p` (parcela baixada pela folha).
      `interestAmount` é opcional por rubrica `LOAN`; sem ele a parcela baixa só principal, a confiança é `ESTIMATED` e vem o aviso `PAYROLL_INTEREST_NOT_SPLIT`.
    - **Reserva (ADR-027):** só ativos `AVAILABLE` com `countsAsReserve` contam; FGTS nunca. Não informe como ativo um saldo que já está numa conta (dupla contagem).
    - **Para o front:** `view` tem padrão `MINE` (envie `GROSS` explicitamente onde precisar do bruto e rotule a visão); os enums `ThirdPartyItem.source = CARD_SHARE`,
      `Debt.kind` e `NotificationKind` ganharam valores, então todo `switch` precisa de ramo padrão; `Transaction.shares` (dívidas da despesa dividida em conta) não é
      `Transaction.personShares` (rateio de compra no cartão). A versão 2.28.0 é uma lacuna intencional de numeração, reservada ao simulador (ADR-030).

    ## Alertas novos, proveniência e dados do cartão (2.32.0, só acréscimos compatíveis; ADR-028)
    `NotificationKind` ganha `INVOICE_DUE_AUTODEBIT_OFF`, `NEGATIVE_MONTH_PROJECTED`, `NEW_DEBT_BEFORE_FINANCING`, `CARD_CASH_OUT_COST` (Pix no crédito: taxa efetiva
    mensal e valor da parcela), `SUBSCRIPTION_OVERLAP`, `SUBSCRIPTION_UNUSED`, `WEEKLY_CHARGE`, `THIRD_PARTY_OVERDUE`, `BALANCE_BELOW_REAL_ESTATE` e
    `DOCUMENT_DIVERGENCE`, todos gerados no backend, com chave de i18n e sem depender de IA. `/v1/settings/notifications` ganha `alerts` (liga/desliga por tipo
    novo em `kinds` e três parâmetros): `subscriptionUnusedDays` (`null` até o dono definir; com `null` o alerta `SUBSCRIPTION_UNUSED` fica inativo),
    `invoiceDueLeadDays` (padrão 3) e `documentDivergenceTolerance` (padrão 0,00). `PurchasePreview.warnings` ganha `FINANCING_PENDING`. O `Card` ganha
    `autoDebit` (`null` = desconhecido, sem alerta até o dono marcar), `brand`, `bestPurchaseDay` e `lastDigits`; a compra aceita `lastDigits` (um final que não
    pertence ao cartão é `422 PURCHASE_LAST_DIGITS_NOT_FROM_CARD`), e a fatura continua **uma por cartão**, sem quebra por final. `provenance` (`origin`:
    `PRINT`, `PAYSLIP`, `CONTRACT`, `INFORMED`; `confidence`: `CONFIRMED`, `ESTIMATED`) é opcional em item de compromisso, recorrência, perfil de renda,
    ativo e rateio; ausente vale `INFORMED`/`CONFIRMED`. O **status é derivado na leitura**, nunca gravado. O `OwnerStatement` marca cada ponto com o pior
    `confidence` dos itens que o compõem.

    ## Imóvel com cota por co-comprador e cláusulas (2.31.0, só acréscimos compatíveis; ADR-029)
    Cada item do cronograma de um `LONG_TERM_PROJECT` ganha `shares` (cota por pessoa, em valor; a soma é o valor do item) e `coBuyerPersonId`; item sem cota é
    "cota não definida" (`sharesDefined = false`, conta 100% minha, estimado). O compromisso ganha `clauses` (multa, juros, retenção na rescisão, em pontos-base,
    com a retenção calculada pelo backend sobre o preço) e `totalsByPerson` (pago, pendente e total por pessoa). `GET /v1/commitments/{id}/by-person` entrega o
    mesmo recorte em JSON ou CSV (só tela e CSV; PDF fora). `PUT .../schedule/{position}/shares` e `PUT .../clauses` corrigem cotas e cláusulas. O financiamento
    (`FINANCING`) segue fora do pendente direto (ADR-014).

    ## Ativos não disponíveis (FGTS) e reserva de emergência (2.30.0, só acréscimos compatíveis; ADR-027)
    `assets` guarda ativos fora do razão de contas: o FGTS (sempre `RESERVED`, nunca disponível) e outros. O saldo de um ativo é **informado** (com histórico de
    cada atualização); ele **não** é renda, não entra no `owner-statement` e não altera o caixa. `GET /v1/net-worth/overview` separa o que está disponível
    (`availableCash`, a mesma fonte do Início), o reservado (`reservedAssets`), o que me devem (`receivablesPending`), as dívidas e a reserva de emergência com a
    cobertura em meses (base = saídas fixas da minha parte do mês). Limite de cartão e cheque especial nunca contam como disponível.

    ## Renda detalhada, tabelas fiscais, consignado em folha, TIR e Pix no crédito (2.29.0, só acréscimos compatíveis; ADR-026 e ADR-031)
    `income-profiles` guarda o bruto, os dependentes, o adiantamento, o dia do saldo, as rubricas (`TAX`, `BENEFIT`, `UNION`, `LOAN`, `OTHER`) e o 13º; a prévia
    (`/preview`) calcula o líquido no backend com INSS e IRRF das tabelas versionadas (`GET /v1/tax-tables`, somente leitura, carga por migração), em BRL
    exato, sem ponto flutuante. Sem tabela vigente: `422 TAX_TABLE_UNAVAILABLE` (nunca um número inventado). Rubrica `LOAN` aponta para a dívida (`debtId`): o
    consignado é desconto em folha e **não** vira saída duplicada. `Debt` ganha `kind` (`PERSONAL`, `PAYROLL`, `CARD_CASH_OUT`), `channel` e a taxa efetiva
    (`effectiveRate`, TIR mensal e anual). `POST /v1/card-cash-outs` registra o Pix no crédito como empréstimo: o principal não é consumo, só o juro é custo.
    `NotificationKind.CARD_CASH_OUT_COST` chega com o contrato 2.32.0 (ADR-028).

    ## Simulador de compra parcelada (2.28.0, só acréscimos compatíveis; ADR-030)
    `POST /v1/simulations/purchase` mostra, **sem gravar nada**, o efeito de uma compra parcelada na sobra de cada mês (mesmo motor do `owner-statement` e a
    mesma parcela do `purchase-preview`). A resposta declara o **horizonte** calculado (`horizon`): quando as parcelas vão além dele, `horizon.limited = true`,
    `reasons` traz `HORIZON_LIMITED` e a classificação **nunca** é `SUSTAINABLE` (o aperto pode estar depois do último mês calculado). A classificação é regra
    estrutural, sem limiar numérico, num único lugar do backend: `INCOMPATIBLE`, `VIABLE_WITH_PLANNING`, `RISKY` ou `SUSTAINABLE`, sempre com `reasons`. Os cortes
    (`cancelSubscriptionIds`) são só de assinaturas ativas escolhidas pelo usuário; sem cortes informados, `VIABLE_WITH_PLANNING` não é alcançável.

    ## Assinaturas e moeda estrangeira como metadado (2.27.0, só acréscimos compatíveis; ADR-025)
    O razão continua só em BRL. USD/EUR é **metadado** da cobrança: `originalAmount` (valor na moeda), `fxRate` (câmbio informado a cada cobrança, string
    decimal de até 6 casas) e `iofBps` (IOF em pontos-base; padrão 350 com moeda estrangeira). O valor em BRL é `original x fxRate` mais o IOF, com **um único
    arredondamento**. O câmbio é informado **na confirmação de cada ocorrência** (`RealizeOccurrenceInput`) e na compra de cartão; `Recurrence.referenceFxRate`
    só serve de base da previsão. A recorrência ganha `scope` (`PERSONAL`/`COMPANY`), `channel`, `overlapGroup`, `lastUsedOn`; `POST /v1/recurrences/{id}/end`
    aceita `activeUntil`; `GET /v1/subscriptions` lista as recorrências de despesa **marcadas como assinatura** (`isSubscription`, 2.32.1) com custo mensal equivalente, totais, `totalMonthlyMine` e sobreposições.

    ## Compra parcelada agrupada (2.26.0, só acréscimos compatíveis; ADR-024)
    `PurchaseGroup` junta compras parceladas do mesmo item em cartões diferentes (ex.: um notebook em dois cartões). O grupo **não cria lançamento**:
    cada membro é uma compra criada pelos caminhos existentes (compra comum ou compra em andamento, com ou sem rateio) e o grupo só **lê** o
    total, o que falta, o mês final e a parcela do mês. `GET /v1/purchase-groups/commitments` devolve o comprometido até um mês, sem duplicar
    compras que estão fora de grupo. Estorno e cancelamento de parcelas de um membro recalculam o grupo.

    ## Resumo do mês do dono (2.25.0, só acréscimos compatíveis; ADR-023)
    `GET /v1/owner-statement` responde "quanto do MEU salário sobra depois de tudo que é MEU": por mês, `income` (renda de competência M-1 paga na
    coluna de M, `incomeLagMonths = 1`), `outflow` (faturas no mês do vencimento, parcelas futuras, recorrências previstas, despesas fora do cartão
    e minha cota do imóvel, cada item uma só vez), `surplus`, `endBalance` e `receivablesPending` (o que me devem, nunca renda). O saldo inicial
    (`openingBalance`) é o saldo atual das contas `CASH`; com `from` posterior ao mês corrente ele não é projetado e o aviso
    `OPENING_BALANCE_NOT_PROJECTED` vem em `warnings`. Tudo na visão `MINE`; `cardsGross` aparece ao lado e nunca entra no total. Despesas e
    recorrências ganham `nature` (`FIXED` ou `VARIABLE`); a forma de pagamento é o `method` que já existia (`PaymentMethod`).

    ## Rateio por pessoa e visão "minha parte" (2.24.0, só acréscimos compatíveis; ADR-022)
    A compra no cartão e a recorrência no cartão aceitam `splitMode` (`BPS`, `EQUAL`, `AMOUNT`) e `shares`: a parte de cada pessoa é gravada
    como `RECEIVABLE` na hora da compra, e o consumo (`EXPENSE`) passa a ser só a **minha parte**. A fatura, o caixa e a dívida do cartão
    continuam **cheios** (PR 01, regra 4). `PUT /v1/transactions/{id}/shares` reclassifica o rateio (vale em fatura fechada; só interno).
    `PurchasePreview` devolve as partes calculadas pelo backend. **Visão padrão `MINE`**: os endpoints de leitura de consumo
    (`GET /v1/summaries/{month}`, `/v1/dashboard/summary`, `/v1/entries`, `/v1/reports/*`, `/v1/insights/*`) aceitam `view=MINE|GROSS`
    (padrão `MINE`) e devolvem `view`; `GROSS` soma o consumo e o que está a receber de rateio. Isto **revoga a regra de consumo bruto até o
    reembolso da ADR-014 §2**: sem rateio, os números não mudam. **Emenda A1b (ainda 2.24.0, não mesclado):** `POST /v1/third-party-receipts` aceita
    `accountId` opcional e devolve `settlement` (`ACCOUNT` | `ALREADY_IN_BALANCE`; sem conta, `RECEIVABLE −X / EQUITY +X`); `RECEIPT_ACCOUNT_REQUIRED` deixa de
    existir; `GET /v1/recurrences/summary` aceita `view` e a medida `FIXED_COSTS_MONTHLY` lê `MINE`. `ThirdPartyItem.source` ganha `CARD_SHARE` e `ThirdPartyPerson` ganha
    `months[]`. Nome do campo de saída: `Transaction.personShares` (o `Transaction.shares` existente continua sendo as dívidas da despesa
    dividida em conta).

    ## Primeiro acesso do dono (2.15.0, só acréscimos compatíveis; ADR-015)
    `GET /v1/auth/status` (público) devolve `{ passwordSetupRequired }` e `POST /v1/auth/setup-password` define a senha do dono
    com um código de uso único (`setupCode`), abre a sessão como o login e revoga todas as sessões anteriores. O restante do
    contrato não muda.

    ## Fatura histórica (2.16.0, só acréscimos compatíveis; ADR-014)
    `POST /v1/cards/{id}/historical-invoices` registra o valor de uma fatura passada que o usuário só conhece pelo pagamento (item `CARD -X / EQUITY +X`,
    sem categoria e sem consumo, `Transaction.source = HISTORICAL`); em seguida o pagamento real quita a fatura. Acréscimo: `TransactionSource.HISTORICAL`.

    ## Insights calculados (2.20.0, só acréscimos compatíveis; ADR-019)
    Insights financeiros determinísticos (fórmulas sobre o razão, sem IA, sem provedor, offline), em dois horizontes: `GET /v1/insights/monthly`
    (mês) e `GET /v1/insights/daily` (dia, no fuso do usuário), mais `GET /v1/insights/history` (até 12 meses), `POST` e `DELETE
    /v1/insights/{id}/dismissals` (dispensa auditada, só inserção). `GET /v1/insights` continua como alias do mensal **na forma
    original** (só `CATEGORY_DELTA` e `CARD_COMMITTED`, schema `Insight` inalterado). O insight completo é o `InsightItem`, com `id`, `severity`,
    `priority`, `period`, `basis`, `confidence`, `subjectId` e `dismissed`. A lista ganha `insufficient[]`: por que um insight **não** saiu (nunca se inventa número com dado
    insuficiente). O cálculo é só do backend; o front traduz `key` + `params` e formata. `/v1/ai/*` não muda e os insights nunca chamam a IA.

    ## Metas de sonho com fotos (2.19.0, só acréscimos compatíveis; ADR-018)
    A meta `SAVINGS` ganha `featured` (meta em destaque da Home: no máximo uma por usuário), `coverPhotoId` e `photos[]` (só metadados, na
    ordem de exibição; a capa é a primeira). Fora de `SAVINGS`, `featured = false`, `coverPhotoId = null` e `photos = []`. Rotas novas:
    `POST /v1/goals/{id}/photos` (multipart `file`, `Idempotency-Key` opcional), `GET /v1/goals/{id}/photos/{photoId}/content?variant=thumb|display`
    (bytes `image/jpeg`, **autenticado por Bearer**, `Cache-Control: no-store`, `X-Content-Type-Options: nosniff`; o front busca com o
    interceptor e cria um object URL), `PUT .../photos/order`, `PUT .../photos/{photoId}/cover`, `DELETE .../photos/{photoId}` e
    `PUT /v1/goals/{id}/featured`; `GET /v1/goals` aceita `featured`. Limites: 8 fotos por meta, 40 por usuário, 40 MB por usuário,
    arquivo de até 8 MB, só JPEG e PNG (conferidos pelo conteúdo, não pelo nome nem pelo MIME), até 24 megapixels e 8000 px no maior lado.
    O servidor recodifica sempre (sem EXIF/GPS) e guarda só a exibição (até 1280 px) e a miniatura (até 320 px). As fotos não vão no
    backup JSON nem no vault, nunca em log e nunca para a IA.

    ## Competência de renda (2.18.0, só acréscimos compatíveis; ADR-017)
    Uma **receita** (`INCOME`) pode pertencer a um mês diferente do mês em que o dinheiro cai (salário dividido: o adiantamento pago em
    16/09 conta como renda de outubro). `IncomeInput`/`IncomeUpdate` ganham `incomeCompetence` (`AAAA-MM`, opcional; ausente ou `null` = o mês
    da `date`, como sempre; no `PUT` ausente **limpa**). O lançamento, o saldo, o caixa e `totals.cashFlow` continuam na `date`: só a
    **competência** da renda muda, e todas as leituras que agrupam por competência (`GET /v1/summaries/{month}`, `GET /v1/dashboard/summary`
    `month.income`/`net`, `GET /v1/entries?lens=INCOME`, `GET /v1/reports/income-expenses` com `period=M12`) usam a competência da renda.
    Em `income-expenses`, `DAY`/`WEEK` (`basis = DATE`) continuam por data efetiva (caixa: quando a renda **entrou**) e `MONTH`
    (`basis = COMPETENCE`) por competência (a renda **do mês**); a renda total é a mesma nos dois, só o balde muda. `Entry.competence` passa a
    refletir a competência da linha (receita de outro mês: `competence` ≠ mês de `date`). Só `INCOME` aceita o campo (despesa, transferência,
    ajuste etc. nunca mudam de mês: `additionalProperties: false`); fora de 2000-01..2100-12 → `422 INCOME_COMPETENCE_INVALID`. Recorrência de
    receita: `RecurrenceInput`/`RecurrenceUpdate.incomeCompetenceOffsetMonths` (-1, 0 ou 1; ADR-017 emendada) e `Recurrence.incomeCompetenceOffsetMonths`; a ocorrência
    realizada herda `incomeCompetence` = mês da data da ocorrência + deslocamento (as já realizadas não mudam). `Transaction.incomeCompetence`,
    `SearchTransaction.incomeCompetence`, a 10ª coluna do CSV (`Competência da renda`/`Income month`) e, no backup, `BackupTransaction.incomeCompetence`,
    `BackupRecurrence.incomeCompetenceOffsetMonths` e `BackupPosting.competence` são aditivos. Importação CSV/OFX: sem `incomeCompetence`.

    ## Metas de medida, estágio e plano (2.17.0, só acréscimos compatíveis; ADR-016)
    `Goal.kind = METRIC`: a meta acompanha uma medida do sistema (`metric`: `TOTAL_DEBT`, `CARD_DEBT`, `PEOPLE_DEBT`, `OTHER_DEBT`,
    `ACCOUNTS_BALANCE`, `AVAILABLE_BALANCE`, `FIXED_COSTS_MONTHLY`, cada uma na mesma fonte da tela correspondente) até `target`, a
    partir de um `baseline` capturado na criação; `direction` é derivada; `current`, `remaining`, `progress`, `reached` e `metricAsOf`
    são calculados ao vivo. Em **todo** tipo de meta, a leitura traz `stage` (`FANTASY` sem prazo, `OBJECTIVE` com prazo, `STRATEGY` com
    prazo e plano, `CONSISTENT` com prazo, plano e `streak` >= 2, `ACHIEVED` quando atingida), o plano automático (`requiredPace`,
    `monthsLeft`, `nextMilestone`, `onTrack`, `gap`), o plano declarado (`planNote`, `actions`; `POST/PUT/DELETE /v1/goals/{id}/actions`
    e `POST .../actions/{actionId}/check-in`) e a consistência (`consistency`, `streak`, `consistencyRate`). `GoalUpdate.name` e
    `GoalUpdate.target` deixam de ser obrigatórios no contrato (continuam exigidos em `SAVINGS`, agora como `422`); `Goal.name`, `current`
    e `remaining` podem ser nulos (`METRIC` sem nome; `METRIC` arquivada não calcula). Nenhum campo ou rota existente mudou de significado.

    ## Compromissos acompanhados, despesa de terceiro e carga de fatura emitida (2.14.0, só acréscimos compatíveis; ADR-014)
    `/v1/commitments` (empréstimo no nome de terceiro e projeto de longo prazo com cronograma próprio, sem efeito em contas, consumo ou no
    total de dívidas), `POST /v1/third-party-expenses` e `GET /v1/debts/third-party-receivables` ("dinheiro a receber de terceiros" e o
    gasto bruto x terceiros x líquido do mês), `DebtOverview.tracked` (à parte do total). Acréscimos em schemas existentes:
    `RecurrenceInput` aceita despesa/receita sem `accountId`/`method` ("conta a definir"; `RealizeOccurrenceInput.accountId`/`method` os
    informam ao confirmar, senão `422 RECURRENCE_ACCOUNT_REQUIRED`). Mudança de comportamento (sem mudar o formato): uma fatura já fechada,
    ainda no prazo de vencimento e sem nenhum item recebe a compra do ciclo como lançamento tardio (antes: ia para a fatura corrente).

    ## Visão total de dívidas (2.13.0, só acréscimos compatíveis; ADR-013, `docs/planos/2026-10-14-visao-total-de-dividas.md`)
    `GET /v1/debts/overview` (quanto o usuário ainda deve, custo fixo ao lado, comparação e cronograma), compra parcelada em andamento
    (`POST /v1/cards/{id}/ongoing-installments` e `/preview`), meta `DEBT_PAYOFF` (`Goal.kind`, `POST /v1/goals/{id}/baseline`) e dívida com
    credor livre (`DebtInput.creditorName`, sem `Person`). Acréscimos em schemas existentes: `Goal.kind`, `baselineSet`, `baseline`,
    `baselineAt`, `grewSinceBaseline` (meta sem `kind` = `SAVINGS`); `Debt.creditorName` e `DebtSummary.creditorName` (com `person` nulo
    nessa dívida); `TransactionSource.ONGOING`. Nenhum campo ou rota existente mudou de significado.

    **Versão do OpenAPI: 3.1.0** (spike S-84: o `swagger-request-validator` 3.0.0 valida `oneOf` + `discriminator`,
    `type: [string, "null"]` e `$ref` com irmãos).

    ## Campos opcionais com padrão no servidor (2.11.0, só afrouxa, não quebra cliente antigo)
    Ausentes, estes campos são resolvidos pelo servidor (o front pode omiti-los): `description` (movimentações, `DebtInput`, `RecurrenceInput`;
    fica nula, o front gera o rótulo), `categoryId` (despesa, compra no cartão, reembolso sem origem e recorrência de despesa = categoria de
    sistema `OTHER_EXPENSE`; receita e recorrência de receita = `OTHER_INCOME`; reembolso com `refundOfTransactionId` herda a da original),
    `method` (`OTHER`), `installments` (1), `openingBalance` (0,00), `openingDate` (hoje no fuso do usuário), `priority` da meta (`MEDIUM`).

    ## Convenções
    - Base `/v1`, JSON, `Authorization: Bearer <accessToken>` em tudo, exceto `/v1/auth/*`.
    - **Dinheiro** é sempre `Money = { amount: "1200.00", currency: "BRL" }`: `amount` em string decimal com 2 casas
      (nunca número). O frontend não soma, subtrai nem arredonda valores: exibe o que a API calcula.
    - Datas `YYYY-MM-DD` (data financeira no fuso `America/Sao_Paulo`); instantes ISO-8601 UTC; competência `YYYY-MM`.
    - Criação: `201` + `Location` + recurso completo. Edição: `PUT` com `version` (lock otimista; desatualizada =
      `409 VERSION_CONFLICT`) → `200` + recurso. Ações: `200` + recurso atualizado.
    - Listas: `Slice = { items, hasNext }` com `page` (1-indexado, padrão 1) e `pageSize` (padrão 10, máximo 50); `page=0`
      ou `pageSize=51` → `400`. As listas curtas (categorias) não são paginadas.
    - Erros: `application/problem+json` (RFC 9457) com `code` estável e `traceId` (igual ao header `X-Trace-Id`). O front
      traduz pelo `code`, nunca pela mensagem. O `500` nunca traz a mensagem interna.
    - Recurso inexistente **ou de outro usuário** responde `404` (não revela a existência).

