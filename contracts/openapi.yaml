        notes:
          type: [string, 'null']
          maxLength: 2000
        fromAccountId:
          type: string
          format: uuid
        toAccountId:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
    InvestmentUpdate:
      type: object
      description: 'Edição: o corpo do `POST` do tipo + `version`. Aplicação ou resgate entre conta `CASH` e conta `INVESTMENT` (`INVESTMENT`).'
      required: [type, amount, date, cashAccountId, investmentAccountId, direction, version]
      additionalProperties: false
      properties:
        type:
          type: string
          const: INVESTMENT
        amount:
