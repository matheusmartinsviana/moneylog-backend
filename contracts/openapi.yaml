  /v1/owner-statement:
    get:
      tags: [Summaries]
      operationId: getOwnerStatement
      summary: Resumo do mês do dono (entradas, saídas, sobra e saldo por mês)
      description: |
        Tudo calculado pelo backend, na visão `MINE` (ADR-022, ADR-023). Coluna do mês M: **entradas** = renda de competência M-1 (`incomeLagMonths = 1`),
        com as parcelas de pagamento dessa competência e a data real de cada uma; **saídas** = o que **vence** em M (a fatura conta no mês do
        vencimento), em `outflow`; `surplus = income.total − outflow.total`; `endBalance = openingBalance + surplus` (encadeado por mês em `months > 1`).
        `outflow.total = cardsMine + offCard.fixed + offCard.variable + realEstateMine`; `subscriptionsMine` é recorte informativo de `cardsMine`
        (`includedInCards`) e `cardsGross` é só a leitura bruta: nenhum dos dois soma de novo. Cada item entra uma só vez, pela chave de
        deduplicação da ADR-023 (fatura, parcela futura, ocorrência prevista, lançamento, item de compromisso); pagar fatura e transferir
        entre contas nunca são saída. O que me devem (`receivablesPending`) nunca entra em `income` nem em `endBalance`.

        `openingBalance` = saldo atual das contas `CASH`. Com `from` posterior ao mês corrente, não se projeta o resto do mês corrente e vem o aviso
        `OPENING_BALANCE_NOT_PROJECTED`. Mês sem renda de competência: `income.total = 0` e aviso `INCOME_MISSING`. Cota do imóvel não definida:
        conta 100% minha com aviso `REAL_ESTATE_SHARE_UNDEFINED`. `status` do item de renda é derivado na leitura e `confidence` é `CONFIRMED`
        até existir proveniência. Recurso de outro usuário nunca aparece.
      parameters:
        - name: from
          in: query
          required: false
          description: 'Primeiro mês (`AAAA-MM`), de 2000-01 a 2100-12. Padrão: o mês corrente em `America/Sao_Paulo`.'
          schema:
            $ref: '#/components/schemas/Competence'
        - name: months
          in: query
          required: false
          description: 'Quantidade de meses a partir de `from`, de 1 a 12 (padrão 3). Resumo (3) e projeção (12) usam o mesmo cálculo.'
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 3
        - name: asOf
          in: query
          required: false
          description: 'Data do cálculo (padrão: hoje em `America/Sao_Paulo`), de 2000-01-01 a 2100-12-31. Define o que é `RECEIVED` e o que é `PLANNED`.'
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Resumo por mês.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerStatement'
              examples:
                novembro:
                  summary: Novembro de 2026, salário de competência outubro
                  value:
                    asOf: '2026-10-15'
                    view: MINE
                    incomeLagMonths: 1
                    openingBalance: {amount: '1000.00', currency: BRL}
                    months:
                      - competence: '2026-11'
                        income:
                          total: {amount: '6000.00', currency: BRL}
                          items:
                            - {source: INCOME_PROFILE, refId: null, date: '2026-11-01', amount: {amount: '3600.00', currency: BRL}, status: PLANNED, confidence: CONFIRMED}
                            - {source: INCOME_PROFILE, refId: null, date: '2026-11-16', amount: {amount: '2400.00', currency: BRL}, status: PLANNED, confidence: CONFIRMED}
                        outflow:
                          cardsMine: {amount: '3000.00', currency: BRL}
                          cardsGross: {amount: '3400.00', currency: BRL}
                          subscriptionsMine: {amount: '120.00', currency: BRL}
                          offCard:
                            fixed: {amount: '500.00', currency: BRL}
                            variable: {amount: '200.00', currency: BRL}
                            byMethod:
                              - {method: PIX, amount: {amount: '200.00', currency: BRL}}
                              - {method: BOLETO, amount: {amount: '500.00', currency: BRL}}
                          realEstateMine: {amount: '1000.00', currency: BRL}
                          total: {amount: '4700.00', currency: BRL}
                        companyReimbursable: {amount: '0.00', currency: BRL}
                        surplus: {amount: '1300.00', currency: BRL}
                        endBalance: {amount: '2300.00', currency: BRL}
                        negative: false
                        receivablesPending: {amount: '400.00', currency: BRL}
                    negativeMonths: []
                    warnings:
                      - {code: OPENING_BALANCE_NOT_PROJECTED, competence: '2026-11'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'


  /v1/purchase-groups:
    get:
      tags: [PurchaseGroups]
      operationId: listPurchaseGroups
      summary: Lista os grupos de compra parcelada (ordem `name asc`)
      description: |
        `status` padrão `ACTIVE` (ainda há parcela a vencer); `DONE` = todas as parcelas dos membros já passaram ou foram canceladas.
        Valores calculados pelo backend a partir das parcelas dos membros; nada é somado no cliente.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PurchaseGroupStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de grupos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseGroupSlice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [PurchaseGroups]
      operationId: createPurchaseGroup
      summary: Cria um grupo e as compras dos membros
      description: |
        Cada membro vira uma compra pelos caminhos existentes: com `remainingInstallments` menor que `totalInstallments` é compra em andamento
        (`POST /v1/cards/{id}/ongoing-installments`: só as parcelas que faltam, sem consumo retroativo); sem ele, compra comum de
        `installmentAmount x totalInstallments`. `splitMode`/`shares` do membro seguem a ADR-022. O total do grupo é **derivado** da soma dos
        membros; se `declaredTotal` vier e for diferente, o grupo é criado e `divergence` informa a diferença (nunca bloqueia). Tudo ou nada:
        um membro inválido (`422 PURCHASE_GROUP_INVALID`, `422 SHARES_INVALID`) não grava nenhum. `Idempotency-Key` opcional.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseGroupInput'
            examples:
              notebook:
                summary: Notebook em dois cartões
                value:
                  name: Notebook
                  interest: false
                  members:
                    - cardId: 3f1d2c4b-7a8e-4f60-8b21-5c9d0e1a2b3c
                      totalInstallments: 10
                      installmentAmount: '100.00'
                      remainingInstallments: 6
                      firstInvoiceDate: '2026-11-05'
                    - cardId: 8a2e5b71-0c4d-4e93-a6f8-9b1d3c5e7f20
                      totalInstallments: 3
                      installmentAmount: '50.00'
                      firstInvoiceDate: '2026-11-10'
      responses:
        '201':
          description: Grupo criado.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

