      required: [id, personId, amount, settlement, ledgered]
      properties:
        id:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        transactionId:
          type: [string, 'null']
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
        receivedOn:
          type: [string, 'null']
          format: date
        note:
          type: [string, 'null']
        accountId:
          type: [string, 'null']
          format: uuid
        settlement:
          $ref: '#/components/schemas/ThirdPartyReceiptSettlement'
        ledgered:
          type: boolean
    RestoreResult:
      type: object
      additionalProperties: false
      required: [schemaVersion, counts]
      properties:
        schemaVersion:
          type: integer
        counts:
          type: object
          description: Quantos registros de cada tipo foram restaurados.
          additionalProperties:
            type: integer
    BackupPosting:
      type: object
      description: Lançamento do razão (partidas dobradas). A soma por livro e data reconstrói saldos e consumo.
      required: [sourceType, sourceId, installmentId, bookType, bookId, amount, effectiveDate, active]
      additionalProperties: false
      properties:
        sourceType:
          type: string
          enum: [TRANSACTION, ACCOUNT_OPENING, DEBT_RECOGNITION, DEBT_CANCELLATION, THIRD_PARTY_RECEIPT, THIRD_PARTY_RECEIPT_IN_BALANCE, THIRD_PARTY_REFUND_ADJUSTMENT, SHARE_PAYABLE]
        sourceId:
          type: string
          format: uuid
        installmentId:
          type: [string, 'null']
          format: uuid
        bookType:
          type: string
          enum: [ACCOUNT, CARD, RECEIVABLE, PAYABLE, EXPENSE, INCOME, EQUITY]
        bookId:
          type: [string, 'null']
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
        effectiveDate:
          type: string
          format: date
        active:
          type: boolean
        competence:
          type: string
          description: 'Competência do lançamento (`AAAA-MM`): o mês de `effectiveDate`, exceto no livro `INCOME` com `incomeCompetence` (ADR-017). Campo opcional (2.18.0).'
    Backup:
      type: object
      description: |
        Backup completo dos dados do usuário (S-153). `schemaVersion` sobe quando um campo muda de sentido (campos novos são
        aditivos). Sem usuário, hash de senha, tokens nem segredos. As notas do vault entram na Etapa 6. A versão 2 (2.33.0) acrescenta os campos
        opcionais e as listas de ativos, renda, compromissos, grupos e terceiros; a versão 1 (só os campos do início) continua aceita em `POST /v1/backups/restore`.
      required:
        - schemaVersion
        - generatedAt
        - accounts
        - categories
        - cards
        - transactions
        - debts
        - people
        - recurrences
        - goals
        - ledgerPostings
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          minimum: 1
        generatedAt:
          type: string
          format: date-time
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/BackupAccount'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/BackupCategory'
        cards:
          type: array
          items:
            $ref: '#/components/schemas/BackupCard'
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/BackupTransaction'
        debts:
          type: array
          items:
            $ref: '#/components/schemas/BackupDebt'
        people:
          type: array
          items:
            $ref: '#/components/schemas/BackupPerson'
        recurrences:
          type: array
          items:
            $ref: '#/components/schemas/BackupRecurrence'
        goals:
          type: array
          items:
            $ref: '#/components/schemas/BackupGoal'
        ledgerPostings:
          type: array
          items:
            $ref: '#/components/schemas/BackupPosting'
        purchaseGroups:
          type: array
          items:
            $ref: '#/components/schemas/BackupPurchaseGroup'
        assets:
          type: array
          items:
            $ref: '#/components/schemas/BackupAsset'
        incomeProfiles:
          type: array
          items:
            $ref: '#/components/schemas/BackupIncomeProfile'
        incomeOccurrences:
          type: array
          items:
            $ref: '#/components/schemas/BackupIncomeOccurrence'
        payrollLoanPlans:
          type: array
          items:
            $ref: '#/components/schemas/BackupPayrollLoanPlan'
        payrollLoanApplications:
          type: array
          items:
            $ref: '#/components/schemas/BackupPayrollLoanApplication'
        commitments:
          type: array
          items:
            $ref: '#/components/schemas/BackupCommitment'
        thirdPartyExpenses:
          type: array
          items:
            $ref: '#/components/schemas/BackupThirdPartyExpense'
        thirdPartyReceipts:
          type: array
          items:
            $ref: '#/components/schemas/BackupThirdPartyReceipt'

    # ---- Vault de notas (Etapa 6, ADR-009)
    NoteLinkType:
      type: string
      description: |
        Tipo do alvo de um vínculo (S-160). `MONTHLY_SUMMARY` usa `key` (`AAAA-MM`); os demais usam `id`. `NOTE` é o mesmo que um wikilink.
      enum: [TRANSACTION, ACCOUNT, CARD, INVOICE, PERSON, DEBT, GOAL, MONTHLY_SUMMARY, NOTE]
    NoteStatus:
      type: string
      description: Filtro da lista (a lixeira só com `TRASHED`).
      enum: [ACTIVE, TRASHED]
    NoteSort:
      type: string
      description: '`RELEVANCE` só tem efeito com `q` (título, caminho, corpo, data); sem `q` vale `UPDATED`.'
      enum: [RELEVANCE, UPDATED, PATH, TITLE]
    NoteLinkOrigin:
      type: string
      description: '`WIKILINK` vem do corpo (recalculado a cada edição); `EXPLICIT` foi criado pelo usuário.'
      enum: [WIKILINK, EXPLICIT]
    NoteLinkState:
      type: string
      description: '`PENDING` = wikilink sem nota ou vínculo para uma entidade que não existe (só vem de importação).'
      enum: [RESOLVED, PENDING]
    NoteTargetStatus:
      type: string
      description: |
        Estado do alvo (S-164: o vínculo nunca some): movimentação `ACTIVE`/`VOIDED`; conta, cartão, pessoa e meta `ACTIVE`/`ARCHIVED`;
        dívida `ACTIVE`/`CANCELED`/`VOIDED`; nota `ACTIVE`/`TRASHED`. Fatura e resumo mensal: `null`.
      enum: [ACTIVE, VOIDED, ARCHIVED, CANCELED, TRASHED]
    ImportConflictMode:
      type: string
      description: Caminho já usado por nota ativa (sem diferenciar caixa).
      enum: [SKIP, RENAME]
    NoteLinkInput:
      type: object
      description: '`id` para entidades e notas; `key` (`AAAA-MM`, 2000-01 a 2100-12) para `MONTHLY_SUMMARY`.'
      required: [type]
      additionalProperties: false
      properties:
        type:
          $ref: '#/components/schemas/NoteLinkType'
        id:
          type: [string, 'null']
          format: uuid
        key:
          type: [string, 'null']
          maxLength: 7
    NoteInput:
      type: object
      required: [path, body]
      additionalProperties: false
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 600
          description: Caminho no vault, com `.md` (regras no `POST`). Acima de 255 caracteres → `422 NOTE_PATH_INVALID`.
        body:
          type: string
          description: Markdown como escrito (até 200 KB em UTF-8; `422 NOTE_TOO_LARGE`). Quebra de linha e tabulação ok; outro caractere de controle → `400`.
        links:
          type: [array, 'null']
          maxItems: 100
          items:
            $ref: '#/components/schemas/NoteLinkInput'
    NoteUpdate:
      type: object
      required: [body, version]
      additionalProperties: false
      properties:
        body:
          type: string
        version:
          type: integer
          format: int64
    NoteMove:
      type: object
      required: [newPath, version]
      additionalProperties: false
      properties:
        newPath:
          type: string
          minLength: 1
          maxLength: 600
        version:
          type: integer
          format: int64
    NoteLinksUpdate:
      type: object
      required: [links, version]
      additionalProperties: false
      properties:
        links:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/NoteLinkInput'
        version:
          type: integer
          format: int64
    NoteLinkTarget:
      type: object
      description: O alvo resolvido de um vínculo. `id` (UUID) ou `key` (mês), com o rótulo e o estado que a API conhece.
      required: [id, key, label, status]
      additionalProperties: false
      properties:
        id:
          type: [string, 'null']
          format: uuid
        key:
          type: [string, 'null']
        label:
          type: [string, 'null']
          description: Nome, descrição ou título do alvo (texto puro).
        status:
          type: [string, 'null']
          enum: [ACTIVE, VOIDED, ARCHIVED, CANCELED, TRASHED, null]
    NoteLink:
      type: object
      description: |
        Vínculo da nota. `text` é o alvo como escrito no wikilink (`projetos/MG Tech`) ou o valor original de um vínculo pendente; `null` nos
        vínculos resolvidos. `target` vem preenchido quando resolvido (e `null` se pendente).
      required: [origin, type, state, text, alias, section, embed, target]
      additionalProperties: false
      properties:
        origin:
          $ref: '#/components/schemas/NoteLinkOrigin'
        type:
          $ref: '#/components/schemas/NoteLinkType'
        state:
          $ref: '#/components/schemas/NoteLinkState'
        text:
          type: [string, 'null']
        alias:
          type: [string, 'null']
        section:
          type: [string, 'null']
        embed:
          type: boolean
        target:
          anyOf:
            - $ref: '#/components/schemas/NoteLinkTarget'
            - type: 'null'
    Note:
      type: object
      description: |
        Nota do vault. `body` é o texto Markdown **como foi escrito**: devolvido como dado (`application/json`, `nosniff`), nunca interpretado como HTML pelo backend. O front o
        renderiza sem HTML bruto (ADR-009). `trashedAt` preenchido = na lixeira.
      required: [id, path, title, body, tags, links, version, trashedAt, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
        title:
          type: string
          description: '`title` do frontmatter ou o nome do arquivo.'
        body:
          type: string
        tags:
          type: array
          items:
            type: string
        links:
          type: array
          items:
            $ref: '#/components/schemas/NoteLink'
        version:
          type: integer
          format: int64
        trashedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NoteSummary:
      type: object
      description: 'Nota na lista, sem o corpo (`body` nunca vem aqui).'
      required: [id, path, title, tags, snippet, updatedAt, trashedAt, version]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
        title:
          type: string
        tags:
          type: array
          items:
            type: string
        snippet:
          type: [string, 'null']
          description: Trecho de texto puro (até 160 caracteres) com o termo buscado; `null` sem `q`.
        updatedAt:
          type: string
          format: date-time
        trashedAt:
          type: [string, 'null']
          format: date-time
        version:
          type: integer
          format: int64
    NoteSummarySlice:
      allOf:
        - $ref: '#/components/schemas/SliceBase'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/NoteSummary'
      unevaluatedProperties: false
    Backlink:
      type: object
      required: [noteId, path, title, context]
      additionalProperties: false
      properties:
        noteId:
          type: string
          format: uuid
        path:
          type: string
        title:
          type: string
        context:
          type: [string, 'null']
          description: Trecho de texto puro (até 160 caracteres) ao redor do link; `null` no vínculo explícito.
    BacklinkSlice:
      allOf:
        - $ref: '#/components/schemas/SliceBase'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Backlink'
      unevaluatedProperties: false
    NoteTagCount:
      type: object
      required: [tag, count]
      additionalProperties: false
      properties:
        tag:
          type: string
        count:
          type: integer
          format: int64
    NoteRef:
      type: object
      required: [id, path, title]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        path:
          type: string
        title:
          type: string
    NoteMoved:
      type: object
      required: [note, rewrittenNotes]
      additionalProperties: false
      properties:
        note:
          $ref: '#/components/schemas/Note'
        rewrittenNotes:
          type: array
          description: As outras notas cujo texto foi reescrito (wikilinks que apontavam para a nota movida).
          items:
            $ref: '#/components/schemas/NoteRef'
    ImportRenamedFile:
      type: object
      required: [from, to]
      additionalProperties: false
      properties:
        from:
          type: string
        to:
          type: string
    ImportWarning:
      type: object
      description: |
        Aviso que não derrubou a importação. `code`: `FRONTMATTER_INVALID`, `LINK_IGNORED`, `NOTE_TOO_LARGE`, `NOTE_PATH_INVALID`,
        `NOTE_PATH_TAKEN`, `NOTE_INVALID_ENCODING`, `TEXT_INVALID_CHARACTERS`, `NOTE_FRONTMATTER_RESERVED`, `NOTE_TOO_MANY_LINKS` (mais de
        500 wikilinks distintos), `NOTE_RENAMED` (nota renomeada por `RENAME`), `NAME_ENCODING_GUESSED` (nome lido como CP437) ou outro código
        de regra de nota. `path` e `message` vêm cortados em 200 caracteres.
      required: [path, code, message]
      additionalProperties: false
      properties:
        path:
          type: string
        code:
          type: string
        message:
          type: string
    ImportReport:
      type: object
      description: |
        `created` notas criadas; `skipped` puladas por conflito (`skippedFiles`); `pendingLinks` wikilinks sem nota e vínculos para entidades
        que não existem, das notas criadas; `ignoredFiles` o que não entrou (anexos, pastas ocultas, notas recusadas).
      required: [created, skipped, pendingLinks, ignoredFiles, skippedFiles, renamedFiles, warnings]
      additionalProperties: false
      properties:
        created:
          type: integer
        skipped:
          type: integer
        pendingLinks:
          type: integer
        ignoredFiles:
          type: array
          items:
            type: string
        skippedFiles:
          type: array
          items:
            type: string
        renamedFiles:
          type: array
          items:
            $ref: '#/components/schemas/ImportRenamedFile'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ImportWarning'

    # ---- Redesign (2.6.0): relatórios e busca global
    ReportPeriod:
      type: string
      description: '`D7` = hoje−6..hoje e `D30` = hoje−29..hoje (por dia); `M3` = hoje−3 meses..hoje (por semana, recortada); `M12` = 12 competências (por mês).'
      enum: [D7, D30, M3, M12]
    IncomeExpensePoint:
      type: object
      description: Um balde da série. `partial` = contém hoje (ainda não terminou).
      required: [periodStart, periodEnd, partial, income, expenses, net]
      additionalProperties: false
      properties:
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        partial:
          type: boolean
        income:
          $ref: '#/components/schemas/Money'
          description: Receita do balde (livro `INCOME`).
        expenses:
          $ref: '#/components/schemas/Money'
          description: Consumo do balde (livro `EXPENSE`); **pode ser negativo** (dia só com reembolso).
        net:
          $ref: '#/components/schemas/Money'
          description: '`income` − `expenses`: resultado do período, **não** variação de saldo.'
    IncomeExpenseTotals:
      type: object
      description: Soma exata dos pontos.
      required: [income, expenses, net]
      additionalProperties: false
      properties:
        income:
          $ref: '#/components/schemas/Money'
        expenses:
          $ref: '#/components/schemas/Money'
        net:
          $ref: '#/components/schemas/Money'
    IncomeExpenseSeries:
      type: object
      description: Série de entradas e saídas (resultado, não caixa). Regras em `GET /v1/reports/income-expenses`.
      required: [view, period, from, to, basis, granularity, points, totals]
      additionalProperties: false
      properties:
        view:
          $ref: '#/components/schemas/ViewMode'
        period:
          $ref: '#/components/schemas/ReportPeriod'
        from:
          type: string
          format: date
          description: Primeiro dia da janela (em `M12`, o primeiro dia da competência mais antiga).
        to:
          type: string
          format: date
          description: Último dia da janela (hoje; em `M12`, o último dia do mês corrente).
        basis:
          type: string
          description: '`DATE` (`DAY`, `WEEK`: data efetiva, o caixa) ou `COMPETENCE` (`MONTH`: competência do lançamento, que é o mês da data efetiva, exceto na receita com `incomeCompetence`, ADR-017). Só rótulo.'
          enum: [DATE, COMPETENCE]
        granularity:
          type: string
          enum: [DAY, WEEK, MONTH]
        points:
          type: array
          items:
            $ref: '#/components/schemas/IncomeExpensePoint'
        totals:
          $ref: '#/components/schemas/IncomeExpenseTotals'
      examples:
        - view: MINE
          period: D7
          from: '2026-10-04'
          to: '2026-10-10'
          basis: DATE
          granularity: DAY
          points:
            - { periodStart: '2026-10-04', periodEnd: '2026-10-04', partial: false, income: { amount: '0.00', currency: BRL }, expenses: { amount: '0.00', currency: BRL }, net: { amount: '0.00', currency: BRL } }
            - { periodStart: '2026-10-05', periodEnd: '2026-10-05', partial: false, income: { amount: '3000.00', currency: BRL }, expenses: { amount: '0.00', currency: BRL }, net: { amount: '3000.00', currency: BRL } }
            - { periodStart: '2026-10-06', periodEnd: '2026-10-06', partial: false, income: { amount: '0.00', currency: BRL }, expenses: { amount: '0.00', currency: BRL }, net: { amount: '0.00', currency: BRL } }
            - { periodStart: '2026-10-07', periodEnd: '2026-10-07', partial: false, income: { amount: '0.00', currency: BRL }, expenses: { amount: '0.00', currency: BRL }, net: { amount: '0.00', currency: BRL } }
            - { periodStart: '2026-10-08', periodEnd: '2026-10-08', partial: false, income: { amount: '0.00', currency: BRL }, expenses: { amount: '0.00', currency: BRL }, net: { amount: '0.00', currency: BRL } }
            - { periodStart: '2026-10-09', periodEnd: '2026-10-09', partial: false, income: { amount: '0.00', currency: BRL }, expenses: { amount: '-50.00', currency: BRL }, net: { amount: '50.00', currency: BRL } }
            - { periodStart: '2026-10-10', periodEnd: '2026-10-10', partial: true, income: { amount: '0.00', currency: BRL }, expenses: { amount: '300.00', currency: BRL }, net: { amount: '-300.00', currency: BRL } }
          totals:
            income: { amount: '3000.00', currency: BRL }
            expenses: { amount: '250.00', currency: BRL }
            net: { amount: '2750.00', currency: BRL }
    SpendingItem:
      type: object
      required: [category, amount, share]
      additionalProperties: false
      properties:
        category:
          $ref: '#/components/schemas/CategoryRef'
        amount:
          $ref: '#/components/schemas/Money'
        share:
          description: '`amount` ÷ `base`, 4 casas, arredondado no backend; `null` se `base` ≤ 0.'
          oneOf:
            - $ref: '#/components/schemas/Ratio'
            - type: 'null'
    SpendingOther:
      type: object
      description: Soma das demais categorias positivas (as que não couberam em `limit`).
      required: [amount, share, categories]
      additionalProperties: false
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        share:
          oneOf:
            - $ref: '#/components/schemas/Ratio'
            - type: 'null'
        categories:
          type: integer
          minimum: 1
          description: Quantas categorias foram agrupadas.
    SpendingByCategory:
      type: object
      description: Consumo do mês por categoria. Regras em `GET /v1/reports/spending-by-category`.
      required: [view, basis, from, to, total, base, items, other]
      additionalProperties: false
      properties:
        view:
          $ref: '#/components/schemas/ViewMode'
        basis:
          type: string
          enum: [COMPETENCE]
        from:
          type: string
          format: date
          description: Primeiro dia da competência.
        to:
          type: string
          format: date
          description: Último dia da competência.
        total:
          $ref: '#/components/schemas/Money'
          description: Consumo líquido do mês (igual a `month.consumption` do dashboard e a `EntryTotals.total`).
        base:
          $ref: '#/components/schemas/Money'
          description: Σ das categorias com valor líquido > 0 (itens + `other`); divisor de `share`. Pode ser maior que `total`.
        items:
          type: array
          items:
            $ref: '#/components/schemas/SpendingItem'
        other:
          oneOf:
            - $ref: '#/components/schemas/SpendingOther'
            - type: 'null'
      examples:
        - view: MINE
          basis: COMPETENCE
          from: '2026-10-01'
          to: '2026-10-31'
          total: { amount: '250.00', currency: BRL }
          base: { amount: '250.00', currency: BRL }
          items:
            - category: { id: 8a3c6b10-5e2f-4d7a-9b41-c0d1e2f3a4b5, name: Tecnologia }
              amount: { amount: '200.00', currency: BRL }
              share: '0.8000'
          other:
            amount: { amount: '50.00', currency: BRL }
            share: '0.2000'
            categories: 1
    SearchTransaction:
      type: object
      required: [id, description, date, amount, type, category, account]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        date:
          type: string
          format: date
        amount:
          $ref: '#/components/schemas/Money'
        type:
          $ref: '#/components/schemas/TransactionType'
        category:
          oneOf:
            - $ref: '#/components/schemas/CategoryRef'
            - type: 'null'
        account:
          oneOf:
            - $ref: '#/components/schemas/AccountRef'
            - type: 'null'
        incomeCompetence:
          type: [string, 'null']
          description: 'Mês a que a receita pertence quando declarado (ADR-017); `null` nas demais. Campo opcional (2.18.0).'
    SearchAccount:
      type: object
      required: [id, name, institution, type, status]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        institution:
          type: [string, 'null']
        type:
          $ref: '#/components/schemas/AccountType'
        status:
          $ref: '#/components/schemas/AccountStatus'
    SearchCategory:
      type: object
      required: [id, name, kind, archived]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/CategoryKind'
        archived:
          type: boolean
    SearchCard:
      type: object
      required: [id, name, institution, status]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        institution:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/CardStatus'
    SearchNote:
      type: object
      required: [id, title, path, snippet]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        path:
          type: string
        snippet:
          type: string
          description: Texto puro (nunca Markdown nem HTML), até 160 caracteres; exibir sempre como texto.
    SearchGroup:
      type: string
      description: Nome de um grupo do resultado.
      enum: [transactions, accounts, categories, cards, notes]
    SearchResults:
      type: object
      description: Resultado da busca global. Regras em `GET /v1/search`.
      required: [q, transactions, accounts, categories, cards, notes, truncated]
      additionalProperties: false
      properties:
        q:
          type: string
          description: O termo já aparado.
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/SearchTransaction'
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/SearchAccount'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/SearchCategory'
        cards:
          type: array
          items:
            $ref: '#/components/schemas/SearchCard'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/SearchNote'
        truncated:
          type: array
          description: Grupos cuja leitura estourou o limite de tempo (vêm vazios). `[]` na resposta normal.
          items:
            $ref: '#/components/schemas/SearchGroup'

    # ---- Etapa 7: importação de extrato (2.7.0)
    ImportBatchStatus:
      type: string
      enum: [PENDING_REVIEW, APPLIED, UNDONE, PARTIALLY_UNDONE]
    ImportLineStatus:
      type: string
      enum: [PENDING, ACCEPTED, DUPLICATE, POSSIBLE_DUPLICATE, REJECTED]
    ImportLineFlag:
      type: string
      description: |
        `LOOKS_LIKE_INVOICE_PAYMENT` (cartão: pagamento de fatura, rejeitada por padrão), `CARD_CREDIT_NOT_IMPORTED` (cartão: crédito que não é compra,
        rejeitada por padrão), `LOOKS_LIKE_INSTALLMENT` (cartão: parece parcela; exige decisão), `POSSIBLE_TRANSFER` (conta: há a perna oposta em outra conta;
        exige decisão).
      enum: [LOOKS_LIKE_INVOICE_PAYMENT, CARD_CREDIT_NOT_IMPORTED, LOOKS_LIKE_INSTALLMENT, POSSIBLE_TRANSFER]
    ImportDirection:
      type: string
      enum: [IN, OUT]
    ImportAction:
      type: string
      enum: [ACCEPT, REJECT, FORCE, REOPEN]
    ImportCounts:
      type: object
      description: Calculado pelo backend; `requireDecision` = linhas `PENDING` com marca de decisão ou `POSSIBLE_DUPLICATE`.
      required: [total, pending, accepted, rejected, duplicate, possibleDuplicate, requireDecision]
      additionalProperties: false
      properties:
        total: {type: integer, minimum: 0}
        pending: {type: integer, minimum: 0}
        accepted: {type: integer, minimum: 0}
        rejected: {type: integer, minimum: 0}
        duplicate: {type: integer, minimum: 0}
        possibleDuplicate: {type: integer, minimum: 0}
        requireDecision: {type: integer, minimum: 0}
    ImportBatch:
      type: object
      required: [id, format, status, warnings, skipped, counts, createdAt]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        accountId: {type: [string, 'null'], format: uuid}
        cardId: {type: [string, 'null'], format: uuid}
        format: {type: string, enum: [CSV, OFX]}
        status:
          $ref: '#/components/schemas/ImportBatchStatus'
        warnings:
          type: array
          description: '`SAME_FILE_ALREADY_IMPORTED`, `STATEMENT_KIND_MISMATCH` (OFX de cartão em conta ou o inverso).'
          items: {type: string}
        skipped:
          type: array
          description: 'Linhas do arquivo ignoradas, "n: motivo" (branco, total, valor zero, data inválida), até 200.'
          items: {type: string}
        counts:
          $ref: '#/components/schemas/ImportCounts'
        createdAt: {type: string, format: date-time}
        appliedAt: {type: [string, 'null'], format: date-time}
        undoneAt: {type: [string, 'null'], format: date-time}
        undoReason: {type: [string, 'null']}
    ImportBatchSlice:
      allOf:
        - $ref: '#/components/schemas/SliceBase'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ImportBatch'
      unevaluatedProperties: false
    ImportSuggestion:
      type: object
      required: [categoryId, confidence]
      additionalProperties: false
      properties:
        categoryId: {type: string, format: uuid}
        method:
          oneOf:
            - $ref: '#/components/schemas/PaymentMethod'
            - type: 'null'
        confidence: {type: string, enum: [HIGH, MEDIUM]}
    ImportLine:
      type: object
      required: [id, position, date, amount, direction, description, normalizedDescription, status, flags, requiresDecision, matches]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        position: {type: integer, minimum: 1}
        date: {type: string, format: date}
        amount:
          $ref: '#/components/schemas/Money'
        direction:
          $ref: '#/components/schemas/ImportDirection'
        description: {type: string}
        normalizedDescription: {type: string}
        status:
          $ref: '#/components/schemas/ImportLineStatus'
        flags:
          type: array
          items:
            $ref: '#/components/schemas/ImportLineFlag'
        requiresDecision: {type: boolean}
        rejectReason: {type: [string, 'null']}
        categoryId: {type: [string, 'null'], format: uuid}
        method: {type: [string, 'null']}
        editedDescription: {type: [string, 'null']}
        counterpartAccountId:
          type: [string, 'null']
          format: uuid
          description: Preenchido quando a linha foi decidida como transferência.
        suggestion:
          oneOf:
            - $ref: '#/components/schemas/ImportSuggestion'
            - type: 'null'
        matches:
          type: array
          description: Movimentações que motivaram `DUPLICATE`/`POSSIBLE_DUPLICATE`.
          items: {type: string, format: uuid}
        transactionId: {type: [string, 'null'], format: uuid}
    ImportLineSlice:
      allOf:
        - $ref: '#/components/schemas/SliceBase'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ImportLine'
      unevaluatedProperties: false
    ImportAsTransfer:
      type: object
      required: [counterpartAccountId]
      additionalProperties: false
      properties:
        counterpartAccountId: {type: string, format: uuid}
    ImportLinePatch:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action:
          $ref: '#/components/schemas/ImportAction'
        categoryId: {type: [string, 'null'], format: uuid}
        method:
          oneOf:
            - $ref: '#/components/schemas/PaymentMethod'
            - type: 'null'
        description: {type: [string, 'null'], maxLength: 200}
        asTransfer:
          oneOf:
            - $ref: '#/components/schemas/ImportAsTransfer'
            - type: 'null'
        learn: {type: [boolean, 'null']}
    ImportBulkInput:
      type: object
      required: [lineIds, action]
      additionalProperties: false
      properties:
        lineIds:
          type: array
          minItems: 1
          maxItems: 500
          items: {type: string, format: uuid}
        action:
          type: string
          enum: [ACCEPT, REJECT]
    ImportBulkSkipped:
      type: object
      required: [lineId, reason]
      additionalProperties: false
      properties:
        lineId: {type: string, format: uuid}
        reason: {type: string, enum: [LINE_NOT_FOUND, REQUIRES_DECISION, NOT_PENDING, NO_CATEGORY, INVALID_TRANSITION]}
    ImportBulkResult:
      type: object
      required: [updated, skipped]
      additionalProperties: false
      properties:
        updated: {type: integer, minimum: 0}
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/ImportBulkSkipped'
    ImportApplied:
      type: object
      required: [batch, created]
      additionalProperties: false
      properties:
        batch:
          $ref: '#/components/schemas/ImportBatch'
        created:
          type: array
          description: Ids das movimentações criadas.
          items: {type: string, format: uuid}
    ImportUndoInput:
      type: object
      additionalProperties: false
      properties:
        reason: {type: [string, 'null'], maxLength: 300}
    ImportBlocked:
      type: object
      required: [transactionId, code, message]
      additionalProperties: false
      properties:
        transactionId: {type: string, format: uuid}
        code: {type: string}
        message: {type: string}
    ImportUndone:
      type: object
      required: [batch, blocked]
      additionalProperties: false
      properties:
        batch:
          $ref: '#/components/schemas/ImportBatch'
        blocked:
          type: array
          description: Movimentações que a guarda impediu de estornar; correção manual.
          items:
            $ref: '#/components/schemas/ImportBlocked'
    ImportMapping:
      type: object
      description: Colunas por índice (0-based). Valor em uma coluna (`amount`) **ou** em duas (`debit`/`credit`).
      required: [date, description]
      additionalProperties: false
      properties:
        date: {type: integer, minimum: 0}
        description: {type: integer, minimum: 0}
        amount: {type: [integer, 'null'], minimum: 0}
        debit: {type: [integer, 'null'], minimum: 0}
        credit: {type: [integer, 'null'], minimum: 0}
        invert: {type: [boolean, 'null']}
        hasHeader: {type: [boolean, 'null']}
        delimiter: {type: [string, 'null'], enum: [';', ',', "\t", null]}
    CategorizationRule:
      type: object
      required: [id, direction, normalizedDescription, categoryId]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        direction:
          $ref: '#/components/schemas/ImportDirection'
        normalizedDescription: {type: string}
        categoryId: {type: string, format: uuid}
        method: {type: [string, 'null']}
    CategorizationRuleSlice:
      allOf:
        - $ref: '#/components/schemas/SliceBase'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CategorizationRule'
      unevaluatedProperties: false

    # ---- Etapa 7: notificações, lembretes, configurações, push (2.7.0)
    NotificationKind:
      type: string
      enum: [INVOICE_DUE, DEBT_COLLECT, DEBT_PAYABLE_DUE, RECURRENCE_PENDING, COMMITTED_NEXT_MONTH, DAILY_SUMMARY, REMINDER, GOAL_DEADLINE, GROUPED, INVOICE_DUE_AUTODEBIT_OFF, NEGATIVE_MONTH_PROJECTED, NEW_DEBT_BEFORE_FINANCING, CARD_CASH_OUT_COST, SUBSCRIPTION_OVERLAP, SUBSCRIPTION_UNUSED, WEEKLY_CHARGE, THIRD_PARTY_OVERDUE, BALANCE_BELOW_REAL_ESTATE, DOCUMENT_DIVERGENCE]
    NotificationRef:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: {type: string, enum: [CARD, DEBT, RECURRENCE, GOAL, REMINDER, USER, COMMITMENT, ASSET, TRANSACTION, INVOICE]}
        id: {type: string, format: uuid}
    Notification:
      type: object
      description: |
        Texto por chave de i18n + `params` (S-34); o backend não grava frase pronta. `params` dos tipos de 2.32.0: `CARD_CASH_OUT_COST` (`monthlyRateBps`,
        `installmentAmount`, `installments`), `NEGATIVE_MONTH_PROJECTED` (`competence`, `surplus`), `INVOICE_DUE_AUTODEBIT_OFF` (`cardName`, `dueDate`, `amount`),
        `NEW_DEBT_BEFORE_FINANCING` (`amount`, `installments`), `SUBSCRIPTION_OVERLAP` (`group`), `SUBSCRIPTION_UNUSED` (`name`, `days`), `WEEKLY_CHARGE` (`name`),
        `THIRD_PARTY_OVERDUE` (`personName`, `amount`), `BALANCE_BELOW_REAL_ESTATE` (`balance`, `due`), `DOCUMENT_DIVERGENCE` (`label`, `difference`).
      required: [id, kind, titleKey, bodyKey, params, ref, onDate, createdAt]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        kind:
          $ref: '#/components/schemas/NotificationKind'
        titleKey: {type: string}
        bodyKey: {type: string}
        params:
          type: object
          additionalProperties: {type: string}
        ref:
          $ref: '#/components/schemas/NotificationRef'
        onDate: {type: string, format: date}
        dueOn: {type: [string, 'null'], format: date}
        readAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
    NotificationSlice:
      allOf:
        - $ref: '#/components/schemas/SliceBase'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Notification'
      unevaluatedProperties: false
    UnreadCount:
      type: object
      required: [count]
      additionalProperties: false
      properties:
        count: {type: integer, minimum: 0}
    ReminderLink:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: {type: string, pattern: '^[A-Z_]{1,20}$'}
        id: {type: string, format: uuid}
    Reminder:
      type: object
      required: [id, title, remindOn, done, createdAt]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        remindOn: {type: string, format: date}
        remindAt: {type: [string, 'null'], pattern: '^([01]\d|2[0-3]):[0-5]\d$'}
        note: {type: [string, 'null']}
        link:
          oneOf:
            - $ref: '#/components/schemas/ReminderLink'
            - type: 'null'
        done: {type: boolean}
        doneAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
    ReminderSlice:
      allOf:
        - $ref: '#/components/schemas/SliceBase'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Reminder'
      unevaluatedProperties: false
    ReminderInput:
      type: object
      required: [title, remindOn]
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1, maxLength: 120}
        remindOn: {type: string, format: date}
        remindAt: {type: [string, 'null'], pattern: '^([01]\d|2[0-3]):[0-5]\d$'}
        note: {type: [string, 'null'], maxLength: 500}
        link:
          oneOf:
            - $ref: '#/components/schemas/ReminderLink'
            - type: 'null'
    SnoozeInput:
      type: object
      additionalProperties: false
      properties:
        days: {type: [integer, 'null'], minimum: 1, maximum: 365}
    SummaryFrequency:
      type: string
      enum: [DAILY, ONLY_DUE, 'OFF']
    NotificationSettings:
      type: object
      description: '`version` 0 = ainda não salvo (valores padrão). `kinds` aceita só os tipos configuráveis (resumo diário, lembrete manual e agrupada não são).'
      required: [dailySummary, quietHours, push, version]
      additionalProperties: false
      properties:
        dailySummary:
          type: object
          required: [enabled, time, frequency]
          additionalProperties: false
          properties:
            enabled: {type: boolean}
            time: {type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$'}
            frequency:
              $ref: '#/components/schemas/SummaryFrequency'
        kinds:
          type: object
          propertyNames:
            enum: [INVOICE_DUE, DEBT_COLLECT, DEBT_PAYABLE_DUE, RECURRENCE_PENDING, COMMITTED_NEXT_MONTH, GOAL_DEADLINE, INVOICE_DUE_AUTODEBIT_OFF, NEGATIVE_MONTH_PROJECTED, NEW_DEBT_BEFORE_FINANCING, CARD_CASH_OUT_COST, SUBSCRIPTION_OVERLAP, SUBSCRIPTION_UNUSED, WEEKLY_CHARGE, THIRD_PARTY_OVERDUE, BALANCE_BELOW_REAL_ESTATE, DOCUMENT_DIVERGENCE]
          additionalProperties: {type: boolean}
        quietHours:
          type: object
          required: [from, to]
          additionalProperties: false
          properties:
            from: {type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$'}
            to: {type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$'}
        push:
          type: object
          required: [enabled]
          additionalProperties: false
          properties:
            enabled: {type: boolean}
        displayName: {type: [string, 'null'], maxLength: 60}
        alerts:
          $ref: '#/components/schemas/NotificationAlertSettings'
        version: {type: integer, format: int64, minimum: 0}
        hasPhoto:
          type: boolean
          readOnly: true
          description: Há foto de perfil (2.34.0). Somente leitura; ignorado no `PUT`.
        photoVersion:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          description: Muda a cada troca de foto (0 sem foto). Use para invalidar o cache do `Blob` da foto. Somente leitura; ignorado no `PUT`.
    ProfilePhoto:
      type: object
      required: [hasPhoto, photoVersion]
      additionalProperties: false
      properties:
        hasPhoto: {type: boolean}
        photoVersion: {type: integer, format: int64, minimum: 0}
    NotificationAlertSettings:
      type: object
      description: |
        Parâmetros dos alertas de 2.32.0. No `PUT`, campo ausente mantém o valor salvo. Sem `subscriptionUnusedDays` definido, `SUBSCRIPTION_UNUSED` fica
        inativo (não há valor padrão). `invoiceDueLeadDays` é a antecedência do aviso de fatura (padrão 3). `documentDivergenceTolerance` é a diferença absoluta
        aceita entre o informado e o documento antes de `DOCUMENT_DIVERGENCE` (padrão 0,00). Fora do intervalo: `422 NOTIFICATION_THRESHOLD_INVALID`.
      additionalProperties: false
      properties:
        subscriptionUnusedDays:
          type: [integer, 'null']
          minimum: 1
          maximum: 3650
          default: null
          description: Dias sem uso (`lastUsedOn`) a partir dos quais a assinatura é "sem uso". `null` = alerta inativo.
        invoiceDueLeadDays:
          type: integer
          minimum: 1
          maximum: 30
          default: 3
        documentDivergenceTolerance:
          $ref: '#/components/schemas/Money'
          description: 'Padrão `{amount: "0.00", currency: BRL}`.'
      examples:
        - subscriptionUnusedDays: 60
          invoiceDueLeadDays: 3
          documentDivergenceTolerance: {amount: '0.00', currency: BRL}
    PushSubscriptionKeys:
      type: object
      required: [p256dh, auth]
      additionalProperties: false
      properties:
        p256dh: {type: string, maxLength: 200}
        auth: {type: string, maxLength: 100}
    PushSubscriptionInput:
      type: object
      required: [endpoint, keys]
      additionalProperties: false
      properties:
        endpoint: {type: string, maxLength: 500}
        keys:
          $ref: '#/components/schemas/PushSubscriptionKeys'
        userAgent: {type: [string, 'null'], maxLength: 200}
    PushSubscription:
      type: object
      required: [id, endpoint, createdAt]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        endpoint: {type: string}
        createdAt: {type: string, format: date-time}
    PushConfig:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: {type: boolean}
        publicKey: {type: [string, 'null'], description: Chave VAPID pública (só com `enabled`).}
    DailyMessage:
      type: object
      required: [key, params, source, generatedAt]
      additionalProperties: false
      properties:
        key: {type: string, examples: [daily.summary]}
        params:
          type: object
          description: '`name` (opcional), `available`, `committed7d` (decimais em string, 2 casas), `goalName` e `goalProgress` (opcionais).'
          additionalProperties: {type: string}
        source: {type: string, enum: [STATIC]}
        generatedAt: {type: string, format: date-time}

    # ---- Etapa 8: IA (2.8.0)
    AiPurpose:
      type: string
      enum: [CATEGORIZE_IMPORT, CATEGORIZE_TRANSACTIONS, ANALYZE_STATEMENT, MONTHLY_SUMMARY, INSIGHTS, FORECAST, DAILY_MESSAGE]
      description: Hoje só `MONTHLY_SUMMARY` e `INSIGHTS` geram prévia; as demais respondem `422 AI_PURPOSE_NOT_SUPPORTED`.
    AiAnalysisStatus:
      type: string
      enum: [COMPLETED, FAILED, DENIED, REJECTED_UNGROUNDED, BUDGET_EXCEEDED]
    AiStatus:
      type: object
      required: [enabled, provider, model, dailyCallsRemaining, monthlyTokensRemaining, circuit]
      additionalProperties: false
      properties:
        enabled: {type: boolean}
        provider: {type: string, description: '`none` quando desligada.'}
        model: {type: string}
        dailyCallsRemaining: {type: integer, minimum: 0}
        monthlyTokensRemaining: {type: integer, minimum: 0}
        circuit: {type: string, enum: [CLOSED, OPEN]}
    AiPreviewInput:
      type: object
      required: [purpose]
      additionalProperties: false
      properties:
        purpose:
          $ref: '#/components/schemas/AiPurpose'
        scope:
          type: object
          additionalProperties: false
          properties:
            month: {type: string, pattern: '^\d{4}-\d{2}$', description: 'Competência (padrão = mês corrente).'}
            language: {type: string, enum: [pt, en, es], description: 'Idioma da resposta da IA (padrão `pt`).'}
    AiPreview:
      type: object
      required: [previewId, purpose, language, redactedPayload, counts, estimatedTokens, expiresAt, redactions]
      additionalProperties: false
      properties:
        previewId: {type: string, format: uuid}
        purpose:
          $ref: '#/components/schemas/AiPurpose'
        period: {type: [string, 'null']}
        language: {type: string}
        redactedPayload:
          type: string
          description: O JSON **exato** que iria ao provedor (já minimizado e redigido). Mostrar ao usuário antes de aprovar.
        counts:
          type: object
          additionalProperties: {type: integer}
        estimatedTokens: {type: integer, minimum: 0}
        expiresAt: {type: string, format: date-time}
        redactions:
          type: array
          description: Tipos mascarados (`PAYEE`, `PERSON`, `CPF`, `CNPJ`, `PHONE`, `EMAIL`, `CARD`, `NUMBER`), nunca os valores.
          items: {type: string}
    AiAnalysisInput:
      type: object
      required: [previewId, approve]
      additionalProperties: false
      properties:
        previewId: {type: string, format: uuid}
        approve: {type: boolean, description: '`false` registra `DENIED` e nada é enviado.'}
    AiTokens:
      type: object
      required: [input, output]
      additionalProperties: false
      properties:
        input: {type: integer, minimum: 0}
        output: {type: integer, minimum: 0}
    AiResult:
      type: object
      required: [text, factRefs, source]
      additionalProperties: false
      properties:
        text: {type: string}
        caveat: {type: [string, 'null'], description: 'Aviso do modelo (obrigatório em mês parcial).'}
        factRefs: {type: array, items: {type: string}}
        source: {type: string, enum: [AI]}
    AiAnalysis:
      type: object
      description: |
        `fallback: true` = sem texto de IA utilizável (`FAILED`, `DENIED`, `REJECTED_UNGROUNDED`, `BUDGET_EXCEEDED`): o front mostra o conteúdo
        determinístico. `redactedPayload` é apagado após `AI_PAYLOAD_RETENTION_DAYS` (então `null` e `payloadPurgedAt` preenchido); `DENIED` nunca tem.
      required: [id, purpose, provider, model, status, tokens, durationMs, fallback, createdAt]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        previewId: {type: [string, 'null'], format: uuid}
        purpose:
          $ref: '#/components/schemas/AiPurpose'
        period: {type: [string, 'null']}
        provider: {type: string}
        model: {type: string}
        status:
          $ref: '#/components/schemas/AiAnalysisStatus'
        tokens:
          $ref: '#/components/schemas/AiTokens'
        durationMs: {type: integer, minimum: 0}
        result:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/AiResult'
        fallback: {type: boolean}
        failureReason: {type: [string, 'null'], examples: [PROVIDER_ERROR, INVALID_RESPONSE, UNGROUNDED, USER_DENIED, BUDGET_EXCEEDED]}
        redactedPayload: {type: [string, 'null']}
        payloadPurgedAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
    AiAnalysisSummary:
      type: object
      required: [id, purpose, provider, model, status, tokens, fallback, payloadAvailable, createdAt]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        purpose:
          $ref: '#/components/schemas/AiPurpose'
        period: {type: [string, 'null']}
        provider: {type: string}
        model: {type: string}
        status:
          $ref: '#/components/schemas/AiAnalysisStatus'
        tokens:
          $ref: '#/components/schemas/AiTokens'
        fallback: {type: boolean}
        payloadAvailable: {type: boolean, description: '`false` depois da retenção; o registro permanece.'}
        payloadPurgedAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
    AiAnalysisSummarySlice:
      allOf:
        - $ref: '#/components/schemas/SliceBase'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AiAnalysisSummary'
      unevaluatedProperties: false
    Insight:
      type: object
      required: [type, key, params, factRefs, source]
      additionalProperties: false
      description: |
        Insight no formato original (2.8.0), só os tipos `CATEGORY_DELTA` e `CARD_COMMITTED`: é o que `GET /v1/insights` (alias) devolve, sem
        nenhum campo novo, para não quebrar clientes antigos. Os insights completos (catálogo inteiro e campos novos) são o `InsightItem`.
      properties:
        type: {type: string, enum: [CATEGORY_DELTA, CARD_COMMITTED]}
        key: {type: string, description: 'Chave de i18n (`insight.category.up`, `insight.category.down`, `insight.card.committed`).'}
        params:
          type: object
          description: 'Decimais em string. `CATEGORY_DELTA`: `categoryId`, `categoryName`, `current`, `previous`, `deltaAmount`, `deltaPercent` (mais `baseline` e `months`, 2.20.0). `CARD_COMMITTED`: `amount`.'
          additionalProperties: {type: string}
        factRefs: {type: array, items: {type: string}}
        source: {type: string, enum: [COMPUTED], description: 'Calculado pelos dados do usuário, sem IA.'}
    InsightSlice:
      allOf:
        - $ref: '#/components/schemas/SliceBase'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Insight'
      unevaluatedProperties: false
    InsightItem:
      type: object
      required: [id, type, key, params, factRefs, severity, priority, source, dismissed]
      additionalProperties: false
      description: 'Insight calculado completo (2.20.0, ADR-019). Todos os campos listados em `required` são sempre enviados; `period`, `basis`, `confidence` e `subjectId` podem ser `null`.'
      properties:
        id:
          type: string
          pattern: '^ins_[0-9a-f]{32}$'
          description: '`ins_` + hash de (usuário, tipo, período, assunto): estável entre chamadas.'
        type: {type: string, enum: [SAVINGS_RATE, SPEND_VS_BASELINE, CATEGORY_DELTA, MONTH_PROJECTION, FREE_MONEY, COMMITMENT_INDEX, DEBT_SERVICE, INSTALLMENT_LOAD, EMERGENCY_COVERAGE, INCOME_STABILITY, GOAL_PACE, CONCENTRATION, CARD_COMMITTED, CARD_LIMIT_USAGE, RECURRING_DETECTED, DAILY_BUDGET, TODAY_VS_AVERAGE, DUE_SOON, MIN_BALANCE_FORECAST, ATYPICAL_ENTRY, CARD_CLOSING_SOON]}
        key: {type: string, description: 'Chave de i18n (`insight.<área>.<variante>`); chave desconhecida mostra texto neutro.'}
        params:
          type: object
          description: 'Decimais em string, já calculados (o front só formata). Depende do `type` (ver `docs/arquitetura/insights.md`).'
          additionalProperties: {type: string}
        factRefs: {type: array, items: {type: string}}
        severity: {type: string, enum: [ALERT, ATTENTION, POSITIVE, INFO]}
        priority: {type: integer, description: 'Desempate dentro da severidade (maior primeiro).'}
        period:
          type: [object, 'null']
          required: [kind, value]
          additionalProperties: false
          properties:
            kind: {type: string, enum: [MONTH, DAY]}
            value: {type: string, description: '`AAAA-MM` ou `AAAA-MM-DD`.'}
        source: {type: string, enum: [COMPUTED], description: 'Calculado pelos dados do usuário, sem IA.'}
        basis:
          type: [string, 'null']
          enum: [KNOWN_SCHEDULE, HISTORY, PROJECTION, null]
          description: 'Como o número nasceu: só a agenda conhecida, estatística do histórico ou projeção do mês corrente.'
        confidence:
          type: [object, 'null']
          required: [n, window]
          additionalProperties: false
          properties:
            n: {type: integer, description: Observações usadas.}
            window: {type: integer, description: Janela pedida (meses; dias na projeção).}
            z: {type: [string, 'null'], description: z robusto (decimal em texto), quando houver.}
        subjectId: {type: [string, 'null'], description: 'O que o insight descreve dentro do tipo (categoria, meta, cartão, lançamento).'}
        dismissed: {type: boolean}
    InsightInsufficient:
      type: object
      required: [type, reason]
      additionalProperties: false
      properties:
        type: {type: string, description: 'Tipo que não saiu (`ALL` = o mês inteiro não se aplica).'}
        reason: {type: string, enum: [HISTORY, NO_INCOME, PARTIAL_MONTH, NO_DATA, NO_BASELINE, NO_ACCOUNTS, NO_SCHEDULE, NO_LIMIT, NO_PLAN, FUTURE_MONTH]}
        missing: {type: [integer, 'null'], description: 'Quantos meses (ou dias) faltam para emitir.'}
    InsightList:
      allOf:
        - $ref: '#/components/schemas/SliceBase'
        - type: object
          required: [items, insufficient, view]
          properties:
            view:
              $ref: '#/components/schemas/ViewMode'
            items:
              type: array
              items:
                $ref: '#/components/schemas/InsightItem'
            insufficient:
              type: array
              items:
                $ref: '#/components/schemas/InsightInsufficient'
      unevaluatedProperties: false
    InsightHistory:
      type: object
      required: [view, items]
      additionalProperties: false
      properties:
        view:
          $ref: '#/components/schemas/ViewMode'
        items:
          type: array
          items:
            type: object
            required: [month, items, hasNext, insufficient]
            additionalProperties: false
            properties:
              month: {type: string, pattern: '^\d{4}-\d{2}$'}
              items:
                type: array
                items:
                  $ref: '#/components/schemas/InsightItem'
              hasNext: {type: boolean}
              insufficient:
                type: array
                items:
                  $ref: '#/components/schemas/InsightInsufficient'
    InsightDismissInput:
      type: object
      required: [scope]
      additionalProperties: false
      properties:
        scope: {type: string, enum: [TODAY, MONTH, TYPE]}
    AiSettings:
      type: object
      required: [dailyMessageEnabled]
      additionalProperties: false
      properties:
        dailyMessageEnabled: {type: boolean}
    TransactionNature:
      type: string
      description: |
        Natureza de uma despesa fora do cartão e de uma recorrência (2.25.0). `FIXED` = custo que se repete (aluguel, assinatura, boleto fixo);
        `VARIABLE` = o resto. Registro antigo: `VARIABLE`; recorrência ativa de despesa conta como `FIXED` (P-29). A forma de pagamento é o `method`.
      enum: [FIXED, VARIABLE]
    OwnerIncomeSource:
      type: string
      description: 'Origem de um item de renda. `INCOME_PROFILE` (perfil de renda, bloco F), `RECURRENCE` (receita recorrente), `TRANSACTION` (receita lançada).'
      enum: [INCOME_PROFILE, RECURRENCE, TRANSACTION]
    OwnerIncomeStatus:
      type: string
      description: 'Derivado na leitura contra `asOf`: `RECEIVED` (data até `asOf` e lançada) ou `PLANNED` (prevista ou com data depois de `asOf`).'
      enum: [PLANNED, RECEIVED]
    OwnerConfidence:
      type: string
      description: 'Pior confiança dos itens do ponto (`Provenance.confidence`; `CONFIRMED` quando não há proveniência). `ESTIMATED` quando o valor é estimativa (ex.: cota do imóvel não definida).'
      enum: [CONFIRMED, ESTIMATED]
    OwnerIncomeItem:
      type: object
      required: [source, refId, date, amount, status, confidence]
      additionalProperties: false
      properties:
        source:
          $ref: '#/components/schemas/OwnerIncomeSource'
        refId:
          type: [string, 'null']
          format: uuid
          description: Id da recorrência, da movimentação ou do perfil de origem.
        date:
          type: string
          format: date
          description: Data real do recebimento (ou prevista) dessa parcela.
        amount:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/OwnerIncomeStatus'
        confidence:
          $ref: '#/components/schemas/OwnerConfidence'
    OwnerIncome:
      type: object
      description: |
        Renda da coluna: as parcelas do pagamento da competência M-1. `total` = Σ `items` = `receivedInAccount` (o que cai na conta). No razão a renda do
        consignado é `N + p` (2.32.1): `receivedInAccount = N` (caixa) e `appliedToDebt = p` (parcela baixada pela folha); `receivedInAccount + appliedToDebt`
        é igual à renda do razão, e a sobra do mês usa só `N`.
      required: [total, items]
      additionalProperties: false
      properties:
        total:
          $ref: '#/components/schemas/Money'
        receivedInAccount:
          $ref: '#/components/schemas/Money'
          description: Soma do que cai na conta (`N`); igual a `total`. Campo opcional (2.32.1).
        appliedToDebt:
          $ref: '#/components/schemas/Money'
          description: Soma das parcelas de consignado baixadas pela folha (`p`); `0,00` sem consignado. Fora de `total`, `surplus` e `endBalance`. Campo opcional (2.32.1).
        items:
          type: array
          items:
            $ref: '#/components/schemas/OwnerIncomeItem'
    OwnerMethodAmount:
      type: object
      required: [method, amount]
      additionalProperties: false
      properties:
        method:
          $ref: '#/components/schemas/PaymentMethod'
        amount:
          $ref: '#/components/schemas/Money'
    OwnerOffCard:
      type: object
      description: 'Saídas fora do cartão, por natureza. `fixed + variable` = Σ `byMethod`.'
      required: [fixed, variable, byMethod]
      additionalProperties: false
      properties:
        fixed:
          $ref: '#/components/schemas/Money'
        variable:
          $ref: '#/components/schemas/Money'
        byMethod:
          type: array
          items:
            $ref: '#/components/schemas/OwnerMethodAmount'
    OwnerOutflow:
      type: object
      description: |
        Composição das saídas do mês (ADR-023). `total = cardsMine + offCard.fixed + offCard.variable + realEstateMine`. `cardsGross`
        (fatura cheia) e `subscriptionsMine` (recorte de `cardsMine`) são informativos e **nunca** somam em `total`.
      required: [cardsMine, cardsGross, subscriptionsMine, offCard, realEstateMine, total]
      additionalProperties: false
      properties:
        cardsMine:
          $ref: '#/components/schemas/Money'
        cardsGross:
          $ref: '#/components/schemas/Money'
        subscriptionsMine:
          $ref: '#/components/schemas/Money'
        offCard:
          $ref: '#/components/schemas/OwnerOffCard'
        realEstateMine:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
    OwnerStatementMonth:
      type: object
      required: [competence, income, outflow, companyReimbursable, surplus, endBalance, negative, receivablesPending]
      additionalProperties: false
      properties:
        competence:
          $ref: '#/components/schemas/Competence'
        income:
          $ref: '#/components/schemas/OwnerIncome'
        outflow:
          $ref: '#/components/schemas/OwnerOutflow'
        companyReimbursable:
          $ref: '#/components/schemas/Money'
          description: Assinaturas `COMPANY` pagas no meu cartão, a ressarcir pela empresa (P-10). Informativo, fora de `outflow.total`.
        surplus:
          $ref: '#/components/schemas/Money'
          description: '`income.total − outflow.total`. Pode ser negativo.'
        endBalance:
          $ref: '#/components/schemas/Money'
          description: '`openingBalance` (1º mês) ou `endBalance` do mês anterior, mais `surplus`.'
        negative:
          type: boolean
          description: '`true` quando `surplus < 0`.'
        receivablesPending:
          $ref: '#/components/schemas/Money'
          description: 'O que me devem **previsto para este mês** (mês do vencimento da fatura da parcela ou o definido pelo dono, 2.36.0) e ainda não recebi. Nunca entra em `income` nem em `endBalance`.'
    OwnerStatementWarning:
      type: object
      description: |
        Aviso do cálculo. `code` é aberto; os conhecidos: `OPENING_BALANCE_NOT_PROJECTED`, `INCOME_MISSING`, `REAL_ESTATE_SHARE_UNDEFINED`.
      required: [code, competence]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
        competence:
          oneOf:
            - $ref: '#/components/schemas/Competence'
            - type: 'null'
    OwnerStatement:
      type: object
      required: [asOf, view, incomeLagMonths, openingBalance, months, negativeMonths, warnings]
      additionalProperties: false
      properties:
        asOf:
          type: string
          format: date
        view:
          type: string
          const: MINE
        incomeLagMonths:
          type: integer
          description: 'Defasagem da renda (padrão 1, a competência M-1 paga a coluna de M).'
        openingBalance:
          $ref: '#/components/schemas/Money'
          description: Saldo atual das contas `CASH` (âncora, P-2).
        months:
          type: array
          items:
            $ref: '#/components/schemas/OwnerStatementMonth'
        negativeMonths:
          type: array
          items:
            $ref: '#/components/schemas/Competence'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/OwnerStatementWarning'
    PurchaseGroupStatus:
      type: string
      description: '`ACTIVE` = há parcela de algum membro ainda a vencer; `DONE` = nenhuma.'
      enum: [ACTIVE, DONE]
    PurchaseGroupMemberCreate:
      type: object
      description: |
        Compra de um membro, criada pelos caminhos existentes. `remainingInstallments` ausente = compra comum de `installmentAmount x totalInstallments`;
        menor que `totalInstallments` = compra em andamento (só as parcelas que faltam). Acima de `totalInstallments` → `422 PURCHASE_GROUP_INVALID`.
      required: [cardId, totalInstallments, installmentAmount, firstInvoiceDate]
      additionalProperties: false
      properties:
        cardId:
          type: string
          format: uuid
        totalInstallments:
          type: integer
          minimum: 2
          maximum: 36
        installmentAmount:
          $ref: '#/components/schemas/AmountInput'
          description: Valor de **cada** parcela.
        remainingInstallments:
          type: integer
          minimum: 1
          maximum: 36
        firstInvoiceDate:
          type: string
          format: date
          description: Data dentro do ciclo da fatura da primeira parcela a lançar.
        categoryId:
          type: [string, 'null']
          format: uuid
        splitMode:
          $ref: '#/components/schemas/SplitMode'
        shares:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ShareInput'
    PurchaseGroupInput:
      type: object
      required: [name, interest, members]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        interest:
          type: boolean
          description: Indica se a compra tem juros (informativo; o valor das parcelas já os traz).
        declaredTotal:
          oneOf:
            - $ref: '#/components/schemas/AmountInput'
            - type: 'null'
          description: Total que o usuário acredita ser o do item. Só gera `divergence` se diferente do derivado (P-26); nunca bloqueia.
        members:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/PurchaseGroupMemberCreate'
    PurchaseGroupUpdate:
      type: object
      required: [name, interest, version]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        interest:
          type: boolean
        version:
          type: integer
          format: int64
    PurchaseGroupMemberInput:
      type: object
      required: [transactionId]
      additionalProperties: false
      properties:
        transactionId:
          type: string
          format: uuid
    PurchaseGroupMember:
      type: object
      description: Uma compra do grupo, com os valores derivados das parcelas dela.
      required: [transactionId, card, description, totalInstallments, remainingInstallments, installmentAmount, total, remaining, myRemaining, lastDueDate]
      additionalProperties: false
      properties:
        transactionId:
          type: string
          format: uuid
        card:
          $ref: '#/components/schemas/CardRef'
        description:
          type: [string, 'null']
        totalInstallments:
          type: integer
        remainingInstallments:
          type: integer
          description: Parcelas ainda não vencidas e não canceladas.
        installmentAmount:
          $ref: '#/components/schemas/Money'
          description: Valor da parcela cheia da próxima fatura (a primeira pode diferir em centavos).
        total:
          $ref: '#/components/schemas/Money'
        remaining:
          $ref: '#/components/schemas/Money'
        myRemaining:
          $ref: '#/components/schemas/Money'
          description: Parte do que falta que é minha (rateio, ADR-022).
        lastDueDate:
          type: [string, 'null']
          format: date
          description: Vencimento da última parcela não cancelada.
    PurchaseGroupDivergence:
      type: object
      description: 'Diferença entre o total informado e o derivado dos membros (P-26).'
      required: [declared, computed, difference]
      additionalProperties: false
      properties:
        declared:
          $ref: '#/components/schemas/Money'
        computed:
          $ref: '#/components/schemas/Money'
        difference:
          $ref: '#/components/schemas/Money'
    PurchaseGroup:
      type: object
      description: |
        `total` = Σ `total` dos membros; `remaining` = Σ parcelas restantes; `lastDueDate` = a maior última parcela entre os membros;
        `installmentAmountPerMonth` = soma, entre os membros, das parcelas que caem na competência corrente. Tudo derivado; o grupo não tem lançamento.
      required: [id, name, interest, status, total, remaining, myRemaining, installmentAmountPerMonth, lastDueDate, divergence, members, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        interest:
          type: boolean
        status:
          $ref: '#/components/schemas/PurchaseGroupStatus'
        total:
          $ref: '#/components/schemas/Money'
        remaining:
          $ref: '#/components/schemas/Money'
        myRemaining:
          $ref: '#/components/schemas/Money'
        installmentAmountPerMonth:
          $ref: '#/components/schemas/Money'
        lastDueDate:
          type: [string, 'null']
          format: date
        divergence:
          oneOf:
            - $ref: '#/components/schemas/PurchaseGroupDivergence'
            - type: 'null'
        members:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseGroupMember'
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      examples:
        - id: 5d0b7c42-1e6a-4f93-8a2c-7b3e9f1d4a60
          name: Notebook
          interest: false
          status: ACTIVE
          total: {amount: '1150.00', currency: BRL}
          remaining: {amount: '750.00', currency: BRL}
          myRemaining: {amount: '750.00', currency: BRL}
          installmentAmountPerMonth: {amount: '150.00', currency: BRL}
          lastDueDate: '2027-04-05'
          divergence: null
          members: []
          version: 1
          createdAt: '2026-10-15T12:00:00Z'
          updatedAt: '2026-10-15T12:00:00Z'
    PurchaseGroupSlice:
      allOf:
        - $ref: '#/components/schemas/SliceBase'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PurchaseGroup'
      unevaluatedProperties: false
    PurchaseGroupCommitmentMonth:
      type: object
      required: [competence, amount, mine]
      additionalProperties: false
      properties:
        competence:
          $ref: '#/components/schemas/Competence'
        amount:
          $ref: '#/components/schemas/Money'
        mine:
          $ref: '#/components/schemas/Money'
    PurchaseGroupCommitments:
      type: object
      required: [until, committed, committedMine, byMonth]
      additionalProperties: false
      properties:
        until:
          $ref: '#/components/schemas/Competence'
        committed:
          $ref: '#/components/schemas/Money'
        committedMine:
          $ref: '#/components/schemas/Money'
        byMonth:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseGroupCommitmentMonth'
    CurrencyCode:
      type: string
      description: Moeda original de uma cobrança (2.27.0). O razão é só em BRL; as demais são metadado.
      enum: [BRL, USD, EUR]
    OriginalAmountInput:
      type: object
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount:
          $ref: '#/components/schemas/AmountInput'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
      examples:
        - { amount: '5.00', currency: USD }
    OriginalAmount:
      type: object
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount:
          type: string
          pattern: '^\d{1,13}\.\d{2}$'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
    FxRate:
      type: string
      description: |
        Câmbio BRL por 1 unidade da moeda original, string decimal de até 6 casas (`^\d{1,6}(\.\d{1,6})?$`), informado a cada cobrança.
        Exemplo: USD 5,00 a `5.000000` com IOF de 350 bps = 25,00 + 0,875 = `25.88` (um arredondamento `HALF_UP`).
      pattern: '^\d{1,6}(\.\d{1,6})?$'
      examples: ['5.000000']
    IofBps:
      type: integer
      description: IOF em pontos-base (10000 = 100%). Padrão 350 com moeda estrangeira; editável; só com moeda diferente de `BRL`.
      minimum: 0
      maximum: 10000
    RecurrenceScope:
      type: string
      description: '`PERSONAL` (padrão) ou `COMPANY` (pago no meu cartão, a ressarcir pela empresa; fora de `totalMonthlyMine`).'
      enum: [PERSONAL, COMPANY]
    Subscription:
      type: object
      description: Uma recorrência de despesa com os derivados de assinatura.
      required: [recurrence, monthlyEquivalent, monthlyEquivalentMine, lastChargedAmount, ended]
      additionalProperties: false
      properties:
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        monthlyEquivalent:
          $ref: '#/components/schemas/Money'
          description: Custo mensal equivalente cheio (não zera quando encerrada).
        monthlyEquivalentMine:
          $ref: '#/components/schemas/Money'
          description: 'Minha parte do custo mensal equivalente; `0,00` em `COMPANY`.'
        lastChargedAmount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Valor em BRL da última cobrança lançada; `null` sem cobrança.
        ended:
          type: boolean
    SubscriptionScopeTotal:
      type: object
      required: [scope, monthly]
      additionalProperties: false
      properties:
        scope:
          $ref: '#/components/schemas/RecurrenceScope'
        monthly:
          $ref: '#/components/schemas/Money'
    SubscriptionOverlapItem:
      type: object
      required: [id, description, monthlyEquivalent]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        description:
          type: [string, 'null']
        monthlyEquivalent:
          $ref: '#/components/schemas/Money'
    SubscriptionOverlap:
      type: object
      required: [group, items, monthly]
      additionalProperties: false
      properties:
        group:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionOverlapItem'
        monthly:
          $ref: '#/components/schemas/Money'
    SubscriptionList:
      allOf:
        - $ref: '#/components/schemas/SliceBase'
        - type: object
          required: [items, totalMonthly, totalMonthlyMine, byScope, overlaps]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Subscription'
            totalMonthly:
              $ref: '#/components/schemas/Money'
            totalMonthlyMine:
              $ref: '#/components/schemas/Money'
            byScope:
              type: array
              items:
                $ref: '#/components/schemas/SubscriptionScopeTotal'
            overlaps:
              type: array
              items:
                $ref: '#/components/schemas/SubscriptionOverlap'
      unevaluatedProperties: false
    DebtKind:
      type: string
      description: |
        Natureza do empréstimo (2.29.0). `PERSONAL` (padrão), `PAYROLL` (consignado descontado em folha, ADR-026) ou `CARD_CASH_OUT` (Pix no crédito,
        ADR-031, só criado por `POST /v1/card-cash-outs`).
        Enum que cresce: o cliente deve ter ramo padrão para valores desconhecidos.
      enum: [PERSONAL, PAYROLL, CARD_CASH_OUT]
    EffectiveRate:
      type: object
      description: |
        Taxa efetiva do empréstimo (TIR sobre parcelas mensais regulares, P-17). `annualBps = (1 + i)^12 - 1` em pontos-base (pode passar de 10000).
        Parcelas que somam o principal → 0.
      required: [monthlyBps, annualBps, method]
      additionalProperties: false
      properties:
        monthlyBps:
          type: integer
          format: int64
        annualBps:
          type: integer
          format: int64
        method:
          type: string
          const: IRR
    IncomeProfileStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    DeductionKind:
      type: string
      description: 'Tipo da rubrica (P-14): `TAX` (imposto além de INSS/IRRF), `BENEFIT`, `UNION` (sindicato), `LOAN` (consignado, aponta para a dívida) ou `OTHER`.'
      enum: [TAX, BENEFIT, UNION, LOAN, OTHER]
    PayrollAdvance:
      type: object
      required: [dayOfMonth, percentBps]
      additionalProperties: false
      properties:
        dayOfMonth:
          type: integer
          minimum: 1
          maximum: 28
        percentBps:
          type: integer
          minimum: 0
          maximum: 10000
          description: Fatia do líquido paga como adiantamento (4000 = 40%).
    ThirteenthSettings:
      type: object
      description: 13º salário (P-16). A 1ª parcela é paga sem descontos e pertence à competência do mês em que é paga; a 2ª parcela fica fora desta versão.
      required: [enabled, firstInstallmentMonth]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        firstInstallmentMonth:
          type: integer
          minimum: 1
          maximum: 12
          description: Mês de pagamento da 1ª parcela (padrão 11).
    PayrollDeductionInput:
      type: object
      description: |
        Rubrica de desconto em folha. `amount` ou `percentBps` (percentual do bruto), nunca os dois. `debtId` só em `LOAN`. `interestAmount` (2.32.1) só em `LOAN`:
        juros embutidos na parcela de cada ocorrência; sem ele a parcela baixa só principal (`confidence = ESTIMATED`, aviso `PAYROLL_INTEREST_NOT_SPLIT`).
      required: [kind, label]
      additionalProperties: false
      properties:
        interestAmount:
          oneOf:
            - $ref: '#/components/schemas/AmountInput'
            - type: 'null'
          description: Juros da parcela (zero ou mais, no máximo o valor da rubrica). Fora de `LOAN` → `422 INCOME_PROFILE_INVALID`.
        kind:
          $ref: '#/components/schemas/DeductionKind'
        label:
          type: string
          minLength: 1
          maxLength: 100
        amount:
          $ref: '#/components/schemas/AmountInput'
        percentBps:
          type: integer
          minimum: 1
          maximum: 10000
        startsOn:
          type: [string, 'null']
          format: date
        endsOn:
          type: [string, 'null']
          format: date
        debtId:
          type: [string, 'null']
          format: uuid
    PayrollDeduction:
      type: object
      required: [kind, label, amount, percentBps, startsOn, endsOn, debtId]
      additionalProperties: false
      properties:
        interestAmount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Juros da parcela informados (2.32.1); `null` = não informado (`PAYROLL_INTEREST_NOT_SPLIT`).
        kind:
          $ref: '#/components/schemas/DeductionKind'
        label:
          type: string
        amount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        percentBps:
          type: [integer, 'null']
        startsOn:
          type: [string, 'null']
          format: date
        endsOn:
          type: [string, 'null']
          format: date
        debtId:
          type: [string, 'null']
          format: uuid
    IncomeProfileFields:
      type: object
      description: Campos do perfil de renda, sem fechar o objeto (a entrada e a atualização fecham com `unevaluatedProperties`).
      required: [source, gross, dependents, balanceDayOfMonth, deductions, thirteenth]
      properties:
        provenance:
          $ref: '#/components/schemas/Provenance'
        source:
          type: string
          minLength: 1
          maxLength: 100
          description: Nome da fonte pagadora (texto livre).
        gross:
          $ref: '#/components/schemas/AmountInput'
          description: Salário bruto mensal.
        dependents:
          type: integer
          minimum: 0
          maximum: 20
        advance:
          oneOf:
            - $ref: '#/components/schemas/PayrollAdvance'
            - type: 'null'
          description: Adiantamento; `null` = sem adiantamento (o líquido cai inteiro no dia do saldo).
        balanceDayOfMonth:
          type: integer
          minimum: 1
          maximum: 28
          description: Dia do saldo, no mês seguinte à competência (P-1).
        deductions:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/PayrollDeductionInput'
        thirteenth:
          $ref: '#/components/schemas/ThirteenthSettings'
    IncomeProfileInput:
      allOf:
        - $ref: '#/components/schemas/IncomeProfileFields'
      unevaluatedProperties: false
    IncomeProfileUpdate:
      allOf:
        - $ref: '#/components/schemas/IncomeProfileFields'
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              format: int64
      unevaluatedProperties: false
    IncomeProfile:
      type: object
      required: [id, source, gross, dependents, advance, balanceDayOfMonth, deductions, thirteenth, status, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        provenance:
          $ref: '#/components/schemas/Provenance'
        id:
          type: string
          format: uuid
        source:
          type: string
        gross:
          $ref: '#/components/schemas/Money'
        dependents:
          type: integer
        advance:
          oneOf:
            - $ref: '#/components/schemas/PayrollAdvance'
            - type: 'null'
        balanceDayOfMonth:
          type: integer
        deductions:
          type: array
          items:
            $ref: '#/components/schemas/PayrollDeduction'
        thirteenth:
          $ref: '#/components/schemas/ThirteenthSettings'
        status:
          $ref: '#/components/schemas/IncomeProfileStatus'
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IncomeProfileSlice:
      allOf:
        - $ref: '#/components/schemas/SliceBase'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/IncomeProfile'
      unevaluatedProperties: false
    PreviewDeduction:
      type: object
      required: [kind, label, amount, debtId]
      additionalProperties: false
      properties:
        interestAmount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Juros da parcela `LOAN` (2.32.1); `null` quando não informado.
        principalAmount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: 'Principal baixado da dívida: `amount − interestAmount`; sem `interestAmount`, o valor inteiro (só em `LOAN`).'
        confidence:
          $ref: '#/components/schemas/OwnerConfidence'
          description: '`ESTIMATED` em `LOAN` sem `interestAmount` (aviso `PAYROLL_INTEREST_NOT_SPLIT`).'
        warnings:
          type: array
          description: 'Códigos abertos; conhecido: `PAYROLL_INTEREST_NOT_SPLIT`.'
          items:
            type: string
            pattern: '^[A-Z][A-Z0-9_]*$'
        kind:
          $ref: '#/components/schemas/DeductionKind'
        label:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        debtId:
          type: [string, 'null']
          format: uuid
    PayrollPayment:
      type: object
      description: Um pagamento da competência, com a data real.
      required: [date, amount]
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
        amount:
          $ref: '#/components/schemas/Money'
    IncomePreview:
      type: object
      description: |
        Líquido da competência `month`. `net = gross - inss - irrf - Σ fixedDeductions - Σ loanDeductions`; `advance.amount + balance.amount = net`.
        `taxTables` lista as versões usadas (INSS pela competência, IRRF pela data de pagamento).
      required: [month, gross, inss, irrf, fixedDeductions, loanDeductions, net, advance, balance, thirteenth, taxTables]
      additionalProperties: false
      properties:
        month:
          $ref: '#/components/schemas/Competence'
        gross:
          $ref: '#/components/schemas/Money'
        inss:
          $ref: '#/components/schemas/Money'
        irrf:
          $ref: '#/components/schemas/Money'
        fixedDeductions:
          type: array
          items:
            $ref: '#/components/schemas/PreviewDeduction'
        loanDeductions:
          type: array
          items:
            $ref: '#/components/schemas/PreviewDeduction'
        net:
          $ref: '#/components/schemas/Money'
        advance:
          oneOf:
            - $ref: '#/components/schemas/PayrollPayment'
            - type: 'null'
        balance:
          $ref: '#/components/schemas/PayrollPayment'
        thirteenth:
          oneOf:
            - $ref: '#/components/schemas/PayrollPayment'
            - type: 'null'
          description: 1ª parcela do 13º, sem descontos, quando `month` é o mês de pagamento dela; senão `null`.
        taxTables:
          type: array
          items:
            $ref: '#/components/schemas/TaxTableRef'
    GeneratedIncomeKind:
      type: string
      description: '`ADVANCE`, `BALANCE` ou `THIRTEENTH_FIRST`.'
      enum: [ADVANCE, BALANCE, THIRTEENTH_FIRST]
    GeneratedIncomeOccurrence:
      type: object
      required: [kind, competence, date, amount, recurrenceId, created]
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/GeneratedIncomeKind'
        competence:
          $ref: '#/components/schemas/Competence'
          description: Competência que o pagamento paga (`incomeCompetence`).
        date:
          type: string
          format: date
        amount:
          $ref: '#/components/schemas/Money'
        recurrenceId:
          type: string
          format: uuid
        created:
          type: boolean
          description: '`false` quando o pagamento já existia (idempotência).'
    GeneratedIncomeOccurrences:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GeneratedIncomeOccurrence'
    TaxTableKind:
      type: string
      enum: [INSS, IRRF]
    TaxTableBasis:
      type: string
      description: '`COMPETENCE` (INSS: vigência pela competência) ou `PAYMENT_DATE` (IRRF: vigência pela data de pagamento).'
      enum: [COMPETENCE, PAYMENT_DATE]
    TaxMethod:
      type: string
      description: '`PROGRESSIVE_BY_BAND` (INSS: soma por faixa) ou `RATE_MINUS_DEDUCTION` (IRRF: base x alíquota - parcela a deduzir).'
      enum: [PROGRESSIVE_BY_BAND, RATE_MINUS_DEDUCTION]
    TaxBracket:
      type: object
      required: [from, upTo, rateBps, deduction]
      additionalProperties: false
      properties:
        from:
          $ref: '#/components/schemas/Money'
        upTo:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Limite superior da faixa; `null` na última (sem teto, ou o teto está em `contributionCeiling`).
        rateBps:
          type: integer
          description: Alíquota em pontos-base (750 = 7,5%).
        deduction:
          $ref: '#/components/schemas/Money'
          description: Parcela a deduzir (IRRF); 0,00 no INSS.
    TaxReduction:
      type: object
      description: |
        Redutor mensal do IRRF (Lei 15.270/2025, art. 3º-A da Lei 9.250/1995). Rendimento até `fullReductionUpTo`: redução de até `fullReductionAmount`
        (o imposto zera); entre `fullReductionUpTo` e `phaseOutUpTo`: `constant - coefficient x rendimentos`; acima de `phaseOutUpTo`: nenhuma. Limitado ao
        imposto apurado. O rendimento da fórmula é o rendimento tributável do mês, **não** a base de cálculo.
      required: [fullReductionUpTo, fullReductionAmount, phaseOutUpTo, constant, coefficient]
      additionalProperties: false
      properties:
        fullReductionUpTo:
          $ref: '#/components/schemas/Money'
        fullReductionAmount:
          $ref: '#/components/schemas/Money'
        phaseOutUpTo:
          $ref: '#/components/schemas/Money'
        constant:
          $ref: '#/components/schemas/Money'
        coefficient:
          type: string
          pattern: '^\d\.\d{6}$'
          description: Coeficiente com 6 casas (`0.133145`).
    TaxSource:
      type: object
      description: Fonte oficial da tabela.
      required: [agency, norm, url, consultedOn]
      additionalProperties: false
      properties:
        agency:
          type: string
        norm:
          type: string
        url:
          type: string
        consultedOn:
          type: string
          format: date
    TaxTableRef:
      type: object
      required: [kind, version, effectiveFrom]
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/TaxTableKind'
        version:
          type: integer
        effectiveFrom:
          type: string
          format: date
    TaxTable:
      type: object
      required: [kind, version, effectiveFrom, effectiveTo, basis, method, brackets, contributionCeiling, dependentDeduction, simplifiedDiscountLimit, reduction, sources]
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/TaxTableKind'
        version:
          type: integer
          description: Versão da tabela na mesma vigência; correção = versão nova.
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: [string, 'null']
          format: date
        basis:
          $ref: '#/components/schemas/TaxTableBasis'
        method:
          $ref: '#/components/schemas/TaxMethod'
        brackets:
          type: array
          items:
            $ref: '#/components/schemas/TaxBracket'
        contributionCeiling:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Teto do salário de contribuição (INSS); `null` no IRRF.
        dependentDeduction:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Dedução mensal por dependente (IRRF).
        simplifiedDiscountLimit:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Limite mensal do desconto simplificado (IRRF).
        reduction:
          oneOf:
            - $ref: '#/components/schemas/TaxReduction'
            - type: 'null'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/TaxSource'
    TaxTableList:
      type: object
      required: [year, items]
      additionalProperties: false
      properties:
        year:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaxTable'
    CardCashOutInput:
      type: object
      required: [cardId, principal, installments, firstInvoiceDate]
      additionalProperties: false
      properties:
        cardId:
          type: string
          format: uuid
        accountId:
          type: [string, 'null']
          format: uuid
          description: Conta `CASH` que recebe o principal. Obrigatória sem `beneficiaryPersonId`; com beneficiário não existe.
        principal:
          $ref: '#/components/schemas/AmountInput'
        installments:
          type: integer
          minimum: 1
          maximum: 36
        totalWithInterest:
          $ref: '#/components/schemas/AmountInput'
          description: Total das parcelas, juros incluídos. Informe este ou `rateBps`.
        rateBps:
          type: integer
          minimum: 0
          maximum: 10000
          description: Taxa mensal em pontos-base. O backend calcula as parcelas (arredondamento único; o resto do centavo vai para a primeira parcela).
        firstInvoiceDate:
          type: string
          format: date
        beneficiaryPersonId:
          type: [string, 'null']
          format: uuid
          description: Pessoa que recebeu o Pix; o principal vira `RECEIVABLE` dela. Nulo = eu.
        interestCategoryId:
          type: [string, 'null']
          format: uuid
          description: Categoria `EXPENSE` do juro; ausente = a categoria padrão.
        channel:
          type: [string, 'null']
          maxLength: 60
    AssetKind:
