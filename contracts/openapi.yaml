 (inclui cláusulas com percentual fora de 0..10000 e cotas ou cláusulas em compromisso que não é projeto), `COMMITMENT_SCHEDULE_ITEM_ALREADY_PAID`, `THIRD_PARTY_EXPENSE_INVALID`, `THIRD_PARTY_EXPENSE_ALREADY_MARKED`, `THIRD_PARTY_EXPENSE_NOT_FOUND`, `RECEIVABLE_ALREADY_RECEIVED` (2.36.0), `RECEIVABLE_EXPECTED_MONTH_INVALID` (2.36.0), `RECURRENCE_OCCURRENCE_ALREADY_REALIZED`, `RECURRENCE_OCCURRENCE_SKIPPED`, `RECURRENCE_NOT_AN_OCCURRENCE`, `RECURRENCE_REFERENCE_MISMATCH`, `RECURRENCE_INACTIVE`, `RECURRENCE_ENDED`, `DATE_OUT_OF_RANGE`, `WEAK_PASSWORD` (2.15.0: senha do primeiro acesso com menos de 12 caracteres, mais de 72 bytes ou igual ao e-mail; o código de setup não é consumido; 2.38.0: vale também no aceite de convite, sem consumir o token); **metas (Etapa 5)**: `GOAL_ARCHIVED`, `GOAL_ALREADY_ARCHIVED`, `GOAL_NOT_ARCHIVED`, `GOAL_RESERVATION_ACCOUNT_NOT_ELIGIBLE`, `GOAL_RELEASE_EXCEEDS_RESERVED`, `GOAL_RESERVATION_AMOUNT_ZERO`, `GOAL_TARGET_NOT_POSITIVE`, `GOAL_FIELD_REQUIRED`, `GOAL_NAME_REQUIRED`, `GOAL_NAME_TOO_LONG`, `GOAL_TEXT_TOO_LONG`; **visão de dívidas (2.13.0)**: `ONGOING_INVALID_COUNT` (faltam mais parcelas que o total), `ONGOING_FIRST_INVOICE_NOT_PAYABLE` (a fatura da próxima parcela já está paga), `ONGOING_CATEGORY_RETROACTIVE` (com categoria, a próxima parcela não pode cair em mês anterior ao atual), `DEBT_PAYOFF_GOAL_EXISTS` (já há meta de quitar dívidas ativa), `DEBT_PAYOFF_NOTHING_TO_BASELINE` (total de dívidas zero ao ancorar), `GOAL_KIND_NOT_RESERVABLE` (reserva em meta de quitar dívidas), `GOAL_KIND_MISMATCH` (baseline em meta de guardar dinheiro), `DEBT_CREDITOR_INVALID` (pessoa e credor livre juntos, nenhum dos dois, credor em dívida a receber ou categoria no credor livre); **notas e vault (Etapa 6)**: `NOTE_PATH_INVALID`, `NOTE_PATH_TAKEN`, `NOTE_TOO_LARGE` (acima de 200 KB), `NOTE_LIMIT_REACHED` (5.000 notas), `NOTE_LINK_TARGET_NOT_FOUND`, `NOTE_LINK_INVALID`, `NOTE_LINK_LIMIT_REACHED`, `NOTE_TRASHED`, `NOTE_ALREADY_TRASHED`, `NOTE_NOT_TRASHED`, `NOTE_FRONTMATTER_INVALID`, `NOTE_FRONTMATTER_RESERVED`, `TEXT_INVALID_CHARACTERS` (controle no texto da nota que passou do `400`), `VAULT_IMPORT_INVALID` (zip hostil, corrompido ou que não é zip), `VAULT_IMPORT_TOO_LARGE` (acima de 20 MB, 2.000 entradas ou 100 MB descomprimidos); **importação e notificações (Etapa 7)**: `IMPORT_TOO_LARGE` (acima de 5 MB ou 5.000 linhas), `IMPORT_FORMAT_UNSUPPORTED` (XLSX, PDF, moeda diferente de BRL), `IMPORT_PARSE_FAILED` (arquivo ilegível ou truncado, OFX com DOCTYPE/ENTITY), `IMPORT_MAPPING_INVALID`, `IMPORT_SOURCE_INVALID`, `IMPORT_BATCH_NOT_PENDING`, `IMPORT_BATCH_NOT_UNDOABLE`, `IMPORT_LINES_REQUIRE_DECISION`, `IMPORT_NOTHING_TO_APPLY`, `IMPORT_APPLY_FAILED` (uma linha falhou; nada foi gravado), `IMPORT_LINE_INVALID`, `IMPORT_LINE_INVALID_TRANSITION`, `REMINDER_INVALID`, `REMINDER_ALREADY_DONE`, `NOTIFICATION_SETTINGS_INVALID`, `PUSH_SUBSCRIPTION_LIMIT`, `PUSH_SUBSCRIPTION_INVALID`, `PUSH_NOT_ENABLED` (push desligado neste servidor) |
    | 404, 405, 406, 415 (rota ou mídia que o servidor não atende) | `NOT_FOUND`, `METHOD_NOT_ALLOWED`, `NOT_ACCEPTABLE`, `UNSUPPORTED_MEDIA_TYPE` |
    | 429 | `TOO_MANY_ATTEMPTS` (com `Retry-After`; 2.38.0: o login também por e-mail normalizado, e `preview` e `accept` de convite por IP e hash do token apresentado, com resposta idêntica exista ou não o e-mail ou o token): login, o primeiro acesso (`setup-password`, mesmo limite por IP do login), as rotas de exportação (6 pedidos por minuto por usuário) e a busca global (120 pedidos por minuto por usuário) |
    | 500 | `INTERNAL_ERROR` |
    | 502 | `EMAIL_DELIVERY_FAILED` (2.38.0: o provedor de e-mail recusou o envio; o convite foi criado e traz `invitationId`) |

    `INVOICE_CHAIN_INCONSISTENT` (cadeia de faturas quebrada) e `CARD_INVALID_INSTALLMENT` (parcela inválida) são invariantes internas: respondem `500 INTERNAL_ERROR`, nunca aparecem como `code`.

    Se o domínio usar outro nome para um desses códigos, vale o do domínio e este arquivo é ajustado.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Mesmo domínio do frontend (em dev, o proxy do Angular encaminha `/v1`).
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Login, refresh rotativo em cookie e logout (ADR-003, ADR-032).
  - name: Invitations
    description: 'Convites por e-mail (2.38.0, ADR-032): criar, listar, reenviar, revogar (só o dono) e a prévia e o aceite públicos, com o token sempre no corpo.'
  - name: Users
    description: 'Gestão de usuários pelo dono (2.38.0, ADR-032): listar, desativar e reativar, sem nenhum dado financeiro.'
  - name: Accounts
    description: Contas (corrente, poupança, carteira, investimento).
  - name: Categories
    description: Categorias de despesa e de receita.
  - name: Transactions
    description: Movimentações (visão registros) com edição, estorno e idempotência.
  - name: Cards
    description: Cartões de crédito, limite, parcelas futuras e prévias (compra e mudança de dias).
  - name: Invoices
    description: Faturas (itens, pagamento e prévia do pagamento). Status derivado na leitura.
  - name: Entries
    description: Lançamentos por competência (visão de consumo e de receita).
  - name: Dashboard
    description: Resumo do Início e compromissos futuros.
  - name: People
    description: Pessoas com quem há dívidas (saldo e histórico).
  - name: Debts
    description: Dívidas (me devem / eu devo), quitação por movimentação, perdão e estorno do registro.
  - name: Commitments
    description: 'Compromissos acompanhados (2.14.0): empréstimo de terceiro e projeto de longo prazo, sem efeito em contas nem no total de dívidas.'
  - name: Recurrences
    description: Recorrências, ocorrências previstas e a confirmação de cada uma (nunca automática).
  - name: Goals
    description: Metas com reserva lógica sobre o saldo de uma conta (sem movimentação nem lançamento).
  - name: Summaries
    description: Resumo mensal calculado pelo backend, com comparação ao mês anterior.
  - name: Projections
    description: Projeções determinísticas (30 e 90 dias, 6 e 12 meses), sempre rotuladas como projeção.
  - name: Exports
    description: Exportação dos dados do usuário (CSV de movimentações e backup JSON).
  - name: Notes
    description: Notas Markdown vinculadas às finanças (wikilinks, backlinks, tags, lixeira, busca). O backend nunca renderiza o Markdown.
  - name: Vault
    description: Exportar e importar o vault como zip compatível com o Obsidian (S-157).
  - name: Reports
    description: Relatórios do Início (redesign, 2.6.0). Série de entradas e saídas e consumo por categoria, calculados no backend, nunca cacheados.
  - name: Search
    description: Busca global (redesign, 2.6.0) em movimentações, contas, categorias, cartões e notas do usuário.
  - name: Imports
    description: Importação de extrato CSV/OFX (2.7.0) com revisão antes de aplicar, detecção de duplicidade, desfazer o lote e regras de categorização aprendidas.
  - name: Notifications
    description: Central de notificações, lembretes, configurações, push preparado (desligado por padrão) e mensagem diária (2.7.0).
  - name: AI
    description: |
      IA opcional (2.8.0). O app funciona sem chave (`GET /v1/ai/status` traz `enabled: false`). Todo envio exige uma prévia aprovada pelo usuário
      (`POST /v1/ai/previews` e depois `POST /v1/ai/analyses`), com o payload já minimizado e redigido. A chave, o provedor e a URL base vivem só no
      ambiente do servidor e **nunca** aparecem em nenhuma resposta. A IA nunca altera o razão.
  - name: Insights
    description: |
      Insights calculados (2.20.0, ADR-019): fórmulas sobre o razão, mensais e do dia, sem IA, sem provedor e offline. O backend devolve `key` e
      `params`; o front traduz e formata. Dispensa auditada (só inserção).

  - name: PurchaseGroups
    description: 'Compras parceladas agrupadas entre cartões (2.26.0): total, restante, mês final e comprometido até um mês.'
  - name: IncomeProfiles
    description: 'Perfil de renda (2.29.0): bruto, rubricas, adiantamento, 13º, prévia do líquido e geração de ocorrências. Dado sensível: escopo por usuário e fora de logs.'
  - name: TaxTables
    description: 'Tabelas de INSS e IRRF versionadas por vigência (2.29.0), somente leitura, com a fonte oficial de cada uma.'
  - name: CardCashOuts
    description: 'Pix no crédito como empréstimo (2.29.0).'
  - name: Assets
    description: 'Ativos informados (2.30.0): FGTS e outros, com histórico de saldo. Dado sensível: escopo por usuário e fora de logs.'
  - name: NetWorth
    description: 'Patrimônio por disponibilidade e reserva de emergência (2.30.0).'
  - name: Simulations
    description: 'Simulador de compra parcelada: impacto mês a mês e classificação, sem gravar nada (2.28.0).'
paths:
  # ---------------------------------------------------------------- Auth
  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Entra com e-mail e senha
      description: |
        Devolve o access token (JWT de 15 min, guardado só em memória no front) e grava o refresh token em cookie
        `ml_refresh` (`HttpOnly; Secure; SameSite=Strict; Path=/v1/auth; Max-Age=2592000`). A mesma resposta
        (`401 INVALID_CREDENTIALS`) vale para e-mail inexistente, senha errada e usuário `DISABLED`, com corpo, cabeçalhos e tempo equivalentes (2.38.0). Limite: 5 falhas por IP ou por e-mail normalizado em 15 min → `429`, idêntico exista ou não o e-mail.
        A resposta traz `user` (`id`, `email`, `role`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticado.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/auth/status:
    get:
      tags: [Auth]
      operationId: getAuthStatus
      summary: O dono ainda precisa escolher a senha (primeiro acesso)?
      description: |
        Público e sem dado sensível. `passwordSetupRequired=true` quando o dono não tem senha no banco e (pediu redefinição
        ou não há hash no ambiente): o front mostra a tela de primeiro acesso em vez do login (ADR-015).
      security: []
      responses:
        '200':
          description: Estado do primeiro acesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/auth/setup-password:
    post:
      tags: [Auth]
      operationId: setupPassword
      summary: Primeiro acesso, o dono escolhe a senha
      description: |
        Só funciona enquanto o dono não tem senha definida (`GET /v1/auth/status`). Exige o e-mail do dono e o `setupCode` de
        uso único (impresso no log de inicialização do perfil dev, ou informado em `MONEYLOG_OWNER_SETUP_CODE`), que expira
        em 24 h ou ao ser usado. Senha: 12 a 72 bytes e diferente do e-mail (`422 WEAK_PASSWORD`, o código não é consumido).
        Devolve o mesmo par do login (cookie `ml_refresh` + `AuthToken`) e revoga todas as sessões anteriores. E-mail, código
        errado, expirado ou já usado: `401 INVALID_SETUP_CODE` (mesma resposta). Limite: 5 falhas por IP em 15 min → `429`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupPasswordRequest'
      responses:
        '200':
          description: Senha definida e sessão aberta.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Troca o refresh token (cookie) por um novo par
      description: |
        Rotativo: o cookie é substituído. O `Origin` precisa estar em `MONEYLOG_ALLOWED_ORIGINS` (proteção CSRF).
        Um refresh já rotacionado, reapresentado em até 30 s, gera um novo par da mesma família sem revogar nada (S-83).
        Usuário `DISABLED` recebe `401 REFRESH_INVALID` e nenhum token novo (2.38.0).
      security: []
      responses:
        '200':
          description: Novo par.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoga a família do refresh token
      security: []
      responses:
        '204':
          description: Sessão encerrada; cookie expirado.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------- Invitations
  /v1/invitations:
    post:
      tags: [Invitations]
      operationId: createInvitation
      summary: Convida uma pessoa por e-mail (só o dono)
      description: |
        Cria o convite `PENDING` (validade de 7 dias, token aleatório de 256 bits guardado só como hash) e envia o e-mail com o link
        `https://moneylog.mviana.tech/convite#<token>`. O token em claro nunca aparece na resposta. Convite `PENDING` vencido do mesmo e-mail vira `EXPIRED` na mesma transação.
        Erros: `409 EMAIL_ALREADY_REGISTERED` (e-mail já é usuário, ativo ou desativado, em qualquer caixa), `409 INVITATION_PENDING` (já há pendente não expirado; `invitationId` aponta o existente e o
        caminho é `resend`), `409 USER_LIMIT_REACHED`, `404 INVITATIONS_DISABLED` com os convites desligados, `403 FORBIDDEN` para `MEMBER`.
        `502 EMAIL_DELIVERY_FAILED`: o convite foi criado com `deliveryStatus = FAILED` e o `problem+json` traz `invitationId`; `POST /v1/invitations/{id}/resend` o reenvia.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationInput'
      responses:
        '201':
          description: Convite criado e e-mail enviado.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/EmailDeliveryFailed'
    get:
      tags: [Invitations]
      operationId: listInvitations
      summary: Lista os convites (só o dono; lista curta, sem paginação, mais novos primeiro)
      description: Sem `status`, devolve todos. Um `PENDING` vencido sai como `EXPIRED`. Convites em estado final são apagados após `moneylog.invitations.retention-days` (90).
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/InvitationStatus'
      responses:
        '200':
          description: Convites.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/invitations/{id}/resend:
    post:
      tags: [Invitations]
      operationId: resendInvitation
      summary: Reenvia o convite com novo token (só o dono)
      description: |
        Vale em `PENDING` e `EXPIRED`: o convite fica `PENDING` com novo token e novo `expiresAt` (7 dias); o token anterior passa a dar `404 INVALID_INVITATION`. Sem corpo.
        `ACCEPTED` ou `REVOKED` → `409 INVITATION_NOT_RESENDABLE`. Em `EXPIRED` reavalia as regras de `POST /v1/invitations`:
        `409 EMAIL_ALREADY_REGISTERED`, `409 INVITATION_PENDING` (há outro pendente não expirado para o e-mail; `invitationId` aponta o outro) e `409 USER_LIMIT_REACHED`
        (o convite continua `EXPIRED`). `502 EMAIL_DELIVERY_FAILED` traz `invitationId` deste convite. `404 INVITATIONS_DISABLED` com os convites desligados; id desconhecido: `404 INVITATION_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Convite atualizado e e-mail reenviado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/EmailDeliveryFailed'

  /v1/invitations/{id}:
    delete:
      tags: [Invitations]
      operationId: revokeInvitation
      summary: Revoga o convite (só o dono)
      description: |
        `PENDING` e `EXPIRED` viram `REVOKED`; repetir em `REVOKED` é idempotente e devolve o mesmo recurso. `ACCEPTED` → `409 INVITATION_NOT_REVOCABLE`.
        Devolve o convite atualizado (`200`), não `204`. Id desconhecido: `404 INVITATION_NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Convite com `status = REVOKED`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/invitations/preview:
    post:
      tags: [Invitations]
      operationId: previewInvitation
      summary: Mostra o e-mail e a validade de um convite (público)
      description: |
        Público, sem JWT. O token vai **no corpo** (lido do fragmento da URL pelo front), nunca em caminho nem query. Token expirado, usado, revogado ou inexistente:
        `404 INVALID_INVITATION`, idêntico (corpo, cabeçalhos e tempo) nos quatro casos. Com os convites desligados também responde `404`. Limite de tentativas por IP e hash do token
        apresentado: `429 TOO_MANY_ATTEMPTS` com `Retry-After`, idêntico exista ou não o token. Sempre `Cache-Control: no-store`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationPreviewRequest'
      responses:
        '200':
          description: O convite é válido.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/invitations/accept:
    post:
      tags: [Invitations]
      operationId: acceptInvitation
      summary: Aceita o convite, cria a conta e abre a sessão (público)
      description: |
        Público, sem JWT e sem cookie de autenticação prévio (não é alvo de CSRF). O token vai **no corpo**, nunca em caminho nem query. Consome o convite de forma atômica, cria o usuário
        `MEMBER`/`ACTIVE`, semeia as categorias do sistema e devolve o mesmo par do login (cookie `ml_refresh` + `AuthToken`), tudo na mesma transação; falha em qualquer parte desfaz tudo e o token continua válido.
        Senha: mesma política do primeiro acesso (12 a 72 bytes e diferente do e-mail); fraca → `422 WEAK_PASSWORD`, sem consumir o token. Token expirado, usado, revogado, inexistente, convites
        desligados, ou e-mail que passou a existir como usuário desde o convite (o convite vira `REVOKED`): `404 INVALID_INVITATION`, idêntico. Limite de tentativas: `429` com `Retry-After`.
        Sempre `Cache-Control: no-store`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
      responses:
        '200':
          description: Conta criada e sessão aberta.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
