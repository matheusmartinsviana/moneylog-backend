  /v1/ai/analyses:
    post:
      tags: [AI]
      operationId: runAiAnalysis
      summary: Aprova (ou nega) uma prévia e, aprovada, envia exatamente aquele payload à IA
      description: |
        `approve: false` registra `DENIED` e nada é enviado. `approve: true` confere o hash do payload, o limite diário, o orçamento e o disjuntor,
        reivindica a prévia (uso único), chama o provedor e valida o texto contra os fatos (todo número do texto precisa estar nos fatos). O
        resultado `REJECTED_UNGROUNDED`, `FAILED` ou `BUDGET_EXCEEDED` volta com `201` e `fallback: true`: o front mostra o conteúdo determinístico
        (insights e resumo). Repetir a mesma `Idempotency-Key` devolve a mesma análise sem nova chamada ao provedor.

        Erros `422`: `AI_DISABLED` (sem provedor), `AI_BUDGET_EXCEEDED`, `AI_PREVIEW_EXPIRED`, `AI_PREVIEW_MISMATCH`, `AI_PREVIEW_ALREADY_USED`.
        `429 AI_RATE_LIMITED` (limite diário) e `503 AI_PROVIDER_UNAVAILABLE` (disjuntor aberto).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiAnalysisInput'
      responses:
        '201':
          description: A análise registrada.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Cache-Control:
