          type: [string, 'null']
          format: uuid
          description: |
            Cartão que recebe o crédito (reembolso no cartão, S-134, T56): `CARD +X / EXPENSE -X` na competência do
            reembolso, como crédito na fatura do período (lançamento tardio em fatura fechada e não paga; fatura paga
            manda o crédito para a corrente). Pode deixar a fatura negativa: vira crédito transportado (S-18).
