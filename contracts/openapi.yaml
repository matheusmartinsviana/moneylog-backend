  # ---------------------------------------------------------------- Dashboard
  /v1/dashboard/summary:
    get:
      tags: [Dashboard]
      operationId: getDashboardSummary
      summary: Resumo do Início
      description: |
        Tudo calculado pelo backend. `available` = `inAccounts` − `committed.d30` − `reserved`; `consumption` =
        `expensesPaid.total` + `credit` − `refunds`; `net` = `income` − `consumption`. `hasAccounts` = existe ao menos
        uma conta, ativa ou arquivada (o Início mostra o estado vazio só quando é `false`, S-61). **Cartões (T59):** as
        faturas e as parcelas entram em `committed`/`balances`/`month`/`netWorth` pelos mesmos registros da lista e do
        cartão (S-79): a compra conta no consumo da competência de cada parcela, o limite usado e o passivo vêm do livro
        do cartão, e pagar a fatura move caixa e compromisso sem recontabilizar consumo. **Dívidas e recorrências (Etapa 4):**
        entram pelas mesmas fontes de compromisso (cobrança de dívida em `incoming`, dívida `PAYABLE` e ocorrência pendente em
        `committed`); quitar uma dívida **não** é renda (`month.income` não muda; sobe `month.received`), e realizar uma
        ocorrência a tira de `committed` e a põe em `month.consumption` uma vez só. **Movimentação com data futura (S-258):** a
        movimentação ativa com data **depois de hoje** (despesa, saída em conta, aplicação, pagamento de fatura ou de dívida,
        receita, ocorrência realizada adiantada...) não está no caixa até a data dela: ela é um compromisso `SCHEDULED_TRANSACTION`
        (saída em `committed`, `available` e `projected`; entrada em `projected`) e, na data, passa a ser caixa e deixa de ser compromisso
        (nunca os dois). Transferência entre contas de caixa e compra no cartão não geram item (a fatura continua sendo o compromisso).
      parameters:
        - name: asOf
          in: query
          description: 'Data do resumo (padrão: hoje no fuso `America/Sao_Paulo`), de 2000-01-01 a 2100-12-31 (fora disso, `400`, S-239). Depois de hoje, `isProjection = true`.'
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/View'
      responses:
        '200':
          description: Resumo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/dashboard/upcoming:
    get:
      tags: [Dashboard]
      operationId: getDashboardUpcoming
      summary: Compromissos futuros
      description: |
        Sem parâmetros: `from` = hoje e `to` = hoje + 30 dias; vencidos não pagos entram sempre (S-64). **Cartões (Etapa
        3, T59):** cada fatura não paga com saldo é **um** item `INVOICE_FORECAST` (aberta ou futura) ou `INVOICE` (fechada
        ou vencida, esta com `bucket: OVERDUE`), com valor = `outstanding` e as parcelas aninhadas em `items[]`
        (informativas: ninguém soma); nunca há item `INSTALLMENT` de primeiro nível, então compra → parcela → fatura →
        pagamento conta uma vez só. Pagar a fatura tira o item (e o `outstanding` do pagamento sai de `committed` e de
        `balances.inAccounts` de uma vez, sem mexer em `balances.available` nem em `month.consumption`). **Dívidas e
        recorrências (Etapa 4):** a dívida `OPEN`/`PARTIALLY_SETTLED` com `expectedDate` é um item `DEBT_PAYABLE` (saída) ou
        `DEBT_RECEIVABLE` (entrada) com o saldo em aberto; sem `expectedDate` vai para `undated` e fica fora dos horizontes
        (S-145). Cada ocorrência `PENDING` de recorrência ativa é um item `RECURRENCE` (as vencidas e não realizadas continuam
        pendentes, S-20); realizada ou pulada, sai. Uma ocorrência de cartão realizada passa a vir só da fatura. Nenhum
        compromisso aparece duas vezes. **Limites (S-239, S-240):** `from` e `to` ficam entre 2000-01-01 e 2100-12-31, `from`
        não pode ser depois de `to` (inclusive o `from` padrão, hoje: `to` no passado é `400`) e a janela pode ter no máximo
        3 anos; fora disso, `400 VALIDATION_FAILED`. As ocorrências de recorrência **vencidas e pendentes** vêm limitadas às 500
        mais recentes por chamada; havendo mais, `overdueTruncated = true` (`totals` e o comprometido do dashboard continuam
        completos). **Movimentações com data futura (S-258):** cada movimentação ativa com data depois de hoje que muda o caixa é um
        item `SCHEDULED_TRANSACTION` (`refType: TRANSACTION`, `refId` = id da movimentação, `label` = descrição, `direction` pelo sentido do
        caixa) até a data chegar; ao realizar uma ocorrência de recorrência com data futura, a ocorrência pendente sai e a movimentação
        entra (nunca as duas). A fatura e a dívida que ela quita já têm o saldo abatido, então o total de saídas não muda.
      parameters:
        - name: from
          in: query
          description: 'De 2000-01-01 a 2100-12-31.'
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: 'De 2000-01-01 a 2100-12-31; no máximo 3 anos depois de `from`.'
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Compromissos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upcoming'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

