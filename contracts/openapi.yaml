        kind:
          $ref: '#/components/schemas/CommitmentKind'
        name:
          type: string
          minLength: 1
          maxLength: 100
        counterparty:
          type: [string, 'null']
          maxLength: 100
        notes:
          type: [string, 'null']
          maxLength: 1000
        total:
          type: [string, 'null']
          description: Só no projeto; tem de fechar com Σ do cronograma.
        installmentsTotal:
          type: [integer, 'null']
          minimum: 1
        installmentsPaid:
          type: [integer, 'null']
          minimum: 0
        paidAmount:
          type: [string, 'null']
        nextDueDate:
          type: [string, 'null']
          format: date
        schedule:
          type: [array, 'null']
          maxItems: 120
          items:
            $ref: '#/components/schemas/CommitmentItemInput'
    CommitmentPayInput:
      type: object
      required: [paidOn, version]
      additionalProperties: false
      properties:
        paidOn:
          type: string
          format: date
        version:
          type: integer
          format: int64
    CommitmentProgressInput:
      type: object
      required: [installmentsPaid, version]
      additionalProperties: false
      properties:
        installmentsPaid:
          type: integer
          minimum: 0
        paidAmount:
          type: [string, 'null']
        nextDueDate:
          type: [string, 'null']
          format: date
        notes:
          type: [string, 'null']
          maxLength: 1000
        name:
          type: [string, 'null']
          maxLength: 100
          description: Opcional; nulo não muda (corrigir o nome).
        counterparty:
          type: [string, 'null']
          maxLength: 100
          description: Opcional; nulo não muda (corrigir a titularidade, por exemplo "Titular a confirmar").
        version:
          type: integer
          format: int64
    ThirdPartyExpenseInput:
      type: object
      required: [transactionId, personId]
      additionalProperties: false
      properties:
        transactionId:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        note:
          type: [string, 'null']
          maxLength: 200
        amount:
          type: [string, 'null']
          description: Parte reembolsável já comprovada (padrão `null` = o valor cobrado da compra, inclusive as parcelas futuras). Entre 0,01 e o valor cobrado.
    ThirdPartyReceiptInput:
      type: object
      required: [personId, amount]
      additionalProperties: false
      properties:
        personId:
          type: string
          format: uuid
        transactionId:
          type: [string, 'null']
          format: uuid
          description: Despesa marcada como de terceiro, ou compra de cartão rateada, da mesma pessoa, à qual o recebimento se liga; ausente = sem vínculo ("origem a confirmar").
        amount:
          $ref: '#/components/schemas/AmountInput'
        accountId:
          type: [string, 'null']
          format: uuid
          description: |
            **Opcional.** Com ele (conta `CASH` que recebeu o dinheiro): `ACCOUNT +X / RECEIVABLE −X`, `settlement = ACCOUNT`. Sem ele, em
            compra rateada: `RECEIVABLE −X / EQUITY +X`, `settlement = ALREADY_IN_BALANCE` ("já está no saldo", sem movimento de conta). Nunca
            renda nem redução de consumo (ADR-022). Sem `accountId` e **com** `transactionId` de compra rateada, vale o modo "já no saldo" (exige
            `Idempotency-Key`); sem `accountId` e sem vínculo, ou com despesa marcada (legado), é o registro informativo (`ledgerEffect = NONE`). `accountId`
            com `transactionId` que não é de compra rateada nem despesa marcada → `422 THIRD_PARTY_EXPENSE_INVALID`.
        receivedOn:
          type: [string, 'null']
          format: date
        note:
          type: [string, 'null']
          maxLength: 200
    ThirdPartyReceiptSettlement:
      type: string
      description: |
        Como o recebimento foi contabilizado (ADR-022). `ACCOUNT` = moveu uma conta (`ACCOUNT +X / RECEIVABLE −X`). `ALREADY_IN_BALANCE` = o dinheiro já
        estava no saldo. O efeito no razão está em `ThirdPartyReceipt.ledgerEffect`: em compra rateada `RECEIVABLE −X / EQUITY +X` (`EQUITY_OFFSET`); no
        recebimento legado (marca ou sem vínculo) nada é lançado (`NONE`).
      enum: [ACCOUNT, ALREADY_IN_BALANCE]
    ThirdPartyReceiptLedgerEffect:
      type: string
      description: |
        `ACCOUNT_MOVEMENT` = `ACCOUNT +X / RECEIVABLE −X`. `EQUITY_OFFSET` = `RECEIVABLE −X / EQUITY +X` (patrimônio cai X; fonte de posting
        `THIRD_PARTY_RECEIPT_IN_BALANCE`). `NONE` = só registro informativo, nada no razão.
      enum: [ACCOUNT_MOVEMENT, EQUITY_OFFSET, NONE]
    ThirdPartyReceipt:
      type: object
      required: [id, personId, transactionId, amount, receivedOn, note, settlement]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        settlement:
          $ref: '#/components/schemas/ThirdPartyReceiptSettlement'
        ledgerEffect:
          $ref: '#/components/schemas/ThirdPartyReceiptLedgerEffect'
        transactionId:
          type: [string, 'null']
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
        receivedOn:
          type: [string, 'null']
          format: date
        note:
          type: [string, 'null']
    ShareMigrationApplyInput:
      type: object
