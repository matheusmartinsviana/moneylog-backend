NG_BALANCE`, `CARD_INVALID_BILLING_DAY`, `CARD_INVALID_LIMIT`, `CARD_INVALID_INSTALLMENT_COUNT`, `CARD_NO_INSTALLMENTS_TO_CANCEL`, `CARD_NAME_REQUIRED`, `CARD_NAME_TOO_LONG`, `CARD_INSTITUTION_TOO_LONG`, `CARD_BRAND_TOO_LONG` (bandeira acima do limite), `CARD_FIELD_REQUIRED`, `CARD_BILLING_CHANGE_NOT_CONFIRMED`, `INVOICE_NOT_PAYABLE`, `INVOICE_PAID`, `INVOICE_DOCUMENT_AMOUNT_INVALID` (2.37.0: valor do documento da fatura negativo ou fora de BRL), `INVOICE_CLOSED_REQUIRES_LATE_ENTRY`, `TRANSACTION_IN_CLOSED_INVOICE`, `TRANSACTION_NOT_CANCELABLE`, `MONEY_INVALID_ALLOCATION` (valor menor que o número de parcelas em centavos); **pessoas, dívidas e recorrências (Etapa 4)**: `PERSON_NAME_REQUIRED`, `PERSON_ARCHIVED`, `PERSON_ALREADY_ARCHIVED`, `PERSON_NOT_ARCHIVED`, `DEBT_FIELD_REQUIRED`, `DEBT_DESCRIPTION_TOO_LONG`, `DEBT_INVALID_PRINCIPAL`, `DEBT_DIRECTION_MISMATCH`, `DEBT_SETTLEMENT_EXCEEDS_OUTSTANDING`, `DEBT_CLOSED`, `DEBT_HAS_SETTLEMENTS`, `DEBT_ALREADY_HAS_ORIGIN`, `DEBT_ALREADY_SETTLED`, `DEBT_HAS_ORIGIN_TRANSACTION`, `DEBT_REASON_REQUIRED`, `DEBT_REASON_TOO_LONG`, `DEBT_CATEGORY_NOT_ALLOWED`, `SHARES_EXCEED_AMOUNT`, `SHARE_PERSON_ARCHIVED`, `SHARES_INVALID` (2.24.0: soma que não fecha, `personId` repetido, `AMOUNT` que não soma a parcela, ou rateio em recorrência que não é de cartão), `SHARES_BELOW_RECEIVED` (2.24.0: o novo devido de uma pessoa ficaria abaixo do que ela já pagou), `PURCHASE_GROUP_INVALID` (2.26.0: grupo sem membro, `remainingInstallments` acima de `totalInstallments`, nome vazio), `PURCHASE_GROUP_MEMBER_INVALID` (2.26.0: a compra não é parcelada de cartão, está estornada ou já pertence a outro grupo), `FX_RATE_REQUIRED` (2.27.0: moeda estrangeira sem `fxRate` ao confirmar a cobrança ou lançar a compra), `FX_INVALID` (2.27.0: câmbio zero ou negativo, `fxRate` ou `iofBps` com moeda `BRL`, `originalAmount` com `amount` divergente do calculado), `TAX_TABLE_UNAVAILABLE` (2.29.0: sem tabela de INSS ou IRRF vigente para a competência ou a data de pagame