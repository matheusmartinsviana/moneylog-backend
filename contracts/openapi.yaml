    get:
      tags: [Invoices]
      operationId: getInvoice
      summary: Consulta uma fatura (itens e pagamentos)
      description: |
        O `id` é determinístico (ADR-006, UUID v5 de cartão + fechamento): a fatura que ainda não recebeu item (a
        corrente vazia, por exemplo) responde `200` com `total` 0,00. Id de outro usuário, de outro cartão ou fora da
        janela [hoje − 24 meses, hoje + 36 meses] → `404 INVOICE_NOT_FOUND`. A janela é alargada para cobrir a cadeia
        inteira do cartão (da primeira à última fatura com movimento), então todo `id` devolvido por
        `GET /v1/cards/{id}/invoices` resolve aqui, inclusive as faturas vazias de uma lacuna maior que 24 meses.
      responses:
        '200':
          description: A fatura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/invoices/{id}/document-amount:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [Invoices]
      operationId: changeInvoiceDocumentAmount
      summary: Informa ou limpa o valor do documento da fatura
      description: |
        O dono preenche o valor que consta no documento (extrato) da fatura; `null` limpa. O valor é só de comparação e não altera `total`, saldo nem razão. A diferença
        para o `total` calculado aparece em `documentDivergence` e, acima de `documentDivergenceTolerance`, vira o alerta `DOCUMENT_DIVERGENCE`. Devolve a fatura atualizada.
        `version` é opcional: enviada e diferente de `documentVersion` → `409 VERSION_CONFLICT`. Valor negativo → `422 INVOICE_DOCUMENT_AMOUNT_INVALID`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceDocumentAmountInput'
      responses:
        '200':
          description: A fatura atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

