  # ---------------------------------------------------------------- Summaries (Etapa 5)
  /v1/summaries/{month}:
    get:
      tags: [Summaries]
      operationId: getMonthlySummary
      summary: Resumo do mês (PR 00 §32)
      description: |
        Calculado pelo backend sobre os **mesmos registros e calculadoras** do dashboard e da lista por competência (S-79): para o mesmo
        mês, `income`, `expenses` e `net` batem com `DashboardSummary.month` (`income`, `consumption`, `net`) e com `GET /v1/entries`
        (por construção, PR 01 regra 10). `income` = receitas da competência; `expenses` = consumo (despesas + crédito − reembolsos);
        `investments` = aplicações − resgates líquidos (linha própria, **fora** do consumo); `net` = `income` − `expenses` (S-23);
        `savingsRate` = `net / income` com 4 casas (`null` se `income` = 0); `largestCategory` = categoria de maior consumo;
        `largestExpense` = maior lançamento de consumo da competência (a parcela, não a compra inteira); `card` = consumo no crédito do
        mês e `outstanding` das faturas que vencem no mês; `futureInstallments` = parcelas com competência depois do mês. `comparison`
        compara com o mês anterior (diferença absoluta e `percent` = diferença / |anterior| com 4 casas; `null` se a base for 0).
        Mês corrente: `partial: true`; mês futuro: `partial: true` e `isProjection: true` (só o que já existe).
        Mês fora do formato `AAAA-MM` ou da janela de 2000-01 a 2100-12 → `400 SUMMARY_MONTH_INVALID`.
      parameters:
        - name: month
          in: path
          required: true
          description: Competência `AAAA-MM`.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
            examples: ['2026-10']
        - $ref: '#/components/parameters/View'
      responses:
        '200':
          description: Resumo do mês.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlySummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------- Projections (Etapa 5)
  /v1/projections:
    get:
      tags: [Projections]
      operationId: getProjection
      summary: Projeção determinística (sempre uma projeção, nunca uma certeza)
      description: |
        Série mensal de `em contas + entradas previstas − saídas previstas` (compromissos: faturas com as parcelas, dívidas com data,
        recorrências pendentes e movimentações ativas com data futura, `SCHEDULED_TRANSACTION`, S-258; cada compromisso uma vez só), do mês de hoje ao mês do fim do `horizon` (`D30` e `D90` = 30 e 90 dias;
        `M6` e `M12` = 6 e 12 meses; padrão `M6`). O 1º ponto traz os vencidos e o resto do mês corrente; o último termina no fim do
        horizonte, então o `balance` dele é igual a `DashboardSummary.projected` do mesmo horizonte. Reservas de metas **não são saída**
        (`goals` só informa). `isProjection` é sempre `true` e `assumptions` traz as premissas como chaves traduzíveis.
        **Tendência** (S-152): `includeTrend=true` acrescenta `trend`, uma série **separada e rotulada estimativa** (`estimate: true`) =
        média dos 3 meses completos anteriores do consumo novo (despesas de conta não recorrentes + a 1ª parcela ou compra à vista no
        cartão; nunca parcelas 2..N nem ocorrências de recorrência); a série base **não muda**. Com menos de 3 meses completos de
        histórico, **ou com algum desses 3 meses sem nenhum lançamento de consumo novo** (mês vazio no meio do histórico, S-262),
        `trend.available = false` e `trend.reason = INSUFFICIENT_HISTORY` (não inventa média). Desligada por padrão.
      parameters:
        - name: horizon
          in: query
          schema:
            $ref: '#/components/schemas/ProjectionHorizon'
        - name: includeTrend
          in: query
          description: Liga a tendência histórica (estimativa separada da série base). Padrão `false`.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: A projeção.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Projection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------- Exports (Etapa 5)
  /v1/exports/transactions.csv:
    get:
      tags: [Exports]
      operationId: exportTransactionsCsv
      summary: Exporta as movimentações em CSV
      description: |
        Mesmos filtros de `GET /v1/transactions` (sem paginação) mais `includeVoided`. UTF-8 **com BOM**, separador `;`, fim de linha
        `CRLF`, valor com vírgula decimal e sem milhar (`1234,50`), datas ISO. **Uma linha por movimentação** (a compra em 6x aparece uma
        vez, com o valor inteiro). Colunas: data, tipo, descrição, categoria, conta/cartão (`origem > destino` nas transferências), método,
        valor, status, **direção** (9ª coluna, aditiva, S-261: `Aplicação`/`Resgate` no `INVESTMENT` e `Crédito`/`Débito` no `ADJUSTMENT`,
        `Contribution`/`Redemption`/`Credit`/`Debit` em inglês; vazia nos demais tipos, em que o valor, sempre positivo, já basta) e
        **competência da renda** (10ª coluna, aditiva, ADR-017: `AAAA-MM` quando a receita pertence a outro mês que o da data; vazia nas demais linhas). O
        cabeçalho **e os valores de tipo, método, status e direção** seguem `Accept-Language` (português por padrão; `en` em inglês),
        por exemplo `Despesa`/`Pix`/`Ativa` ou `Expense`/`Pix`/`Active`. Texto que começa com `=`, `+`, `-`, `@`,
        tabulação ou retorno de carro recebe um `'` na frente (proteção contra injeção de fórmula). Estornadas só com `status=VOIDED` ou
        `includeVoided=true`; o `status` explícito vale mais que `includeVoided` (`status=ACTIVE&includeVoided=true` devolve só as ativas).
        Resposta em download (`Content-Disposition: attachment`), `Cache-Control: no-store`. O download no front usa `Blob` com o
        `Authorization` (não um link direto). **Limites (S-260):** no máximo **200.000 movimentações** por arquivo; acima, `422 EXPORT_TOO_LARGE`
        (nada é escrito; reduza o período ou o filtro). No máximo 6 pedidos de exportação por usuário por minuto (CSV e backup somam);
        acima, `429 TOO_MANY_ATTEMPTS` com `Retry-After`.
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/TransactionType'
        - name: accountId
          in: query
          schema:
            type: string
            format: uuid
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: method
          in: query
          schema:
            $ref: '#/components/schemas/PaymentMethod'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TransactionStatus'
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
        - name: includeVoided
          in: query
          description: Inclui as estornadas (ativas e estornadas); sem efeito quando `status` é informado. Padrão `false`.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: O arquivo CSV.
          headers:
            Content-Disposition:
              description: '`attachment; filename="moneylog-transactions[-AAAA-MM-DD_AAAA-MM-DD].csv"`.'
              schema:
                type: string
            Cache-Control:
              description: '`no-store`.'
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/exports/backup:
    get:
      tags: [Exports]
      operationId: exportBackup
      summary: Backup completo dos dados do usuário (JSON)
      description: |
        Todas as contas, categorias, cartões, movimentações (com parcelas e rateio), dívidas, pessoas, recorrências, metas (com reservas), ativos,
        perfis de renda, compromissos, grupos de compra, marcas e recebimentos de terceiros e os lançamentos do razão, versionado por `schemaVersion`. **Nunca** traz hash de senha, refresh token, chave de idempotência nem
        segredo. A soma dos `ledgerPostings` ativos do livro `ACCOUNT` de uma conta (até hoje) fecha com o `currentBalance` da API. A
        restauração por API é `POST /v1/backups/restore` (a de desastre segue por `pg_dump`, runbook da Etapa 9). Download, `Cache-Control: no-store`. O dia do nome do
        arquivo é o do usuário (`America/Sao_Paulo`, S-261). **Limites (S-260):** no máximo **200.000 movimentações**; acima,
        `422 EXPORT_TOO_LARGE`. No máximo 6 pedidos de exportação por usuário por minuto; acima, `429 TOO_MANY_ATTEMPTS` com `Retry-After`.
        Não traz `realizedDates` das recorrências nem `createdAt`/`version` (deriváveis das movimentações; a restauração os lê de `occurrenceDate`).
        `schemaVersion` 2 (2.33.0) acrescenta os campos novos e as listas de ativos, renda, compromissos, grupos de compra e terceiros; o 1 é só lido na restauração.
        Restaura-se com `POST /v1/backups/restore`.
      responses:
        '200':
          description: O backup.
          headers:
            Content-Disposition:
              description: '`attachment; filename="moneylog-backup-AAAA-MM-DD.json"`.'
              schema:
                type: string
            Cache-Control:
              description: '`no-store`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/backups/restore:
    post:
      tags: [Exports]
      operationId: restoreBackup
      summary: Restaura um backup (versão 1 ou 2) em conta sem dados financeiros
      description: |
        Lê o JSON de `GET /v1/exports/backup` e grava tudo ou nada (uma transação), na ordem das chaves estrangeiras: categorias, contas, cartões, pessoas, dívidas,
        recorrências, movimentações (parcelas, rateio, câmbio), razão, aplicações de consignado, metas, ativos, perfis de renda, grupos de compra, compromissos e terceiros.
        O razão restaurado é o do arquivo e a abertura das contas é recalculada dela; os saldos fecham com os do arquivo. Os `id` do arquivo são mantidos.
        **Só** em conta sem dados financeiros (sem contas, cartões, pessoas, movimentações, dívidas, recorrências, metas, ativos, perfis, compromissos, grupos, terceiros,
        regras nem importações e sem categoria própria); as categorias de sistema recém-criadas são trocadas pelas do arquivo e as que faltarem são recriadas.
        `schemaVersion` 1 é lido (o que não existia vem com o padrão do servidor); fora de 1 e 2 → `422 BACKUP_SCHEMA_UNSUPPORTED`. Arquivo ilegível, com referência para algo
        que não está nele, com razão que não fecha ou com campo inválido → `422 BACKUP_INVALID`. Conta com dados → `409 RESTORE_TARGET_NOT_EMPTY`; `id` que já existe
        (inclusive de outro usuário, sem dizer de quem) → `409 RESTORE_CONFLICT`. Origem `IMPORT` volta como `MANUAL`; fotos de metas ficam fora. O corpo cabe no limite de
        JSON do servidor (`moneylog.web.max-json-body-bytes`, 1 MiB por padrão: `413 PAYLOAD_TOO_LARGE` acima). Mesmo limite de pedidos da exportação (`429 TOO_MANY_ATTEMPTS`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Backup'
      responses:
        '200':
          description: O que foi restaurado.
          headers:
            Cache-Control:
              description: '`no-store`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Corpo acima do limite de JSON do servidor (`PAYLOAD_TOO_LARGE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------- Redesign (2.6.0): relatórios e busca global
  /v1/reports/income-expenses:
    get:
      tags: [Reports]
      operationId: getIncomeExpenseSeries
      summary: Série de entradas e saídas por período (resultado, não caixa)
      description: |
        **Leitura do razão ativo nos livros `INCOME` (receita) e `EXPENSE` (consumo), agrupada pela data efetiva do lançamento** (não pela
        data da movimentação: a compra de 1.200,00 em 6x tem 200,00 em cada mês, nunca 1.200,00 num dia só). É a mesma regra do
        dashboard, de `GET /v1/entries` e do resumo mensal (PR 01, regra 10), sem classificação própria: a soma dos pontos `DAY` de um mês
        civil inteiro é igual ao ponto `MONTH` dele e a `DashboardSummary.month.income` e `month.consumption` daquele mês.

        **Fora da série** (não estão nesses dois livros): pagamento de fatura (a compra já contou no consumo; contar o pagamento seria dupla
        contagem), transferência, aplicação e resgate, ajuste de saldo, empréstimo concedido ou recebido, quitação de dívida, movimentação
        estornada e saldo inicial. **Dentro:** receita, despesa à vista, cada parcela de cartão no dia dela, reembolso (abate na categoria
        original) e consumo de dívida (S-137). Despesa dividida entra só a parte de consumo.

        `net` = `income` − `expenses` (S-23): é o **resultado do período** (receita menos consumo), **não** a variação do saldo nem o
        `month.cashFlow` do dashboard (que soma o efeito nas contas e inclui fatura paga e aplicação). `expenses` pode ser **negativo**
        (um dia só com reembolso).

        **Janelas** (dia do usuário = `asOf` do dashboard, `America/Sao_Paulo`; o front não faz aritmética de datas): `D7` = de hoje−6 a
        hoje e `D30` = de hoje−29 a hoje, um ponto por dia (`DAY`, `basis` `DATE`); `M3` = de hoje−3 meses (mesmo dia, limitado ao último dia
        do mês) a hoje, um ponto por semana de segunda a domingo (`WEEK`, `basis` `DATE`), cada balde **recortado** na janela (o primeiro
        começa em `from`, o último termina em hoje; 13 a 15 pontos); `M12` = 12 competências terminando na corrente, um ponto por mês
        (`MONTH`, `basis` `COMPETENCE`, que é o mês da data efetiva: o rótulo não indica divergência). A série é densa (zeros incluídos).
        `totals` é a soma exata dos pontos.

        **Futuro:** `DAY` e `WEEK` terminam hoje (lançamento datado depois de hoje não aparece; projeção é `GET /v1/projections`). O ponto
        `MONTH` do **mês corrente é a competência inteira**, igual ao `month.*` do dashboard, que inclui lançamentos já agendados dentro do
        mês; por isso `to` é o último dia do mês corrente em `M12` e o ponto leva `partial: true`. `partial` = o balde contém hoje.

        `period` ausente ou desconhecido → `400 REPORT_PERIOD_INVALID`. Sem lançamentos → série de zeros. Leitura num instantâneo só
        (`REPEATABLE_READ` somente leitura); `Cache-Control: private, no-store`.
      parameters:
        - name: period
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ReportPeriod'
        - $ref: '#/components/parameters/View'
      responses:
        '200':
          description: A série.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeExpenseSeries'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/reports/spending-by-category:
    get:
      tags: [Reports]
      operationId: getSpendingByCategory
      summary: Consumo do mês por categoria, com a participação de cada uma
      description: |
        Consumo (`CONSUMPTION`, as mesmas regras de `GET /v1/entries` com `lens=CONSUMPTION`) por categoria na competência `month` (padrão: a
        de hoje). Reembolso abate **na categoria dele**; consumo de dívida (S-137) entra na categoria da dívida. `total` é o consumo líquido do
        mês e **é igual** a `DashboardSummary.month.consumption`, a `MonthlySummary.expenses` e a `EntrySlice.totals.total` do mesmo mês.

        `base` = soma das categorias com valor líquido **positivo** (os `items` mais `other`); é o divisor de `share`. Categoria com valor
        líquido ≤ 0 (reembolso de outro mês) **não** entra nos itens nem em `other`, então `base` pode ser maior que `total`: o front **não**
        subtrai nem recalcula. `items` = as `limit` maiores categorias positivas em ordem decrescente (empate por nome sem diferenciar caixa,
        depois id); `other` = soma das **demais** categorias positivas (não soma de novo o que já está nos itens; `null` se não houver).
        `share` = `amount` ÷ `base` com 4 casas, `HALF_UP`, **arredondado no backend**: a soma dos `share` pode ficar até
        `(itens + 1) × 0,00005` longe de `1.0000` (três categorias iguais dão `0.3333` cada, soma `0.9999`) e o front não normaliza. `share`
        é `null` se `base` ≤ 0 (então `items` é `[]`).

        `month` fora do formato `AAAA-MM` ou da janela 2000-01 a 2100-12 → `400 REPORT_MONTH_INVALID`; `limit` fora de 1 a 10 → `400
        VALIDATION_FAILED`. Sem consumo → `items: []`, `other: null`, `base` e `total` zerados. Leitura num instantâneo só;
        `Cache-Control: private, no-store`.
      parameters:
        - name: month
          in: query
          description: Competência `AAAA-MM` (padrão a de hoje).
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
            examples: ['2026-10']
        - name: limit
          in: query
          description: Quantas categorias antes de `other` (1 a 10).
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
        - $ref: '#/components/parameters/View'
      responses:
        '200':
          description: As categorias de maior consumo.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendingByCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/search:
    get:
      tags: [Search]
      operationId: globalSearch
      summary: Busca global (movimentações, contas, categorias, cartões e notas)
      description: |
        Só dados do usuário autenticado. A busca **não diferencia acento nem maiúsculas** (`unaccent`) e os caracteres `%`, `_` e `\` são
        **literais** (não são curingas). `q` é aparado e tem de 2 a 100 caracteres; qualquer caractere de controle (inclusive NUL) →
        `400 SEARCH_QUERY_INVALID`. `limit` vale **por grupo** (1 a 8, padrão 5).

        Movimentações: só `ACTIVE`, pela descrição; contas: nome e instituição; categorias: nome; cartões: nome e instituição; **notas: só
        título e caminho** (o corpo não é varrido: a busca de corpo é lenta e aqui roda a cada pausa de digitação; para isso use
        `GET /v1/notes?q`). Contas, categorias e cartões **arquivados** vêm por último no grupo, marcados (`status`/`archived`). **Ordem
        determinística por grupo:** movimentações por `date` desc, `createdAt` desc, `id` desc (a mesma da lista); contas, categorias e
        cartões por nome (sem acento nem caixa) e `id`; notas por `updatedAt` desc e `id`. Nenhum total ou saldo agregado.

        `snippet` da nota é **texto puro** (nunca Markdown nem HTML): o início do corpo com espaços e quebras colapsados e sem caracteres de
        controle, com até 160 caracteres; o front o exibe como texto, jamais como Markdown.

        Cada grupo tem um limite de tempo de leitura (3 s): se estourar, a resposta é `200` com o grupo vazio e o nome dele em
        `truncated` (nunca `500`). `Cache-Control: private, no-store`; o termo `q` **não** é gravado em log. No máximo **120 pedidos por
        minuto por usuário**; acima, `429 TOO_MANY_ATTEMPTS` com `Retry-After`. Leitura num instantâneo só.
      parameters:
        - name: q
          in: query
          required: true
          description: Termo (2 a 100 caracteres, aparado, sem caractere de controle).
          schema:
            type: string
        - name: limit
          in: query
          description: Itens por grupo (1 a 8).
          schema:
            type: integer
            minimum: 1
            maximum: 8
            default: 5
      responses:
        '200':
          description: Os resultados por grupo.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------- Etapa 6: vault de notas Markdown (ADR-009)
  /v1/notes:
    get:
      tags: [Notes]
      operationId: listNotes
      summary: Lista e busca as notas (sem o corpo)
      description: |
        Nunca devolve o corpo (`GET /v1/notes/{id}` devolve). Sem `q`, as mais recentes primeiro. Com `q` (até 200 caracteres, sem caractere de
        controle), busca em título, caminho e corpo **sem diferenciar caixa nem acento** (`unaccent` + `ILIKE`, S-163); `%`, `_` e `\` do
        termo são literais. `sort=RELEVANCE` (padrão com `q`) ordena título, depois caminho, depois corpo, e então a data. O `snippet` é um
        trecho de **texto puro** (nunca HTML) de até 160 caracteres com o termo. `tag` casa a tag normalizada (minúsculas, sem acento);
        `folder` filtra a pasta e as subpastas; `linkedType` + `linkedId` (ou `linkedKey` no `MONTHLY_SUMMARY`) filtra as notas ligadas à
        entidade. A **lixeira só aparece com `status=TRASHED`** (S-161); nota na lixeira nunca entra na busca padrão.
        A busca de texto tem **limite de tempo de 10 s**: acima disso `422 NOTE_SEARCH_TIMEOUT` (use um termo mais específico ou filtre por pasta
        ou tag).
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: tag
          in: query
          schema:
            type: string
            maxLength: 64
        - name: folder
          in: query
          description: Pasta (`reviews`); inclui as subpastas.
          schema:
            type: string
            maxLength: 255
        - name: linkedType
          in: query
          schema:
            $ref: '#/components/schemas/NoteLinkType'
        - name: linkedId
          in: query
          description: Obrigatório com `linkedType` (exceto `MONTHLY_SUMMARY`).
          schema:
            type: string
            format: uuid
        - name: linkedKey
          in: query
          description: Obrigatório com `linkedType=MONTHLY_SUMMARY` (`AAAA-MM`).
          schema:
            type: string
            maxLength: 7
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/NoteStatus'
        - name: sort
          in: query
          schema:
            $ref: '#/components/schemas/NoteSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de notas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteSummarySlice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Notes]
      operationId: createNote
      summary: Cria uma nota
      description: |
        `path` é o caminho no vault (`reviews/2026-10.md`): até 255 caracteres e 10 níveis, extensão `.md`, sem `..`, sem `/` inicial, sem
        `\`, sem controle nem caracteres que o Windows ou o wikilink não aceitam (`<>:"|?*#^[]`), sem segmento oculto e sem nome reservado do
        Windows (`NOTE_PATH_INVALID`); único **sem diferenciar maiúsculas** entre as notas ativas (`NOTE_PATH_TAKEN`). `body` é o texto
        Markdown como o usuário o escreveu (frontmatter incluído), até **200 KB** em UTF-8 (`NOTE_TOO_LARGE`), com quebra de linha e
        tabulação mas sem outro caractere de controle. **O backend nunca renderiza nem altera o Markdown** (nenhum HTML é interpretado ou
        removido): o front o exibe sem HTML bruto (ADR-009). A chave `moneylog` do frontmatter é reservada (`NOTE_FRONTMATTER_RESERVED`);
        só é frontmatter o bloco `---...---` fechado cujo conteúdo é um mapa YAML válido e seguro: qualquer outro texto que comece com `---`
        (régua horizontal, lista, YAML quebrado, `!!tag`, âncora, acima de 64 KB) é **corpo** e é guardado como foi escrito. Título = `title`
        do frontmatter ou o nome do arquivo (o `title` não pode ter caractere de controle, de formatação/bidi nem quebra de linha:
        `422 TEXT_INVALID_CHARACTERS`; acima de 255 caracteres é cortado por ponto de código); `tags` vêm de
        `tags:` do frontmatter e de `#tag` no corpo fora de código (no máximo 100 no conjunto, frontmatter primeiro); o texto com mais de
        **500 wikilinks distintos** é recusado (`422 NOTE_LINK_LIMIT_REACHED`): nenhum link fica sem índice; os `[[wikilinks]]` são resolvidos pelo **nome do arquivo** (S-158).
        `links` são vínculos explícitos (S-160), validados contra o usuário. Limite de 5.000 notas por usuário, a lixeira inclusa
        (`NOTE_LIMIT_REACHED`). `Idempotency-Key` opcional (escopo `POST /v1/notes`, 24 h).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteInput'
      responses:
        '201':
          description: Nota criada (versão 0).
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/notes/tags:
    get:
      tags: [Notes]
      operationId: listNoteTags
      summary: Tags das notas ativas com a contagem
      description: Da mais usada para a menos usada. Só conta notas fora da lixeira.
      responses:
        '200':
          description: As tags.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NoteTagCount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/notes/trash:
    delete:
      tags: [Notes]
      operationId: emptyNoteTrash
      summary: Esvazia a lixeira
      description: |
        **Única exclusão definitiva do vault**, sempre uma ação explícita (S-161, "nada é apagado em silêncio"): apaga de vez as notas que
        já estão na lixeira do usuário e os vínculos delas. Nunca toca nenhuma entidade financeira. Sem notas na lixeira, também `204`.
      responses:
        '204':
          description: Lixeira esvaziada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/notes/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Notes]
      operationId: getNote
      summary: Consulta uma nota (com o corpo)
      description: Também devolve a nota que está na lixeira (`trashedAt` preenchido). É o **único** endpoint que traz o `body`.
      responses:
        '200':
          description: A nota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Notes]
      operationId: updateNote
      summary: Edita o texto da nota
      description: |
        Troca o texto; tags, título e wikilinks são recalculados e os vínculos explícitos ficam. `version` desatualizada →
        `409 VERSION_CONFLICT`. Nota na lixeira → `422 NOTE_TRASHED`. Mesmas regras de texto do `POST`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteUpdate'
      responses:
        '200':
          description: Nota atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/notes/{id}/move:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Notes]
      operationId: moveNote
      summary: Renomeia ou move a nota, reescrevendo os wikilinks
      description: |
        Na **mesma transação** reescreve o alvo dos wikilinks das outras notas que apontavam para **esta** nota (`[[2026-10]]` →
        `[[outubro]]`, `[[reviews/2026-10|alias]]` → `[[reviews/outubro|alias]]`), preservando alias, seção e embed, sem tocar código e sem
        mexer nos links da nota de mesmo nome em outra pasta (S-158). Se o nome novo ficaria ambíguo, o link vira o caminho completo.
        `rewrittenNotes` lista as notas cujo texto mudou. Falha em qualquer nota desfaz tudo. `version` desatualizada → `409`; caminho
        ocupado → `422 NOTE_PATH_TAKEN`; mesmo caminho → `200` sem mudança.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteMove'
      responses:
        '200':
          description: A nota movida e as notas reescritas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteMoved'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/notes/{id}/trash:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Notes]
      operationId: trashNote
      summary: Manda a nota para a lixeira
      description: |
        Sai da lista padrão, da busca e dos backlinks; os wikilinks que apontavam para ela ficam pendentes e voltam a resolver se ela for
        restaurada. Já na lixeira → `422 NOTE_ALREADY_TRASHED`.
      responses:
        '200':
          description: A nota, com `trashedAt`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/notes/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Notes]
      operationId: restoreNote
      summary: Restaura a nota da lixeira
      description: Caminho ocupado por outra nota ativa → `422 NOTE_PATH_TAKEN` (a nota segue na lixeira; o usuário renomeia ou move a nota que ocupa o caminho e tenta de novo). Fora da lixeira → `422 NOTE_NOT_TRASHED`.
      responses:
        '200':
          description: A nota restaurada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/notes/{id}/backlinks:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Notes]
      operationId: listNoteBacklinks
      summary: Notas que apontam para esta
      description: |
        Notas **ativas** que apontam para a nota por wikilink resolvido ou por vínculo explícito `NOTE`, **uma por nota de origem** (sem
        duplicar), com o trecho de contexto de até 160 caracteres (texto puro; `null` no vínculo explícito). Nota na lixeira não aparece.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de backlinks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacklinkSlice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/notes/{id}/links:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [Notes]
      operationId: setNoteLinks
      summary: Troca os vínculos explícitos da nota
      description: |
        Substitui **todos** os vínculos explícitos (`origin = EXPLICIT`); os `WIKILINK` do corpo não mudam. Cada alvo precisa existir e ser
        **do usuário** (`422 NOTE_LINK_TARGET_NOT_FOUND`); transação estornada, meta arquivada e dívida cancelada continuam sendo alvos
        válidos (S-164). `MONTHLY_SUMMARY` usa `key` `AAAA-MM` de 2000-01 a 2100-12 (`2026-13` → `422 NOTE_LINK_INVALID`); os demais tipos
        usam `id`. Até 100 vínculos (`NOTE_LINK_LIMIT_REACHED`). Vínculos pendentes (vindos de importação) não são reenviáveis: omiti-los
        os remove. Nota na lixeira → `NOTE_TRASHED`; `version` desatualizada → `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteLinksUpdate'
      responses:
        '200':
          description: A nota com os vínculos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/links:
    get:
      tags: [Notes]
      operationId: listNotesLinkedTo
      summary: Notas ligadas a uma entidade
      description: |
        Para o bloco "Notas vinculadas" das telas financeiras. Só notas ativas, mais recentes primeiro. `targetType` com `targetId`, ou
        `MONTHLY_SUMMARY` com `targetKey` (`AAAA-MM`). `targetType=NOTE` equivale aos backlinks da nota (wikilink ou vínculo explícito). Um
        alvo que não existe devolve a lista vazia.
      parameters:
        - name: targetType
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/NoteLinkType'
        - name: targetId
          in: query
          schema:
            type: string
            format: uuid
        - name: targetKey
          in: query
          schema:
            type: string
            maxLength: 7
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
