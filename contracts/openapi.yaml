  /v1/third-party-expenses/share-migration/apply:
    post:
      tags: [Debts]
      operationId: applyShareMigration
      summary: Aplica a migração aprovada no dry-run (idempotente pelo hash)
      description: |
        Exige o `reportHash` do dry-run e `backupConfirmed = true`. Se os dados mudaram desde o dry-run → `409 SHARE_MIGRATION_REPORT_MISMATCH` (gere o
        relatório de novo); `backupConfirmed` falso → `422 SHARE_MIGRATION_BACKUP_REQUIRED`; nada elegível → `422 SHARE_MIGRATION_NOTHING_TO_APPLY`.
        Repetir com o mesmo `reportHash` já aplicado devolve `alreadyApplied = true` e não grava de novo. Tudo ou nada, numa transação.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareMigrationApplyInput'
      responses:
