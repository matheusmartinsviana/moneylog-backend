    post:
      tags: [Debts]
      operationId: cancelDebt
      summary: Perdoa o saldo restante da dívida
      description: |
        Só `OPEN`/`PARTIALLY_SETTLED`: zera o saldo contra `EQUITY`, sem despesa nem receita (S-19). O perdão não pode ser
        desfeito (S-41). Sem motivo → `422 DEBT_REASON_REQUIRED`; `SETTLED` → `422 DEBT_ALREADY_SETTLED`; dívida já
        encerrada → `422 DEBT_CLOSED`.
      requestBody:
