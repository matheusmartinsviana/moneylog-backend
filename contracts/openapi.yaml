        label:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: '#/components/schemas/CommitmentItemType'
        dueDate:
          type: [string, 'null']
          format: date
        amount:
          $ref: '#/components/schemas/AmountInput'
        paid:
          type: boolean
          default: false
        paidOn:
          type: [string, 'null']
          format: date
    CommitmentInput:
      type: object
      required: [kind, name]
      additionalProperties: false
      properties:
        clauses:
          oneOf:
            - $ref: '#/components/schemas/CommitmentClausesInput'
            - type: 'null'
