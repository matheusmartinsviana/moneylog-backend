          format: int64

    # ---- Movimentações: entrada (um schema plano por tipo; entrada e edição repetem os campos de propósito, para o
    # `additionalProperties: false` valer sem depender de `allOf`)
    ExpenseInput:
      type: object
      description: Despesa paga de conta (`EXPENSE`).
      required: [type, amount, date, accountId]
      additionalProperties: false
      properties:
        nature:
          $ref: '#/components/schemas/TransactionNature'
        type:
          type: string
          const: EXPENSE
        amount:
          $ref: '#/components/schemas/AmountInput'
        date:
          type: string
          format: date
          description: Data financeira (no fuso do usuário).
        description:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: [string, 'null']
          maxLength: 2000
        accountId:
          type: string
          format: uuid
          description: Conta `CASH`.
        categoryId:
          type: string
          format: uuid
          description: Categoria `EXPENSE`.
        method:
          $ref: '#/components/schemas/PaymentMethod'
        shares:
          type: [array, 'null']
          description: |
            Divisão da despesa (S-40, S-137): cada parte é uma dívida `RECEIVABLE` cuja origem é esta despesa. Paguei 200,00 e o
            João me deve 100,00: caixa −200,00 (igual à linha do extrato), consumo 100,00, recebível +100,00. Σ das partes tem de
            ser **menor** que `amount` (`422 SHARES_EXCEED_AMOUNT`); pessoa arquivada → `422 SHARE_PERSON_ARCHIVED`.
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/ExpenseShareInput'
    IncomeInput:
      type: object
      description: Receita (`INCOME`). O campo `origin` de D2 §4.2 fica de fora (S-60).
      required: [type, amount, date, accountId]
      additionalProperties: false
      properties:
        type:
