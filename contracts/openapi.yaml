      tags: [Invoices]
      operationId: payInvoice
      summary: Paga uma fatura (inclusive parcial, antecipado e a maior)
      description: |
        Cria um `INVOICE_PAYMENT` (`CARD +X` / `ACCOUNT -X`, nenhum consumo) e devolve a **fatura atualizada**. Qualquer
        valor > 0 é aceito; o excedente vira `creditCarry` (S-16). `Idempotency-Key` obrigatório: a mesma chave e o
        mesmo corpo devolvem o mesmo resultado sem segundo pagamento. Fatura `FUTURE`/`PAID` →
        `422 INVOICE_NOT_PAYABLE`. O `INVOICE_PAYMENT` aparece também na lista de movimentações; para estornar, use
        `payments[].transactionId` em `POST /v1/transactions/{id}/void`.
      parameters:
