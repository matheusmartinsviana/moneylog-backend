  # ---------------------------------------------------------------- Transactions
  /v1/transactions:
    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: Lista de movimentações, visão registros (D1 §2.10)
      description: |
        Ordem `date desc, createdAt desc, id desc`. `totals` é calculado pelo backend sobre o **filtro inteiro** (não
        sobre a página) com as mesmas calculadoras do dashboard (S-79); o front exibe sem somar.

        - `totals.count`: número de movimentações **ativas** que casam com o filtro (S-80). Com `status=VOIDED`,
          `count` = 0 e `cashFlow` zerado, embora `items` traga as estornadas (o rodapé diz "estornadas não entram nos
          totais").
        - `totals.cashFlow` sem `accountId`: efeito líquido de cada movimentação nas contas `CASH` (transferência
          CASH → CASH = 0; aplicação = saída; saldo inicial fora), igual a `summary.month.cashFlow` quando o filtro é o
          mês inteiro. Com `accountId`: efeito só no livro daquela conta (S-63).
      parameters:
        - name: from
          in: query
          description: Primeira data (inclusive).
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Última data (inclusive).
          schema:
            type: string
            format: date
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/TransactionType'
        - name: accountId
          in: query
          schema:
            type: string
            format: uuid
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: method
          in: query
          schema:
            $ref: '#/components/schemas/PaymentMethod'
        - name: status
          in: query
          description: Padrão `ACTIVE`.
          schema:
            $ref: '#/components/schemas/TransactionStatus'
        - name: q
          in: query
          description: 'Busca na descrição, sem diferenciar maiúsculas de minúsculas. Os acentos contam: `cafe` não acha `Café`.'
          schema:
            type: string
            maxLength: 100
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de movimentações com totais.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSlice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Transactions]
      operationId: createTransaction
      summary: Registra uma movimentação
      description: |
        Aceita os tipos em conta (`EXPENSE`, `INCOME`, `TRANSFER`, `INVESTMENT`, `ADJUSTMENT`, `REFUND` com `accountId`,
        S-58), a compra no cartão (`CARD_PURCHASE`, S-134), o crédito no cartão (`REFUND` com `cardId`, T56) e, na Etapa 4, as
        movimentações de dívida: `LOAN_GIVEN` (emprestar; cria a dívida `RECEIVABLE`), `MONEY_RECEIVED` (devolução de uma
        `RECEIVABLE` ou captação, que cria uma `PAYABLE`; **nunca é receita**) e `DEBT_PAYMENT` (pagar uma `PAYABLE`), além da
        `EXPENSE` com `shares` (divisão de despesa). **`INVOICE_PAYMENT` só nasce por `POST /v1/invoices/{id}/payments`**: neste
        endpoint responde `422 TRANSACTION_TYPE_NOT_AVAILABLE`, embora apareça nas listas como `Transaction`. O `201` traz a
        `debt` (ou as `shares`) e o `impact` (empréstimo de 300,00: caixa −300,00, consumo vazio, patrimônio 0,00). O estorno de
        uma origem de dívida com quitação ativa responde `422 DEBT_HAS_SETTLEMENTS` (`voidable: false`, `voidBlockedBy:
        DEBT_HAS_SETTLEMENTS`); dívida perdoada → `422 DEBT_CLOSED`.

        O header `Idempotency-Key` é obrigatório (sem ele, `400`). A chave é gravada na mesma transação da criação:
        a mesma chave + o mesmo comando devolve `201` com o **estado atual** do mesmo recurso (clique duplo e reenvio
        não duplicam); a mesma chave + comando diferente → `409 IDEMPOTENCY_KEY_REUSED`. **Erros não são memorizados**:
        depois de um `4xx`/`5xx`, a mesma chave pode ser reenviada. Válida por 24 h.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionInput'
      responses:
        '201':
          description: Movimentação criada (ou replay da mesma chave).
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/transactions/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: Consulta uma movimentação (com `impact`)
      responses:
        '200':
          description: A movimentação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Transactions]
      operationId: updateTransaction
      summary: Edita uma movimentação
      description: |
        Mesmo corpo do `POST` do tipo + `version` (S-68). Muda tudo menos o `type` (`type` diferente →
        `422 TRANSACTION_NOT_EDITABLE`). Grava a versão anterior em `transaction_revisions` e troca os lançamentos do
        razão. Movimentação estornada ou que toca conta arquivada não é editável (`editable = false`).
        **Compra no cartão** (S-121, T57): o corpo é o do `POST` + `version`, mas só `description`, `categoryId` e `notes`
        mudam (as parcelas e os lançamentos de despesa mudam só de categoria); `amount`, `date`, `installments` ou `cardId`
        diferentes dos da compra → `422 TRANSACTION_NOT_EDITABLE` (o caminho é estornar, se nenhuma parcela estiver em
        fatura fechada, e lançar de novo, ou cancelar as parcelas restantes e registrar um reembolso). Compra com
        reembolso ativo não troca de categoria (`422 REFUND_CATEGORY_LOCKED`). Crédito no cartão e pagamento de fatura não
        são editáveis (`422 TRANSACTION_NOT_EDITABLE`).

        Despesa com reembolsos ativos: trocar a categoria → `422 REFUND_CATEGORY_LOCKED`; valor menor que a soma dos
        reembolsos ativos → `422 REFUND_EXCEEDS_ORIGINAL` (S-81). Editar um `REFUND` revalida a despesa de origem sem
        contar o próprio reembolso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionUpdate'
      responses:
        '200':
          description: Movimentação atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
