        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/imports/{id}/lines/{lineId}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: lineId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Imports]
      operationId: reviewImportLine
      summary: Decide uma linha (aceitar, rejeitar, forçar duplicata, transferência)
      description: |
        `ACCEPT` em linha `PENDING` ou `POSSIBLE_DUPLICATE` (nesta, "é outro lançamento"); `REJECT` em qualquer linha não final (em `POSSIBLE_DUPLICATE`,
        "é o mesmo lançamento manual"); `FORCE` **só** em `DUPLICATE`. `REJECT` também vale em linha `ACCEPTED` e `REOPEN` desfaz a aceitação
        (volta a `PENDING`, `POSSIBLE_DUPLICATE` ou `DUPLICATE`, o estado de origem), ambos enquanto o lote está em revisão. `REJECTED` é final
        (`422 IMPORT_LINE_INVALID_TRANSITION`). `categoryId` de outra pessoa/inexistente: `404 CATEGORY_NOT_FOUND`; de tipo errado ou arquivada:
        `422`. `asTransfer` é recusado com `422 IMPORT_TRANSFER_LEG_ALREADY_RECORDED` se a outra ponta já for entrada/saída ativa em outra conta
        (contaria em dobro; aceite a linha como está ou rejeite). `ACCEPT` exige
        categoria (a sugerida serve). `asTransfer` só em extrato de conta e em linha marcada `POSSIBLE_TRANSFER`: ao aplicar cria **uma** `TRANSFER`.
        `learn` grava uma regra (descrição normalizada → categoria) para as próximas sugestões.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportLinePatch'
      responses:
        '200':
          description: A linha atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportLine'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/imports/{id}/lines:bulk:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Imports]
      operationId: bulkReviewImportLines
      summary: Aceita ou rejeita várias linhas sem marca de decisão
      description: Só `ACCEPT` e `REJECT`. Linha que exige decisão, sem categoria sugerida ou fora do estado permitido volta em `skipped`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportBulkInput'
      responses:
        '200':
          description: Quantas mudaram e quais foram puladas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBulkResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/imports/{id}/apply:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Imports]
      operationId: applyImport
      summary: Aplica o lote (cria as movimentações das linhas aceitas)
      description: |
        Numa transação só, pelos **mesmos** caminhos da criação manual (`source: IMPORT`). Falha numa linha desfaz o lote inteiro
        (`422 IMPORT_APPLY_FAILED`, com a linha no texto). `422 IMPORT_LINES_REQUIRE_DECISION` se ainda há linha pedindo decisão;
        `422 IMPORT_NOTHING_TO_APPLY` sem linha aceita; `422 IMPORT_BATCH_NOT_PENDING` se o lote já foi aplicado. Com a mesma `Idempotency-Key` repetir devolve o
        mesmo resultado, sem duplicar.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '200':
          description: Lote aplicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportApplied'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/imports/{id}/undo:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Imports]
      operationId: undoImport
      summary: Desfaz o lote (estorna as movimentações, respeitando as guardas)
      description: |
        Estorna (`VOIDED`, nada é apagado) as movimentações ativas do lote. As que a guarda recusa (ex.: compra em fatura fechada) ficam em `blocked` e o
        lote vira `PARTIALLY_UNDONE`; repetir retoma o que faltou. Depois do desfazer a reimportação do mesmo arquivo volta a ser possível.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportUndoInput'
      responses:
        '200':
          description: Resultado do desfazer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportUndone'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

