    UnavailableTransactionInput:
      type: object
      description: |
        Tipos que existem no domínio mas ainda não têm fluxo (S-58): chegam ao caso de uso e respondem
        `422 TRANSACTION_TYPE_NOT_AVAILABLE`. `INVOICE_PAYMENT` só nasce por `POST /v1/invoices/{id}/payments`.
        (`LOAN_GIVEN`, `MONEY_RECEIVED` e `DEBT_PAYMENT` ganharam schemas próprios na Etapa 4.)
      required: [type]
      properties:
        type:
          type: string
          enum: [INVOICE_PAYMENT]
    UnavailableTransactionUpdate:
      type: object
      description: |
        Tipos sem edição por `PUT` (S-58): chegam ao caso de uso e respondem `422 TRANSACTION_NOT_EDITABLE`. A compra no
        cartão tem a edição limitada de S-121 (`CardPurchaseUpdate`).
      required: [type]
      properties:
        type:
          type: string
          enum: [INVOICE_PAYMENT, LOAN_GIVEN, MONEY_RECEIVED, DEBT_PAYMENT]
    TransactionInput:
      description: |
        Corpo do `POST /v1/transactions`, discriminado por `type`.

        **Mapa resposta → entrada (S-90).** A resposta `Transaction` usa nomes genéricos; o formulário de edição
        reconstrói a entrada assim:

        | `type` | `Transaction` (resposta) | `TransactionInput` (entrada) |
        |---|---|---|
        | todos | `amount.amount` | `amount` |
        | todos | `date`, `description`, `notes` | iguais |
        | `EXPENSE`, `INCOME` | `account.id`, `category.id`, `method` | `accountId`, `categoryId`, `method` |
        | `TRANSFER` | `account.id` (origem), `counterpartAccount.id` (destino) | `fromAccountId`, `toAccountId` |
        | `INVESTMENT` | `account.id` (conta CASH), `counterpartAccount.id` (conta de investimento), `direction` | `cashAccountId`, `investmentAccountId`, `direction` |
        | `ADJUSTMENT` | `account.id`, `direction`, `adjustmentKind`, `reason` | `accountId`, `direction`, `kind`, `reason` |
        | `REFUND` | `account.id` ou `card.id`, `category.id`, `refundOf.id` | `accountId` ou `cardId`, `categoryId`, `refundOfTransactionId` |
        | `CARD_PURCHASE` | `card.id`, `category.id`, `installments[].total` | `cardId`, `categoryId`, `installments` |
        | `LOAN_GIVEN`, `MONEY_RECEIVED`, `DEBT_PAYMENT` | `account.id`, `debt` | `accountId`, `newDebt` ou `debtId` (os de dívida não têm edição: estorne e lance de novo) |
        | `EXPENSE` dividida | `shares[]` (as dívidas que nasceram) | `shares[]` só na criação |
      oneOf:
        - $ref: '#/components/schemas/ExpenseInput'
        - $ref: '#/components/schemas/IncomeInput'
        - $ref: '#/components/schemas/TransferInput'
        - $ref: '#/components/schemas/InvestmentInput'
        - $ref: '#/components/schemas/AdjustmentInput'
        - $ref: '#/components/schemas/RefundInput'
        - $ref: '#/components/schemas/CardPurchaseInput'
        - $ref: '#/components/schemas/LoanGivenInput'
        - $ref: '#/components/schemas/MoneyReceivedInput'
        - $ref: '#/components/schemas/DebtPaymentInput'
        - $ref: '#/components/schemas/UnavailableTransactionInput'
      discriminator:
        propertyName: type
        mapping:
          EXPENSE: '#/components/schemas/ExpenseInput'
          INCOME: '#/components/schemas/IncomeInput'
          TRANSFER: '#/components/schemas/TransferInput'
          INVESTMENT: '#/components/schemas/InvestmentInput'
          ADJUSTMENT: '#/components/schemas/AdjustmentInput'
          REFUND: '#/components/schemas/RefundInput'
          CARD_PURCHASE: '#/components/schemas/CardPurchaseInput'
          INVOICE_PAYMENT: '#/components/schemas/UnavailableTransactionInput'
          LOAN_GIVEN: '#/components/schemas/LoanGivenInput'
          MONEY_RECEIVED: '#/components/schemas/MoneyReceivedInput'
          DEBT_PAYMENT: '#/components/schemas/DebtPaymentInput'
    TransactionUpdate:
      description: |
        Corpo do `PUT /v1/transactions/{id}`: o mesmo corpo do `POST` do tipo da movimentação + `version`. O `type` não
        muda (`type` diferente → `422 TRANSACTION_NOT_EDITABLE`).
      oneOf:
        - $ref: '#/components/schemas/ExpenseUpdate'
        - $ref: '#/components/schemas/IncomeUpdate'
        - $ref: '#/components/schemas/TransferUpdate'
        - $ref: '#/components/schemas/InvestmentUpdate'
        - $ref: '#/components/schemas/AdjustmentUpdate'
        - $ref: '#/components/schemas/RefundUpdate'
        - $ref: '#/components/schemas/CardPurchaseUpdate'
        - $ref: '#/components/schemas/UnavailableTransactionUpdate'
      discriminator:
        propertyName: type
        mapping:
          EXPENSE: '#/components/schemas/ExpenseUpdate'
          INCOME: '#/components/schemas/IncomeUpdate'
          TRANSFER: '#/components/schemas/TransferUpdate'
          INVESTMENT: '#/components/schemas/InvestmentUpdate'
          ADJUSTMENT: '#/components/schemas/AdjustmentUpdate'
          REFUND: '#/components/schemas/RefundUpdate'
          CARD_PURCHASE: '#/components/schemas/CardPurchaseUpdate'
          INVOICE_PAYMENT: '#/components/schemas/UnavailableTransactionUpdate'
          LOAN_GIVEN: '#/components/schemas/UnavailableTransactionUpdate'
          MONEY_RECEIVED: '#/components/schemas/UnavailableTransactionUpdate'
          DEBT_PAYMENT: '#/components/schemas/UnavailableTransactionUpdate'
    VoidRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500

    # ---- Movimentações: saída
    Installment:
      type: object
      description: |
        Parcela de compra no cartão (`Transaction.installments`). `status` é derivado da fatura (`PAID`, `OVERDUE`; o resto
        é `PENDING`); só `CANCELED` é gravado.
      required:
        - number
        - total
        - amount
        - competence
        - invoiceId
        - invoiceReferenceMonth
        - invoiceDueDate
        - status
        - lateEntry
      additionalProperties: false
      properties:
        number:
          type: integer
        total:
          type: integer
        amount:
          $ref: '#/components/schemas/Money'
        competence:
          $ref: '#/components/schemas/Competence'
        invoiceId:
          type: string
          format: uuid
        invoiceReferenceMonth:
          $ref: '#/components/schemas/Competence'
        invoiceDueDate:
          type: string
          format: date
        status:
          type: string
          enum: [PENDING, PAID, OVERDUE, CANCELED]
        lateEntry:
          type: boolean
    ConsumptionImpact:
      type: object
      required: [competence, amount]
      additionalProperties: false
      properties:
        competence:
          $ref: '#/components/schemas/Competence'
        amount:
          $ref: '#/components/schemas/Money'
    Impact:
      type: object
      description: Efeito da movimentação nas quatro lentes (D1 §1), calculado pelo backend.
      required: [cash, consumption, netWorth, commitment]
      additionalProperties: false
      properties:
        cash:
          $ref: '#/components/schemas/Money'
        consumption:
          type: array
          description: Uma entrada por competência (reembolso negativo).
          items:
            $ref: '#/components/schemas/ConsumptionImpact'
        netWorth:
          $ref: '#/components/schemas/Money'
        commitment:
          $ref: '#/components/schemas/Money'
          description: |
            Compromisso que **a própria movimentação** cria: na compra no cartão, a soma das parcelas não canceladas em
            faturas `FUTURE` (1.200,00 em 6x em 10/10 → 1.000,00; a parcela 1 já está na fatura corrente). É a visão da
            compra do mesmo dinheiro que `Card.committedFuture` e o `/upcoming` mostram por fatura: **nunca se soma**.
            0,00 nos demais tipos.
    RefundOfRef:
      type: object
      required: [id, description]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
    Transaction:
      type: object
      description: Movimentação. O mapa para `TransactionInput` está descrito em `TransactionInput`.
      required:
        - id
        - type
        - status
        - amount
        - date
        - description
        - notes
        - category
        - card
        - account
        - counterpartAccount
        - method
        - direction
        - adjustmentKind
        - reason
        - refundOf
        - installments
        - impact
        - editable
        - voidable
        - voidBlockedBy
        - voidReason
        - voidedAt
        - source
        - version
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        originalAmount:
          oneOf:
            - $ref: '#/components/schemas/OriginalAmount'
            - type: 'null'
          description: Valor na moeda original (2.27.0); `null` em BRL.
        fxRate:
          oneOf:
            - $ref: '#/components/schemas/FxRate'
            - type: 'null'
          description: Câmbio gravado nesta cobrança (2.27.0); `null` em BRL.
        iofBps:
          oneOf:
            - $ref: '#/components/schemas/IofBps'
            - type: 'null'
        nature:
          description: 'Natureza da despesa (2.25.0). `null` fora de despesa. Registro antigo = `VARIABLE`; recorrência de despesa = `FIXED`.'
          oneOf:
            - $ref: '#/components/schemas/TransactionNature'
            - type: 'null'
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TransactionType'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        amount:
          $ref: '#/components/schemas/Money'
        date:
          type: string
          format: date
        description:
          type: string
        notes:
          type: [string, 'null']
        category:
          oneOf:
            - $ref: '#/components/schemas/CategoryRef'
            - type: 'null'
        card:
          description: Cartão das movimentações de cartão; `null` nas demais.
          oneOf:
            - $ref: '#/components/schemas/CardRef'
            - type: 'null'
        account:
          description: |
            Conta da despesa/receita/ajuste/reembolso; origem da transferência; conta `CASH` do investimento.
          oneOf:
            - $ref: '#/components/schemas/AccountRef'
            - type: 'null'
        counterpartAccount:
          description: Destino da transferência; conta de investimento.
          oneOf:
            - $ref: '#/components/schemas/AccountRef'
            - type: 'null'
        method:
          oneOf:
            - $ref: '#/components/schemas/PaymentMethod'
            - type: 'null'
        direction:
          description: '`INCREASE`/`DECREASE` (ajuste) ou `CONTRIBUTION`/`REDEMPTION` (investimento).'
          oneOf:
            - $ref: '#/components/schemas/AdjustmentDirection'
            - $ref: '#/components/schemas/InvestmentDirection'
            - type: 'null'
        adjustmentKind:
          oneOf:
            - $ref: '#/components/schemas/AdjustmentKind'
            - type: 'null'
        reason:
          type: [string, 'null']
          description: Motivo do ajuste.
        refundOf:
          oneOf:
            - $ref: '#/components/schemas/RefundOfRef'
            - type: 'null'
        installments:
          type: array
          description: Parcelas da `CARD_PURCHASE` (na ordem 1..N); vazio nos demais tipos.
          items:
            $ref: '#/components/schemas/Installment'
        invoice:
          description: |
            Fatura do `REFUND` no cartão e do `INVOICE_PAYMENT`; `null` nos demais (a compra no cartão tem a fatura em
            cada parcela). Campo opcional: aditivo.
          oneOf:
            - $ref: '#/components/schemas/InvoiceRef'
            - type: 'null'
        debt:
          description: |
            A dívida das movimentações de dívida (`LOAN_GIVEN`/captação: a que nasceu; `MONEY_RECEIVED` de devolução e
            `DEBT_PAYMENT`: a quitada). `null` nas demais. Campo opcional: aditivo (Etapa 4).
          oneOf:
            - $ref: '#/components/schemas/DebtSummary'
            - type: 'null'
        shares:
          type: array
          description: As dívidas que nasceram das partes de uma `EXPENSE` dividida em conta (uma por parte); vazio nas demais. Não é o rateio de compra no cartão, que está em `personShares`. Campo opcional (Etapa 4).
          items:
            $ref: '#/components/schemas/DebtSummary'
        recurrenceId:
          type: [string, 'null']
          format: uuid
          description: 'Recorrência de origem (`source: RECURRENCE`). Campo opcional (Etapa 4).'
        occurrenceDate:
          type: [string, 'null']
          format: date
          description: 'Data da ocorrência realizada (`source: RECURRENCE`). Campo opcional (Etapa 4).'
        lastDigits:
          oneOf:
            - $ref: '#/components/schemas/CardLastDigits'
            - type: 'null'
          description: Final do cartão da compra (só em `CARD_PURCHASE`, 2.32.0).
        incomeCompetence:
          type: [string, 'null']
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: |
            Mês a que a receita pertence quando declarado (ADR-017); `null` = o mês da `date`. Só em `INCOME`. A competência efetiva da renda é
            `incomeCompetence` ou, se `null`, o mês de `date`. Campo opcional (2.18.0).
        splitMode:
          oneOf:
            - $ref: '#/components/schemas/SplitMode'
            - type: 'null'
          description: Modo do rateio de uma compra no cartão (ADR-022); `null` sem rateio e nos demais tipos. Campo opcional (2.24.0).
        personShares:
          type: array
          description: Rateio gravado da compra no cartão, como informado; vazio sem rateio. Distinto de `shares` (dívidas da despesa dividida em conta). Campo opcional (2.24.0).
          items:
            $ref: '#/components/schemas/PersonShareLine'
        myAmount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Minha parte do valor total da compra; `null` nos tipos sem rateio. Campo opcional (2.24.0).
        thirdPartyAmount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Parte de terceiros do valor total da compra; `null` nos tipos sem rateio. Campo opcional (2.24.0).
        impact:
          $ref: '#/components/schemas/Impact'
        editable:
          type: boolean
          description: Ativa, de tipo editável e sem conta arquivada (S-62, S-88).
        voidable:
          type: boolean
        voidBlockedBy:
          description: Preenchido quando `voidable = false` por regra (S-88, S-89).
          oneOf:
            - $ref: '#/components/schemas/VoidBlockedBy'
            - type: 'null'
        voidReason:
          type: [string, 'null']
        voidedAt:
          type: [string, 'null']
          format: date-time
        source:
          $ref: '#/components/schemas/TransactionSource'
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CashFlowTotals:
      type: object
      required: [in, out, net]
      additionalProperties: false
      properties:
        in:
          $ref: '#/components/schemas/Money'
        out:
          $ref: '#/components/schemas/Money'
        net:
          $ref: '#/components/schemas/Money'
    TransactionTotals:
      type: object
      required: [count, cashFlow]
      additionalProperties: false
      properties:
        count:
          type: integer
          minimum: 0
          description: Movimentações **ativas** que casam com o filtro inteiro (S-80).
        cashFlow:
          $ref: '#/components/schemas/CashFlowTotals'
    TransactionSlice:
      allOf:
        - $ref: '#/components/schemas/SliceBase'
        - type: object
          required: [items, totals]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Transaction'
            totals:
              $ref: '#/components/schemas/TransactionTotals'
      unevaluatedProperties: false

    # ---- Lançamentos por competência
    EntryInstallment:
      type: object
      required: [number, total]
      additionalProperties: false
      properties:
        number:
          type: integer
        total:
          type: integer
    Entry:
      type: object
      required:
        - transactionId
        - transactionType
        - date
        - competence
        - description
        - category
        - installment
        - via
        - method
        - cardId
        - accountId
        - amount
      additionalProperties: false
      properties:
        transactionId:
          type: string
          format: uuid
        transactionType:
          $ref: '#/components/schemas/TransactionType'
        date:
          type: string
          format: date
        competence:
          $ref: '#/components/schemas/Competence'
          description: 'Competência da linha: o mês de `date`, exceto na receita com `incomeCompetence` (ADR-017), em que é a competência declarada (`date` segue sendo quando o dinheiro caiu).'
        description:
          type: string
        category:
          $ref: '#/components/schemas/CategoryRef'
        installment:
          oneOf:
            - $ref: '#/components/schemas/EntryInstallment'
            - type: 'null'
        via:
          type: string
          enum: [ACCOUNT, CARD]
        method:
          oneOf:
            - $ref: '#/components/schemas/PaymentMethod'
            - type: 'null'
        cardId:
          type: [string, 'null']
          format: uuid
        accountId:
          type: [string, 'null']
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
          description: No sentido da lente (reembolso negativo em `CONSUMPTION`).
    DebtEntry:
      type: object
      description: Linha de consumo que nasce de uma dívida sem movimentação com categoria (S-137).
      required: [debtId, date, competence, description, category, amount]
      additionalProperties: false
      properties:
        debtId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        competence:
          $ref: '#/components/schemas/Competence'
        description:
          type: string
        category:
          $ref: '#/components/schemas/CategoryRef'
        amount:
          $ref: '#/components/schemas/Money'
    CategoryAmount:
      type: object
      required: [category, amount]
      additionalProperties: false
      properties:
        category:
          $ref: '#/components/schemas/CategoryRef'
        amount:
          $ref: '#/components/schemas/Money'
    EntryTotals:
      type: object
      required: [total, byCategory]
      additionalProperties: false
      properties:
        total:
          $ref: '#/components/schemas/Money'
        byCategory:
          type: array
          items:
            $ref: '#/components/schemas/CategoryAmount'
    EntrySlice:
      allOf:
        - $ref: '#/components/schemas/SliceBase'
        - type: object
          required: [items, totals, view]
          properties:
            view:
              $ref: '#/components/schemas/ViewMode'
            items:
              type: array
              items:
                $ref: '#/components/schemas/Entry'
            totals:
              $ref: '#/components/schemas/EntryTotals'
            debtItems:
              type: array
              description: |
                Linhas de consumo que nascem de dívida `PAYABLE` sem movimentação com categoria (S-137): não têm movimentação,
                têm a dívida. Entram em `totals` (a lista fecha com o dashboard, S-79) e vêm **completas, só na primeira página**
                (`page = 1`; nas demais vêm `[]`), para quem concatena as páginas não duplicar a linha (S-238); são poucas por mês.
                Só em `lens = CONSUMPTION`, e só com o filtro de categoria (ou sem filtro): com `accountId`
                ou `method` ficam de fora, porque a dívida não tem conta nem meio de pagamento. Campo opcional (Etapa 4).
              items:
                $ref: '#/components/schemas/DebtEntry'
      unevaluatedProperties: false

    # ---- Dashboard
    DashboardBalances:
      type: object
      required: [inAccounts, investments, available, reserved, committed30d]
      additionalProperties: false
      properties:
        inAccounts:
          $ref: '#/components/schemas/Money'
        investments:
          $ref: '#/components/schemas/Money'
        available:
          $ref: '#/components/schemas/Money'
        reserved:
          $ref: '#/components/schemas/Money'
          description: |
            Σ reservas de metas em contas `CASH` com data até `asOf` (S-147, Etapa 5); 0,00 sem metas. Reserva em conta `INVESTMENT`
            não entra (já está fora do disponível, S-21). Reserva acima do saldo é aceita: `available` pode ficar negativo (S-148).
        committed30d:
          $ref: '#/components/schemas/Money'
          description: Repete `committed.d30`.
        inAccountsChange:
          $ref: '#/components/schemas/DashboardInAccountsChange'
    DashboardInAccountsChange:
      type: object
      description: |
        Variação do saldo **em contas** (`inAccounts`) desde o último dia do mês anterior (redesign 2.6.0). **Campo opcional de
        `balances`: ausente** em projeção (`isProjection = true`) e quando o usuário não tem contas. É exato por data: `previous` é o
        `inAccounts` em `since`, pelo mesmo cálculo do saldo de hoje (movimentação datada depois de `since` não entra). **Não** é a variação
        do disponível (`available` não tem histórico: depende do comprometido, uma estimativa do futuro) nem do patrimônio: aplicar em
        investimento **reduz** `inAccounts` (o dinheiro não saiu do patrimônio) e o bloco de investimentos continua em `balances.investments`.
      required: [previous, amount, percent, since]
      additionalProperties: false
      properties:
        previous:
          $ref: '#/components/schemas/Money'
          description: '`inAccounts` no fim do mês anterior (`since`).'
        amount:
          $ref: '#/components/schemas/Money'
          description: '`inAccounts` de `asOf` − `previous`. Pode ser negativo.'
        percent:
          description: '`amount` ÷ \|`previous`\| com 4 casas; `null` se `previous` = 0.'
          oneOf:
            - $ref: '#/components/schemas/Ratio'
            - type: 'null'
        since:
          type: string
          format: date
          description: Último dia do mês anterior ao de `asOf`.
    DashboardCommitted:
      type: object
      required: [d7, d30, d60, d90, m6, m12]
      additionalProperties: false
      properties:
        d7:
          $ref: '#/components/schemas/Money'
        d30:
          $ref: '#/components/schemas/Money'
        d60:
          $ref: '#/components/schemas/Money'
        d90:
          $ref: '#/components/schemas/Money'
        m6:
          $ref: '#/components/schemas/Money'
        m12:
          $ref: '#/components/schemas/Money'
    DashboardProjected:
      type: object
      required: [d30, d90, m6, m12]
      additionalProperties: false
      properties:
        d30:
          $ref: '#/components/schemas/Money'
        d90:
          $ref: '#/components/schemas/Money'
        m6:
          $ref: '#/components/schemas/Money'
        m12:
          $ref: '#/components/schemas/Money'
    ExpensesByMethod:
      type: object
      required: [DEBIT, PIX, CASH, BOLETO, TRANSFER, OTHER]
      additionalProperties: false
      properties:
        DEBIT:
          $ref: '#/components/schemas/Money'
        PIX:
          $ref: '#/components/schemas/Money'
        CASH:
          $ref: '#/components/schemas/Money'
        BOLETO:
          $ref: '#/components/schemas/Money'
        TRANSFER:
          $ref: '#/components/schemas/Money'
        OTHER:
          $ref: '#/components/schemas/Money'
    ExpensesPaid:
      type: object
      required: [total, byMethod]
      additionalProperties: false
      properties:
        total:
          $ref: '#/components/schemas/Money'
        byMethod:
          $ref: '#/components/schemas/ExpensesByMethod'
    DashboardMonth:
      type: object
      required:
        - competence
        - income
        - expensesPaid
        - credit
        - refunds
        - consumption
        - cashFlow
        - investedNet
        - lent
        - received
        - net
      additionalProperties: false
      properties:
        competence:
          $ref: '#/components/schemas/Competence'
        income:
          $ref: '#/components/schemas/Money'
        expensesPaid:
          $ref: '#/components/schemas/ExpensesPaid'
        credit:
          $ref: '#/components/schemas/Money'
          description: Parcelas de compras no cartão da competência (cada parcela na competência dela, S-8; pagar a fatura não muda).
        refunds:
          $ref: '#/components/schemas/Money'
        consumption:
          $ref: '#/components/schemas/Money'
          description: '`expensesPaid.total` + `credit` − `refunds` + `debtConsumption`.'
        debtConsumption:
          $ref: '#/components/schemas/Money'
          description: |
            Consumo que nasce de dívida `PAYABLE` sem movimentação com categoria ("um amigo pagou meu jantar", S-137): `EXPENSE`
            na competência da data da dívida, sem caixa. Já está em `consumption`. Campo opcional (Etapa 4).
        cashFlow:
          $ref: '#/components/schemas/CashFlowTotals'
        investedNet:
          $ref: '#/components/schemas/Money'
        lent:
          $ref: '#/components/schemas/Money'
        received:
          $ref: '#/components/schemas/Money'
        net:
          $ref: '#/components/schemas/Money'
          description: '`income` − `consumption` (S-23).'
    DashboardNetWorth:
      type: object
      required: [accounts, receivables, cardLiabilities, payables, total, cardFutureInstallments]
      additionalProperties: false
      properties:
        accounts:
          $ref: '#/components/schemas/Money'
        receivables:
          $ref: '#/components/schemas/Money'
        cardLiabilities:
          $ref: '#/components/schemas/Money'
        payables:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        cardFutureInstallments:
          $ref: '#/components/schemas/Money'
          description: Informativo; não entra em `total` (S-8).
    DashboardSummary:
      type: object
      required: [view, asOf, isProjection, hasAccounts, balances, committed, projected, month, netWorth]
      additionalProperties: false
      properties:
        view:
          $ref: '#/components/schemas/ViewMode'
        asOf:
          type: string
          format: date
        isProjection:
          type: boolean
        hasAccounts:
          type: boolean
          description: Existe ao menos uma conta do usuário, ativa ou arquivada (S-61).
        balances:
          $ref: '#/components/schemas/DashboardBalances'
        committed:
          $ref: '#/components/schemas/DashboardCommitted'
        projected:
          $ref: '#/components/schemas/DashboardProjected'
        month:
          $ref: '#/components/schemas/DashboardMonth'
        netWorth:
          $ref: '#/components/schemas/DashboardNetWorth'
    UpcomingInstallment:
      type: object
      required: [number, total]
      additionalProperties: false
      properties:
        number:
          type: integer
        total:
          type: integer
    UpcomingChild:
      type: object
      required: [kind, label, installment, amount, informational]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [INSTALLMENT]
        label:
          type: string
        installment:
          $ref: '#/components/schemas/UpcomingInstallment'
        amount:
          $ref: '#/components/schemas/Money'
        informational:
          type: boolean
    UpcomingItem:
      type: object
      description: 'Compromisso futuro. Fatura de cartão (`INVOICE`, `INVOICE_FORECAST`), dívida, ocorrência de recorrência ou movimentação ativa com data futura (`SCHEDULED_TRANSACTION`, S-258).'
      required: [kind, dueDate, direction, amount, label, refType, refId, items]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [INVOICE, INVOICE_FORECAST, DEBT_PAYABLE, DEBT_RECEIVABLE, RECURRENCE, SCHEDULED_TRANSACTION]
        bucket:
          type: [string, 'null']
          description: Calculado no backend, no fuso do usuário. Ausente ou `null` nos itens sem data (`undated`).
          enum: [OVERDUE, TODAY, TOMORROW, NEXT_7_DAYS, NEXT_30_DAYS, LATER, null]
        dueDate:
          type: [string, 'null']
          format: date
        direction:
          type: string
          enum: [IN, OUT]
        amount:
          $ref: '#/components/schemas/Money'
        label:
          type: string
        refType:
          type: string
          enum: [INVOICE, DEBT, RECURRENCE, TRANSACTION]
        refId:
          type: [string, 'null']
          format: uuid
        items:
          type: array
          description: Parcelas aninhadas de uma fatura (informativas; ninguém soma).
          items:
            $ref: '#/components/schemas/UpcomingChild'
    UpcomingTotals:
      type: object
      required: [out, in]
      additionalProperties: false
      properties:
        out:
          $ref: '#/components/schemas/Money'
        in:
          $ref: '#/components/schemas/Money'
    Upcoming:
      type: object
      required: [items, undated, totals]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UpcomingItem'
        undated:
          type: array
          description: Dívidas sem data prevista.
          items:
            $ref: '#/components/schemas/UpcomingItem'
        totals:
          $ref: '#/components/schemas/UpcomingTotals'
        overdueTruncated:
          type: boolean
          description: |
            `true` quando havia mais ocorrências de recorrência vencidas e pendentes que o limite de 500 por chamada (S-240):
            só as mais recentes vêm em `items`, e `totals` continua completo. Campo opcional (sempre presente na resposta);
            ausente = `false`.

    # ---- Cartões e faturas (Etapa 3)
    CardStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    InvoiceStatus:
      type: string
      description: |
        Derivado na leitura (S-37), nunca gravado: `FUTURE` (antes do período), `OPEN` (a corrente: uma por cartão),
        `CLOSED` (fechou e vence hoje ou depois, com saldo), `OVERDUE` (passou do vencimento, com saldo) e `PAID`
        (fechou e `outstanding = 0`).
      enum: [FUTURE, OPEN, CLOSED, OVERDUE, PAID]
    InvoiceCore:
      type: object
      description: Campos de `InvoiceSummary` e de `Invoice`. `total` pode ser negativo; `outstanding` e `creditCarry` nunca.
      required:
        - id
        - cardId
        - referenceMonth
        - periodStart
        - closingDate
        - dueDate
        - status
        - total
        - carryIn
        - paid
        - outstanding
        - creditCarry
        - hasLateEntries
      properties:
        id:
          type: string
          format: uuid
          description: 'Determinístico (ADR-006): o mesmo id com ou sem linha gravada.'
        cardId:
          type: string
          format: uuid
        referenceMonth:
          $ref: '#/components/schemas/Competence'
        periodStart:
          type: string
          format: date
          description: Fechamento anterior (inclusive).
        closingDate:
          type: string
          format: date
          description: Identidade da fatura junto com o cartão (S-13).
        dueDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        total:
          $ref: '#/components/schemas/Money'
          description: Σ parcelas ativas − Σ créditos ativos.
        carryIn:
          $ref: '#/components/schemas/Money'
          description: Crédito transportado da fatura anterior.
        paid:
          $ref: '#/components/schemas/Money'
        outstanding:
          $ref: '#/components/schemas/Money'
          description: max(0, total − carryIn − paid).
        creditCarry:
          $ref: '#/components/schemas/Money'
          description: max(0, carryIn + paid − total), transportado para a fatura seguinte.
        hasLateEntries:
          type: boolean
          description: Algum item ativo é lançamento tardio (S-14).
    InvoiceSummary:
      allOf:
        - $ref: '#/components/schemas/InvoiceCore'
      unevaluatedProperties: false
    InvoiceItem:
      type: object
      description: Item ativo de uma fatura (parcela ou crédito). Item estornado/cancelado não aparece.
      required: [kind, transactionId, description, number, totalInstallments, amount, date, lateEntry]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [INSTALLMENT, CREDIT]
        transactionId:
          type: string
          format: uuid
        description:
          type: string
        number:
          type: [integer, 'null']
          description: Número da parcela (`INSTALLMENT`); `null` em `CREDIT`.
        totalInstallments:
          type: [integer, 'null']
        amount:
          $ref: '#/components/schemas/Money'
          description: Sempre positivo; o sinal vem do `kind`.
        date:
          type: string
          format: date
          description: Data efetiva do item (a data da parcela, ou a data do crédito).
        lateEntry:
          type: boolean
    InvoicePayment:
      type: object
      required: [transactionId, accountId, amount, date]
      additionalProperties: false
      properties:
        transactionId:
          type: string
          format: uuid
          description: A movimentação `INVOICE_PAYMENT` (use em `POST /v1/transactions/{id}/void`).
        accountId:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
        date:
          type: string
          format: date
    Invoice:
      allOf:
        - $ref: '#/components/schemas/InvoiceCore'
        - type: object
          required: [items, payments, myShare, thirdPartyShare, shareByPerson]
          properties:
            myShare:
              $ref: '#/components/schemas/Money'
              description: Minha parte da fatura (ADR-022). `total` = `myShare` + `thirdPartyShare`; o valor devido não muda.
            thirdPartyShare:
              $ref: '#/components/schemas/Money'
              description: Parte de terceiros da fatura, a receber deles.
            shareByPerson:
              type: array
              items:
                $ref: '#/components/schemas/PersonAmount'
            items:
              type: array
              items:
                $ref: '#/components/schemas/InvoiceItem'
            payments:
              type: array
              items:
                $ref: '#/components/schemas/InvoicePayment'
            documentAmount:
              oneOf:
                - $ref: '#/components/schemas/Money'
                - type: 'null'
              description: Valor que o dono informou do documento da fatura (2.37.0); `null` sem valor. Só comparação.
            documentDivergence:
              oneOf:
                - $ref: '#/components/schemas/Money'
                - type: 'null'
              description: '`total` − `documentAmount`, com sinal (2.37.0); `null` sem valor informado ou quando fecham.'
            documentVersion:
              type: integer
              format: int64
              description: Versão do registro da fatura para o `version` opcional do `PUT` (2.37.0).
      unevaluatedProperties: false
    InvoiceSlice:
      allOf:
        - $ref: '#/components/schemas/SliceBase'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/InvoiceSummary'
      unevaluatedProperties: false
    InvoiceRef:
      type: object
      description: Referência curta a uma fatura (compra, prévia, movimentação).
      required: [id, referenceMonth, closingDate, dueDate, status]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        referenceMonth:
          $ref: '#/components/schemas/Competence'
        closingDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/InvoiceStatus'
    Card:
      type: object
      description: |
        Cartão com os números calculados pelo backend (S-129). **Dois valores de "comprometido", disjuntos e nunca
        somados em outro lugar** (PR 01, regra 1): `totalCommitted` é a fatura corrente + as fechadas/atrasadas (o que
        vai ao fluxo de caixa); `committedFuture` são as parcelas já assumidas que ainda não caíram em fatura. Com
        `creditBalance = 0` e **sem crédito transportado para uma fatura `FUTURE`**: `limit − availableLimit =
        totalCommitted + committedFuture`. **Exceção:** `committedFuture` é bruto (Σ das parcelas, sem abater o crédito
        transportado); quando há crédito transportado entrando numa fatura `FUTURE` (pagamento a maior com a fatura
        seguinte ainda sem item), a identidade deixa de valer (`limit − availableLimit` fica abaixo da soma pelo valor
        do crédito absorvido) e o mesmo compromisso aparece líquido no `/v1/dashboard/upcoming` e no dashboard (ex.:
        `committedFuture` 200,00 e `/upcoming` 183,00). Não é dupla contagem: o front exibe cada número no seu lugar e
        não os soma.
      required:
        - id
        - name
        - institution
        - overLimit
        - creditBalance
        - closingDay
        - dueDay
        - defaultPaymentAccountId
        - status
        - currentInvoice
        - totalCommitted
        - committedFuture
        - archivable
        - closingConfirmed
        - autoDebit
        - lastDigits
        - version
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        autoDebit:
          type: [boolean, 'null']
          description: 'Débito automático da fatura. `null` = desconhecido (cartões existentes): sem alerta até o dono marcar.'
        brand:
          type: [string, 'null']
          maxLength: 40
        bestPurchaseDay:
          type: [integer, 'null']
          minimum: 1
          maximum: 31
          description: Melhor dia de compra (informativo).
        lastDigits:
          type: array
          maxItems: 5
          uniqueItems: true
          description: 'Finais (4 dígitos) dos cartões físicos e virtuais ligados a este cartão. A fatura é uma só por cartão, sem quebra por final.'
          items:
            $ref: '#/components/schemas/CardLastDigits'
        id:
          type: string
          format: uuid
        name:
          type: string
        institution:
          type: [string, 'null']
        limit:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: 'Limite do cartão; `null` ou ausente = ainda não definido (2.14.0). Sem limite: `availableLimit` e `usedRatio` também ficam nulos/ausentes e `overLimit` é `false`.'
        availableLimit:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: 'limite + saldo do livro `CARD` em todas as datas (S-46); pode ser negativo ou passar do limite. Nulo/ausente sem limite definido.'
        overLimit:
          type: boolean
          description: Disponível negativo. Sinalizado, nunca bloqueia (S-11).
        creditBalance:
          $ref: '#/components/schemas/Money'
          description: Crédito no cartão = `creditCarry` da última fatura da cadeia (0,00 se não houver).
        usedRatio:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: Razão do limite usado, 0..1 (4 casas), calculada no backend só para a largura da barra. Com `overLimit` vale 1.
        closingDay:
          type: integer
          description: Dia de fechamento da regra mais recente.
        dueDay:
          type: integer
          description: Dia de vencimento da regra mais recente.
        defaultPaymentAccountId:
          type: [string, 'null']
          format: uuid
        status:
          $ref: '#/components/schemas/CardStatus'
        currentInvoice:
          description: A fatura `OPEN` de hoje (existe sempre, ainda que vazia).
          oneOf:
            - $ref: '#/components/schemas/InvoiceSummary'
            - type: 'null'
        totalCommitted:
          $ref: '#/components/schemas/Money'
          description: Σ `outstanding` das faturas que não são `PAID` nem `FUTURE` (a corrente e as fechadas/atrasadas).
        committedFuture:
          $ref: '#/components/schemas/Money'
          description: |
            Σ das parcelas não canceladas em faturas `FUTURE`, **bruto** (não abate o crédito transportado para essas
            faturas; o `/upcoming` e o dashboard são líquidos). Ver a exceção da identidade na descrição de `Card`.
        closingConfirmed:
          type: boolean
          description: 'Fechamento confirmado por documento (2.14.0). `false` = o `closingDay` é só um parâmetro técnico provisório, nunca um fato: a tela mostra "fechamento não confirmado". Padrão `true`.'
        archivable:
          type: boolean
          description: Ativo, sem saldo em aberto, sem crédito e sem parcela futura (S-120).
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CardInput:
      type: object
      required: [name, closingDay, dueDay]
      additionalProperties: false
      properties:
        autoDebit:
          type: [boolean, 'null']
          description: 'Débito automático da fatura. `null` = desconhecido (cartões existentes): sem alerta até o dono marcar.'
        brand:
          type: [string, 'null']
          maxLength: 40
        bestPurchaseDay:
          type: [integer, 'null']
          minimum: 1
          maximum: 31
          description: Melhor dia de compra (informativo).
        lastDigits:
          type: array
          maxItems: 5
          uniqueItems: true
          description: 'Finais (4 dígitos) dos cartões físicos e virtuais ligados a este cartão. A fatura é uma só por cartão, sem quebra por final.'
          items:
            $ref: '#/components/schemas/CardLastDigits'
        name:
          type: string
          description: Obrigatório e até 100 caracteres (senão `422 CARD_NAME_REQUIRED` / `CARD_NAME_TOO_LONG`).
        institution:
          type: [string, 'null']
          description: Até 100 caracteres (senão `422 CARD_INSTITUTION_TOO_LONG`).
        limit:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: 'Opcional (2.14.0), ausente ou `null` = limite ainda não definido. Informado, maior que zero e até R$ 999.999.999,99 (senão `422 CARD_INVALID_LIMIT` / `AMOUNT_ABOVE_LIMIT`).'
        closingDay:
          type: integer
          description: 1..31 (senão `422 CARD_INVALID_BILLING_DAY`); em mês curto vale o último dia.
        dueDay:
          type: integer
          description: 1..31 (senão `422 CARD_INVALID_BILLING_DAY`).
        defaultPaymentAccountId:
          type: [string, 'null']
          format: uuid
          description: Conta `CASH` sugerida no pagamento da fatura.
    CardUpdate:
      type: object
      required: [name, closingDay, dueDay, version]
      additionalProperties: false
      properties:
        autoDebit:
          type: [boolean, 'null']
          description: 'Débito automático da fatura. `null` = desconhecido (cartões existentes): sem alerta até o dono marcar.'
        brand:
          type: [string, 'null']
          maxLength: 40
        bestPurchaseDay:
          type: [integer, 'null']
          minimum: 1
          maximum: 31
          description: Melhor dia de compra (informativo).
        lastDigits:
          type: array
          maxItems: 5
          uniqueItems: true
          description: 'Finais (4 dígitos) dos cartões físicos e virtuais ligados a este cartão. A fatura é uma só por cartão, sem quebra por final.'
          items:
            $ref: '#/components/schemas/CardLastDigits'
        name:
          type: string
          description: Obrigatório e até 100 caracteres (senão `422 CARD_NAME_REQUIRED` / `CARD_NAME_TOO_LONG`).
        institution:
          type: [string, 'null']
          description: Até 100 caracteres (senão `422 CARD_INSTITUTION_TOO_LONG`).
        limit:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: 'Opcional (2.14.0), `null`/ausente = sem limite (a edição é substituição completa).'
        closingDay:
          type: integer
        dueDay:
          type: integer
        defaultPaymentAccountId:
          type: [string, 'null']
          format: uuid
        confirmedEffectiveFrom:
          type: [string, 'null']
          format: date
          description: |
            Obrigatório quando `closingDay`/`dueDay` mudam (T58): o `effectiveFromClosingDate` da prévia. Se o
            backend recalcular outra data, `409 CARD_BILLING_CHANGE_STALE`.
        version:
          type: integer
          format: int64
    CardSlice:
      allOf:
        - $ref: '#/components/schemas/SliceBase'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Card'
      unevaluatedProperties: false
    FutureInstallmentsInvoice:
      type: object
      required: [invoiceId, referenceMonth, dueDate, amount, items]
      additionalProperties: false
      properties:
        invoiceId:
          type: string
          format: uuid
        referenceMonth:
          $ref: '#/components/schemas/Competence'
        dueDate:
          type: string
          format: date
        amount:
          $ref: '#/components/schemas/Money'
          description: Σ das parcelas desta fatura (soma do backend).
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceItem'
    FutureInstallments:
      type: object
      required: [total, byInvoice]
      additionalProperties: false
      properties:
        total:
          $ref: '#/components/schemas/Money'
        byInvoice:
          type: array
          description: Uma entrada por fatura `FUTURE` com parcela, em ordem de fechamento.
          items:
            $ref: '#/components/schemas/FutureInstallmentsInvoice'
    OngoingInstallmentsRequest:
      type: object
      required: [description, installmentAmount, totalInstallments, remainingInstallments]
      additionalProperties: false
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 200
        installmentAmount:
          $ref: '#/components/schemas/AmountInput'
          description: Valor de **cada** parcela.
        totalInstallments:
          type: integer
          minimum: 2
          maximum: 36
        remainingInstallments:
          type: integer
          minimum: 1
          maximum: 36
          description: Quantas faltam pagar, a próxima inclusive ("parcela 3 de 10" = 8). Acima de `totalInstallments` → `422 ONGOING_INVALID_COUNT`.
        firstInvoiceDate:
          type: [string, 'null']
          format: date
          description: Data dentro do ciclo da fatura da próxima parcela. Ausente = hoje (fatura corrente). Fatura paga → `422 ONGOING_FIRST_INVOICE_NOT_PAYABLE`.
        categoryId:
          type: [string, 'null']
          format: uuid
          description: Ausente = sem categoria (consumo 0 em todos os meses). Com categoria, cada parcela vira consumo só na competência dela.
    OngoingPreview:
      type: object
      required: [remainingInstallments, installmentAmount, remaining, firstDueDate, lastDueDate, purchase]
      additionalProperties: false
      properties:
        remainingInstallments:
          type: integer
        installmentAmount:
          $ref: '#/components/schemas/Money'
        remaining:
          $ref: '#/components/schemas/Money'
          description: Σ das parcelas que faltam; o que passa a ser devido.
        firstDueDate:
          type: string
          format: date
        lastDueDate:
          type: string
          format: date
        purchase:
          $ref: '#/components/schemas/PurchasePreview'
    PurchasePreviewRequest:
      type: object
      required: [amount, installments, date]
      additionalProperties: false
      properties:
        originalAmount:
          $ref: '#/components/schemas/OriginalAmountInput'
        fxRate:
          $ref: '#/components/schemas/FxRate'
        iofBps:
          $ref: '#/components/schemas/IofBps'
        amount:
          $ref: '#/components/schemas/AmountInput'
        installments:
          type: integer
          minimum: 1
          maximum: 36
        date:
          type: string
          format: date
          description: Data da compra.
        splitMode:
          $ref: '#/components/schemas/SplitMode'
        shares:
          type: array
          maxItems: 20
          description: Mesmas regras de `CardPurchaseInput.shares`; sem `shares` a compra é 100% minha.
          items:
            $ref: '#/components/schemas/ShareInput'
    PurchasePreviewInstallment:
      type: object
      required: [number, total, amount, competence, invoice, lateEntry, myAmount, thirdPartyAmount, byPerson]
      additionalProperties: false
      properties:
        number:
          type: integer
        total:
          type: integer
        amount:
          $ref: '#/components/schemas/Money'
        competence:
          $ref: '#/components/schemas/Competence'
        invoice:
          $ref: '#/components/schemas/InvoiceRef'
        lateEntry:
          type: boolean
        myAmount:
          $ref: '#/components/schemas/Money'
          description: Minha parte da parcela (o que vira `EXPENSE`).
        thirdPartyAmount:
          $ref: '#/components/schemas/Money'
          description: Soma da parte dos terceiros na parcela (o que vira `RECEIVABLE`); `amount` = `myAmount` + `thirdPartyAmount`.
        byPerson:
          type: array
          description: Parte de cada terceiro na parcela, idêntica ao que a criação grava. Vazio sem rateio.
          items:
            $ref: '#/components/schemas/PersonAmount'
    PurchasePreview:
      type: object
      required: [installments, total, overLimit, warnings]
      additionalProperties: false
      properties:
        installments:
          type: array
          items:
            $ref: '#/components/schemas/PurchasePreviewInstallment'
        total:
          $ref: '#/components/schemas/Money'
        availableLimitAfter:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: 'Limite disponível depois da compra (pode ser negativo); nulo/ausente sem limite definido.'
        overLimit:
          type: boolean
        splitMode:
          $ref: '#/components/schemas/SplitMode'
        shares:
          type: array
          items:
            $ref: '#/components/schemas/PersonShareLine'
        warnings:
          type: array
          items:
            type: string
            enum: [LATE_ENTRY, OVER_LIMIT, FUTURE_DATE, FINANCING_PENDING]
    PaymentPreview:
      type: object
      required: [kind, outstandingAfter, creditCarryAfter]
      additionalProperties: false
      properties:
        kind:
          type: string
          description: |
            `FULL` (quita exatamente o `outstanding`), `PARTIAL` (menos que o `outstanding`), `OVERPAY` (mais que o
            `outstanding` numa fatura fechada: o excedente vira `creditCarry`) e `PREPAY` (pagamento numa fatura `OPEN`).
          enum: [FULL, PARTIAL, OVERPAY, PREPAY]
        outstandingAfter:
          $ref: '#/components/schemas/Money'
        creditCarryAfter:
          $ref: '#/components/schemas/Money'
    BillingChangePreview:
      type: object
      required: [effectiveFromClosingDate, firstNewInvoice, movedInstallments, movedCredits, notice]
      additionalProperties: false
      properties:
        effectiveFromClosingDate:
          type: string
          format: date
          description: Fechamento da primeira fatura afetada; devolvido no `PUT` como `confirmedEffectiveFrom`.
        firstNewInvoice:
          type: object
          required: [closingDate, dueDate]
          additionalProperties: false
          properties:
            closingDate:
              type: string
              format: date
            dueDate:
              type: string
              format: date
        movedInstallments:
          type: integer
          minimum: 0
        movedCredits:
          type: integer
          minimum: 0
        notice:
          type: string
          description: A mudança vale da fatura seguinte à corrente (S-42).
          enum: [FROM_NEXT_INVOICE]
    InvoiceDocumentAmountInput:
      type: object
      required: [documentAmount]
      additionalProperties: false
      properties:
        documentAmount:
          type: [string, 'null']
          pattern: '^-?\d{1,13}(\.\d{1,2})?$'
          description: Valor do documento em BRL, string decimal com até 2 casas; `null` limpa. Negativo é lido e recusado com `422 INVOICE_DOCUMENT_AMOUNT_INVALID`.
          examples: ['1283.00']
        version:
          type: integer
          format: int64
          description: Opcional. `documentVersion` lido da fatura; diferente do atual → `409 VERSION_CONFLICT`.
    InvoicePaymentInput:
      type: object
      required: [accountId, amount, date]
      additionalProperties: false
      properties:
        accountId:
          type: string
          format: uuid
          description: Conta `CASH` de onde sai o dinheiro.
        amount:
          $ref: '#/components/schemas/AmountInput'
        date:
          type: string
          format: date
          description: Data do pagamento; no futuro, conta como agendado (S-130).
    CancelInstallmentsRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    CardPurchaseInput:
      type: object
      description: |
        Compra no cartão (`CARD_PURCHASE`). `installments` de 1 a 36 (obrigatório; à vista = 1). O valor é dividido em
        centavos (`1000.00` em 3x = 333,34 + 333,33 + 333,33) e a parcela 1 cai na competência da compra.
      required: [type, amount, date, cardId]
      additionalProperties: false
      properties:
        lastDigits:
          oneOf:
            - $ref: '#/components/schemas/CardLastDigits'
            - type: 'null'
          description: 'Final do cartão usado na compra (opcional). Precisa estar em `Card.lastDigits`, senão `422 PURCHASE_LAST_DIGITS_NOT_FROM_CARD`.'
        originalAmount:
          $ref: '#/components/schemas/OriginalAmountInput'
        fxRate:
          $ref: '#/components/schemas/FxRate'
        iofBps:
          $ref: '#/components/schemas/IofBps'
        type:
          type: string
          const: CARD_PURCHASE
        amount:
          $ref: '#/components/schemas/AmountInput'
          description: Valor **total** da compra.
        date:
          type: string
          format: date
          description: Data da compra (no fuso do usuário).
        description:
          type: [string, 'null']
          maxLength: 200
        notes:
          type: [string, 'null']
          maxLength: 2000
        cardId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
          description: Categoria `EXPENSE`.
        installments:
          type: integer
          minimum: 1
          maximum: 36
        splitMode:
          $ref: '#/components/schemas/SplitMode'
        shares:
          type: array
          maxItems: 20
          description: |
            Rateio entre pessoas (ADR-022). Ausente = 100% meu. Soma que não fecha, `personId` repetido ou `AMOUNT` que não soma a
            parcela → `422 SHARES_INVALID`; pessoa arquivada → `422 SHARE_PERSON_ARCHIVED`. `splitMode` é obrigatório quando há `shares`.
          items:
            $ref: '#/components/schemas/ShareInput'
      examples:
        - type: CARD_PURCHASE
          amount: '300.00'
          date: '2026-10-05'
          description: Compra de exemplo
          cardId: 3f1d2c4b-7a8e-4f60-8b21-5c9d0e1a2b3c
          installments: 3
          splitMode: BPS
          shares:
            - { personId: null, bps: 5000 }
            - { personId: 6b8f6d0a-3c5e-4b0a-9a55-0f0e1f2a3b4c, bps: 5000 }
    CardLastDigits:
      type: string
      pattern: '^\d{4}$'
      description: Final do cartão, exatamente 4 dígitos. Formato diferente responde `422` (`CARD_LAST_DIGITS_INVALID` no cartão).
      examples: ['1234']
    Provenance:
      type: object
      description: |
        Origem e confiança de um dado (2.32.0, ADR-028). Opcional; ausente vale `INFORMED`/`CONFIRMED`. Só origem e confiança: o status é derivado na leitura e
        nunca é gravado. Valor fora dos enums: `422 PROVENANCE_INVALID`.
      additionalProperties: false
      properties:
        origin:
          type: string
          enum: [PRINT, PAYSLIP, CONTRACT, INFORMED]
          default: INFORMED
        confidence:
          type: string
          enum: [CONFIRMED, ESTIMATED]
          default: CONFIRMED
      examples:
        - {origin: PAYSLIP, confidence: ESTIMATED}
    ViewMode:
      type: string
      description: '`MINE` = minha parte (padrão); `GROSS` = bruto (ADR-022).'
      enum: [MINE, GROSS]
    SplitMode:
      type: string
      description: |
        Como o valor de cada parcela é dividido entre as pessoas (ADR-022). `BPS`: `bps` por pessoa, soma 10000 (o dono entra com
        `personId: null`). `EQUAL`: só `personId`s (inclua `null` para o dono), o backend divide por parcela. `AMOUNT`: `amount` por parcela,
        exato, soma = a parcela. Em todos os modos a parte de cada terceiro é arredondada para baixo por parcela e o resto de centavo fica com o
        dono; `personId` não se repete.
      enum: [BPS, EQUAL, AMOUNT]
    ShareInput:
      type: object
      description: 'Parte de uma pessoa no rateio. `personId: null` = eu. Em `BPS` só `bps`; em `AMOUNT` só `amount`; em `EQUAL` nenhum dos dois.'
      required: [personId]
      additionalProperties: false
      properties:
        provenance:
          $ref: '#/components/schemas/Provenance'
        personId:
          type: [string, 'null']
          format: uuid
        bps:
          type: integer
          minimum: 1
          maximum: 10000
          description: Pontos-base (10000 = 100%).
        amount:
          $ref: '#/components/schemas/AmountInput'
          description: Valor **por parcela** que cabe à pessoa (modo `AMOUNT`).
    PersonShareLine:
      type: object
      description: Rateio gravado, como informado. `bps` ou `amount` conforme o `splitMode`; em `EQUAL`, os dois são `null`.
      required: [personId, bps, amount]
      additionalProperties: false
      properties:
        provenance:
          $ref: '#/components/schemas/Provenance'
        personId:
          type: [string, 'null']
          format: uuid
        bps:
          type: [integer, 'null']
        amount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
    PersonAmount:
      type: object
      description: 'Quanto cabe a uma pessoa (`personId: null` = eu), calculado pelo backend.'
      required: [personId, amount]
      additionalProperties: false
      properties:
        personId:
          type: [string, 'null']
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
    TransactionSharesUpdate:
      type: object
      description: |
        Novo rateio de uma compra no cartão (ADR-022). Vale em fatura aberta **ou fechada**: reclassifica só `EXPENSE` x `RECEIVABLE`; a
        fatura, o `CARD` e o caixa não mudam; o patrimônio varia pela variação da minha parte. A revisão fica em `transaction_revisions`. `shares` vazio ou só o dono volta a 100% meu.
      required: [splitMode, shares, version]
      additionalProperties: false
      properties:
        splitMode:
          $ref: '#/components/schemas/SplitMode'
        shares:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ShareInput'
        version:
          type: integer
          format: int64
      examples:
        - splitMode: BPS
          shares:
            - { personId: null, bps: 7000 }
            - { personId: 6b8f6d0a-3c5e-4b0a-9a55-0f0e1f2a3b4c, bps: 3000 }
          version: 1
    CardPurchaseUpdate:
      type: object
      description: |
        Edição limitada da compra no cartão (S-121, T57): o corpo do `POST` (`CardPurchaseInput`) + `version`. Só
        `description`, `categoryId` e `notes` mudam; `amount`, `date`, `installments` e `cardId` precisam ser os da
        compra (senão `422 TRANSACTION_NOT_EDITABLE`, com a explicação).
      required: [type, amount, date, cardId, installments, version]
      additionalProperties: false
      properties:
        type:
          type: string
          const: CARD_PURCHASE
        amount:
          $ref: '#/components/schemas/AmountInput'
          description: Valor total da compra; tem de ser o atual.
        date:
          type: string
          format: date
          description: Data da compra; tem de ser a atual.
        description:
          type: [string, 'null']
          maxLength: 200
        notes:
          type: [string, 'null']
          maxLength: 2000
        cardId:
          type: string
          format: uuid
          description: Tem de ser o cartão atual.
        categoryId:
          type: string
          format: uuid
          description: Categoria `EXPENSE`.
        installments:
          type: integer
          minimum: 1
          maximum: 36
          description: Tem de ser o número atual de parcelas.
        version:
          type: integer
          format: int64

    # ---- Pessoas, dívidas e recorrências (Etapa 4)
    PersonStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    DebtDirection:
      type: string
      description: '`RECEIVABLE` = "me devem" (ativo); `PAYABLE` = "eu devo" (passivo).'
      enum: [RECEIVABLE, PAYABLE]
    DebtOrigin:
      type: string
      description: '`WITH_MOVEMENT` nasce junto com a movimentação de origem; `WITHOUT_MOVEMENT` é reconhecida contra `EQUITY`.'
      enum: [WITH_MOVEMENT, WITHOUT_MOVEMENT]
    DebtStatus:
      type: string
      description: |
        **Derivado** das quitações ativas (S-41): `OPEN` (nenhuma), `PARTIALLY_SETTLED`, `SETTLED` (= principal);
        `CANCELED` (perdão) e `VOIDED` (estorno) são o encerramento gravado.
      enum: [OPEN, PARTIALLY_SETTLED, SETTLED, CANCELED, VOIDED]
    DebtVoidBlockedBy:
      type: string
      description: |
        Por que a dívida não pode ser estornada como registro: `DEBT_HAS_SETTLEMENTS` (há quitação ativa), `DEBT_CLOSED`
        (já encerrada) ou `HAS_ORIGIN_TRANSACTION` (nasceu de uma movimentação: estorne a movimentação de origem).
      enum: [DEBT_HAS_SETTLEMENTS, DEBT_CLOSED, HAS_ORIGIN_TRANSACTION]
    PersonDirection:
      type: string
      description: Sinal de `net` para o texto da tela ("João deve", "você deve"); `NONE` quando `net` é zero.
      enum: [RECEIVABLE, PAYABLE, NONE]
    PersonRef:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Person:
      type: object
      required: [id, name, notes, archived, net, direction, openDebts, nextDueDate, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        notes:
          type: [string, 'null']
        archived:
          type: boolean
        net:
          $ref: '#/components/schemas/Money'
          description: |
            Saldo com a pessoa, **com sinal**: Σ recebíveis em aberto − Σ passivos em aberto (positivo = me devem). Só
            dívidas `OPEN`/`PARTIALLY_SETTLED` entram (S-142).
        direction:
          $ref: '#/components/schemas/PersonDirection'
        openDebts:
          type: integer
          minimum: 0
          description: Dívidas `OPEN`/`PARTIALLY_SETTLED`.
        nextDueDate:
          type: [string, 'null']
          format: date
          description: Menor `expectedDate` entre as dívidas em aberto com previsão; `null` se não há.
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PersonDetail:
      type: object
      description: '`Person` + o histórico de dívidas (abertas e encerradas, da mais recente para a mais antiga).'
      required: [id, name, notes, archived, net, direction, openDebts, nextDueDate, debts, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        notes:
          type: [string, 'null']
        archived:
          type: boolean
        net:
          $ref: '#/components/schemas/Money'
        direction:
          $ref: '#/components/schemas/PersonDirection'
        openDebts:
          type: integer
          minimum: 0
        nextDueDate:
          type: [string, 'null']
          format: date
        debts:
          type: array
          items:
            $ref: '#/components/schemas/DebtSummary'
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PersonInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        notes:
          type: [string, 'null']
          maxLength: 2000
    PersonUpdate:
      type: object
      required: [name, version]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        notes:
          type: [string, 'null']
          maxLength: 2000
        version:
          type: integer
          format: int64
    PersonSlice:
      allOf:
        - $ref: '#/components/schemas/SliceBase'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Person'
      unevaluatedProperties: false
    DebtSummary:
      type: object
      description: Dívida resumida (dentro de `Transaction.debt`, `Transaction.shares` e `PersonDetail.debts`).
      required: [id, person, creditorName, direction, status, principal, settled, outstanding, date, expectedDate, overdue, description]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        person:
          description: Nulo na dívida com credor livre (`creditorName`).
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        creditorName:
          type: [string, 'null']
          description: Credor livre das "outras dívidas" (2.13.0); `null` quando há `person`.
        direction:
          $ref: '#/components/schemas/DebtDirection'
        status:
          $ref: '#/components/schemas/DebtStatus'
        principal:
          $ref: '#/components/schemas/Money'
        settled:
          $ref: '#/components/schemas/Money'
          description: Σ das quitações ativas.
        outstanding:
          $ref: '#/components/schemas/Money'
          description: Principal − quitações ativas (0 se `CANCELED`/`VOIDED`).
        date:
          type: string
          format: date
        expectedDate:
          type: [string, 'null']
          format: date
        overdue:
          type: boolean
          description: Previsão anterior a hoje e saldo em aberto (derivado, S-145).
        description:
          type: [string, 'null']
    DebtSettlement:
      type: object
      description: 'Quitação: a movimentação real (`MONEY_RECEIVED` de devolução ou `DEBT_PAYMENT`).'
      required: [transactionId, amount, date, active]
      additionalProperties: false
      properties:
        transactionId:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
        date:
          type: string
          format: date
        active:
          type: boolean
          description: '`false` na quitação cuja movimentação foi estornada (fica no histórico).'
    Debt:
      type: object
      required:
        - id
        - person
        - creditorName
        - direction
        - origin
        - originTransactionId
        - principal
        - settled
        - outstanding
        - status
        - date
        - expectedDate
        - overdue
        - description
        - category
        - closureDate
        - closureReason
        - settlements
        - cancelable
        - voidable
        - voidBlockedBy
        - version
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/DebtKind'
        channel:
          type: [string, 'null']
          description: Canal pelo qual o empréstimo foi contratado (2.29.0), texto livre; `null` quando não informado.
        effectiveRate:
          oneOf:
            - $ref: '#/components/schemas/EffectiveRate'
            - type: 'null'
          description: Taxa efetiva (TIR) quando há valor recebido e cronograma de parcelas conhecido (Pix no crédito, consignado em folha); ausente/`null` caso contrário.
        id:
          type: string
          format: uuid
        person:
          description: Nulo na dívida com credor livre (`creditorName`, "outras dívidas").
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        creditorName:
          type: [string, 'null']
          description: Credor livre (banco, loja, financiamento) das "outras dívidas" (2.13.0); `null` quando há `person`.
        direction:
          $ref: '#/components/schemas/DebtDirection'
        origin:
          $ref: '#/components/schemas/DebtOrigin'
        originTransactionId:
          type: [string, 'null']
          format: uuid
          description: Movimentação de origem (`LOAN_GIVEN`, captação ou `EXPENSE` com `shares`); `null` em `WITHOUT_MOVEMENT`.
        principal:
          $ref: '#/components/schemas/Money'
        settled:
          $ref: '#/components/schemas/Money'
        outstanding:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/DebtStatus'
        date:
          type: string
          format: date
        expectedDate:
          type: [string, 'null']
          format: date
        overdue:
          type: boolean
        description:
          type: [string, 'null']
        category:
          description: Categoria da dívida `PAYABLE` sem movimentação que nasceu de consumo (S-137); `null` nas demais.
          oneOf:
            - $ref: '#/components/schemas/CategoryRef'
            - type: 'null'
        closureDate:
          type: [string, 'null']
          format: date
          description: Data do perdão ou do estorno; `null` se a dívida não está encerrada.
        closureReason:
          type: [string, 'null']
        settlements:
          type: array
          description: Quitações, da mais antiga para a mais recente (ativas e estornadas).
          items:
            $ref: '#/components/schemas/DebtSettlement'
        cancelable:
          type: boolean
          description: '`OPEN` ou `PARTIALLY_SETTLED` (o perdão só vale nesses estados).'
        voidable:
          type: boolean
          description: 'Estorno do **registro** (`POST /v1/debts/{id}/void`): só `WITHOUT_MOVEMENT` sem quitações ativas e não encerrada.'
        voidBlockedBy:
          description: Preenchido quando `voidable = false`.
          oneOf:
            - $ref: '#/components/schemas/DebtVoidBlockedBy'
            - type: 'null'
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DebtInput:
      type: object
      description: |
        Dívida sem movimentação (`WITHOUT_MOVEMENT`). Informe `personId` **ou** `creditorName` (2.13.0, "outras dívidas": banco, loja,
        financiamento, sem `Person`): os dois juntos, nenhum dos dois, `creditorName` em `RECEIVABLE` ou `categoryId` com `creditorName` são
        `422 DEBT_CREDITOR_INVALID`. A dívida com credor livre também é reconhecida contra `EQUITY` (consumo 0) e vai em `other` de
        `GET /v1/debts/overview`.
      required: [direction, principal, date]
      additionalProperties: false
      properties:
        personId:
          type: string
          format: uuid
        creditorName:
          type: string
          minLength: 1
          maxLength: 100
        direction:
          $ref: '#/components/schemas/DebtDirection'
        principal:
          $ref: '#/components/schemas/AmountInput'
        date:
          type: string
          format: date
          description: Data da dívida (competência do consumo, se houver `categoryId`).
        expectedDate:
          type: [string, 'null']
          format: date
          description: Previsão de pagamento/cobrança. Sem ela a dívida fica em `undated` e fora dos horizontes (S-145).
        description:
          type: string
          minLength: 1
          maxLength: 200
        categoryId:
          type: [string, 'null']
          format: uuid
          description: Categoria `EXPENSE`; só em `PAYABLE` (S-137).
    DebtUpdate:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        expectedDate:
          type: [string, 'null']
          format: date
        description:
          type: string
          minLength: 1
          maxLength: 200
        version:
          type: integer
          format: int64
    DebtReasonInput:
      type: object
      description: |
        Motivo do perdão e do estorno do registro. O motivo é obrigatório, mas a recusa é regra de negócio: corpo sem motivo ou em
        branco → `422 DEBT_REASON_REQUIRED` (não `400`).
      additionalProperties: false
      properties:
        reason:
          type: [string, 'null']
          maxLength: 500
    DebtOverviewPlan:
      type: object
      description: Compra parcelada (2x ou mais) com parcelas não canceladas em faturas não pagas.
      required: [purchaseId, description, ongoing, installmentAmount, totalInstallments, remainingInstallments, nextInstallmentNumber, remaining, nextDueDate, lastDueDate]
      additionalProperties: false
      properties:
        purchaseId:
          type: string
          format: uuid
        description:
          type: [string, 'null']
        ongoing:
          type: boolean
          description: Cadastrada já em andamento (`Transaction.source = ONGOING`).
        installmentAmount:
          $ref: '#/components/schemas/Money'
          description: Valor da próxima parcela.
        totalInstallments:
          type: integer
        remainingInstallments:
          type: integer
          description: Parcelas ainda não pagas e não canceladas.
        nextInstallmentNumber:
          type: integer
        remaining:
          $ref: '#/components/schemas/Money'
          description: Σ das parcelas ainda não pagas e não canceladas.
        nextDueDate:
          type: string
          format: date
        lastDueDate:
          type: string
          format: date
    DebtOverviewCardItem:
      type: object
      description: |
        Um cartão. Identidade: `total = Σ plans[].remaining + otherCharges + adjustment`, com `adjustment ≤ 0` (0 sem pagamento
        parcial, crédito transportado nem reembolso em fatura não paga). `total = invoiced + future`.
      required: [card, total, invoiced, future, otherCharges, adjustment, plans]
      additionalProperties: false
      properties:
        card:
          type: object
          required: [id, name]
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        total:
          $ref: '#/components/schemas/Money'
        invoiced:
          $ref: '#/components/schemas/Money'
          description: Faturas aberta, fechada e vencida.
        future:
          $ref: '#/components/schemas/Money'
          description: Faturas futuras.
        otherCharges:
          $ref: '#/components/schemas/Money'
          description: Compras à vista (1x) em fatura não paga.
        adjustment:
          $ref: '#/components/schemas/Money'
          description: Pagamento parcial, crédito transportado e reembolso (≤ 0).
        plans:
          type: array
          items:
            $ref: '#/components/schemas/DebtOverviewPlan'
    DebtOverviewDebtItem:
      type: object
      required: [debtId, person, creditorName, description, outstanding, expectedDate, overdue]
      additionalProperties: false
      properties:
        debtId:
          type: string
          format: uuid
        person:
          description: Nulo na dívida com credor livre.
          oneOf:
            - $ref: '#/components/schemas/PersonRef'
            - type: 'null'
        creditorName:
          type: string
          description: Nome da pessoa ou do credor livre.
        description:
          type: [string, 'null']
        outstanding:
          $ref: '#/components/schemas/Money'
        expectedDate:
          type: [string, 'null']
          format: date
        overdue:
          type: boolean
    DebtOverviewGroup:
      type: object
      required: [total, items]
      additionalProperties: false
      properties:
        total:
          $ref: '#/components/schemas/Money'
        items:
          type: array
          items:
            $ref: '#/components/schemas/DebtOverviewDebtItem'
    DebtOverviewPoint:
      type: object
      required: [competence, cards, people, other, total, remainingAfter]
      additionalProperties: false
      properties:
        competence:
          $ref: '#/components/schemas/Competence'
        cards:
          $ref: '#/components/schemas/Money'
        people:
          $ref: '#/components/schemas/Money'
        other:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        remainingAfter:
          $ref: '#/components/schemas/Money'
    HistoricalInvoiceRequest:
      type: object
      required: [closingDate, amount, description]
      additionalProperties: false
      properties:
        closingDate:
          type: string
          format: date
          description: Fechamento da fatura (data de fechamento do calendário do cartão, já passada).
        amount:
          $ref: '#/components/schemas/AmountInput'
        description:
          type: string
          minLength: 1
          maxLength: 200
    CardClosingConfirmationInput:
      type: object
      required: [confirmed, version]
      additionalProperties: false
      properties:
        confirmed:
          type: boolean
        version:
          type: integer
          format: int64
    CommitmentKind:
      type: string
      enum: [TRACKED_THIRD_PARTY, LONG_TERM_PROJECT]
    CommitmentItemType:
      type: string
      enum: [DOWN_PAYMENT, INSTALLMENT, EXTRAORDINARY, FINANCING]
    CommitmentItem:
      type: object
      required: [position, label, type, dueDate, amount, paid, paidOn]
      additionalProperties: false
      properties:
        provenance:
          $ref: '#/components/schemas/Provenance'
        shares:
          type: array
          description: Cota gravada por pessoa; vazia quando `sharesDefined = false`.
          items:
            $ref: '#/components/schemas/CommitmentShare'
        sharesDefined:
          type: boolean
          description: '`false` = cota não definida (conta 100% minha, estimada, P-19).'
        coBuyerPersonId:
          type: [string, 'null']
          format: uuid
        position:
          type: integer
        label:
          type: string
        type:
          $ref: '#/components/schemas/CommitmentItemType'
        dueDate:
          type: [string, 'null']
          format: date
        amount:
          $ref: '#/components/schemas/Money'
        paid:
          type: boolean
        paidOn:
          type: [string, 'null']
          format: date
    CommitmentMonth:
      type: object
      required: [competence, amount]
      additionalProperties: false
      properties:
        competence:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        amount:
          $ref: '#/components/schemas/Money'
    Commitment:
      type: object
      description: |
        Compromisso acompanhado (2.14.0). `total`, `nominalBalance` e `progress` só existem no projeto (`LONG_TERM_PROJECT`); no empréstimo de
        terceiro são `null` (o saldo exato não é conhecido nem estimado). `directPending` e `financingPending` só no projeto.
      required: [id, kind, name, counterparty, notes, total, paid, nominalBalance, progress, installmentsTotal, installmentsPaid, remainingInstallments, nextDueDate, directPending, financingPending, pendingByMonth, schedule, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        clauses:
          oneOf:
            - $ref: '#/components/schemas/CommitmentClauses'
            - type: 'null'
          description: Cláusulas (2.31.0); `null` sem cláusulas ou fora de `LONG_TERM_PROJECT`.
        totalsByPerson:
          type: array
          description: Pago, pendente e total por pessoa (2.31.0); só no projeto, vazio nos demais. O que não tem cota definida soma em "eu".
          items:
            $ref: '#/components/schemas/CommitmentPersonTotals'
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/CommitmentKind'
        name:
          type: string
        counterparty:
          type: [string, 'null']
        notes:
          type: [string, 'null']
        total:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        paid:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        nominalBalance:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        progress:
          type: [string, 'null']
          description: Razão pago ÷ total com 4 casas (`0.0227`).
        installmentsTotal:
          type: [integer, 'null']
        installmentsPaid:
          type: [integer, 'null']
        remainingInstallments:
          type: [integer, 'null']
        nextDueDate:
          type: [string, 'null']
          format: date
        directPending:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        financingPending:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        pendingByMonth:
          type: array
          items:
            $ref: '#/components/schemas/CommitmentMonth'
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/CommitmentItem'
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CommitmentSlice:
      type: object
      required: [items, hasNext]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Commitment'
        hasNext:
          type: boolean
    CommitmentItemInput:
      type: object
      required: [label, type, amount]
      additionalProperties: false
      properties:
        provenance:
          $ref: '#/components/schemas/Provenance'
        shares:
          type: [array, 'null']
          maxItems: 10
          description: |
            Cota por pessoa (`personId: null` = eu), em valor; Σ = `amount` do item (senão `422 COMMITMENT_SHARES_INVALID`). Ausente ou `null` = "cota
            não definida" (conta 100% minha, estimada). Só em `LONG_TERM_PROJECT`.
          items:
            $ref: '#/components/schemas/CommitmentShareInput'
        coBuyerPersonId:
          type: [string, 'null']
          format: uuid
