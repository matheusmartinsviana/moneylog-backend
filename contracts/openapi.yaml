          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Imports]
      operationId: discardImport
      summary: Descarta um lote ainda em revisão
      description: |
        Apaga o lote e as linhas dele. Só vale em `PENDING_REVIEW` (nada foi aplicado, então não há o que estornar); lote aplicado ou desfeito
        responde `422 IMPORT_BATCH_NOT_PENDING`. Equivale a `POST /v1/imports/{id}/discard`.
      responses:
