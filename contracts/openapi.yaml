  /v1/insights:
    get:
      tags: [Insights]
      operationId: listInsights
      summary: Insights do mês (alias de `/v1/insights/monthly`, paginado)
      description: |
        Alias de `GET /v1/insights/monthly` mantido para clientes antigos: só os insights `CATEGORY_DELTA` e `CARD_COMMITTED`, com exatamente os
        campos de sempre (`type`, `key`, `params`, `factRefs`, `source`), sem nenhum campo novo e sem os demais tipos. Paginado por `page` e
        `pageSize`. Mês sem dados = lista vazia. Clientes novos usam `/v1/insights/monthly`.
      parameters:
        - name: month
          in: query
          description: Competência `AAAA-MM` (padrão = mês corrente).
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/View'
      responses:
        '200':
          description: Página de insights.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightSlice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/insights/monthly:
    get:
      tags: [Insights]
      operationId: listMonthlyInsights
      summary: Insights do mês, ordenados e sem repetição
      description: |
        Calculados pelo backend sobre o razão (uma leitura por requisição). Ordem estável: `severity` (ALERT, ATTENTION, POSITIVE, INFO), depois
        `priority` decrescente, depois a magnitude em centavos e `type`/`id`. Tipos: `SAVINGS_RATE`, `SPEND_VS_BASELINE`, `CATEGORY_DELTA`,
        `MONTH_PROJECTION`, `FREE_MONEY`, `COMMITMENT_INDEX`, `DEBT_SERVICE`, `INSTALLMENT_LOAD`, `EMERGENCY_COVERAGE`, `INCOME_STABILITY`,
        `GOAL_PACE`, `CONCENTRATION`, `CARD_COMMITTED`, `CARD_LIMIT_USAGE`, `RECURRING_DETECTED`. Os que dependem do estado de hoje
        (projeção, dinheiro livre, cobertura da reserva, metas, limite do cartão) só saem no mês corrente. `insufficient[]` diz por que um
        insight não saiu. Mês futuro responde `insufficient: [{type: ALL, reason: FUTURE_MONTH}]`.
      parameters:
        - name: month
          in: query
          description: Competência `AAAA-MM` (padrão = mês corrente).
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
        - $ref: '#/components/parameters/InsightLimit'
        - $ref: '#/components/parameters/IncludeDismissed'
        - $ref: '#/components/parameters/View'
      responses:
        '200':
          description: Os insights do mês.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/insights/daily:
    get:
      tags: [Insights]
      operationId: listDailyInsights
      summary: Insights do dia (fuso do usuário)
      description: |
        Tipos: `DAILY_BUDGET`, `TODAY_VS_AVERAGE`, `DUE_SOON`, `MIN_BALANCE_FORECAST`, `ATYPICAL_ENTRY`, `CARD_CLOSING_SOON`. `date` padrão = hoje no
