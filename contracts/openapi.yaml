    get:
      tags: [Cards]
      operationId: previewBillingChange
      summary: Prévia da mudança de fechamento/vencimento (não grava nada)
      description: |
        Devolve a primeira fatura afetada, quantas parcelas/créditos ativos mudam de fatura e o aviso de S-42 (a mudança
        vale da fatura seguinte à corrente). Calculada pelo mesmo caminho da mudança real, sobre cópias: não grava nada.
        `effectiveFromClosingDate` é o fechamento, **no calendário atual**, da primeira fatura afetada: é o valor que o
        `PUT` devolve em `confirmedEffectiveFrom` (muda quando a fatura corrente vira); `firstNewInvoice` é essa fatura
        no calendário novo. Dia fora de 1..31 → `422 CARD_INVALID_BILLING_DAY`.
