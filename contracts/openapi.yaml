          type: integer
          format: int64
    CommitmentClausesInput:
      type: object
      description: Cláusulas do contrato, em pontos-base (10000 = 100%).
      required: [lateFeeBps, monthlyInterestBps, terminationRetentionBps]
      additionalProperties: false
      properties:
        lateFeeBps:
          type: integer
          minimum: 0
          maximum: 10000
          description: Multa por atraso (200 = 2%).
        monthlyInterestBps:
          type: integer
          minimum: 0
          maximum: 10000
          description: Juros de mora ao mês (100 = 1% a.m.).
        terminationRetentionBps:
          type: integer
          minimum: 0
          maximum: 10000
          description: Retenção sobre o preço em caso de rescisão (700 = 7%).
        notes:
          type: [string, 'null']
          maxLength: 1000
    CommitmentClausesUpdate:
      type: object
      required: [clauses, version]
      additionalProperties: false
      properties:
        clauses:
          $ref: '#/components/schemas/CommitmentClausesInput'
        version:
          type: integer
          format: int64
    CommitmentClauses:
      type: object
      required: [lateFeeBps, monthlyInterestBps, terminationRetentionBps, terminationRetentionAmount, notes]
      additionalProperties: false
      properties:
        lateFeeBps:
          type: integer
        monthlyInterestBps:
          type: integer
        terminationRetentionBps:
          type: integer
        terminationRetentionAmount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Retenção sobre o preço (`total x terminationRetentionBps / 10000`, arredondado para baixo), calculada pelo backend; `null` sem total.
        notes:
          type: [string, 'null']
    CommitmentPersonTotals:
      type: object
      required: [personId, paid, pending, total]
      additionalProperties: false
      properties:
        personId:
          type: [string, 'null']
          format: uuid
          description: Pessoa; `null` = eu.
        paid:
          $ref: '#/components/schemas/Money'
        pending:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
    CommitmentPersonItem:
      type: object
      required: [position, label, type, dueDate, amount, paid, estimated]
      additionalProperties: false
      properties:
        position:
          type: integer
        label:
          type: string
        type:
          $ref: '#/components/schemas/CommitmentItemType'
        dueDate:
          type: [string, 'null']
          format: date
        amount:
          $ref: '#/components/schemas/Money'
          description: Cota da pessoa neste item.
        paid:
          type: boolean
        estimated:
          type: boolean
          description: '`true` quando a cota não foi definida (conta 100% minha).'
    CommitmentPersonBlock:
      type: object
      required: [personId, items, paid, pending, total]
      additionalProperties: false
      properties:
        personId:
          type: [string, 'null']
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/CommitmentPersonItem'
        paid:
          $ref: '#/components/schemas/Money'
        pending:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
    CommitmentByPerson:
      type: object
      required: [commitmentId, name, people, undefinedItems]
      additionalProperties: false
      properties:
        commitmentId:
          type: string
          format: uuid
        name:
          type: string
        people:
          type: array
          items:
            $ref: '#/components/schemas/CommitmentPersonBlock'
        undefinedItems:
          type: array
          description: Posições dos itens sem cota definida.
          items:
            type: integer

    PurchaseSimulationInput:
      type: object
      required: [amount, installments, firstInstallmentMonth]
      additionalProperties: false
      properties:
        amount:
          $ref: '#/components/schemas/AmountInput'
          description: Valor total da compra, sem juros.
        installments:
          type: integer
          minimum: 1
          maximum: 36
          description: Número de parcelas, de 1 a 36. Fora da faixa responde `422 SIMULATION_INVALID`.
        interestRatePerMonthBps:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
          description: Juros ao mês em pontos-base, de 0 a 10000 (fora da faixa responde `422 SIMULATION_INVALID`). A parcela vem do mesmo cálculo da criação da compra.
        firstInstallmentMonth:
          $ref: '#/components/schemas/Competence'
        cancelSubscriptionIds:
          type: array
          maxItems: 50
          uniqueItems: true
          description: Assinaturas ativas que o usuário cancelaria; só elas compensam o impacto (P-8).
          items:
            type: string
            format: uuid
    SimulationClassification:
      type: string
      description: Regra estrutural da ADR-030, sem limiar numérico. Com `horizon.limited` nunca é `SUSTAINABLE`.
      enum: [SUSTAINABLE, VIABLE_WITH_PLANNING, RISKY, INCOMPATIBLE]
    SimulationReasonCode:
      type: string
      description: |
        Código aberto, chave de i18n no front. Conhecidos: `NEGATIVE_EVEN_WITH_CUTS` (INCOMPATIBLE), `NEGATIVE_WITHOUT_CUTS` (INCOMPATIBLE sem cortes
        informados), `NEGATIVE_FIXED_WITH_CUTS` (VIABLE_WITH_PLANNING), `FINANCING_PENDING`, `ESTIMATED_INCOME_NEEDED`, `HORIZON_LIMITED`, `NO_NEGATIVE_MONTH`.
      pattern: '^[A-Z][A-Z0-9_]*$'
    SimulationReason:
      type: object
      required: [code, competence, params]
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/SimulationReasonCode'
        competence:
          oneOf:
            - $ref: '#/components/schemas/Competence'
            - type: 'null'
        params:
          type: object
          additionalProperties: {type: string}
    SimulationHorizon:
      type: object
      description: |
        Janela que o motor calculou. `requiredMonths` = meses da primeira parcela à última. `limited = requiredMonths > calculatedMonths`.
      required: [from, to, calculatedMonths, requiredMonths, limited]
      additionalProperties: false
      properties:
        from:
          $ref: '#/components/schemas/Competence'
        to:
          $ref: '#/components/schemas/Competence'
        calculatedMonths:
          type: integer
          minimum: 1
        requiredMonths:
          type: integer
          minimum: 1
        limited:
          type: boolean
    SimulationMonth:
      type: object
      required: [competence, surplusBefore, surplusAfter, delta, negativeAfter, cutsMonthly, surplusAfterWithCuts, negativeAfterWithCuts, confidence]
      additionalProperties: false
      properties:
        competence:
          $ref: '#/components/schemas/Competence'
        surplusBefore:
          $ref: '#/components/schemas/Money'
          description: Sobra do mês sem a compra (a do `owner-statement`).
        surplusAfter:
          $ref: '#/components/schemas/Money'
          description: '`surplusBefore - parcela` do mês, sem cortes.'
        delta:
          $ref: '#/components/schemas/Money'
          description: '`surplusAfter - surplusBefore` (negativo: o peso da parcela).'
        negativeAfter:
          type: boolean
          description: '`surplusAfter < 0`.'
        cutsMonthly:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Σ do equivalente mensal das assinaturas escolhidas, a partir da data atual. `null` sem cortes.
        surplusAfterWithCuts:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: '`surplusAfter + cutsMonthly`. `null` sem cortes.'
        negativeAfterWithCuts:
          type: [boolean, 'null']
        confidence:
          $ref: '#/components/schemas/OwnerConfidence'
          description: '`ESTIMATED` quando a renda do mês tem item estimado (proveniência).'
    PurchaseSimulation:
      type: object
      required: [installmentAmount, total, months, horizon, classification, reasons, endBalanceMin, endBalanceMinWithCuts, financingWarning]
      additionalProperties: false
      properties:
        installmentAmount:
          $ref: '#/components/schemas/Money'
          description: Primeira parcela (leva o resto de centavo), a mesma da criação da compra.
        total:
          $ref: '#/components/schemas/Money'
          description: Total da compra com juros.
        months:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: '#/components/schemas/SimulationMonth'
        horizon:
          $ref: '#/components/schemas/SimulationHorizon'
        classification:
          $ref: '#/components/schemas/SimulationClassification'
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/SimulationReason'
        endBalanceMin:
          $ref: '#/components/schemas/Money'
          description: Menor `endBalance` dos meses calculados, com a compra e sem cortes.
        endBalanceMinWithCuts:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        financingWarning:
          type: boolean
          description: Há financiamento pendente (P-20).
