        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/CategoryKind'
        system:
          type: boolean
          description: Criada pelo seed (tem `system_key` estável).
        archived:
          type: boolean
        version:
          type: integer
          format: int64
    CategoryInput:
      type: object
      required: [name, kind]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        kind:
          $ref: '#/components/schemas/CategoryKind'
    CategoryUpdate:
      type: object
      required: [name, version]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        version:
