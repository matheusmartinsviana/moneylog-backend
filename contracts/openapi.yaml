          format: uuid
          description: Categoria `INCOME`.
        method:
          $ref: '#/components/schemas/PaymentMethod'
        incomeCompetence:
          type: [string, 'null']
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: |
            Mês a que a renda pertence (`AAAA-MM`), quando difere do mês da `date` (ADR-017): o adiantamento pago em 16/09 e atribuído a
            `2026-10` conta como renda de outubro. Ausente ou `null` = o mês da `date`. O saldo e o caixa seguem na `date`. Fora de 2000-01..2100-12
            → `422 INCOME_COMPETENCE_INVALID`. Só em `INCOME`.
