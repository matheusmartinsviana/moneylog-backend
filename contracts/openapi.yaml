      description: |
        Monta o payload **já minimizado e redigido** (só agregados do `MonthlySummary` e insights; nenhum id, descrição de movimentação, nome de
        conta/pessoa, e-mail, nota ou nome do usuário; nome de favorecido de PIX/TED/DOC nunca vai, só o tipo da operação). Vale 15 minutos e é de uso
        único. Funciona com a IA desligada (transparência). Finalidades ainda sem fatos montados respondem `422 AI_PURPOSE_NOT_SUPPORTED`
        (hoje só `MONTHLY_SUMMARY` e `INSIGHTS`).
      requestBody:
