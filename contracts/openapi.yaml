      unevaluatedProperties: false
    NewDebtInput:
      type: object
      description: Dívida que nasce junto com a movimentação. O principal é o valor da movimentação e a data é a dela.
      required: [personId]
      additionalProperties: false
      properties:
        personId:
          type: string
          format: uuid
        expectedDate:
          type: [string, 'null']
          format: date
        description:
          type: [string, 'null']
          maxLength: 200
    ExpenseShareInput:
      type: object
      description: |
        Parte de uma despesa dividida (S-40, S-137): `amount` é o que a pessoa deve. Σ das partes tem de ser **menor** que o
        valor da despesa (`422 SHARES_EXCEED_AMOUNT`); pagar tudo "pelo João" é `LOAN_GIVEN`.
      required: [amount, newDebt]
      additionalProperties: false
      properties:
        amount:
          $ref: '#/components/schemas/AmountInput'
        newDebt:
          $ref: '#/components/schemas/NewDebtInput'
    LoanGivenInput:
      type: object
      description: |
        Dinheiro emprestado (`LOAN_GIVEN`): `ACCOUNT −X / RECEIVABLE +X`, sem despesa. Informe `newDebt` **ou** `debtId`
        (este só para recusar com o motivo certo: a dívida existente nunca recebe outra origem, `422 DEBT_ALREADY_HAS_ORIGIN`;
        emprestar de novo cria outra dívida).
      required: [type, amount, date, accountId]
      additionalProperties: false
      properties:
        type:
          type: string
          const: LOAN_GIVEN
        amount:
          $ref: '#/components/schemas/AmountInput'
        date:
          type: string
          format: date
        description:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: [string, 'null']
          maxLength: 2000
        accountId:
          type: string
          format: uuid
          description: Conta `CASH`.
        newDebt:
          $ref: '#/components/schemas/NewDebtInput'
        debtId:
          type: string
          format: uuid
      oneOf:
        - required: [newDebt]
        - required: [debtId]
    MoneyReceivedInput:
      type: object
      description: |
        Dinheiro recebido (`MONEY_RECEIVED`), **nunca receita**: devolução de uma `RECEIVABLE` (`debtId`: `ACCOUNT +X /
        RECEIVABLE −X`) ou captação (`newDebt`: cria uma `PAYABLE`, `ACCOUNT +X / PAYABLE −X`, S-6). Informe `debtId` **ou**
        `newDebt`. Devolução acima do saldo → `422 DEBT_SETTLEMENT_EXCEEDS_OUTSTANDING` (S-143).
      required: [type, amount, date, accountId]
      additionalProperties: false
      properties:
        type:
          type: string
          const: MONEY_RECEIVED
        amount:
          $ref: '#/components/schemas/AmountInput'
        date:
          type: string
          format: date
        description:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: [string, 'null']
          maxLength: 2000
        accountId:
          type: string
          format: uuid
          description: Conta `CASH`.
        debtId:
          type: string
          format: uuid
        newDebt:
          $ref: '#/components/schemas/NewDebtInput'
      oneOf:
        - required: [debtId]
        - required: [newDebt]
    DebtPaymentInput:
      type: object
      description: 'Pagamento de dívida (`DEBT_PAYMENT`): `PAYABLE +X / ACCOUNT −X`, sem despesa. Dívida `RECEIVABLE` → `422 DEBT_DIRECTION_MISMATCH`.'
      required: [type, amount, date, accountId, debtId]
      additionalProperties: false
      properties:
        type:
          type: string
          const: DEBT_PAYMENT
        amount:
          $ref: '#/components/schemas/AmountInput'
        date:
          type: string
          format: date
        description:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: [string, 'null']
          maxLength: 2000
        accountId:
          type: string
          format: uuid
          description: Conta `CASH`.
        debtId:
          type: string
          format: uuid
    RecurrenceType:
      type: string
      description: '`CARD_PURCHASE` só à vista (S-144).'
      enum: [EXPENSE, INCOME, CARD_PURCHASE]
    Frequency:
      type: string
      enum: [DAILY, WEEKLY, MONTHLY, YEARLY, CUSTOM]
    IntervalUnit:
      type: string
      enum: [DAYS, WEEKS, MONTHS]
    OccurrenceStatus:
      type: string
      enum: [PENDING, REALIZED, SKIPPED]
    Recurrence:
      type: object
      required:
        - id
        - type
        - amount
        - description
        - category
        - account
        - card
        - method
        - frequency
        - interval
        - unit
        - startDate
        - endDate
        - maxOccurrences
        - active
        - nextOccurrence
        - monthlyEstimate
        - version
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        provenance:
          $ref: '#/components/schemas/Provenance'
        originalAmount:
          oneOf:
            - $ref: '#/components/schemas/OriginalAmount'
            - type: 'null'
        referenceFxRate:
          oneOf:
            - $ref: '#/components/schemas/FxRate'
            - type: 'null'
        iofBps:
          oneOf:
            - $ref: '#/components/schemas/IofBps'
            - type: 'null'
        isSubscription:
          type: boolean
          default: false
          description: Marca explícita de assinatura (2.32.1). Só `GET /v1/subscriptions` e os alertas de assinatura olham as marcadas. `CARD_PURCHASE` existente migra para `true`.
        scope:
          $ref: '#/components/schemas/RecurrenceScope'
        channel:
          type: [string, 'null']
        overlapGroup:
          type: [string, 'null']
        lastUsedOn:
          type: [string, 'null']
          format: date
        activeUntil:
          type: [string, 'null']
          format: date
          description: 'Espelho de `endDate` quando a recorrência foi cancelada com data (2.27.0); `null` sem encerramento.'
        nature:
          description: 'Natureza da despesa (2.25.0). `null` fora de despesa. Registro antigo = `VARIABLE`; recorrência de despesa = `FIXED`.'
          oneOf:
            - $ref: '#/components/schemas/TransactionNature'
            - type: 'null'
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/RecurrenceType'
        amount:
          $ref: '#/components/schemas/Money'
        description:
          type: [string, 'null']
        category:
          $ref: '#/components/schemas/CategoryRef'
        account:
          oneOf:
            - $ref: '#/components/schemas/AccountRef'
            - type: 'null'
        card:
          oneOf:
            - $ref: '#/components/schemas/CardRef'
            - type: 'null'
        method:
          oneOf:
            - $ref: '#/components/schemas/PaymentMethod'
            - type: 'null'
        frequency:
          $ref: '#/components/schemas/Frequency'
        interval:
          type: integer
          minimum: 1
          description: 1 fora de `CUSTOM`.
        unit:
          oneOf:
            - $ref: '#/components/schemas/IntervalUnit'
            - type: 'null'
        startDate:
          type: string
          format: date
        endDate:
          type: [string, 'null']
          format: date
        maxOccurrences:
          type: [integer, 'null']
          minimum: 1
        active:
          type: boolean
          description: '`false` só depois de `POST /deactivate` (definitivo: não há reativação). Encerrar não muda `active`; veja `ended`.'
        ended:
          type: boolean
          description: |
            Derivado (S-235), nunca gravado: `true` quando a agenda não tem ocorrência hoje nem depois (`endDate` anterior a hoje,
            ou `maxOccurrences` esgotado). Uma recorrência encerrada tem `monthlyEstimate = 0,00` e fora do resumo; as ocorrências
            vencidas e não realizadas dela continuam pendentes (S-20). Campo opcional (sempre presente na resposta); ausente = `false`.
        incomeCompetenceOffsetMonths:
          type: integer
          minimum: -1
          maximum: 1
          description: 'Só na recorrência de receita (ADR-017): -1 = ao mês anterior (saldo pago em M+1 é renda de M, ADR-017 emendada); 0 = a renda de cada ocorrência pertence ao mês da data; 1 = ao mês seguinte (salário dividido). 0 nas demais. Campo opcional (2.18.0).'
        splitMode:
          oneOf:
            - $ref: '#/components/schemas/SplitMode'
            - type: 'null'
          description: Rateio das ocorrências (ADR-022); `null` sem rateio. Campo opcional (2.24.0).
        shares:
          type: array
          description: Rateio gravado, como informado; vazio sem rateio. Campo opcional (2.24.0).
          items:
            $ref: '#/components/schemas/PersonShareLine'
        nextOccurrence:
          type: [string, 'null']
          format: date
          description: Próxima ocorrência **pendente** (inclui as vencidas, S-20); `null` se desativada ou sem mais ocorrências.
        monthlyEstimate:
          $ref: '#/components/schemas/Money'
          description: Valor normalizado para o mês (semanal × 52/12 etc.). **Estimativa** (S-146); 0,00 se desativada ou encerrada (`ended`, S-235).
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RecurrenceInput:
      type: object
      description: |
        `EXPENSE`/`INCOME`: `accountId` + `method` (2.14.0: ou nenhum dos dois, "conta a definir", informados ao confirmar cada ocorrência). `CARD_PURCHASE`: `cardId` (à vista). Conta **e** cartão, ou nenhum dos
        dois, → `422 RECURRENCE_INVALID`. Em `CUSTOM`, `interval` (≥ 1) e `unit` são obrigatórios (`interval` ausente ou `null`
        → `422 RECURRENCE_INVALID`, S-242); nas demais não existem.
      required: [type, amount, frequency, startDate]
      additionalProperties: false
      properties:
        provenance:
          $ref: '#/components/schemas/Provenance'
        originalAmount:
          $ref: '#/components/schemas/OriginalAmountInput'
          description: |
            Valor previsto na moeda estrangeira. Com ele, `referenceFxRate` é obrigatório e o `amount` em BRL é **recalculado pelo backend**
            (`original x referenceFxRate` + IOF, um arredondamento); o `amount` enviado é ignorado (o cliente não calcula).
        referenceFxRate:
          $ref: '#/components/schemas/FxRate'
          description: Câmbio-base da previsão. Cada cobrança usa o `fxRate` informado ao confirmar a ocorrência.
        iofBps:
          $ref: '#/components/schemas/IofBps'
        isSubscription:
          type: [boolean, 'null']
          description: Marca de assinatura (2.32.1). Ausente = `false` na criação e inalterado na edição.
        scope:
          $ref: '#/components/schemas/RecurrenceScope'
        channel:
          type: [string, 'null']
          maxLength: 60
          description: Onde a cobrança acontece, em texto livre (por exemplo a loja de aplicativos).
        overlapGroup:
          type: [string, 'null']
          maxLength: 60
          description: Grupo de sobreposição manual; 2 ou mais ativas no mesmo grupo geram aviso.
        lastUsedOn:
          type: [string, 'null']
          format: date
          description: Último uso informado pelo usuário (manual).
        nature:
          $ref: '#/components/schemas/TransactionNature'
        type:
          $ref: '#/components/schemas/RecurrenceType'
        amount:
          $ref: '#/components/schemas/AmountInput'
        description:
          type: string
          minLength: 1
          maxLength: 200
        categoryId:
          type: string
          format: uuid
        accountId:
          type: [string, 'null']
          format: uuid
        method:
          oneOf:
            - $ref: '#/components/schemas/PaymentMethod'
            - type: 'null'
        cardId:
          type: [string, 'null']
          format: uuid
        frequency:
          $ref: '#/components/schemas/Frequency'
        interval:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000
        unit:
          oneOf:
            - $ref: '#/components/schemas/IntervalUnit'
            - type: 'null'
        startDate:
          type: string
          format: date
        endDate:
          type: [string, 'null']
          format: date
        maxOccurrences:
          type: [integer, 'null']
          minimum: 1
          maximum: 10000
        splitMode:
          $ref: '#/components/schemas/SplitMode'
        shares:
          type: array
          maxItems: 20
          description: |
            Rateio de cada ocorrência lançada (ADR-022); só em recorrência de cartão (`type = CARD_PURCHASE`; outro tipo →
            `422 SHARES_INVALID`). Mesmas regras de `CardPurchaseInput.shares`; em `AMOUNT`, o valor é por ocorrência.
          items:
            $ref: '#/components/schemas/ShareInput'
        incomeCompetenceOffsetMonths:
          type: [integer, 'null']
          minimum: -1
          maximum: 1
          description: |
            Só em recorrência de receita (ADR-017; em outro tipo → `422 RECURRENCE_INVALID`): `-1` = `incomeCompetence` = mês da data da ocorrência - 1; `0` (padrão) = a ocorrência realizada
            tem `incomeCompetence` ausente (mês da data); `1` = `incomeCompetence` = mês da data da ocorrência + 1. As ocorrências já
            realizadas não mudam.
    RecurrenceUpdate:
      type: object
      description: Só os dados do modelo (S-139). Frequência e início não existem aqui.
      required: [amount, categoryId, version]
      additionalProperties: false
      properties:
        provenance:
          $ref: '#/components/schemas/Provenance'
        originalAmount:
          $ref: '#/components/schemas/OriginalAmountInput'
          description: |
            Valor previsto na moeda estrangeira. Com ele, `referenceFxRate` é obrigatório e o `amount` em BRL é **recalculado pelo backend**
            (`original x referenceFxRate` + IOF, um arredondamento); o `amount` enviado é ignorado (o cliente não calcula).
        referenceFxRate:
          $ref: '#/components/schemas/FxRate'
          description: Câmbio-base da previsão. Cada cobrança usa o `fxRate` informado ao confirmar a ocorrência.
        iofBps:
          $ref: '#/components/schemas/IofBps'
        isSubscription:
          type: [boolean, 'null']
          description: Marca de assinatura (2.32.1). Ausente = `false` na criação e inalterado na edição.
        scope:
          $ref: '#/components/schemas/RecurrenceScope'
        channel:
          type: [string, 'null']
          maxLength: 60
          description: Onde a cobrança acontece, em texto livre (por exemplo a loja de aplicativos).
        overlapGroup:
          type: [string, 'null']
          maxLength: 60
          description: Grupo de sobreposição manual; 2 ou mais ativas no mesmo grupo geram aviso.
        lastUsedOn:
          type: [string, 'null']
          format: date
          description: Último uso informado pelo usuário (manual).
        nature:
          $ref: '#/components/schemas/TransactionNature'
        amount:
          $ref: '#/components/schemas/AmountInput'
        description:
          type: string
          minLength: 1
          maxLength: 200
        categoryId:
          type: string
          format: uuid
        accountId:
          type: [string, 'null']
          format: uuid
        method:
          oneOf:
            - $ref: '#/components/schemas/PaymentMethod'
            - type: 'null'
        cardId:
          type: [string, 'null']
          format: uuid
        endDate:
          type: [string, 'null']
          format: date
          description: |
            Substitui o fim: ausente ou `null` **remove** o fim (reenvie o atual para mantê-lo). Numa recorrência já **encerrada**
            (`ended`), ausente/`null` reabriria a agenda e é recusado com `422 RECURRENCE_ENDED` (S-236); para reabrir, envie um
            `endDate` de hoje em diante.
        splitMode:
          $ref: '#/components/schemas/SplitMode'
        shares:
          type: array
          maxItems: 20
          description: Ausente mantém o atual. Vale para as ocorrências **futuras**; as já lançadas não mudam.
          items:
            $ref: '#/components/schemas/ShareInput'
        version:
          type: integer
          format: int64
        incomeCompetenceOffsetMonths:
          type: [integer, 'null']
          minimum: -1
          maximum: 1
          description: |
            Ausente mantém o atual. Só em recorrência de receita (ADR-017; em outro tipo → `422 RECURRENCE_INVALID`): `0` =  a ocorrência realizada
            tem `incomeCompetence` ausente (mês da data); `1` = `incomeCompetence` = mês da data da ocorrência + 1. As ocorrências já
            realizadas não mudam.
    RecurrenceEndInput:
      type: object
      additionalProperties: false
      properties:
        activeUntil:
          type: [string, 'null']
          format: date
          description: |
            "Ativa até" (2.27.0): sinônimo de `endDate`. As ocorrências até a data seguem previstas, depois dela não, e a última lançada permanece. Se os
            dois vierem e forem diferentes → `422 RECURRENCE_INVALID`.
        endDate:
          type: [string, 'null']
          format: date
          description: Padrão hoje.
    RecurrenceSlice:
      allOf:
        - $ref: '#/components/schemas/SliceBase'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Recurrence'
      unevaluatedProperties: false
    RecurrenceSummary:
      type: object
      required: [fixedCosts, recurringIncome, estimate, view]
      additionalProperties: false
      properties:
        view:
          $ref: '#/components/schemas/ViewMode'
        fixedCosts:
          $ref: '#/components/schemas/Money'
          description: Custo fixo mensal (estimativa).
        recurringIncome:
          $ref: '#/components/schemas/Money'
          description: Receita recorrente mensal (estimativa).
        estimate:
          type: boolean
          const: true
          description: 'Sempre `true`: o valor é uma estimativa e a tela o rotula assim (S-146).'
    RealizeOccurrenceInput:
      type: object
      additionalProperties: false
      properties:
        originalAmount:
          $ref: '#/components/schemas/OriginalAmountInput'
        fxRate:
          $ref: '#/components/schemas/FxRate'
        iofBps:
          $ref: '#/components/schemas/IofBps'
        amount:
          oneOf:
            - $ref: '#/components/schemas/AmountInput'
            - type: 'null'
          description: 'Valor real (ex.: a conta de luz veio diferente). Padrão = valor do modelo.'
        accountId:
          type: [string, 'null']
          format: uuid
          description: 'Só na recorrência de conta a definir (2.14.0), a conta `CASH` do pagamento. Faltando, `422 RECURRENCE_ACCOUNT_REQUIRED`.'
        method:
          oneOf:
            - $ref: '#/components/schemas/PaymentMethod'
            - type: 'null'
          description: 'Só na recorrência de conta a definir (2.14.0).'
    Occurrence:
      type: object
      description: Ocorrência de uma recorrência (prevista, realizada ou pulada).
      required:
        - recurrenceId
        - date
        - status
        - overdue
        - type
        - direction
        - amount
        - description
        - categoryId
        - accountId
        - cardId
        - transactionId
      additionalProperties: false
      properties:
        recurrenceId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/OccurrenceStatus'
        overdue:
          type: boolean
          description: '`PENDING` com data anterior a hoje (continua pendente até ser realizada ou pulada, S-20).'
        type:
          $ref: '#/components/schemas/RecurrenceType'
        direction:
          type: string
          enum: [IN, OUT]
        amount:
          $ref: '#/components/schemas/Money'
          description: Valor do modelo (`PENDING`/`SKIPPED`) ou o da movimentação (`REALIZED`).
        description:
          type: [string, 'null']
        categoryId:
          type: string
          format: uuid
        accountId:
          type: [string, 'null']
          format: uuid
        cardId:
          type: [string, 'null']
          format: uuid
        transactionId:
          type: [string, 'null']
          format: uuid
          description: Movimentação gerada (só `REALIZED`).
        originalAmount:
          oneOf:
            - $ref: '#/components/schemas/OriginalAmount'
            - type: 'null'
          description: Valor de referência na moeda original da recorrência (2.32.3); `null` em BRL. A cobrança real usa o `fxRate` informado ao realizar.
        referenceFxRate:
          oneOf:
            - $ref: '#/components/schemas/FxRate'
            - type: 'null'
          description: Câmbio-base da recorrência (2.32.3); `null` em BRL. Realizar exige `fxRate` (`FX_RATE_REQUIRED`).
        iofBps:
          oneOf:
            - $ref: '#/components/schemas/IofBps'
            - type: 'null'
          description: IOF de referência da recorrência (2.32.3); `null` em BRL.
    OccurrenceSlice:
      allOf:
        - $ref: '#/components/schemas/SliceBase'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Occurrence'
            overdueTruncated:
              type: boolean
              description: |
                `true` quando havia mais ocorrências pendentes **vencidas** que o limite de 500 por chamada (S-240): só as mais
                recentes vêm. Campo opcional (sempre presente na resposta); ausente = `false`.
      unevaluatedProperties: false

    # ---- Metas (Etapa 5)
    GoalPriority:
      type: string
      description: Prioridade da meta (S-149).
      enum: [HIGH, MEDIUM, LOW]
    GoalStatus:
      type: string
      description: |
        `ARCHIVED` é gravado; `ACHIEVED` é **derivado** (`current` ≥ `target`, S-150) e `ACTIVE` é o resto. Meta atingida continua
        reservando até o usuário liberar ("usar o dinheiro" = uma despesa normal + a liberação da reserva: duas ações, a despesa conta
        uma vez).
      enum: [ACTIVE, ACHIEVED, ARCHIVED]
    SignedAmountInput:
      type: string
      description: |
        Valor com sinal em string decimal com até 2 casas (`^-?\d{1,13}(\.\d{1,2})?$`): positivo reserva, negativo libera. Número JSON e
        3 casas → `400`; zero → `422 GOAL_RESERVATION_AMOUNT_ZERO`; acima do teto de R$ 999.999.999,99 → `422 AMOUNT_ABOVE_LIMIT`.
      pattern: '^-?\d{1,13}(\.\d{1,2})?$'
      examples: ['-2000.00']
    Ratio:
      type: string
      description: Razão decimal com sempre 4 casas, calculada pelo backend (`0.4250` = 42,5%). O front só formata.
      pattern: '^-?\d+\.\d{4}$'
      examples: ['0.4250']
    GoalKind:
      type: string
      description: |
        `SAVINGS` (padrão; a meta de guardar dinheiro por reserva lógica) ou `DEBT_PAYOFF` (2.13.0, "quitar todas as dívidas": sem reservas,
        progresso vindo do total de dívidas em relação à `baseline`). Não entra em `balances.reserved` nem em `uncovered`.
      enum: [SAVINGS, DEBT_PAYOFF, METRIC]
    GoalMetric:
      type: string
      description: |
        Medida acompanhada por uma meta `METRIC` (ADR-016), sempre na mesma fonte da tela: `TOTAL_DEBT`, `CARD_DEBT`, `PEOPLE_DEBT`,
        `OTHER_DEBT` = `total` e `parts` de `GET /v1/debts/overview`; `ACCOUNTS_BALANCE`, `AVAILABLE_BALANCE` = `balances.inAccounts` e
        `balances.available` do dashboard; `FIXED_COSTS_MONTHLY` = `fixedCosts` de `GET /v1/recurrences/summary` com `view = MINE`
        (2.24.0, ADR-022: o custo fixo de uma recorrência rateada vale só pela minha parte; o bruto é `GET /v1/recurrences/summary?view=GROSS`).
        Sem dado, a medida vale 0,00.
      enum: [TOTAL_DEBT, CARD_DEBT, PEOPLE_DEBT, OTHER_DEBT, ACCOUNTS_BALANCE, AVAILABLE_BALANCE, FIXED_COSTS_MONTHLY]
    GoalDirection:
      type: string
      description: >-
        Derivada na criação (e ao mudar alvo ou baseline): `DECREASE` se `target` < `baseline`, `INCREASE` se `target` > `baseline`.
      enum: [DECREASE, INCREASE]
    GoalStage:
      type: string
      description: |
        Derivado em toda leitura (ADR-016): `FANTASY` sem `deadline`; `OBJECTIVE` com prazo; `STRATEGY` com prazo, plano automático válido e
        plano declarado (`planNote` ou ao menos uma ação); `CONSISTENT` = `STRATEGY` com `streak` >= 2; `ACHIEVED` (meta atingida) prevalece.
      enum: [FANTASY, OBJECTIVE, STRATEGY, CONSISTENT, ACHIEVED]
    GoalActionFrequency:
      type: string
      enum: [MONTHLY, WEEKLY, ONE_TIME]
    GoalActionInput:
      type: object
      required: [title, frequency]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        frequency:
          $ref: '#/components/schemas/GoalActionFrequency'
    GoalCheckInInput:
      type: object
      additionalProperties: false
      properties:
        period:
          type: [string, 'null']
          maxLength: 8
          description: '`MONTHLY` `YYYY-MM`; `WEEKLY` `YYYY-Www`; `ONE_TIME` ausente ou `ONCE`.'
        done:
          type: [boolean, 'null']
          description: Ausente = `true`; `false` desmarca.
    GoalAction:
      type: object
      required: [id, title, frequency, doneIn, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        frequency:
          $ref: '#/components/schemas/GoalActionFrequency'
        doneIn:
          type: array
          description: Períodos com check-in (`YYYY-MM`, `YYYY-Www` ou `ONCE`), em ordem.
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    GoalConsistencyMonth:
      type: object
      description: Mês sem instantâneo da medida é "sem dado" (`actual` e `met` nulos), nunca "cumprido". Não há histórico anterior à criação da meta.
      required: [month, expected, actual, met, closed]
      additionalProperties: false
      properties:
        month:
          type: string
          pattern: '^\d{4}-\d{2}$'
        expected:
          $ref: '#/components/schemas/Money'
          description: Valor esperado no fim do mês na trajetória linear.
        actual:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        met:
          type: [boolean, 'null']
        closed:
          type: boolean
          description: O mês já terminou; só os meses fechados contam em `streak` e `consistencyRate`.
    GoalInput:
      type: object
      description: |
        `kind` ausente = `SAVINGS`: `name` e `target` obrigatórios. `kind = METRIC` (ADR-016): `metric` e `target` obrigatórios (`target` pode ser
        0.00), `name` opcional (sem nome, o front mostra o rótulo gerado pela medida), `deadline` e `priority` opcionais; o servidor captura o
        `baseline` (valor atual da medida) e deriva `direction`. `kind = DEBT_PAYOFF`: `target` é ignorado (sem alvo), `name` é opcional
        (padrão "Quitar todas as dívidas"), `deadline` e `priority` opcionais; só uma meta `DEBT_PAYOFF` ativa por usuário
        (`422 DEBT_PAYOFF_GOAL_EXISTS`). A meta nasce "montando" (`baselineSet = false`, `progress` `0.0000`) até `POST /v1/goals/{id}/baseline`.
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/GoalKind'
        name:
          type: string
          minLength: 1
          maxLength: 100
        metric:
          $ref: '#/components/schemas/GoalMetric'
          description: Obrigatório em `kind = METRIC`; ignorado nos demais.
        target:
          $ref: '#/components/schemas/AmountInput'
        deadline:
          type: [string, 'null']
          format: date
          description: Prazo opcional (de 2000-01-01 a 2100-12-31).
        priority:
          $ref: '#/components/schemas/GoalPriority'
        description:
          type: [string, 'null']
          maxLength: 500
    GoalUpdate:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        name:
          type: [string, 'null']
          minLength: 1
          maxLength: 100
          description: Obrigatório em `SAVINGS` (`422` se ausente); opcional em `METRIC`; ausente em `DEBT_PAYOFF` mantém o nome.
        target:
          description: Obrigatório em `SAVINGS`; em `METRIC` e `DEBT_PAYOFF` ausente mantém o atual.
          oneOf:
            - $ref: '#/components/schemas/AmountInput'
            - type: 'null'
        planNote:
          type: [string, 'null']
          maxLength: 500
          description: Texto curto do plano declarado (ADR-016). Ausente ou vazio apaga.
        deadline:
          type: [string, 'null']
          format: date
        priority:
          $ref: '#/components/schemas/GoalPriority'
          description: Opcional (alinhado ao `GoalInput`); ausente mantém a prioridade atual da meta.
        description:
          type: [string, 'null']
          maxLength: 500
        version:
          type: integer
          format: int64
    GoalPhoto:
      type: object
      description: Metadados de uma foto da meta (ADR-018). Os bytes vêm de `GET /v1/goals/{id}/photos/{photoId}/content`.
      additionalProperties: false
      required: [id, position, width, height, createdAt]
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 0
          description: Ordem de exibição; 0 é a capa.
        width:
          type: integer
          description: Largura da versão de exibição, em pixels.
        height:
          type: integer
          description: Altura da versão de exibição, em pixels.
        createdAt:
          type: string
          format: date-time
    GoalPhotoOrderInput:
      type: object
      additionalProperties: false
      required: [photoIds]
      properties:
        photoIds:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
    GoalFeaturedInput:
      type: object
      additionalProperties: false
      required: [featured]
      properties:
        featured:
          type: boolean
    GoalReservationInput:
      type: object
      required: [accountId, amount, date]
      additionalProperties: false
      properties:
        accountId:
          type: string
          format: uuid
          description: Conta `CASH` ou `INVESTMENT` ativa em BRL (para reservar); a liberação aceita conta arquivada.
        amount:
          $ref: '#/components/schemas/SignedAmountInput'
        date:
          type: string
          format: date
          description: Data da reserva (de 2000-01-01 a 2100-12-31). Reserva com data futura só conta a partir dela.
        note:
          type: [string, 'null']
          maxLength: 200
    GoalReservation:
      type: object
      description: Reserva (ou liberação) lógica. Não é movimentação nem lançamento do razão.
      required: [id, account, amount, date, note, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        account:
          $ref: '#/components/schemas/AccountRef'
        amount:
          $ref: '#/components/schemas/Money'
          description: Positivo = reserva; negativo = liberação.
        date:
          type: string
          format: date
        note:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
    Goal:
      type: object
      description: |
        Meta com reserva lógica (S-147). `current` = Σ reservas com data até hoje (reserva soma, liberação subtrai); `progress` =
        `current / target` (4 casas, pode passar de 1); `remaining` = o que falta (nunca negativo); `monthlyNeeded` é uma **estimativa**
        (S-156): `(target − current)` ÷ meses-calendário do mês de hoje ao mês do prazo, ambos inclusive, arredondado para cima ao
        centavo (`null` sem prazo ou com prazo vencido; 0,00 se atingida); `uncovered` = alguma conta com reserva desta meta tem mais
        reservado que saldo (S-148; só avisa). Tudo calculado pelo backend.
      required:
        - id
        - kind
        - name
        - target
        - current
        - progress
        - remaining
        - status
        - deadline
        - priority
        - description
        - monthlyNeeded
        - uncovered
        - reservations
        - baselineSet
        - baseline
        - baselineAt
        - grewSinceBaseline
        - metric
        - direction
        - reached
        - metricAsOf
        - stage
        - requiredPace
        - monthsLeft
        - nextMilestone
        - onTrack
        - gap
        - planNote
        - actions
        - consistency
        - streak
        - consistencyRate
        - featured
        - coverPhotoId
        - photos
        - version
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/GoalKind'
        name:
          type: [string, 'null']
          description: Nulo só em `METRIC` sem nome (o front mostra o rótulo gerado pela medida).
        target:
          $ref: '#/components/schemas/Money'
          description: Em `DEBT_PAYOFF`, a `baseline` (0,00 enquanto "montando").
        current:
          description: |
            Em `DEBT_PAYOFF`, `max(0, baseline − remaining)` (quanto já foi quitado). Em `METRIC`, o valor ATUAL da medida (ao vivo);
            nulo em `METRIC` arquivada (meta arquivada não calcula).
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        progress:
          $ref: '#/components/schemas/Ratio'
          description: |
            Em `DEBT_PAYOFF`, `current / baseline` limitado a 0..1 (`0.0000` sem baseline); dívida nova nunca deixa negativo. Em `METRIC`,
            limitado a 0..1: `DECREASE` = (baseline − current) ÷ (baseline − target); `INCREASE` = (current − baseline) ÷ (target − baseline);
            só chega a `1.0000` quando `reached`; `0.0000` se arquivada.
        remaining:
          description: |
            Em `DEBT_PAYOFF`, o total de dívidas hoje (o mesmo de `GET /v1/debts/overview`), mesmo acima da baseline. Em `METRIC`, a distância
            até o alvo (0,00 se atingida; nulo se arquivada).
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        status:
          $ref: '#/components/schemas/GoalStatus'
        deadline:
          type: [string, 'null']
          format: date
        priority:
          $ref: '#/components/schemas/GoalPriority'
        description:
          type: [string, 'null']
        monthlyNeeded:
          description: Estimativa (S-156).
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        uncovered:
          type: boolean
        reservations:
          type: array
          description: Todas as reservas, da mais recente para a mais antiga (sempre vazio em `DEBT_PAYOFF`).
          items:
            $ref: '#/components/schemas/GoalReservation'
        baselineSet:
          type: boolean
          description: '`DEBT_PAYOFF`: "cadastrei tudo" foi confirmado. `false` = "montando" (sem percentual). Sempre `false` em `SAVINGS`.'
        baseline:
          description: Total de dívidas fixado em "cadastrei tudo"; `null` em `SAVINGS` e enquanto "montando".
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        baselineAt:
          type: [string, 'null']
          format: date-time
        metric:
          oneOf:
            - $ref: '#/components/schemas/GoalMetric'
            - type: 'null'
        direction:
          oneOf:
            - $ref: '#/components/schemas/GoalDirection'
            - type: 'null'
        reached:
          type: boolean
          description: A meta foi atingida (`status = ACHIEVED`).
        metricAsOf:
          type: [string, 'null']
          format: date
          description: Data de referência do cálculo de `current` (só `METRIC` ativa).
        stage:
          $ref: '#/components/schemas/GoalStage'
        requiredPace:
          description: Plano automático (prazo + alvo). Ritmo necessário por mês = distância que falta ÷ `monthsLeft`, para cima ao centavo; 0,00 se atingida; nulo sem prazo ou com prazo vencido.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        monthsLeft:
          type: [integer, 'null']
          description: Meses-calendário do mês de hoje ao mês do prazo (inclusive); 0 com prazo vencido; nulo sem plano automático.
        nextMilestone:
          description: Valor esperado no fim do mês atual na trajetória linear (nulo sem plano automático).
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        onTrack:
          type: [boolean, 'null']
          description: A medida está melhor ou igual à trajetória esperada até o fim do mês passado (ou já foi atingida).
        gap:
          description: 'Diferença para a trajetória (positivo = adiantado, negativo = atrasado).'
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        planNote:
          type: [string, 'null']
          maxLength: 500
        actions:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/GoalAction'
        consistency:
          type: array
          description: Histórico mensal do mês de início ao mês corrente (vazio sem prazo).
          items:
            $ref: '#/components/schemas/GoalConsistencyMonth'
        streak:
          type: integer
          description: Meses fechados seguidos cumprindo o ritmo.
        consistencyRate:
          description: Cumpridos ÷ meses fechados com dado (nulo sem nenhum).
          oneOf:
            - $ref: '#/components/schemas/Ratio'
            - type: 'null'
        featured:
          type: boolean
          description: Meta em destaque da Home (ADR-018). No máximo uma por usuário; só `SAVINGS` ativa.
        coverPhotoId:
          type: [string, 'null']
          format: uuid
          description: Id da capa (a primeira de `photos`); `null` sem fotos.
        photos:
          type: array
          description: Fotos da meta na ordem de exibição (só metadados; só `SAVINGS`, vazio nos demais tipos).
          items:
            $ref: '#/components/schemas/GoalPhoto'
        grewSinceBaseline:
          type: boolean
          description: |
            `DEBT_PAYOFF`: o total de dívidas passou da baseline (dívida nova depois de ancorar). Nada é re-ancorado sozinho; o aviso é
            da UI e re-ancorar é `POST /v1/goals/{id}/baseline`. `ACHIEVED` só com baseline e total 0,00; total 0 sem baseline não é conquista.
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      examples:
        - id: 5b0f6c3e-7e0a-4f6b-9d57-0e8f3a1c2b10
          kind: SAVINGS
          name: Reserva de emergência
          target: { amount: '20000.00', currency: BRL }
          current: { amount: '8500.00', currency: BRL }
          progress: '0.4250'
          remaining: { amount: '11500.00', currency: BRL }
          status: ACTIVE
          deadline: '2027-12-31'
          priority: HIGH
          description: Seis meses de custo fixo
          monthlyNeeded: { amount: '766.67', currency: BRL }
          uncovered: false
          reservations:
            - id: 0c8a1d52-3f1e-4c0b-8a67-5d2e9b7f4a31
              account: { id: 3d6f1a90-1b2c-4d5e-8f70-a1b2c3d4e5f6, name: Nubank }
              amount: { amount: '8500.00', currency: BRL }
              date: '2026-10-10'
              note: null
              createdAt: '2026-10-10T13:00:00Z'
          baselineSet: false
          baseline: null
          baselineAt: null
          grewSinceBaseline: false
          metric: null
          direction: null
          reached: false
          metricAsOf: null
          stage: OBJECTIVE
          requiredPace: { amount: '766.67', currency: BRL }
          monthsLeft: 15
          nextMilestone: { amount: '1000.00', currency: BRL }
          onTrack: true
          gap: { amount: '0.00', currency: BRL }
          planNote: null
          actions: []
          consistency: []
          streak: 0
          consistencyRate: null
          featured: false
          coverPhotoId: null
          photos: []
          version: 1
          createdAt: '2026-10-10T12:00:00Z'
          updatedAt: '2026-10-10T13:00:00Z'
    GoalSlice:
      allOf:
        - $ref: '#/components/schemas/SliceBase'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Goal'
      unevaluatedProperties: false

    # ---- Resumo mensal (Etapa 5)
    SummaryDelta:
      type: object
      description: Diferença do mês em relação ao anterior. `percent` = `amount` ÷ |anterior| (4 casas), `null` se a base for 0.
      required: [amount, percent]
      additionalProperties: false
      properties:
        amount:
          $ref: '#/components/schemas/Money'
          description: Pode ser negativo; 0,00 quando iguais.
        percent:
          oneOf:
            - $ref: '#/components/schemas/Ratio'
            - type: 'null'
    SummaryTotals:
      type: object
      description: Totais de um mês, para a comparação.
      required: [competence, income, expenses, investments, net]
      additionalProperties: false
      properties:
        competence:
          $ref: '#/components/schemas/Competence'
        income:
          $ref: '#/components/schemas/Money'
        expenses:
          $ref: '#/components/schemas/Money'
        investments:
          $ref: '#/components/schemas/Money'
        net:
          $ref: '#/components/schemas/Money'
        savingsRate:
          description: |
            Taxa de poupança do mês (`net / income`, 4 casas; `null` sem receitas). **Opcional** (2.6.0, redesign); o backend sempre a envia.
          oneOf:
            - $ref: '#/components/schemas/Ratio'
            - type: 'null'
    SummaryComparison:
      type: object
      required: [previousMonth, incomeDelta, expensesDelta, investmentsDelta, netDelta]
      additionalProperties: false
      properties:
        previousMonth:
          $ref: '#/components/schemas/SummaryTotals'
        incomeDelta:
          $ref: '#/components/schemas/SummaryDelta'
        expensesDelta:
          $ref: '#/components/schemas/SummaryDelta'
        investmentsDelta:
          $ref: '#/components/schemas/SummaryDelta'
        netDelta:
          $ref: '#/components/schemas/SummaryDelta'
        savingsRateDelta:
          description: |
            Taxa de poupança do mês − a do mês anterior, **em pontos percentuais** (não é variação relativa), calculada sobre as duas taxas
            **já arredondadas** (o que o usuário vê é o que fecha): `0.9167 − 0.9500 = -0.0333`. `null` se alguma das duas taxas for `null`.
            **Opcional** (2.6.0, redesign); o backend sempre a envia. No mês corrente (`partial: true`) compara um mês em andamento com o
            anterior inteiro: não é tendência.
          oneOf:
            - $ref: '#/components/schemas/Ratio'
            - type: 'null'
    SummaryLargestCategory:
      type: object
      required: [category, amount]
      additionalProperties: false
      properties:
        category:
          $ref: '#/components/schemas/CategoryRef'
        amount:
          $ref: '#/components/schemas/Money'
    SummaryLargestExpense:
      type: object
      description: |
        Maior lançamento de consumo da competência (a parcela, não a compra inteira). Da movimentação (`transactionId`) ou, se vier de
        dívida de consumo (S-137), da dívida (`debtId`, sem movimentação).
      required: [transactionId, debtId, description, category, date, amount, installmentNumber, installmentTotal]
      additionalProperties: false
      properties:
        transactionId:
          type: [string, 'null']
          format: uuid
        debtId:
          type: [string, 'null']
          format: uuid
        description:
          type: [string, 'null']
        category:
          $ref: '#/components/schemas/CategoryRef'
        date:
          type: string
          format: date
        amount:
          $ref: '#/components/schemas/Money'
        installmentNumber:
          type: [integer, 'null']
        installmentTotal:
          type: [integer, 'null']
    SummaryCard:
      type: object
      required: [consumption, outstanding]
      additionalProperties: false
      properties:
        consumption:
          $ref: '#/components/schemas/Money'
          description: Consumo no crédito da competência (cada parcela no mês dela).
        outstanding:
          $ref: '#/components/schemas/Money'
          description: Σ `outstanding` das faturas (não pagas) que vencem no mês.
    MonthlySummary:
      type: object
      description: Resumo do mês (PR 00 §32, S-151), calculado pelo backend pelo mesmo caminho do dashboard e da lista.
      required:
        - view
        - competence
        - partial
        - isProjection
        - income
        - expenses
        - investments
        - net
        - savingsRate
        - largestCategory
        - largestExpense
        - card
        - futureInstallments
        - comparison
      additionalProperties: false
      properties:
        view:
          $ref: '#/components/schemas/ViewMode'
        competence:
          $ref: '#/components/schemas/Competence'
        partial:
          type: boolean
          description: Mês corrente ou futuro (ainda não terminou).
        isProjection:
          type: boolean
          description: Mês futuro (só o que já existe).
        income:
          $ref: '#/components/schemas/Money'
        expenses:
          $ref: '#/components/schemas/Money'
          description: Consumo (despesas + crédito − reembolsos), o mesmo `month.consumption` do dashboard.
        investments:
          $ref: '#/components/schemas/Money'
          description: Aplicações − resgates líquidos. Linha própria, **fora** do consumo.
        net:
          $ref: '#/components/schemas/Money'
          description: '`income` − `expenses` (S-23).'
        savingsRate:
          description: '`net / income` (4 casas); `null` sem receitas no mês.'
          oneOf:
            - $ref: '#/components/schemas/Ratio'
            - type: 'null'
        largestCategory:
          oneOf:
            - $ref: '#/components/schemas/SummaryLargestCategory'
            - type: 'null'
        largestExpense:
          oneOf:
            - $ref: '#/components/schemas/SummaryLargestExpense'
            - type: 'null'
        card:
          $ref: '#/components/schemas/SummaryCard'
        futureInstallments:
          $ref: '#/components/schemas/Money'
          description: Parcelas com competência depois do mês.
        comparison:
          $ref: '#/components/schemas/SummaryComparison'
      examples:
        - view: MINE
          competence: '2026-10'
          partial: true
          isProjection: false
          income: { amount: '3000.00', currency: BRL }
          expenses: { amount: '250.00', currency: BRL }
          investments: { amount: '10000.00', currency: BRL }
          net: { amount: '2750.00', currency: BRL }
          savingsRate: '0.9167'
          largestCategory:
            category: { id: 8a3c6b10-5e2f-4d7a-9b41-c0d1e2f3a4b5, name: Tecnologia }
            amount: { amount: '200.00', currency: BRL }
          largestExpense:
            transactionId: 6e1f2a30-4b5c-4d6e-8f70-91a2b3c4d5e6
            debtId: null
            description: Notebook
            category: { id: 8a3c6b10-5e2f-4d7a-9b41-c0d1e2f3a4b5, name: Tecnologia }
            date: '2026-10-10'
            amount: { amount: '200.00', currency: BRL }
            installmentNumber: 1
            installmentTotal: 6
          card:
            consumption: { amount: '200.00', currency: BRL }
            outstanding: { amount: '200.00', currency: BRL }
          futureInstallments: { amount: '1000.00', currency: BRL }
          comparison:
            previousMonth:
              competence: '2026-09'
              income: { amount: '3000.00', currency: BRL }
              expenses: { amount: '150.00', currency: BRL }
              investments: { amount: '0.00', currency: BRL }
              net: { amount: '2850.00', currency: BRL }
              savingsRate: '0.9500'
            incomeDelta:
              amount: { amount: '0.00', currency: BRL }
              percent: '0.0000'
            expensesDelta:
              amount: { amount: '100.00', currency: BRL }
              percent: '0.6667'
            investmentsDelta:
              amount: { amount: '10000.00', currency: BRL }
              percent: null
            netDelta:
              amount: { amount: '-100.00', currency: BRL }
              percent: '-0.0351'
            savingsRateDelta: '-0.0333'

    # ---- Projeções (Etapa 5)
    ProjectionHorizon:
      type: string
      description: '`D30` e `D90` = 30 e 90 dias; `M6` e `M12` = 6 e 12 meses (S-155).'
      enum: [D30, D90, M6, M12]
    ProjectionPoint:
      type: object
      description: Um mês da série. O 1º traz os vencidos e o resto do mês corrente; o último termina no fim do horizonte (`periodEnd`).
      required: [competence, periodEnd, inflows, outflows, balance]
      additionalProperties: false
      properties:
        competence:
          $ref: '#/components/schemas/Competence'
        periodEnd:
          type: string
          format: date
          description: Último dia coberto pelo ponto.
        inflows:
          $ref: '#/components/schemas/Money'
          description: Entradas previstas no período.
        outflows:
          $ref: '#/components/schemas/Money'
          description: Saídas previstas no período (faturas com as parcelas, dívidas, recorrências).
        balance:
          $ref: '#/components/schemas/Money'
          description: Em contas + entradas acumuladas − saídas acumuladas até o fim do ponto.
    ProjectionGoalInfo:
      type: object
      required: [goalId, name, current, target]
      additionalProperties: false
      properties:
        goalId:
          type: string
          format: uuid
        name:
          type: string
        current:
          $ref: '#/components/schemas/Money'
        target:
          $ref: '#/components/schemas/Money'
    ProjectionGoals:
      type: object
      description: 'O que está reservado em metas. Informativo: reserva **não** é saída e não muda a série.'
      required: [reserved, items]
      additionalProperties: false
      properties:
        reserved:
          $ref: '#/components/schemas/Money'
          description: Σ reservas em contas `CASH` hoje (o `balances.reserved` do dashboard).
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectionGoalInfo'
    ProjectionTrendPoint:
      type: object
      required: [competence, estimatedSpending, balance]
      additionalProperties: false
      properties:
        competence:
          $ref: '#/components/schemas/Competence'
        estimatedSpending:
          $ref: '#/components/schemas/Money'
          description: Gasto novo estimado acumulado (média × meses depois do corrente; o mês parcial do fim do horizonte conta inteiro).
        balance:
          $ref: '#/components/schemas/Money'
          description: O `balance` da série base menos `estimatedSpending`.
    ProjectionTrend:
      type: object
      description: 'Tendência histórica opcional (S-152): **estimativa**, separada da série base.'
      required: [available, estimate, reason, monthlyAverage, basedOn, series]
      additionalProperties: false
      properties:
        available:
          type: boolean
          description: '`false` com menos de 3 meses completos de histórico.'
        estimate:
          type: boolean
          description: Sempre `true`.
        reason:
          type: [string, 'null']
          enum: [INSUFFICIENT_HISTORY, null]
        monthlyAverage:
          description: Média mensal do consumo novo dos 3 meses completos anteriores (`null` se indisponível).
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        basedOn:
          type: array
          description: Os 3 meses usados.
          items:
            $ref: '#/components/schemas/Competence'
        series:
          type: array
          items:
            $ref: '#/components/schemas/ProjectionTrendPoint'
    Projection:
      type: object
      description: Projeção determinística (S-152). **Sempre uma projeção, nunca uma certeza.**
      required: [isProjection, horizon, asOf, startingBalance, series, assumptions, goals]
      additionalProperties: false
      properties:
        isProjection:
          type: boolean
          description: Sempre `true`.
        horizon:
          $ref: '#/components/schemas/ProjectionHorizon'
        asOf:
          type: string
          format: date
          description: Hoje (fuso `America/Sao_Paulo`).
        startingBalance:
          $ref: '#/components/schemas/Money'
          description: Em contas (contas `CASH`) hoje.
        series:
          type: array
          items:
            $ref: '#/components/schemas/ProjectionPoint'
        assumptions:
          type: array
          description: |
            Premissas como chaves traduzíveis (sem texto fixo): `ACTIVE_RECURRENCES` (recorrências ativas),
            `REGISTERED_INVOICES_AND_INSTALLMENTS` (faturas e parcelas já registradas), `DEBTS_WITH_EXPECTED_DATE` (dívidas com data
            prevista) e `NO_NEW_SPENDING_TREND` (a série base não inclui gastos novos). O conjunto pode crescer.
          items:
            type: string
        goals:
          $ref: '#/components/schemas/ProjectionGoals'
        trend:
          description: Só com `includeTrend=true`.
          $ref: '#/components/schemas/ProjectionTrend'
      examples:
        - isProjection: true
          horizon: M6
          asOf: '2026-10-10'
          startingBalance: { amount: '20000.00', currency: BRL }
          series:
            - competence: '2026-10'
              periodEnd: '2026-10-31'
              inflows: { amount: '0.00', currency: BRL }
              outflows: { amount: '0.00', currency: BRL }
              balance: { amount: '20000.00', currency: BRL }
            - competence: '2026-11'
              periodEnd: '2026-11-30'
              inflows: { amount: '3000.00', currency: BRL }
              outflows: { amount: '1402.00', currency: BRL }
              balance: { amount: '21598.00', currency: BRL }
          assumptions:
            - ACTIVE_RECURRENCES
            - REGISTERED_INVOICES_AND_INSTALLMENTS
            - DEBTS_WITH_EXPECTED_DATE
            - NO_NEW_SPENDING_TREND
          goals:
            reserved: { amount: '8500.00', currency: BRL }
            items:
              - goalId: 5b0f6c3e-7e0a-4f6b-9d57-0e8f3a1c2b10
                name: Reserva de emergência
                current: { amount: '8500.00', currency: BRL }
                target: { amount: '20000.00', currency: BRL }

