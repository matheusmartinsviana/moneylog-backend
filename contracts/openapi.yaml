    get:
      tags: [Commitments]
      operationId: getCommitmentByPerson
      summary: Cronograma por pessoa (pago, pendente e total), em JSON ou CSV
      description: |
        Só em `LONG_TERM_PROJECT`. Item sem cota definida soma em "eu" e vem listado em `undefinedItems`. Com `format=csv`: UTF-8 com BOM, separador `;`,
        `CRLF`, vírgula decimal, datas ISO, colunas `posição;descrição;tipo;vencimento;pessoa;valor;pago`, uma linha por item e pessoa; cabeçalho conforme
        `Accept-Language`; texto que começa com `=`, `+`, `-`, `@`, tabulação ou retorno de carro recebe um `'` na frente. Download com
        `Content-Disposition: attachment` e `Cache-Control: no-store`. Compromisso que não é projeto → `422 COMMITMENT_INVALID`.
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        '200':
          description: O recorte por pessoa.
          headers:
            Content-Disposition:
              description: 'Só em `csv`: `attachment; filename="moneylog-imovel-por-pessoa.csv"`.'
              schema:
                type: string
            Cache-Control:
              description: '`no-store` em `csv`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitmentByPerson'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: Página (1-indexada).
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Itens por página.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    InsightLimit:
      name: limit
      in: query
      description: Quantos insights devolver (1 a 50; padrão 20).
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    IncludeDismissed:
      name: includeDismissed
      in: query
      description: Inclui os dispensados, marcados com `dismissed = true`.
      schema:
        type: boolean
        default: false
    View:
      name: view
      in: query
      required: false
      description: |
        Visão do consumo (ADR-022). `MINE` (padrão) = só a minha parte; `GROSS` = o consumo bruto (minha parte + a parte de terceiros ainda a
        receber ou já recebida). Não muda caixa, patrimônio, fatura nem dívida, que são sempre cheios.
      schema:
        $ref: '#/components/schemas/ViewMode'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID gerado por tentativa de envio (S-72, S-87).
      schema:
        type: string
        format: uuid
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        UUID gerado por tentativa de envio (S-72, S-87, S-237, S-244). **Opcional**: com a chave, repetir o mesmo corpo devolve o mesmo
        recurso (`201`, sem criar outro nem novo lançamento; vale 24 h, escopo por rota) e a mesma chave com outro corpo é
        `409 IDEMPOTENCY_KEY_REUSED`. Sem a chave, cada chamada cria um recurso novo. Em `POST /v1/debts`, `POST /v1/people` e
        `POST /v1/recurrences`. Envie sempre que o cliente puder repetir a chamada (duplo clique, retry de rede, resposta perdida).
      schema:
        type: string
        format: uuid

  headers:
    Location:
      description: URL do recurso criado.
      schema:
        type: string
    RefreshCookie:
      description: Cookie `ml_refresh` (`HttpOnly; Secure; SameSite=Strict; Path=/v1/auth`).
      schema:
        type: string
    NoStore:
      description: '`private, no-store`: dado financeiro do usuário, nunca cacheado.'
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: |
        `VALIDATION_FAILED`: Bean Validation, JSON inválido, **campo desconhecido no corpo** (`UNKNOWN_FIELD`; os corpos
        de entrada têm `additionalProperties: false`), `amount` fora do formato, enum desconhecido, parâmetro de
        paginação fora do limite ou header obrigatório ausente. Os `errors[].code` possíveis estão em `FieldError`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: '`UNAUTHENTICATED` (sem token, token inválido/expirado), `INVALID_CREDENTIALS` ou `REFRESH_INVALID`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: '`ORIGIN_NOT_ALLOWED`: o `Origin` não está em `MONEYLOG_ALLOWED_ORIGINS`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ForbiddenRole:
      description: |
        `FORBIDDEN` (2.38.0): o usuário autenticado não tem o papel exigido (`MEMBER` em gestão de usuários, de convites ou em IA). O papel e o status vêm do banco a cada requisição;
        a claim `role` do JWT não autoriza nada. Distinto de `ORIGIN_NOT_ALLOWED`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    EmailDeliveryFailed:
      description: |
        `EMAIL_DELIVERY_FAILED` (2.38.0): o provedor de e-mail recusou o envio. O convite **foi gravado** com `deliveryStatus = FAILED`; `invitationId` no corpo identifica o convite para `resend`.
        Mensagem genérica, sem credencial nem corpo do e-mail.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: '`<FEATURE>_NOT_FOUND`: o recurso não existe **ou é de outro usuário**. Em `preview` e `accept` de convite: `INVALID_INVITATION`, também com os convites desligados. Na gestão: `INVITATION_NOT_FOUND`, `USER_NOT_FOUND` e, com os convites desligados, `INVITATIONS_DISABLED` em criar e reenviar.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: |
        `VERSION_CONFLICT`, `CATEGORY_NAME_TAKEN`, `IDEMPOTENCY_KEY_REUSED`, `CARD_BILLING_CHANGE_STALE` ou `CONFLICT`. Em convites e usuários (2.38.0): `EMAIL_ALREADY_REGISTERED`,
        `INVITATION_PENDING` (com `invitationId`), `USER_LIMIT_REACHED`, `INVITATION_NOT_RESENDABLE`, `INVITATION_NOT_REVOCABLE` e `CANNOT_DISABLE_OWNER`.
        `CONFLICT` vale para qualquer rota de escrita: duas requisições simultâneas colidiram numa trava (deadlock); o
        servidor desfez a que perdeu, nada foi gravado e o cliente repete a mesma requisição. Vem com o header
        `Retry-After` (segundos) e mensagem genérica.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Regra de negócio. O `code` é o da exceção de domínio (lista no início deste arquivo).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: |
        `INTERNAL_ERROR`: falha inesperada do servidor. O corpo nunca traz a mensagem interna (`detail` genérico);
        o `traceId` (igual ao header `X-Trace-Id`) liga a resposta ao log.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: '`TOO_MANY_ATTEMPTS` (login com falhas demais, exportação acima de 6 pedidos por minuto por usuário ou busca acima de 120 por minuto por usuário).'
      headers:
        Retry-After:
          description: Segundos até poder tentar de novo.
          schema:
            type: integer
            minimum: 0
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    AiRateLimited:
      description: '`AI_RATE_LIMITED`: limite diário de chamadas de IA atingido (reinicia à meia-noite de America/Sao_Paulo).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AiProviderUnavailable:
      description: '`AI_PROVIDER_UNAVAILABLE`: o disjuntor do provedor está aberto (5 falhas seguidas, por 5 minutos). Mensagem genérica.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # ---- Erros
    Problem:
      type: object
      description: ProblemDetail (RFC 9457) com extensões.
      required: [type, title, status, code, traceId]
      additionalProperties: false
      properties:
        type:
          type: string
          description: 'URI do tipo do problema: `urn:moneylog:problem:<code>`.'
        title:
          type: string
        status:
          type: integer
        detail:
          type: [string, 'null']
          description: Mensagem para log/diagnóstico; o front não a exibe nem a interpreta.
        instance:
          type: string
          description: Caminho da requisição.
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          description: Código estável (lista no início deste arquivo). O front traduz por ele. Em `VALIDATION_FAILED`, os códigos de campo estão em `errors[].code` (ver `FieldError`).
        traceId:
          type: string
          description: Igual ao header `X-Trace-Id` da resposta.
        errors:
          type: array
          description: Só em `VALIDATION_FAILED`.
          items:
            $ref: '#/components/schemas/FieldError'
        position:
          type: integer
          description: 'Só em `IMPORT_APPLY_FAILED` (2.10.0): posição (1 = primeira) da linha do lote que falhou.'
        invitationId:
          type: string
          format: uuid
          description: 'Só em `INVITATION_PENDING` (2.38.0: o convite pendente existente) e `EMAIL_DELIVERY_FAILED` (o convite criado ou reenviado, com `deliveryStatus = FAILED`).'
        cause:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          description: 'Só em `IMPORT_APPLY_FAILED` (2.10.0): `code` da recusa da linha (ex.: `IMPORT_LINE_ALREADY_RECORDED`, `IMPORT_TRANSFER_LEG_ALREADY_RECORDED`). Código aberto; o front trata os desconhecidos como genéricos.'
    FieldError:
      type: object
      required: [field, code, message]
      additionalProperties: false
      properties:
        field:
          type: string
          description: 'Caminho do campo (ex.: `amount`, `newDebt.personId`).'
        code:
          type: string
          description: |
            Código estável do erro do campo (o front traduz por ele, não pela mensagem). Os que o backend emite:
            - Bean Validation (nome da restrição em `UPPER_SNAKE_CASE`): `NOT_NULL`, `NOT_BLANK`, `SIZE`, `PATTERN`, `EMAIL`,
              `NO_CONTROL_CHARS` (texto com caractere de controle), `DATE_IN_WINDOW` (data fora da janela permitida).
            - Corpo e parâmetros: `MALFORMED_JSON` (corpo não é JSON), `INVALID_FORMAT` (valor ou tipo incorreto, enum
              desconhecido), `UNKNOWN_FIELD` (campo que o contrato não declara), `REQUIRED` (corpo, parâmetro, header
              ou `version` ausente), `OUT_OF_RANGE` (`page`/`pageSize` fora do limite), `INVALID_RANGE` (`from` depois
              de `to`) e `INVALID` (restrição sem nome).
            O conjunto pode crescer: o front trata um `code` desconhecido como erro genérico do campo.
        message:
          type: string

    # ---- Valores básicos
    Money:
      type: object
      description: Dinheiro. `amount` é string decimal com sempre 2 casas (nunca número).
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount:
          type: string
          pattern: '^-?\d{1,16}\.\d{2}$'
          examples: ['1200.00']
        currency:
          type: string
          enum: [BRL]
    AmountInput:
      type: string
      description: |
        Valor positivo de uma movimentação, em string decimal com até 2 casas (`^\d{1,13}(\.\d{1,2})?$`). Número JSON
        (`10.5`) e 3 casas (`"10.005"`) → `400 VALIDATION_FAILED`. Zero ou acima do teto de R$ 999.999.999,99 → `422`.
      pattern: '^\d{1,13}(\.\d{1,2})?$'
      examples: ['18.50']
    Competence:
      type: string
      description: Mês de competência `YYYY-MM`.
      pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      examples: ['2026-10']
    AccountRef:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    CategoryRef:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    CardRef:
      type: object
      description: Cartão de uma movimentação de cartão (`CARD_PURCHASE`, `REFUND` no cartão, `INVOICE_PAYMENT`).
      required: [id, name]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    SliceBase:
      type: object
      required: [hasNext]
      properties:
        hasNext:
          type: boolean
          description: Existe próxima página (a consulta não faz `COUNT`).

    # ---- Enums
    AccountType:
      type: string
      enum: [CHECKING, SAVINGS, WALLET, INVESTMENT]
    Liquidity:
      type: string
      description: '`CASH` (CHECKING, SAVINGS, WALLET) ou `INVESTMENT`.'
      enum: [CASH, INVESTMENT]
    AccountStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    CategoryKind:
      type: string
      enum: [EXPENSE, INCOME]
    PaymentMethod:
      type: string
      description: 'Meio de pagamento. `CREDIT` não existe: compra no crédito é `CARD_PURCHASE`.'
      enum: [CASH, DEBIT, PIX, TRANSFER, BOLETO, OTHER]
    TransactionType:
      type: string
      description: Os 11 tipos do domínio (todos, menos `INVOICE_PAYMENT`, aceitos em `POST /v1/transactions`).
      enum:
        - EXPENSE
        - INCOME
        - TRANSFER
        - INVESTMENT
        - ADJUSTMENT
        - REFUND
        - CARD_PURCHASE
        - INVOICE_PAYMENT
        - LOAN_GIVEN
        - MONEY_RECEIVED
        - DEBT_PAYMENT
    TransactionStatus:
      type: string
      enum: [ACTIVE, VOIDED]
    TransactionSource:
      type: string
      description: Como nasceu. `RECURRENCE` quando a movimentação confirma uma ocorrência (Etapa 4). `ONGOING` (2.13.0) é a compra parcelada cadastrada já em andamento. `HISTORICAL` (2.16.0) é o item de fatura histórica.
      enum: [MANUAL, IMPORT, RECURRENCE, ONGOING, HISTORICAL]
    EntryLens:
      type: string
      enum: [CONSUMPTION, INCOME]
    AdjustmentDirection:
      type: string
      enum: [INCREASE, DECREASE]
    AdjustmentKind:
      type: string
      description: '`YIELD` (rendimento) só em conta de investimento; rendimento não é receita.'
      enum: [CORRECTION, YIELD]
    InvestmentDirection:
      type: string
      description: '`CONTRIBUTION` = aplicação (saída de caixa); `REDEMPTION` = resgate.'
      enum: [CONTRIBUTION, REDEMPTION]
    VoidBlockedBy:
      type: string
      description: |
        Por que a movimentação não pode ser estornada. `ACCOUNT_ARCHIVED` (toca conta arquivada, S-88),
        `HAS_ACTIVE_REFUNDS` (despesa ou compra no cartão com reembolso ativo, S-89) ou `TRANSACTION_IN_CLOSED_INVOICE`
        (compra ou crédito no cartão com parcela/crédito em fatura fechada, S-36, S-122: cancele as parcelas restantes e
        registre um reembolso no cartão). Etapa 4: `DEBT_HAS_SETTLEMENTS` (origem de dívida com quitação ativa: estorne antes as
        quitações, S-141) e `DEBT_CLOSED` (dívida perdoada/encerrada: nem a origem nem a quitação se estornam).
      enum: [ACCOUNT_ARCHIVED, HAS_ACTIVE_REFUNDS, TRANSACTION_IN_CLOSED_INVOICE, DEBT_HAS_SETTLEMENTS, DEBT_CLOSED]

    # ---- Auth
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 200
    SetupPasswordRequest:
      type: object
      required: [email, setupCode, newPassword]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        setupCode:
          type: string
          minLength: 1
          maxLength: 200
        newPassword:
          type: string
          minLength: 1
          maxLength: 200
          description: 12 caracteres no mínimo, 72 bytes no máximo, diferente do e-mail.
    AuthStatus:
      type: object
      required: [passwordSetupRequired]
      additionalProperties: false
      properties:
        passwordSetupRequired:
          type: boolean
    AuthToken:
      type: object
      required: [accessToken, expiresAt, user]
      additionalProperties: false
      properties:
        accessToken:
          type: string
          description: JWT de 15 min. O front o guarda só em memória.
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AuthUser'
    AuthUser:
      type: object
      description: 'Quem abriu a sessão (2.38.0, aditivo). `role` é só dica para a interface; a autorização vem do papel no banco.'
      required: [id, email, role]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
    UserRole:
      type: string
      enum: [OWNER, MEMBER]
    UserStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    ManagedUser:
      type: object
      description: 'Usuário na visão do dono (2.38.0). Nenhum dado financeiro.'
      required: [id, email, role, status, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: [string, 'null']
          format: date-time
          description: Instante do último login; ausente ou nulo se nunca entrou.
    InvitationStatus:
      type: string
      enum: [PENDING, ACCEPTED, EXPIRED, REVOKED]
    InvitationDeliveryStatus:
      type: string
      enum: [SENT, FAILED]
    Invitation:
      type: object
      description: 'Convite na visão do dono (2.38.0). Nunca traz o token em claro.'
      required: [id, email, status, createdAt, expiresAt, lastSentAt, deliveryStatus]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          $ref: '#/components/schemas/InvitationStatus'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        acceptedAt:
          type: [string, 'null']
          format: date-time
          description: Só em `ACCEPTED`.
        lastSentAt:
          type: string
          format: date-time
        deliveryStatus:
          $ref: '#/components/schemas/InvitationDeliveryStatus'
    InvitationInput:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    InvitationPreviewRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
          description: Token lido do fragmento da URL do e-mail; nunca em caminho nem query.
    InvitationPreview:
      type: object
      required: [email, expiresAt]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        expiresAt:
          type: string
          format: date-time
    InvitationAcceptRequest:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
          description: Token lido do fragmento da URL do e-mail; nunca em caminho nem query.
        password:
          type: string
          minLength: 1
          maxLength: 200
          description: 12 a 72 bytes e diferente do e-mail; fraca → `422 WEAK_PASSWORD`, sem consumir o token.

    # ---- Contas
    Account:
      type: object
      required:
        - id
        - name
        - type
        - liquidity
        - institution
        - openingBalance
        - openingDate
        - currentBalance
        - status
        - openingEditable
        - archivable
        - version
        - createdAt
        - updatedAt
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/AccountType'
        liquidity:
          $ref: '#/components/schemas/Liquidity'
        institution:
          type: [string, 'null']
        openingBalance:
          $ref: '#/components/schemas/Money'
        openingDate:
          type: string
          format: date
        currentBalance:
          $ref: '#/components/schemas/Money'
          description: Saldo de hoje, do mesmo cálculo do dashboard (S-79).
        status:
          $ref: '#/components/schemas/AccountStatus'
        openingEditable:
          type: boolean
          description: 'Sem movimentação ativa: `type`, `openingBalance` e `openingDate` podem ser corrigidos (S-62).'
        archivable:
          type: boolean
          description: Ativa e com saldo zero em todas as datas (S-62, S-92).
        reservedAmount:
          $ref: '#/components/schemas/Money'
          description: |
            Σ reservas das metas (não arquivadas) nesta conta, com data até hoje (Etapa 5, S-147); 0,00 sem metas. É reserva lógica: não
            muda `currentBalance`. Campo opcional (sempre presente na resposta).
        uncovered:
          type: boolean
          description: '`reservedAmount` maior que `currentBalance` ("reserva descoberta", S-148): só avisa, nunca bloqueia. Campo opcional (sempre presente na resposta).'
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AccountInput:
      type: object
      required: [name, type]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          $ref: '#/components/schemas/AccountType'
        institution:
          type: [string, 'null']
          maxLength: 100
        openingBalance:
          $ref: '#/components/schemas/Money'
          description: Pode ser negativo (cheque especial); em módulo até R$ 999.999.999,99.
        openingDate:
          type: string
          format: date
    AccountUpdate:
      type: object
      required: [name, version]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        institution:
          type: [string, 'null']
          maxLength: 100
        type:
          $ref: '#/components/schemas/AccountType'
          description: Só com `openingEditable = true`, senão `422 ACCOUNT_OPENING_LOCKED`.
        openingBalance:
          $ref: '#/components/schemas/Money'
          description: Só com `openingEditable = true`.
        openingDate:
          type: string
          format: date
          description: Só com `openingEditable = true`.
        version:
          type: integer
          format: int64
    AccountSlice:
      allOf:
        - $ref: '#/components/schemas/SliceBase'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Account'
      unevaluatedProperties: false

