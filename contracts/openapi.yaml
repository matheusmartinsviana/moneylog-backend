            $ref: '#/components/schemas/DebtOverviewTrackedItem'
        scheduleByMonth:
          type: array
          items:
            $ref: '#/components/schemas/CommitmentMonth'
    DebtOverview:
      type: object
      description: Veja `GET /v1/debts/overview`. Tudo calculado pelo backend; o front só exibe.
      required: [asOf, total, parts, cards, people, other, receivablesInfo, hasRecords, fixedCosts, income, liquidity, comparison, schedule, payoffGoal, tracked]
      additionalProperties: false
      properties:
        tracked:
          $ref: '#/components/schemas/DebtOverviewTracked'
        asOf:
          type: string
          format: date
        total:
          $ref: '#/components/schemas/Money'
        parts:
          type: object
          required: [cards, people, other]
          additionalProperties: false
          properties:
            cards:
              $ref: '#/components/schemas/Money'
            people:
              $ref: '#/components/schemas/Money'
            other:
              $ref: '#/components/schemas/Money'
        cards:
          type: object
          required: [total, invoiced, future, items]
          additionalProperties: false
          properties:
            total:
              $ref: '#/components/schemas/Money'
            invoiced:
              $ref: '#/components/schemas/Money'
            future:
              $ref: '#/components/schemas/Money'
            items:
              type: array
              description: Cartões com saldo devedor ou compras parceladas pendentes (cartão sem nada a pagar não aparece).
              items:
                $ref: '#/components/schemas/DebtOverviewCardItem'
        people:
          $ref: '#/components/schemas/DebtOverviewGroup'
        other:
          $ref: '#/components/schemas/DebtOverviewGroup'
        receivablesInfo:
          $ref: '#/components/schemas/Money'
          description: O que as pessoas devem ao usuário. Informativo, fora do total.
        payablesToPeople:
          $ref: '#/components/schemas/Money'
          description: Campo opcional (2.32.3). A pagar à pessoa vindo de `PAYABLE(pessoa)` e `SHARE_PAYABLE`. O backend ainda não o emite; ausente significa não calculado.
        hasRecords:
          type: boolean
        fixedCosts:
          type: object
          description: Custo fixo mensal estimado (recorrências de despesa ativas e não encerradas). Nunca soma no total.
          required: [monthly, estimate]
          additionalProperties: false
          properties:
            monthly:
              $ref: '#/components/schemas/Money'
            estimate:
              type: boolean
        income:
          type: object
          required: [monthly, source]
          additionalProperties: false
          properties:
            monthly:
              description: Nulo com `source = NONE`.
              oneOf:
                - $ref: '#/components/schemas/Money'
                - type: 'null'
            source:
              type: string
              enum: [RECURRING_ESTIMATE, LAST_FULL_MONTH, NONE]
        liquidity:
          type: object
          required: [inAccounts, available]
          additionalProperties: false
          properties:
            inAccounts:
              $ref: '#/components/schemas/Money'
            available:
              $ref: '#/components/schemas/Money'
        comparison:
          type: object
          required: [debtToIncome, fixedCostToIncome, debtMinusInAccounts, reason]
          additionalProperties: false
          properties:
            debtToIncome:
              description: '`total` ÷ renda mensal (4 casas, pode passar de 1); nulo com `reason = NO_INCOME`.'
              oneOf:
                - $ref: '#/components/schemas/Ratio'
                - type: 'null'
            fixedCostToIncome:
              oneOf:
                - $ref: '#/components/schemas/Ratio'
                - type: 'null'
            debtMinusInAccounts:
              $ref: '#/components/schemas/Money'
              description: '`total` − em contas (pode ser negativo: o saldo cobre a dívida).'
            reason:
              type: [string, 'null']
              enum: [NO_INCOME, null]
        schedule:
          type: object
          description: 'Cronograma contratual. Identidade: `overdue + Σ points.total + undated + beyondHorizon = total`.'
          required: [months, points, overdue, undated, beyondHorizon, payoffCompetence, payoffReason]
          additionalProperties: false
          properties:
            months:
              type: integer
            points:
              type: array
              items:
                $ref: '#/components/schemas/DebtOverviewPoint'
            overdue:
              $ref: '#/components/schemas/Money'
            undated:
              $ref: '#/components/schemas/Money'
            beyondHorizon:
              $ref: '#/components/schemas/Money'
            payoffCompetence:
              oneOf:
                - $ref: '#/components/schemas/Competence'
                - type: 'null'
            payoffReason:
              type: [string, 'null']
              enum: [UNDATED_DEBTS, BEYOND_HORIZON, null]
        payoffGoal:
          description: A meta `DEBT_PAYOFF` ativa, se houver (o progresso sai do mesmo total).
          oneOf:
            - type: object
              required: [goalId, baselineSet, progress, remaining]
              additionalProperties: false
              properties:
                goalId:
                  type: string
                  format: uuid
                baselineSet:
                  type: boolean
                progress:
                  $ref: '#/components/schemas/Ratio'
                remaining:
                  $ref: '#/components/schemas/Money'
            - type: 'null'
    DebtSlice:
