  /v1/vault/export:
    get:
      tags: [Vault]
      operationId: exportVault
      summary: Exporta o vault como zip compatível com o Obsidian
      description: |
        Um `.md` por nota **ativa** (a lixeira não vai), no caminho dela, com o frontmatter YAML e o corpo intactos; os vínculos explícitos saem em
        `moneylog.links` (D1 §5; vínculo `NOTE` por `path`; para uma nota que está na lixeira o vínculo sai com `state: trashed`, e esvaziar a
        lixeira remove o vínculo). Abre numa pasta do Obsidian. O zip é montado **antes** de o download começar, com `Content-Length`: o que
        a importação não aceitaria (mais de 5.500 entradas, 300 MB de texto ou 20 MB de zip) é `422 EXPORT_TOO_LARGE`. Anexos ficam fora do MVP. Download,
        `Cache-Control: no-store`; o dia do nome do arquivo é o do usuário. Divide o limite de 6 pedidos por minuto das exportações
        (`429 TOO_MANY_ATTEMPTS`). Não existe "conectar pasta local": o PWA não acessa o disco (S-157).
      responses:
        '200':
          description: O zip.
          headers:
            Content-Disposition:
              description: '`attachment; filename="moneylog-vault-AAAA-MM-DD.zip"`.'
              schema:
                type: string
            Cache-Control:
              description: '`no-store`.'
              schema:
                type: string
            Content-Length:
              description: Tamanho do zip em bytes.
              schema:
                type: integer
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/vault/import:
    post:
      tags: [Vault]
      operationId: importVault
      summary: Importa um zip de notas Markdown
      description: |
        Tudo ou nada, numa transação. Só `.md` vira nota; o resto (`foto.png`, `.obsidian/`, `__MACOSX/`) é **ignorado e listado** em
        `ignoredFiles`, e `![[foto.png]]` fica no texto como link pendente. **Segurança (S-162, S-272, ADR-009):** o zip nunca é extraído; o upload
        é copiado para um arquivo temporário privado (apagado sempre) e lido pelo **diretório central**. Zip com `..`, caminho absoluto
        (`/x`, `C:/x`), `\` ou caractere de controle em qualquer entrada, corrompido, **truncado** (inclusive cortado na fronteira de uma
        entrada), sem diretório central ou que não é zip → `422 VAULT_IMPORT_INVALID`; arquivo acima de **20 MB**, mais de **5.500 entradas**
        ou mais de **300 MB descomprimidos** (contados ao ler) → `422 VAULT_IMPORT_TOO_LARGE`; nos dois casos **nada é gravado**
        (importação tudo ou nada). Multipart sem boundary ou sem fechamento → `400 VALIDATION_FAILED`. Nome de nota sem suporte (reservado
        do Windows, caractere proibido como `:`) e nota acima de 200 KB ou que não é UTF-8 não derrubam a importação: são ignoradas e saem em
        `warnings`; nota com mais de 500 wikilinks distintos é pulada com `NOTE_TOO_MANY_LINKS`. Nome sem a flag UTF-8 é lido como UTF-8 e,
        se falhar, como CP437 (`NAME_ENCODING_GUESSED`). Nomes e mensagens do relatório são cortados em 200 caracteres.
        Conflito de caminho (sem diferenciar caixa): `mode=SKIP` (padrão) pula; `RENAME` cria `nome (2).md` e avisa em cada nota
        (`NOTE_RENAMED`); **`RENAME` não é idempotente**: reenviar o mesmo zip cria outra cópia. Reimportar com `SKIP` não duplica.
        Só é frontmatter o bloco fechado com mapa YAML válido; qualquer outro início com `---` é corpo e entra byte a byte. A chave
        `moneylog` com uma forma que o texto não consegue tirar descarta o bloco, com aviso `FRONTMATTER_INVALID`. `moneylog.links` com
        `type`, `id`, `key` ou `path` com caractere de controle ou de formatação é descartado com `LINK_IGNORED`; `moneylog.links` com alvo que não existe para o usuário vira vínculo **pendente** (não falha) e conta em
        `pendingLinks`, que também conta os wikilinks sem nota. Sem `Idempotency-Key`: `SKIP` já é idempotente. Divide o limite de 6 pedidos
        por minuto das exportações.
      parameters:
        - name: mode
          in: query
          description: Conflito de caminho (padrão `SKIP`). É parâmetro de **query**, não campo do formulário.
          schema:
            $ref: '#/components/schemas/ImportConflictMode'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: O zip (até 20 MB).
      responses:
        '200':
          description: O que a importação fez.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ---------------------------------------------------------------- Etapa 7 (contrato 2.7.0, só acréscimos): importação de extrato
  /v1/imports:
    post:
      tags: [Imports]
      operationId: createImport
      summary: Envia um extrato CSV ou OFX e prepara o lote para revisão
      description: |
        **Não cria nenhuma movimentação**: lê o arquivo, normaliza as descrições, classifica cada linha (`DUPLICATE`, `POSSIBLE_DUPLICATE`, marcas) e
        grava o lote em `PENDING_REVIEW`. O arquivo bruto **não é guardado**: só o hash e as linhas lidas. Informe `accountId` **ou** `cardId` (os dois
        ou nenhum = `400`). `format` é detectado quando ausente. `mapping` (JSON, só CSV) é salvo para a conta/cartão e reaproveitado no próximo envio.
        Até 5 MB e 5.000 linhas (`422 IMPORT_TOO_LARGE`). Mesmo arquivo na mesma conta/cartão: o lote sai com `warnings: [SAME_FILE_ALREADY_IMPORTED]`.
        Com `Idempotency-Key` (escopo `POST /v1/imports`, 24 h), repetir o envio devolve o mesmo lote.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                accountId:
                  type: string
                  format: uuid
                cardId:
                  type: string
                  format: uuid
                format:
                  type: string
                  enum: [CSV, OFX]
                mapping:
                  type: string
                  description: JSON de `ImportMapping` (só CSV).
      responses:
        '201':
          description: Lote em revisão.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Imports]
      operationId: listImports
      summary: Lista os lotes de importação
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ImportBatchStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de lotes, do mais recente ao mais antigo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchSlice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/imports/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Imports]
      operationId: getImport
      summary: Um lote com os contadores
      responses:
