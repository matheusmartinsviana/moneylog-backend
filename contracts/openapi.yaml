    put:
      tags: [Cards]
      operationId: updateCard
      summary: Edita um cartão
      description: |
        Muda nome, instituição, limite e conta padrão (`200`, `version` + 1). **Mudança de `closingDay`/`dueDay`**
        (S-42, S-128, T58): vale a partir da fatura seguinte à corrente e realoca as parcelas e os créditos das faturas
        `FUTURE` **na mesma transação** que grava o cartão (tudo ou nada). O body leva `confirmedEffectiveFrom` (o
        `effectiveFromClosingDate` de `GET /v1/cards/{id}/billing-change-preview`): sem ele,
        `422 CARD_BILLING_CHANGE_NOT_CONFIRMED`; se a fatura corrente virou entre a prévia e o `PUT` (a primeira fatura afetada
        é outra), `409 CARD_BILLING_CHANGE_STALE` e nada muda (a `version` não muda na virada do dia, então não detecta
        sozinha). Dia fora de 1..31 → `422 CARD_INVALID_BILLING_DAY`. As faturas já fechadas e a corrente não mudam de
        data nem de id; as movimentações realocadas ganham `version` + 1.
