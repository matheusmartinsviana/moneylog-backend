      tags: [Invoices]
      operationId: previewInvoicePayment
      summary: Prévia do pagamento de uma fatura (não grava nada)
      description: |
        Mesmo caminho do pagamento real: `kind` (`FULL`, `PARTIAL`, `OVERPAY`, `PREPAY`), `outstandingAfter` e
        `creditCarryAfter`. Fatura `FUTURE`/`PAID` → `422 INVOICE_NOT_PAYABLE`. O front não subtrai valores.
      parameters:
