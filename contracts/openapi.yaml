          format: date
        clauses:
          oneOf:
            - $ref: '#/components/schemas/BackupClauses'
            - type: 'null'
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/BackupScheduleItem'
    BackupThirdPartyExpense:
      type: object
      description: Marca de terceiro em uma movimentação (legado do rateio).
      additionalProperties: false
      required: [id, transactionId, personId]
      properties:
        id:
          type: string
          format: uuid
        transactionId:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        note:
          type: [string, 'null']
        amount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
    BackupThirdPartyReceipt:
      type: object
