          enum: [NOT_CARD_PURCHASE, TRANSACTION_NOT_ACTIVE, NO_CATEGORY, ALREADY_SHARED, NO_ACTIVE_INSTALLMENTS, MARK_EXCEEDS_CHARGED, MARK_NOT_REPRESENTABLE, REFUND_EXCEEDS_THIRD_PART, RECEIVED_EXCEEDS_THIRD_PART, RECEIPT_OF_OTHER_PERSON, INVARIANT_BROKEN, null]
        splitMode:
          description: Modo de rateio proposto; `null` em exceção sem modo.
          oneOf:
            - $ref: '#/components/schemas/SplitMode'
            - type: 'null'
        charged:
          $ref: '#/components/schemas/Money'
        third:
          $ref: '#/components/schemas/Money'
        refunded:
          $ref: '#/components/schemas/Money'
        legacyReceived:
          $ref: '#/components/schemas/Money'
        months:
          type: array
          items:
            $ref: '#/components/schemas/ShareMigrationMonth'
    ShareMigrationReport:
      type: object
