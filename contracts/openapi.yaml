  # ---------------------------------------------------------------- Debts (Etapa 4)
  /v1/commitments:
    get:
      tags: [Commitments]
      operationId: listCommitments
      summary: Compromissos acompanhados (ordem `name asc`)
      description: |
        Empréstimo no nome de terceiro e projeto de longo prazo (ADR-014). Não geram lançamento: não mexem em caixa, consumo, patrimônio
        nem no total de `GET /v1/debts/overview`. Tudo que é derivado (pago, saldo nominal, progresso, próximo vencimento) vem do backend.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de compromissos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitmentSlice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Commitments]
      operationId: createCommitment
      summary: Cadastra um compromisso acompanhado
      description: |
        `TRACKED_THIRD_PARTY`: `installmentsTotal` e `installmentsPaid` (+ `paidAmount` e `nextDueDate`, se informados). O saldo restante **não é
        calculado** (`nominalBalance` e `total` ficam nulos). `LONG_TERM_PROJECT`: `schedule` completo (itens pagos e pendentes, cada um com
        `type`, `amount`, `dueDate` opcional, `paid` e `paidOn` opcional); `total`, se informado, tem de fechar com Σ do cronograma
        (`422 COMMITMENT_INVALID`). O item `FINANCING` faz parte do saldo nominal mas **não é despesa nem dinheiro recebido** e fica fora do
        pendente de pagamento direto. `Idempotency-Key` opcional: mesma chave e mesmo corpo devolvem o mesmo compromisso.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitmentInput'
      responses:
        '201':
          description: Compromisso criado.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commitment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/commitments/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Commitments]
      operationId: getCommitment
      summary: Um compromisso acompanhado
      responses:
        '200':
          description: O compromisso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commitment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/commitments/{id}/schedule/{position}/pay:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: position
        in: path
        required: true
        description: Posição do item no cronograma (1..n).
        schema:
          type: integer
          minimum: 1
    post:
      tags: [Commitments]
      operationId: payCommitmentScheduleItem
      summary: Marca um item do cronograma como pago
      description: |
        Só o acompanhamento: **nenhuma conta é movimentada**. Devolve o compromisso atualizado. Já pago → `422 COMMITMENT_SCHEDULE_ITEM_ALREADY_PAID`;
        posição inexistente → `404 COMMITMENT_SCHEDULE_ITEM_NOT_FOUND`; versão diferente → `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitmentPayInput'
      responses:
        '200':
          description: O compromisso atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commitment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/commitments/{id}/progress:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Commitments]
      operationId: updateCommitmentProgress
      summary: Atualiza o progresso informado de um empréstimo de terceiro
      description: Só para `TRACKED_THIRD_PARTY` (parcelas pagas, valor pago, próximo vencimento, observações). Devolve o compromisso atualizado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitmentProgressInput'
      responses:
        '200':
          description: O compromisso atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commitment'
        '400':
