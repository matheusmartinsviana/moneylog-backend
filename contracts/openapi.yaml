  /v1/debts/third-party-receivables:
    get:
      tags: [Debts]
      operationId: getThirdPartyReceivables
      summary: Dinheiro a receber de terceiros, por pessoa, e o gasto bruto x terceiros x líquido do mês
      description: |
        Lê o **estado**: dívidas `RECEIVABLE` (empréstimo concedido: a receber = principal, recebido = Σ quitações ativas) e despesas marcadas como de
        terceiro (a receber = valor cobrado, recebido = Σ `REFUND` ativos ligados à compra). Fora de patrimônio, renda e consumo. `month`
        (padrão: mês atual) traz o **bruto** (`grossConsumption` = despesas pagas + cartão + dívidas de consumo, antes dos reembolsos), os
        `refunds`, o `personalNet` (= consumo do livro = bruto − reembolsos), o consumo de terceiro (`thirdPartyConsumption`), o já
        reembolsado (`thirdPartyReimbursed`) e o `thirdPartyPending` (de terceiro e ainda não reembolsado, dentro do bruto).
        **Rateio de cartão (2.24.0, ADR-022):** os itens `CARD_SHARE` e `people[].months[]` vêm do `RECEIVABLE` gravado na compra; o bloco `month`
        mantém o significado acima para as marcas legadas.
      parameters:
        - name: month
          in: query
          required: false
          description: Competência `AAAA-MM`. Padrão o mês atual.
          schema:
            type: string
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: A visão.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThirdPartyReceivables'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/debts/overview:
    get:
      tags: [Debts]
      operationId: getDebtOverview
      summary: Visão total de dívidas (cartões + pessoas + outras), custo fixo, comparação e cronograma
      description: |
        Quanto o usuário **ainda deve**, calculado só pelo backend a partir do **estado** (faturas e dívidas), nunca somando movimentos:
        compra → parcela → fatura → pagamento não conta em dobro (PR 01). `total = parts.cards + parts.people + parts.other`.

        - **Cartões**: Σ `outstanding` de todas as faturas não pagas (aberta, fechada, vencida **e futura**), líquido do crédito transportado
          (decisão P2). Por cartão vale a identidade `total = Σ plans.remaining + otherCharges + adjustment`, com `adjustment ≤ 0`
          (pagamento parcial, crédito transportado, reembolso em fatura não paga). `plans` são as compras parceladas (2x ou mais) com
          parcelas não canceladas em faturas não pagas; `otherCharges` são as compras à vista (1x) em fatura não paga.
        - **Pessoas / outras**: Σ `outstanding` das dívidas `PAYABLE` `OPEN`/`PARTIALLY_SETTLED`, inclusive sem `expectedDate`. Com pessoa vai em
          `people`; com credor livre (`creditorName`, sem `Person`) vai em `other`. `RECEIVABLE`, perdoada, estornada ou quitada nunca entra; o
          que as pessoas devem ao usuário vai em `receivablesInfo` (informativo, fora do total).
        - **Custo fixo** (`fixedCosts`, estimativa mensal das recorrências de despesa) **nunca soma no total**: fluxo mensal x saldo devedor.
        - **Renda** (`income`): `RECURRING_ESTIMATE` (receita recorrente mensal); se for 0, `LAST_FULL_MONTH` (receita do mês anterior); senão
          `NONE` (`monthly` nulo). Sem renda, as razões de `comparison` são `null` com `reason: NO_INCOME` (sem divisão por zero).
        - **Cronograma** (`schedule`): o cronograma **contratual** ("se pagar tudo no vencimento"), não uma previsão. Um ponto por mês, do mês
          de hoje por `months` meses, pelo vencimento da fatura e pela `expectedDate` da dívida. Fatura vencida e dívida atrasada ficam em
          `overdue`; dívida sem data em `undated`; o que passa do horizonte em `beyondHorizon`. Identidade:
          `overdue + Σ points.total + undated + beyondHorizon = total`. `remainingAfter` = `total − overdue − Σ points` até o mês (o vencido é
          considerado pago no 1º mês). `payoffCompetence` é o mês do último vencimento, ou `null` com `payoffReason` (`UNDATED_DEBTS`,
          `BEYOND_HORIZON`); também `null`, sem motivo, quando o total é 0.
        - `hasRecords`: existe ao menos um cartão ou uma dívida cadastrados. Com `total = 0.00` e `hasRecords = false` a tela é "nada
          cadastrado", nunca "livre de dívidas".
      parameters:
        - name: months
          in: query
          description: Horizonte do cronograma em meses, de 1 a 36 (padrão 12). Fora disso, `400 VALIDATION_FAILED`.
          schema:
            type: integer
            minimum: 1
            maximum: 36
            default: 12
      responses:
        '200':
          description: A visão.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtOverview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/debts:
    get:
      tags: [Debts]
      operationId: listDebts
      summary: Lista as dívidas (mais recentes primeiro)
      description: |
        Ordem `date desc, id desc`. `status` é **derivado** (S-41): `OPEN`, `PARTIALLY_SETTLED`, `SETTLED` pelas quitações
        ativas; `CANCELED` (perdão) e `VOIDED` (estorno) são gravados. `overdue=true` filtra as dívidas com previsão
        anterior a hoje e saldo em aberto (S-145).
      parameters:
        - name: direction
          in: query
          schema:
            $ref: '#/components/schemas/DebtDirection'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DebtStatus'
        - name: personId
          in: query
          schema:
            type: string
            format: uuid
        - name: overdue
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de dívidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtSlice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Debts]
      operationId: createDebt
      summary: Registra uma dívida sem movimentação
      description: |
        Só `WITHOUT_MOVEMENT`: não mexe no caixa. Sem `categoryId`: `PAYABLE −X / EQUITY +X` (consumo 0, patrimônio −X,
        PR 01 caso 8). `categoryId` só em `PAYABLE` ("gasto que alguém pagou por você", S-137): `EXPENSE(cat) +X / PAYABLE −X`
        (consumo +X na competência da data da dívida, caixa 0). Dívida `RECEIVABLE` com categoria → `422 DEBT_CATEGORY_NOT_ALLOWED`.
        Dívidas com movimentação nascem por `POST /v1/transactions` (`LOAN_GIVEN`, `MONEY_RECEIVED`, `EXPENSE` com `shares`).
        **Idempotência (S-237):** `Idempotency-Key` é opcional e, quando enviado, impede a dívida (e o consumo, com `categoryId`)
        de ser lançada duas vezes num retry.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebtInput'
      responses:
        '201':
          description: Dívida criada.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Debt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/debts/{id}:
    parameters:
