        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/transactions/{id}/void:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Transactions]
      operationId: voidTransaction
      summary: Estorna a movimentação
      description: |
        Marca como `VOIDED` e desativa os lançamentos dela (nada é apagado). Despesa com reembolso ativo →
        `422 TRANSACTION_HAS_ACTIVE_REFUNDS` (estorne antes os reembolsos, S-89); conta arquivada →
        `422 ACCOUNT_ARCHIVED` (S-73). **Movimentações de cartão**: o pagamento de fatura (`INVOICE_PAYMENT`) é sempre
        estornável (o status da fatura é recalculado e o limite disponível volta; conta arquivada →
        `422 ACCOUNT_ARCHIVED`). A compra com parcela não cancelada em fatura fechada (`CLOSED`/`OVERDUE`/`PAID`) e o
        crédito em fatura fechada respondem `422 TRANSACTION_IN_CLOSED_INVOICE` (S-36, S-122; `Transaction.voidable` vem
        `false` com `voidBlockedBy: TRANSACTION_IN_CLOSED_INVOICE`); compra com reembolso ativo →
        `422 TRANSACTION_HAS_ACTIVE_REFUNDS`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidRequest'
      responses:
        '200':
          description: Movimentação estornada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/transactions/{id}/cancel-installments:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Transactions]
      operationId: cancelTransactionInstallments
      summary: Cancela as parcelas restantes de uma compra no cartão
      description: |
        As parcelas em faturas `FUTURE`/`OPEN` viram `CANCELED` (deixam de gerar compromisso e devolvem limite); as de
        faturas fechadas não mudam (a correção é um reembolso no cartão). Sem parcela cancelável →
        `422 CARD_NO_INSTALLMENTS_TO_CANCEL`; compra já estornada → `422 TRANSACTION_ALREADY_VOIDED`; movimentação que
        não é compra no cartão → `422 TRANSACTION_NOT_CANCELABLE`. Com reembolso ativo ligado à compra, o cancelamento é
        recusado com `422 REFUND_EXCEEDS_ORIGINAL` quando a soma dos reembolsos ativos passaria do valor que continua
        cobrado depois do cancelamento (o consumo da compra ficaria negativo; ex.: compra de 1.200,00 em 6x com a
        parcela 1 em fatura fechada e reembolso de 1.000,00: cancelar as parcelas 2 a 6 é recusado; com reembolso de
        200,00 é aceito); nada é alterado na recusa. O `reason` fica gravado na revisão da compra
        (`transaction_revisions`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelInstallmentsRequest'
      responses:
        '200':
          description: A compra com as parcelas atualizadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/transactions/{id}/shares:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    put:
      tags: [Transactions]
      operationId: updateTransactionShares
      summary: Altera o rateio de uma compra no cartão (fatura aberta ou fechada)
      description: |
        ADR-022. Reclassifica as parcelas entre `EXPENSE` (minha parte) e `RECEIVABLE` (partes de terceiros) por revisão em
        `transaction_revisions`; `CARD`, fatura, limite e caixa **não mudam**; o patrimônio muda exatamente pela variação da minha parte (aumentar a minha parte em X reduz o patrimônio em X, porque X deixa de ser a receber). O valor da compra não é editável (`PUT` da compra com outro `amount` → `422 TRANSACTION_NOT_EDITABLE`). Vale em fatura
        fechada porque é só interno. Soma inválida, `personId` repetido ou `AMOUNT` que não soma a parcela → `422 SHARES_INVALID`; o novo
        devido de uma pessoa abaixo do que ela já pagou → `422 SHARES_BELOW_RECEIVED` (nada é gravado); movimentação que não é compra no cartão →
        `422 TRANSACTION_NOT_EDITABLE`; compra estornada → `422 TRANSACTION_ALREADY_VOIDED`; `version` desatualizada → `409`. Outro usuário →
        `404`. Devolve a compra com o rateio novo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionSharesUpdate'
      responses:
        '200':
          description: A compra com o rateio atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

