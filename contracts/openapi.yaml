  /v1/third-party-expenses:
    post:
      tags: [Debts]
      operationId: markThirdPartyExpense
      summary: Marca uma despesa ou compra no cartão como de terceiro (responsável real)
      description: |
        Não muda nenhum lançamento: o gasto **continua consumo bruto do usuário até o reembolso**. O reembolso recebido é um `REFUND` ligado à
        compra (`refundOfTransactionId`), que reduz o consumo na categoria original e nunca é receita. Compra parcelada: a marca vale para a
        compra inteira, inclusive as parcelas futuras. Já marcada → `422 THIRD_PARTY_EXPENSE_ALREADY_MARKED`; estornada ou de outro tipo →
        `422 THIRD_PARTY_EXPENSE_INVALID`. `Idempotency-Key` opcional.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThirdPartyExpenseInput'
      responses:
